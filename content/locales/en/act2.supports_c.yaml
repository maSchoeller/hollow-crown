# Story 11.23: English texts of the support conversations Liora × Amos and Amos × Grosk.
dlg.scn.support.amos_liora.C.l01: "You wrap the bandage left to right. Only a temple teaches that."
dlg.scn.support.amos_liora.C.l02: "And a cloister teaches you to peer over other people’s shoulders?"
dlg.scn.support.amos_liora.C.l03: "Forty years a field surgeon. I peer over every shoulder. Usually someone’s bleeding behind it."
dlg.scn.support.amos_liora.C.l04: "They say your cloister sent you away."
dlg.scn.support.amos_liora.C.l05: "They say right. I stitched up a border soldier who’d cut down three of ours."
dlg.scn.support.amos_liora.C.l06: "“The ember warms whom the Crown warms.” It’s carved above the temple gate."
dlg.scn.support.amos_liora.C.l07: "And whoever it doesn’t warm can freeze. Lovely saying. Never sewed a belly shut, though."
dlg.scn.support.amos_liora.C.l08: "I said it often. Aloud, at sickbeds. Back then it sounded like comfort."
dlg.scn.support.amos_liora.C.l09: "Sayings comfort whoever says them. The sick want hot water and a steady hand."
dlg.scn.support.amos_liora.C.l10: "My hand is steady, Brother Amos. Only the knot was crooked. That’s what you mean."
dlg.scn.support.amos_liora.C.l11: "Caught. Give it here, I’ll teach you the field knot. It holds even when they scream."
dlg.scn.support.amos_liora.B.l01: "You spent half the night in the sickroom. I saw the light under the door."
dlg.scn.support.amos_liora.B.l02: "Old men sleep badly. Might as well stir salve."
dlg.scn.support.amos_liora.B.l03: "You use thyme from the castle slope. The temple would have called it a peasant’s weed."
dlg.scn.support.amos_liora.B.l04: "The temple calls anything a weed that isn’t set in silver. The thyme helps all the same."
dlg.scn.support.amos_liora.B.l05: "For me it was the ember in my hands. I hardly ever needed herbs."
dlg.scn.support.amos_liora.B.l06: "I’ve no ember in my hands. Just herbs and thread. And envy is a sin, so they say."
dlg.scn.support.amos_liora.B.l07: "Which saying is that?"
dlg.scn.support.amos_liora.B.l08: "Mine. I make my own, now the order’s stopped sending them."
dlg.scn.support.amos_liora.B.l09: "Do you miss it? The cloister?"
dlg.scn.support.amos_liora.B.l10: "I miss the bell. Four in the morning, out over the valley. The prior, less so."
dlg.scn.support.amos_liora.B.l11: "I miss the incense. Strange, isn’t it? Of all things, the smoke."
dlg.scn.support.amos_liora.B.l12: "Not strange. You miss what smells of home. Even when home puts you out the door."
dlg.scn.support.amos_liora.B.l13: "Show me the salve, Amos. Tomorrow I’ll bring the thyme along when I heal."
dlg.scn.support.amos_liora.B.l14: "Then we stir together from now on. Bring water. I’ve two hands, and one of them has gout."
dlg.scn.support.amos_liora.A.l01: "You never ask why I bandage enemies. Everyone else asks that first."
dlg.scn.support.amos_liora.A.l02: "Because I know what it is to be sent away for a question."
dlg.scn.support.amos_liora.A.l03: "Ah. What was yours?"
dlg.scn.support.amos_liora.A.l04: "Where the young kings lie buried. No one in the temple wanted to know. I did."
dlg.scn.support.amos_liora.A.l05: "A good question. Dangerously good. Nobody gave you an answer, I take it."
dlg.scn.support.amos_liora.A.l06: "Only the gate. Your turn. Why enemies?"
dlg.scn.support.amos_liora.A.l07: "Twenty years ago, after a border skirmish, a boy from the border army lay before me. Belly wound."
dlg.scn.support.amos_liora.A.l08: "The prior said: our own first. I obeyed. By the time I reached him, he was quiet."
dlg.scn.support.amos_liora.A.l09: "He was younger than you. Since then I don’t ask whose colours a man wears."
dlg.scn.support.amos_liora.A.l10: "And the order took twenty years to send you away for it."
dlg.scn.support.amos_liora.A.l11: "I was an obedient brother for a long time. Obedience is comfortable. One day it wasn’t."
dlg.scn.support.amos_liora.A.l12: "“The ember heals whom it chooses.” I don’t believe that any more. I think we choose."
dlg.scn.support.amos_liora.A.l13: "Then choose well, Liora. And quickly. A wound won’t wait for us to agree."
dlg.scn.support.amos_liora.A.l14: "We do agree, Amos. That’s the strange part."
dlg.scn.support.amos_grosk.C.l01: "Sit down, big fellow. No, not the bench, it won’t hold you. The floor."
dlg.scn.support.amos_grosk.C.l02: "Hm."
dlg.scn.support.amos_grosk.C.l03: "That cut on your forearm. Who sewed it? A blind man with a horseshoe nail?"
dlg.scn.support.amos_grosk.C.l04: "Me."
dlg.scn.support.amos_grosk.C.l05: "Then you were the blind man. By the Pact, it only holds because your hide’s too stubborn to tear."
dlg.scn.support.amos_grosk.C.l06: "Held three winters."
dlg.scn.support.amos_grosk.C.l07: "I’ve sewn men who held three days. After that, all they needed was the gravedigger."
dlg.scn.support.amos_grosk.C.l08: "You dig graves too?"
dlg.scn.support.amos_grosk.C.l09: "In the cloister, yes. Who sews, digs. Saves paying a second man."
dlg.scn.support.amos_grosk.C.l10: "Don’t dig me."
dlg.scn.support.amos_grosk.C.l11: "You? That’d take me a week and three donkeys. Hold still, this’ll be cold."
dlg.scn.support.amos_grosk.B.l01: "You laugh in the sickroom."
dlg.scn.support.amos_grosk.B.l02: "Someone has to. The wounded don’t, and the dead even less."
dlg.scn.support.amos_grosk.B.l03: "The bands laughed too. Before a raid."
dlg.scn.support.amos_grosk.B.l04: "And after?"
dlg.scn.support.amos_grosk.B.l05: "Not after."
dlg.scn.support.amos_grosk.B.l06: "There’s the difference. I laugh before and after. In between, I sew."
dlg.scn.support.amos_grosk.B.l07: "I don’t laugh."
dlg.scn.support.amos_grosk.B.l08: "You do. Your beard twitches. I’m a field surgeon, I notice these things."
dlg.scn.support.amos_grosk.B.l09: "Hm. Beard."
dlg.scn.support.amos_grosk.B.l10: "My old master used to say: who won’t laugh at the bedside weeps into the basin at night."
dlg.scn.support.amos_grosk.B.l11: "Do you?"
dlg.scn.support.amos_grosk.B.l12: "Sometimes. Then the basin’s full, and I’ve room for jokes again."
dlg.scn.support.amos_grosk.B.l13: "I’ll carry the basin. At night."
dlg.scn.support.amos_grosk.B.l14: "A giant for a basin bearer. I’ll have that carved on my gravestone."
dlg.scn.support.amos_grosk.A.l01: "You’ve stood at that door for an hour. Either you’re bleeding or you’ve something to say."
dlg.scn.support.amos_grosk.A.l02: "No blood."
dlg.scn.support.amos_grosk.A.l03: "Pity. Blood I can manage. Talking’s harder. Come in."
dlg.scn.support.amos_grosk.A.l04: "In the bands. Whoever couldn’t walk any more stayed where he fell."
dlg.scn.support.amos_grosk.A.l05: "I gave that order. Often."
dlg.scn.support.amos_grosk.A.l06: "And now you stand in my door wanting to hear it wasn’t so bad."
dlg.scn.support.amos_grosk.A.l07: "No. Want to know how you carry it."
dlg.scn.support.amos_grosk.A.l08: "I left one lying too. Because the prior wished it. I carry him still."
dlg.scn.support.amos_grosk.A.l09: "It doesn’t get lighter. Your back just gets stronger. And you’ve got the back for it."
dlg.scn.support.amos_grosk.A.l10: "Hm. And then?"
dlg.scn.support.amos_grosk.A.l11: "Then you pick up the next one. And the one after. Until the reckoning isn’t so loud."
dlg.scn.support.amos_grosk.A.l12: "I pick them up. You sew."
dlg.scn.support.amos_grosk.A.l13: "Agreed. And if I’m the one left lying, big fellow?"
dlg.scn.support.amos_grosk.A.l14: "Then I carry you. Not dig. Carry."
