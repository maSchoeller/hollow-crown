# English texts of the act 2 scenes (the German text sits in the scene files).
dlg.scn.m2_1.tutorial_ballista.l01: "A ballista! Whoever stands beside it can aim it. Nobody gets onto its tile."
dlg.scn.m2_1.tutorial_ballista.l02: "The bolt flies far, but never at the next tile. And whoever it hits can't strike back."
dlg.scn.m2_1.tutorial_ballista.l03: "From above it carries even farther. Careful: with a foe beside it, it aims at us."
