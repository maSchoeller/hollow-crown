# English texts of the act 2 scenes (the German text sits in the scene files).
dlg.scn.m2_1.tutorial_ballista.l01: "A ballista! With that we bring them down from afar."
dlg.scn.m2_1.tutorial_ballista.l02: "Anyone on foot beside it can aim it. Nobody gets onto its tile."
dlg.scn.m2_1.tutorial_ballista.l03: "One shot a round, and it is the whole deed of whoever aims it."
dlg.scn.m2_1.tutorial_ballista.l04: "The bolt flies far, never at the next tile, and whoever it hits can't strike back."
dlg.scn.m2_1.tutorial_ballista.l05: "From above it carries farther. And careful: with a foe beside it, it aims at us."
# Story 11.5: lieutenant lines of act 2
dlg.scn.lt.rowena.first: "For Aldric and the Silver Lance! The stud holds."
dlg.scn.lt.rowena.grudge_1: "{target}. I know your face from the pasture."
dlg.scn.lt.rowena.grudge_2: "{target}! The Silver Lance forgets no insult."
dlg.scn.lt.rowena.grudge_3: "{target}! For Aldric. Today it ends."
dlg.scn.lt.rowena.flee_1: "Back to the stables! The lance regroups."
dlg.scn.lt.rowena.flee_2: "A knight knows when to give way. No shame in that."
dlg.scn.lt.rowena.flee_3: "For Aldric … I will stand again."
dlg.scn.lt.rowena.mock: "{target} has fallen. I pray for every dead."
dlg.scn.lt.brakka.first: "Whoever pays more is right. Today the other side pays."
dlg.scn.lt.brakka.grudge_1: "{target}. I had you in my sights."
dlg.scn.lt.brakka.grudge_2: "{target}! You cost me bolts. And pay."
dlg.scn.lt.brakka.grudge_3: "{target}! The shot at you I take for free."
dlg.scn.lt.brakka.flee_1: "Too little pay for this much trouble. I am off."
dlg.scn.lt.brakka.flee_2: "The contract runs on. I do not."
dlg.scn.lt.brakka.flee_3: "Whoever pays more is right. Today I pay."
dlg.scn.lt.brakka.mock: "{target}? One hit. Whoever pays more is right."
dlg.scn.lt.grell.first: "Everything has its price. Your hide too."
dlg.scn.lt.grell.grudge_1: "{target}. You are in my ledger."
dlg.scn.lt.grell.grudge_2: "{target}! Your debt grows with interest."
dlg.scn.lt.grell.grudge_3: "{target}! Today the books get settled."
dlg.scn.lt.grell.flee_1: "Cast off! This deal no longer pays."
dlg.scn.lt.grell.flee_2: "Everything has its price. This one was too high."
dlg.scn.lt.grell.flee_3: "The sea takes, the sea gives. We will meet again."
dlg.scn.lt.grell.mock: "{target} is paid for. Everything has its price."
dlg.scn.lt.sable.first: "Orders are orders. Do not take it personally."
dlg.scn.lt.sable.grudge_1: "{target}. I have not forgotten you."
dlg.scn.lt.sable.grudge_2: "{target}! Orders are orders. This one I enjoy."
dlg.scn.lt.sable.grudge_3: "{target}! No order holds me back today."
dlg.scn.lt.sable.flee_1: "Fall back! The border army still stands."
dlg.scn.lt.sable.flee_2: "Orders are orders. This one says: survive."
dlg.scn.lt.sable.flee_3: "I yield. But I wonder what for."
dlg.scn.lt.sable.mock: "{target} is dead. Orders are orders."
dlg.scn.lt.sable.join: "You warned my village. No order weighs more."

# Story 11.12: scn.m2_1.intro (before the map, arrival at Wind Gap)
dlg.scn.m2_1.intro.l01: "The wind tugs at the cloaks. The Wind Gap lies ahead, bare and gray."
dlg.scn.m2_1.intro.l02: "Beyond the crest opens the plain of the Iron March. Golden-brown, wide, strange."
dlg.scn.m2_1.intro.l03: "Ballistae stand on both rock spurs. Free Blades bar the pass."
dlg.scn.m2_1.intro.l04: "The pass is paid for, Ashen Banner. Turn back, or meet my ballistae."
dlg.scn.m2_1.intro.l05: "Under the east spur stands a gaudy minstrel's wagon. A lute defies the wind."
dlg.scn.m2_1.intro.l06: "No way past the spurs. Whoever climbs up gets the bolts first."
dlg.scn.m2_1.intro.l07: "Three bolts so far, all wide. Give me the spur, {avatar}, and I'll turn it."
dlg.scn.m2_1.intro.l08: "Freshly oiled, these ballistae. Someone paid for this pass."
dlg.scn.m2_1.intro.l09: "We hold until the wind turns. Or until no one pays for this pass anymore."

# Story 11.12: scn.m2_1.jory_talk (Jory joins during the battle)
dlg.scn.m2_1.jory_talk.l01: "Behind the wagon Jory sits on a tipped crate, lute across his knees."
dlg.scn.m2_1.jory_talk.l02: "Brakka counts coins and aims by the price. The wind knows better: gold never flies far."
dlg.scn.m2_1.jory_talk.l03: "Your company is gone. Why did you stay?"
dlg.scn.m2_1.jory_talk.l04: "At dawn they rode off with the horses. I got a lute and a wheelless wagon."
dlg.scn.m2_1.jory_talk.l05: "Then come with us. We could use a song against Brakka today."
dlg.scn.m2_1.jory_talk.l06: "Then you come along. Sing the rest of it on the road."

# Story 11.12: scn.m2_1.dragon_shadow (round 8, the shadow of the dragon)
dlg.scn.m2_1.dragon_shadow.l01: "The wind dies. In the middle of the storm it goes still; everyone stops, mercenaries too."
dlg.scn.m2_1.dragon_shadow.l02: "A shadow sweeps the pass and darkens the plain. No one sees the beast."
dlg.scn.m2_1.dragon_shadow.l03: "Where the wind is silent, the Eternal speaks. Hold your breath."
dlg.scn.m2_1.dragon_shadow.l04: "Onward. The wind will return."

# Story 11.12: scn.m2_1.outro (after the map, Brakka leaves, offers arrive, Rhen chooses a stance)
dlg.scn.m2_1.outro.l01: "The wind settles. The Free Blades pull the ballistae off the rock spurs."
dlg.scn.m2_1.outro.l02: "Time's up. The pass was paid for until noon today, not a moment longer."
dlg.scn.m2_1.outro.l03: "The crest is yours. Whoever pays more is right, and today nobody pays more."
dlg.scn.m2_1.outro.l04: "Lancers ride up from the plain, silver pennants: the princess's Silver Lance."
dlg.scn.m2_1.outro.l05: "Close behind them, a lone envoy, the Border Army's sign on his cloak."
dlg.scn.m2_1.outro.l06: "Both groups halt at the crest. No one lays a hand to a weapon. A knight lowers his lance in greeting."
dlg.scn.m2_1.outro.l07: "Her Highness Princess Seraphine offers you pardon."
dlg.scn.m2_1.outro.l07b: "In return for a service. The details follow once you accept."
dlg.scn.m2_1.outro.l08: "General Dravn offers the Ashen Banner pardon. For a service."
dlg.scn.m2_1.outro.l09: "Dravn. I know that name. With him, pardon is never free."
dlg.scn.m2_1.outro.l10: "Lancers wait, spears lowered; the envoy holds his rein. Both want an answer."
dlg.scn.m2_1.outro.l11: "Gallows yesterday, two pardons today. I'll believe it when a seal is on it."
dlg.scn.m2_1.outro.l12: "Two lords, two offers. One wears silver, the other dust. I like neither."
dlg.scn.m2_1.outro.l13: "You speak with them, {avatar}. What do we say?"
dlg.scn.m2_1.outro.c01.title: "Two offers of pardon"
dlg.scn.m2_1.outro.c01.warm: "\"Thank you both. We'll come and hear what you ask.\""
dlg.scn.m2_1.outro.c01.warm.summary: "Both offers stay open, with confidence"
dlg.scn.m2_1.outro.c01.sober: "\"We'll hear both jobs out before we promise anyone anything.\""
dlg.scn.m2_1.outro.c01.sober.summary: "Both offers stay open, but we check first"
dlg.scn.m2_1.outro.c01.defiant: "\"The Ashen Banner won't buy its way free. We decide for ourselves.\""
dlg.scn.m2_1.outro.c01.defiant.summary: "Both offers stay open, on our own terms"
dlg.scn.m2_1.outro.lw1: "You still believe in people, {avatar}. Good. Just watch who deserves it."
dlg.scn.m2_1.outro.ls1: "You reckon like a merchant. Good, this is a place for haggling."
dlg.scn.m2_1.outro.ld1: "You won't bend. Stay that way, but don't drag us down with you."
dlg.scn.m2_1.outro.l13b: "Two lords, one Ashen Banner. We head down."
dlg.scn.m2_1.outro.l14: "The envoys ride ahead. The company descends into the Iron March."
dlg.scn.m2_1.outro.l15: "One last look at the sky. Where the shadow passed, only gray wind remains."
# Story 11.13: mission 2-2 "The Seal in the Salt Pass" (drafts of the writing pipeline, accepted on play-through)
dlg.scn.m2_2.intro.l01: "Fog hangs in the Salt Pass, so thick that the rock walls are only shadows."
dlg.scn.m2_2.intro.l02: "The princess sends me. Her seal was seized on its way to the chancery."
dlg.scn.m2_2.intro.l03: "Captain Grell is taking it over the pass to Maelis. Bring it back before anyone seals with it."
dlg.scn.m2_2.intro.l04: "Then Her Highness writes your pardon. With that very seal."
dlg.scn.m2_2.intro.l05: "Higher up, wagon wheels creak. Salt trickles from the covers, then all is still again."
dlg.scn.m2_2.intro.l06: "You can see three steps ahead. After that there's only white, and someone in it."
dlg.scn.m2_2.intro.l07: "Let me go first. I see further in fog, and I don't ask chests for keys."
dlg.scn.m2_2.intro.l08: "Grell counts in gold, not in time. His caravan won't wait for us. We go."
dlg.scn.m2_2.rockfall_south.l01: "Above the southern narrows something cracks. Scree pours into the pass, two tiles lie under rock."
dlg.scn.m2_2.rockfall_south.l02: "That was no accident. Someone up there helped it along."
dlg.scn.m2_2.rockfall_south.l03: "Then forward only. Move."
dlg.scn.m2_2.rockfall_warn.l01: "Gravel trickles from the northern narrows. The wall above the road grinds."
dlg.scn.m2_2.rockfall_warn.l02: "Something up there is about to give. Whoever stands in the northern narrows should stand elsewhere soon."
dlg.scn.m2_2.rockfall_ledge.l01: "The rock ledge breaks away. Boulders tumble down, the way along the ledge is closed."
dlg.scn.m2_2.rockfall_ledge.l02: "The road, then. As long as the wagons are still there."
dlg.scn.m2_2.seal_found.l01: "In the chest, wrapped in oilcloth, lies a heavy seal with the princess's arms."
dlg.scn.m2_2.seal_found.l02: "Beneath it a folded letter without a name. It is closed with grey wax."
dlg.scn.m2_2.seal_found.l03: "A letter that travels with her seal. Who writes to the princess so secretly?"
dlg.scn.m2_2.seal_found.l04: "Take both. We read later, not here in the fog."
dlg.scn.m2_2.scouts_chart.l01: "In the scouts' chest lies a sea chart. In its margin, the mark of House Silver Sea."
dlg.scn.m2_2.scouts_chart.l02: "Drawn on it: the Salt Pass, the mouth of the Aure and a course across the sea, nameless at its end."
dlg.scn.m2_2.scouts_chart.l03: "Kharesh. That is how they draw their roads. I burned charts like this in the war."
dlg.scn.m2_2.scouts_chart.l04: "So Silver Sea sells passages. The question is, to whom else."
dlg.scn.m2_2.outro.l01: "The fog lifts. Higher up, Grell's wagons pull away, faster than they came."
dlg.scn.m2_2.outro.l02: "Keep your seal, Ashen Banner. Silver Sea has other customers."
dlg.scn.m2_2.outro.l03: "Other customers. I wonder who else besides Grell comes over this pass."
dlg.scn.m2_2.outro.l04: "A seal for our pardon. And a letter none of us is meant to read."
dlg.scn.m2_2.outro.l05: "I'll believe it when the seal sits under the pardon. Until then it's just metal."
dlg.scn.m2_2.outro.l06: "A song about a stolen seal? Hard to sing while nobody knows who stole it."
dlg.scn.m2_2.outro.l07: "We take it to the princess. And we remember who else writes to her."

# Story 11.14: mission 2-3 "The Raven Pasture" (drafts of the writing pipeline, accepted on play-through)
dlg.scn.m2_3.intro.l01: "Golden pastures down to the Aure. Across it white paddocks, stables and silver pennants."
dlg.scn.m2_3.intro.l02: "The stud of the Silver Lance. The general needs the horses for the border army."
dlg.scn.m2_3.intro.l03: "The crown granted them to him long ago. You only fetch them, nothing more."
dlg.scn.m2_3.intro.l04: "If the crown granted them, why does it take sellswords to fetch them?"
dlg.scn.m2_3.intro.l05: "The Lance thinks itself better. It gives nothing away, not even what belongs to the crown."
dlg.scn.m2_3.intro.l06: "On the far bank lancers form up on foot. Not one of them sits in the saddle."
dlg.scn.m2_3.intro.l07: "Someone moves in the wood on the north bank. No knight. More like someone who reads tracks."
dlg.scn.m2_3.intro.l08: "Three fords and a footbridge. We cross and take what we were promised."
dlg.scn.m2_3.water_hint.l01: "The Aure is shallow but swift. Three fords lead across, and by the road a narrow wooden footbridge."
dlg.scn.m2_3.water_hint.l02: "Nobody in full armor gets through a ford. Whoever wears iron has to take the bridge."
dlg.scn.m2_3.water_hint.l03: "Then the heavy ones hold the bridge. The light ones take the fords and hit their flank."
dlg.scn.m2_3.ilka_talk.l01: "A marksman kneels among the trees. The bow is drawn, the arrow points at the ground."
dlg.scn.m2_3.ilka_talk.l02: "I read tracks, not crests. The Lance pays me for the horse trains, not for killing."
dlg.scn.m2_3.ilka_talk.l03: "Then read ours. We are no horse thieves, even if it looks that way today."
dlg.scn.m2_3.ilka_talk.l04: "Your trail comes from the border army. It smells of lies. But you don't walk like liars."
dlg.scn.m2_3.ilka_talk.l05: "Then walk a stretch with us. Whoever reads tracks sees sooner where they lead."
dlg.scn.m2_3.ilka_talk.l06: "A stretch. If I don't like it, I'm gone before you notice."
dlg.scn.m2_3.outro.l01: "At the stud yard the lances drop. Rowena comes back on foot, helmet under her arm."
dlg.scn.m2_3.outro.l02: "Enough. I give up the stud for today. Nobody else dies here for horses."
dlg.scn.m2_3.outro.l03: "Lucan leans on the paddock fence, a hand on his bleeding side. Two knights step toward him."
dlg.scn.m2_3.outro.l04: "Leave him. Fetch linen and water. The Lance takes no wounded man prisoner."
dlg.scn.m2_3.outro.l05: "You hold that sword like someone from a house of the crown. Who brought you this far?"
dlg.scn.m2_3.outro.l06: "The same people who take your horses today. Long story, Dame Rowena."
dlg.scn.m2_3.outro.l07: "Then tell your general: the crown refused him the horses. Twice, under seal."
dlg.scn.m2_3.outro.l08: "His envoy said they were granted long ago. We were only to fetch them."
dlg.scn.m2_3.outro.l09: "Then he lied to you. Nobody just fetches anything from the stud of the Lance."
dlg.scn.m2_3.outro.l10: "I told you. The trail from the border army smells of lies."
dlg.scn.m2_3.outro.l11: "We fight for a pardon and steal horses nobody wanted to give up along the way. Wonderful."
dlg.scn.m2_3.outro.l12: "Rowena gathers her knights and withdraws north. At the gate she turns once more."
dlg.scn.m2_3.outro.l13: "We will meet again, Ashen Banner. Not over horses, I hope."
dlg.scn.m2_3.outro.l14: "So Dravn lies even about small things. Let's remember that, {avatar}."
