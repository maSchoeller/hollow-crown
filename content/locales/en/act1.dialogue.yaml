# English texts of the act 1 scenes; keys = dlg.<scene>.<line>[.<answer>|.memorial] (architecture 5.8). German text sits in the scene files.
dlg.scn.ch01.ambush.l01: "Ambush! They were waiting in the ruins!"
dlg.scn.ch01.hask_battle.l01: "Burns pretty, doesn't it? Soon you'll burn with it!"
dlg.scn.ch01.intro.l01: "Captain! The town's burning – and ever since the Pact Night the whole country has gone mad!"
dlg.scn.ch01.intro.l02: "Aldric was healthy as an ox when I guarded him. And then he died before our eyes."
dlg.scn.ch01.intro.l03: "Marauders exploit the chaos faster than any herald."
dlg.scn.ch01.intro.l03b: "We need to cross that bridge before they tear it down."
dlg.scn.ch01.intro.l04: "{avatar}. You wanted to prove you can do more than read maps. Here's your chance."
dlg.scn.ch01.intro.c01.cautious: "\"We stay together and avoid the fire.\""
dlg.scn.ch01.intro.c01.bold: "\"We cut a path straight through.\""
dlg.scn.ch01.intro.l05: "Careful. Good. Dead mercenaries don't collect pay."
dlg.scn.ch01.intro.l06: "Bold. Let's hope the fire agrees."
dlg.scn.ch01.mira_lost.l01: "The house on the east edge … they set it alight. Someone was inside. We're too late."
dlg.scn.ch01.mira_village.l01: "One more step and you'll have an arrow in your – oh. You're not with Hask's lot."
dlg.scn.ch01.mira_village.l02: "Ashen Banner. We're headed for the bridge. You shoot well?"
dlg.scn.ch01.mira_village.l03: "Better than any noble who ever hunted these woods."
dlg.scn.ch01.mira_village.l03b: "I'm Mira. I'll come along – but my village comes first."
dlg.scn.ch01.outro.l01: "The bridge stands. The town doesn't."
dlg.scn.ch01.outro.l02: "A rider of the Silver Lance came through. He asked after a seer – at the shrine in the Silverbrook valley."
dlg.scn.ch01.outro.l03: "The Lance hunts a seer while the realm burns? Then she matters. We find her first."
dlg.scn.ch01.outro.l04: "{avatar} – this was in Hask's tent. An Ember folio. You studied magic at the academy, didn't you? Take it."
dlg.scn.ch01.tutorial_fire.l01: "See the flames in the grass? Fire spreads every round. Anyone standing in it burns."
dlg.scn.ch01.tutorial_fire.l02: "And the houses? There are still people inside! We should visit them before the looters do."
dlg.scn.ch01.tutorial_triangle.l01: "Our goal is the bridge to the north. I have to reach it – we don't need to kill Hask for that."
dlg.scn.ch01.tutorial_triangle.l02: "Hask's men carry axes, the deserters lances, the sellswords swords."
dlg.scn.ch01.tutorial_triangle.l02b: "Remember: sword beats axe, axe beats lance, lance beats sword."
dlg.scn.ch01.tutorial_triangle.l03: "And my lance beats … swords! Leave the sellswords to me!"
dlg.scn.ch01.tutorial_triangle.l04: "A green ▲ in the forecast means advantage, a red ▼ disadvantage. I'll take the lancers."
dlg.scn.ch01.village_north.l01: "An old woman presses a pouch into Tobin's hand. \"For the bridge. Get the children across.\""
dlg.scn.ch01.village_west.l01: "A smith presses a javelin into your hands. \"Hit them before they hit you.\""
dlg.scn.ch02.intro.l01: "Early autumn. Mist lies over the Silverbrook. A single white light burns at the shrine."
dlg.scn.ch02.intro.l02: "You are late, Captain Kael. I saw you three days ago – in a dream made of ash."
dlg.scn.ch02.intro.l03: "You know my name."
dlg.scn.ch02.intro.l04: "I also know the name of the woman who has come to take me. Morra. Her sellswords are already at the brook."
dlg.scn.ch02.intro.l05: "Morra … she'd sell her own mother if the price was right."
dlg.scn.ch02.intro.c01.hold: "\"We hold the shrine until Morra gives up.\""
dlg.scn.ch02.intro.c01.question: "\"Who paid Morra? That's what I want to know.\""
dlg.scn.ch02.intro.l06: "Eight rounds, I reckon. Then the contract gets too costly for her."
dlg.scn.ch02.intro.l07: "A good question. You will not like the answer."
dlg.scn.ch02.morra_battle.l01: "Nothing personal, Kael. Just a contract. But I finish my contracts."
dlg.scn.ch02.outro.l01: "Morra withdraws. You saved me, Ashen Banner. And I pay my debts."
dlg.scn.ch02.outro.l02: "The crown was not stolen, Captain. It was … taken back. I cannot say more yet."
dlg.scn.ch02.outro.l03: "Taken back? By whom?"
dlg.scn.ch02.outro.l04: "By the one it always belonged to. Let me travel with you."
dlg.scn.ch02.outro.l04b: "{avatar} – I saw you in my dream. You were holding the crown."
dlg.scn.ch02.reinforcements.l01: "More are coming. From west and east – I see their shadows in the mist."
dlg.scn.ch02.tutorial_magic.l01: "Liora is on the shrine. It heals her, but she won't last long alone."
dlg.scn.ch02.tutorial_magic.l01b: "If she falls, it's all over."
dlg.scn.ch02.tutorial_magic.l02: "Magic strikes the spirit, not the armour: it pits MAG against RES and reaches two tiles."
dlg.scn.ch02.tutorial_magic.l03: "{avatar}, your folio is made for the armoured ones."
dlg.scn.ch02.tutorial_magic.l03b: "And keep away from their mage – armour won't help there."
dlg.scn.ch02.tutorial_talk.l01: "And Kael … the one in the plum coat over there. Isn't that Varek?"
dlg.scn.ch02.tutorial_talk.l02: "Varek. If I get close enough, I'll talk to him. He never fought for anything he didn't like."
dlg.scn.ch02.tutorial_talk.l03: "Put me next to him and choose \"Talk\". Until then, nobody attacks him."
dlg.scn.ch02.varek_spotted.l01: "Well, look at that. Kael of the Ashen Banner. Care to roll dice, or cross swords?"
dlg.scn.ch02.varek_talk.l01: "Varek. Since when do you kidnap seers?"
dlg.scn.ch02.varek_talk.l02: "Since Morra pays up front."
dlg.scn.ch02.varek_talk.l02b: "But honestly … the client wears a golden mask. I don't like it."
dlg.scn.ch02.varek_talk.l03: "Then I'll pay you double. Later."
dlg.scn.ch02.varek_talk.l04: "Later. My favourite sum. Fine – the dice say: Ashen Banner."
dlg.scn.ch02.village_herb.l01: "A herbwoman hands you a rune, cool as brook water. \"Water quenches fire. Don't forget it.\""
dlg.scn.ch02.village_mill.l01: "The miller slides a potion across. \"For the seer. She prayed my boy back to health.\""
dlg.scn.m1_1.house_e.l01: "An old couple slips you a small flask. \"The bounty can't buy us. The hunters outside can.\""
dlg.scn.m1_1.house_ne.l01: "An herb woman presses a potion into Tobin's hand. \"A stranger brought those notices.\""
dlg.scn.m1_1.house_nw.l01: "A baker pushes a pouch toward Brenna. \"I don't believe the notices. Murderers don't bring bread.\""
dlg.scn.m1_1.house_w.l01: "A smith nods. \"The notices have been plastered everywhere since yesterday. I'd still rather have your gold.\""
dlg.scn.m1_1.intro.l01: "Varnhold, a border town. Late summer, noon, dust on the road. A few days after the Pact Night."
dlg.scn.m1_1.intro.l02: "Varnhold! A roof, a soup, a bed where nobody snores. I mean … well …"
dlg.scn.m1_1.intro.l03: "It's all right, chick. He would have laughed."
dlg.scn.m1_1.intro.l04: "We buy bread and water and we're out again before nightfall."
dlg.scn.m1_1.intro.l05: "People are staring at us."
dlg.scn.m1_1.intro.l06: "The same notice hangs on every wall: four faces and one sentence. Wanted for the murder of the king."
dlg.scn.m1_1.intro.l07: "Dead or alive. Nobody even asked us."
dlg.scn.m1_1.intro.l08: "All of Valmora thinks we murdered the king."
dlg.scn.m1_1.intro.l09: "It wasn't us, was it? I mean, we know it wasn't us."
dlg.scn.m1_1.intro.l10: "We know. The people out there don't."
dlg.scn.m1_1.intro.l11: "And here they come. From the alleys. Notices in hand."
dlg.scn.m1_1.intro.l12: "Weapons ready. We stay together. {avatar}, form the lines."
dlg.scn.m1_1.outro.l01: "The hunters are down or running. The market is empty, only a notice flutters on the wall."
dlg.scn.m1_1.outro.l02: "Hey, hey, don't shoot! I'm on your side. For about ten heartbeats now."
dlg.scn.m1_1.outro.l03: "And who are you, chick?"
dlg.scn.m1_1.outro.l04: "Fenn. Best thief in Varnhold. Well, second best. The best sits in the tower, and not because of me."
dlg.scn.m1_1.outro.l05: "You watched from the roof."
dlg.scn.m1_1.outro.l06: "Watched? I scouted half the hunters for you! All right, half of the half."
dlg.scn.m1_1.outro.l07: "You don't print that many notices overnight. This was planned. Long ago."
dlg.scn.m1_1.outro.l08: "Then somebody knew in advance what would happen on the Pact Night."
dlg.scn.m1_1.outro.l09: "Somebody who gave us the contract."
dlg.scn.m1_1.outro.l10: "Who hired us? That's our question from now on."
dlg.scn.m1_1.outro.l11: "I know every alley to Aurenhall and every fence. Take me along! Cheap. Fine: dear, but good."
dlg.scn.m1_1.outro.l12: "Give Tobin his pouch back, chick. The one in your left hand."
dlg.scn.m1_1.outro.l13: "What pouch? It was empty anyway!"
dlg.scn.m1_1.outro.l14: "Welcome to the Ashen Banner, Fenn."
dlg.scn.m1_1.outro.l15: "You just take me? No guarantor? Nobody's ever done that."
dlg.scn.m1_1.posters.l01: "That … that's us. Drawn. With a beard. I don't even have a beard!"
dlg.scn.m1_1.posters.l02: "\"Wanted for the murder of the king.\" The bounty is bigger than a whole company's pay."
dlg.scn.m1_1.tutorial_triangle.l01: "The hunters carry axes, lances and swords all mixed up."
dlg.scn.m1_1.tutorial_triangle.l01b: "Remember: sword beats axe, axe beats lance, lance beats sword."
dlg.scn.m1_1.tutorial_triangle.l02: "A green ▲ in the forecast means advantage, a red ▼ disadvantage. Look before you swing."
dlg.scn.prologue.intro.l01: "(A voice, distant as a dream.) For three hundred years the dragons slept beneath the mountain."
dlg.scn.prologue.intro.l01b: "For three hundred years every king wore the Ember Crown."
dlg.scn.prologue.intro.l02: "On the night of the Pact Festival the ember went out. The king died. And the crown … was gone."
dlg.scn.prologue.intro.l03: "Aurenhall, late summer. Pact Festival. The Ashen Banner keeps watch at the outer ring of the Glutdom."
dlg.scn.prologue.intro.l04: "Thirty years I've carried this banner, and never has a watch smelled of incense."
dlg.scn.prologue.intro.l05: "One day they'll sing songs about – about the night the Ashen Banner guarded the king!"
dlg.scn.prologue.intro.l06: "They sing about kings, chick. About guards they only sing when they snore. Gerrit?"
dlg.scn.prologue.intro.l07: "I snore in time. That's called marching music."
dlg.scn.prologue.intro.l08: "Hold the ring, guard the door, go home. The pay is good."
dlg.scn.prologue.intro.l09: "Triple pay for a night of door-minding. I don't trust gold that comes that easy."
dlg.scn.prologue.intro.l10: "{avatar} got us the contract. Didn't you?"
dlg.scn.prologue.intro.l11: "The client paid in advance. I should have asked more."
dlg.scn.prologue.intro.l12: "Whoever asks questions before the pay is right goes hungry. Don't fret, {avatar}."
dlg.scn.prologue.intro.l13: "Weeks with us, {avatar}, and I still don't know why the Academy struck you off."
dlg.scn.prologue.intro.c01.honest: "\"I don't remember. That's the truth.\""
dlg.scn.prologue.intro.c01.proud: "\"Maybe I was too good for them.\""
dlg.scn.prologue.intro.l14: "Hm. Honest, at least. That's more than most offer."
dlg.scn.prologue.intro.l15: "Modest, you are not. Good. We've had modest strategists – they're all dead."
dlg.scn.prologue.intro.l16: "It's fine. What counts here is who stays when things get hot."
dlg.scn.prologue.intro.l17: "A bell tolls in the Glutdom, once, too high and wrong. Behind the doors someone screams."
dlg.scn.prologue.intro.l18: "The king is dead. The crown is gone. And the temple guards turn on the mercenaries."
dlg.scn.prologue.intro.l19: "Those aren't criers, Kael. Those are drawn blades!"
dlg.scn.prologue.intro.l20: "The ring is lost. Get everyone out of here. I'll cover your backs!"
dlg.scn.prologue.intro.l21: "Everyone to the temple gate in the south. Nobody stays behind. I go last. {avatar}, lead us."
dlg.scn.prologue.outro.l01: "A night later. A forest edge south of Aurenhall. By the fire, a fresh grave and a banner."
dlg.scn.prologue.outro.l02: "He held the door for us. I looked back. I should have … I shouldn't have …"
dlg.scn.prologue.outro.l03: "Thirty years he carried that thing. And he didn't let go. Not to the very end."
dlg.scn.prologue.outro.l04: "Gerrit has carried this banner for as long as there's been one."
dlg.scn.prologue.outro.l05: "I don't know what to say."
dlg.scn.prologue.outro.l06: "Then say nothing. Just stay here."
dlg.scn.prologue.outro.l07: "I'll take the watch. Sleep, chick. Tonight he stays with us."
dlg.scn.prologue.outro.l08: "Nobody speaks. In the distance the bells of Aurenhall ring, as if nothing had happened."
dlg.scn.prologue.outro.l09: "Tomorrow we ride to the border, to Varnhold. They'll look for us there last."
dlg.scn.prologue.tutorial_danger.l01: "Tap an enemy: the red area shows how far it reaches on its turn."
dlg.scn.prologue.tutorial_danger.l01b: "Anyone wounded stays out of it."
dlg.scn.prologue.tutorial_danger.l02: "And use the trees in the gardens. Whoever stands in the woods gets hit less often."
dlg.scn.prologue.tutorial_heal.l01: "Kael, you're bleeding! Drink a vulnerary – under \"Item\", before you wait."
dlg.scn.prologue.tutorial_move.l01: "Out through the temple gate in the south, all four of us. I go last."
dlg.scn.prologue.tutorial_move.l02: "Tap a unit: blue is its path, red its attack. Tap a tile to preview, then again."
dlg.scn.prologue.tutorial_move.l03: "And before you swing: check the combat forecast."
dlg.scn.support.avatar_kael.A.l01: "The sword’s sharp. You’ve been whetting it for half an hour."
dlg.scn.support.avatar_kael.A.l02: "I know."
dlg.scn.support.avatar_kael.A.l03: "When you told me everything back then, you thought I’d send you away."
dlg.scn.support.avatar_kael.A.l04: "I would have understood."
dlg.scn.support.avatar_kael.A.l05: "So would I. That’s why I didn’t."
dlg.scn.support.avatar_kael.A.l06: "Twelve years back. Border war. A noble commander who needed a victory."
dlg.scn.support.avatar_kael.A.l07: "We were the price he was willing to pay."
dlg.scn.support.avatar_kael.A.l08: "I didn’t stop him. I came back. Most didn’t."
dlg.scn.support.avatar_kael.A.l09: "You trusted the commander. I trusted Dunn."
dlg.scn.support.avatar_kael.A.l10: "Yes."
dlg.scn.support.avatar_kael.A.l11: "Mine are twelve years old. Yours are a few weeks. I never weighed them against each other."
dlg.scn.support.avatar_kael.A.l12: "And if we put them together?"
dlg.scn.support.avatar_kael.A.l13: "Then we both sleep badly."
dlg.scn.support.avatar_kael.A.l14: "At least we have company."
dlg.scn.support.avatar_kael.A.l15: "Hand over the whetstone."
dlg.scn.support.avatar_kael.B.l01: "Your name is on the watch roster twice today."
dlg.scn.support.avatar_kael.B.l02: "One’s missing. Someone has to take it."
dlg.scn.support.avatar_kael.B.l03: "I know who’s missing."
dlg.scn.support.avatar_kael.B.l04: "His place by the fire. Nobody sits there. Not me either."
dlg.scn.support.avatar_kael.B.l05: "We all sit beside it and pretend nothing is there."
dlg.scn.support.avatar_kael.B.l06: "Mm."
dlg.scn.support.avatar_kael.B.l07: "Give me the second watch. Tonight and tomorrow."
dlg.scn.support.avatar_kael.B.l08: "You’re not on the roster."
dlg.scn.support.avatar_kael.B.l09: "That’s why I’m asking."
dlg.scn.support.avatar_kael.B.l10: "I have it under control."
dlg.scn.support.avatar_kael.B.l11: "Your eyes say otherwise."
dlg.scn.support.avatar_kael.B.l12: "Second watch. If anything stirs, you wake Brenna."
dlg.scn.support.avatar_kael.B.l13: "And you?"
dlg.scn.support.avatar_kael.B.l14: "I’ll stay too. Beside the spot, not on it."
dlg.scn.support.avatar_kael.C.l01: "Second watch is mine. You can go to sleep."
dlg.scn.support.avatar_kael.C.l02: "I can’t. I’d rather sit here, if that’s allowed."
dlg.scn.support.avatar_kael.C.l03: "Allowed."
dlg.scn.support.avatar_kael.C.l04: "From the Academy to a company like ours. That’s a fall in station."
dlg.scn.support.avatar_kael.C.l05: "I was thrown out. Gambling debts. You know that."
dlg.scn.support.avatar_kael.C.l06: "I know about being thrown out. Not why it had to be us."
dlg.scn.support.avatar_kael.C.l07: "Your pay came on time. That’s rare."
dlg.scn.support.avatar_kael.C.l08: "That was an answer to a different question."
dlg.scn.support.avatar_kael.C.l09: "Some people wouldn’t wait. And you had work."
dlg.scn.support.avatar_kael.C.l10: "And nothing else."
dlg.scn.support.avatar_kael.C.l11: "Pass me some wood?"
dlg.scn.support.avatar_kael.C.l12: "Here. I won’t ask you again today."
dlg.scn.support.avatar_kael.S.l01: "You’ve folded that wanted poster three times today already."
dlg.scn.support.avatar_kael.S.l02: "It doesn’t get any smoother."
dlg.scn.support.avatar_kael.S.l03: "What’s on it that you don’t already know?"
dlg.scn.support.avatar_kael.S.l04: "The sum. It’s enough for everyone."
dlg.scn.support.avatar_kael.S.l05: "The company could be dissolved. Every man paid out, and a road away from here."
dlg.scn.support.avatar_kael.S.l06: "I’ve thought about it. More than once. At night."
dlg.scn.support.avatar_kael.S.l07: "And where would you be?"
dlg.scn.support.avatar_kael.S.l08: "Gone. That was the part that didn’t bother me."
dlg.scn.support.avatar_kael.S.l09: "It bothers me. You’re not going. That is not a request."
dlg.scn.support.avatar_kael.S.l10: "I didn’t do it."
dlg.scn.support.avatar_kael.S.l11: "You said it. That’s enough for me today."
dlg.scn.support.avatar_kael.S.l12: "I’m tired."
dlg.scn.support.avatar_kael.S.l13: "Then lie down. I’ll keep watch. And you too."
dlg.scn.support.avatar_kael.S.l14: "I don’t know how that works."
dlg.scn.support.avatar_kael.S.l15: "Close your eyes. I’ll handle the rest."
dlg.scn.support.avatar_kael.S.l16: "Wake me at first light. Or not at all."
dlg.scn.support.avatar_liora.A.l01: "I know what you told Kael. I didn’t want to pretend I knew nothing."
dlg.scn.support.avatar_liora.A.l02: "Then you also know who took the job from Osric Dunn."
dlg.scn.support.avatar_liora.A.l03: "You. Yes."
dlg.scn.support.avatar_liora.A.l04: "And you’re still sitting here."
dlg.scn.support.avatar_liora.A.l05: "Where else should I sit? The fire is here."
dlg.scn.support.avatar_liora.A.l06: "Don’t make this easy for me."
dlg.scn.support.avatar_liora.A.l07: "Forgiving is Kael’s to do, not mine. I just don’t see you differently than yesterday."
dlg.scn.support.avatar_liora.A.l08: "That’s more than I expected."
dlg.scn.support.avatar_liora.A.l09: "When I was small and broke something, Halvard came to me with bread."
dlg.scn.support.avatar_liora.A.l10: "He said: a debt weighs less when a second hand is under it. He had forgiven me already."
dlg.scn.support.avatar_liora.A.l11: "I believed him. I still do."
dlg.scn.support.avatar_liora.A.l12: "He raised you well."
dlg.scn.support.avatar_liora.A.l13: "He tried. His bread was better than his sermons."
dlg.scn.support.avatar_liora.A.l14: "A second hand. If you offer it, I’ll take it."
dlg.scn.support.avatar_liora.A.l15: "It’s already there."
dlg.scn.support.avatar_liora.B.l01: "You left your soup standing. That’s the third night."
dlg.scn.support.avatar_liora.B.l02: "I’ll eat later."
dlg.scn.support.avatar_liora.B.l03: "You say that every night. The temple had a saying for it."
dlg.scn.support.avatar_liora.B.l04: "Of course it did."
dlg.scn.support.avatar_liora.B.l05: "“Guilt is an ember: whoever hides it carries it until it burns.” As a child I thought that lovely."
dlg.scn.support.avatar_liora.B.l06: "And now?"
dlg.scn.support.avatar_liora.B.l07: "Now I wonder who decided that people must carry embers alone."
dlg.scn.support.avatar_liora.B.l08: "Why are you asking me that?"
dlg.scn.support.avatar_liora.B.l09: "You hold that bowl as if it were hot. It’s long since cold."
dlg.scn.support.avatar_liora.B.l10: "I’m tired, that’s all."
dlg.scn.support.avatar_liora.B.l11: "I believe you. The rest I’ll leave with you."
dlg.scn.support.avatar_liora.B.l12: "Thanks."
dlg.scn.support.avatar_liora.B.l13: "Eat. Cold soup is bland. Warm soup would at least be bland and warm."
dlg.scn.support.avatar_liora.C.l01: "I roll bandages; it calms me. Would you mind if I sat by your watch?"
dlg.scn.support.avatar_liora.C.l02: "The night is long. One more fire won’t hurt."
dlg.scn.support.avatar_liora.C.l03: "The company is sparing with words, I’ve noticed. May I tell you something anyway?"
dlg.scn.support.avatar_liora.C.l04: "We’re all strange here. Go on."
dlg.scn.support.avatar_liora.C.l05: "I sometimes dream things before they happen. I dreamed of you weeks ago."
dlg.scn.support.avatar_liora.C.l06: "Of me. And what did I do?"
dlg.scn.support.avatar_liora.C.l07: "You stood before the crown and didn’t look at it. Only at the mountain behind it."
dlg.scn.support.avatar_liora.C.l08: "A dream is a dream. I see no mountain here."
dlg.scn.support.avatar_liora.C.l09: "Nor do I. I don’t know what it means. I only tell what I saw."
dlg.scn.support.avatar_liora.C.l10: "And if it means nothing?"
dlg.scn.support.avatar_liora.C.l11: "Then I’ve rid myself of a bad dream and had someone listen for a night."
dlg.scn.support.avatar_liora.C.l12: "Stay put. The mountain can wait."
dlg.scn.support.avatar_liora.S.l01: "I dreamed again. Don’t worry, this time without the mountain."
dlg.scn.support.avatar_liora.S.l02: "Without the crown too?"
dlg.scn.support.avatar_liora.S.l03: "Without the crown. You were just sitting by a fire. Like now."
dlg.scn.support.avatar_liora.S.l04: "Sounds harmless."
dlg.scn.support.avatar_liora.S.l05: "I was glad in it. That’s the strange part. I didn’t have to interpret anything."
dlg.scn.support.avatar_liora.S.l06: "And what does the temple say to that?"
dlg.scn.support.avatar_liora.S.l07: "The temple has nothing to say. I do."
dlg.scn.support.avatar_liora.S.l08: "When Morra came, I looked for you first, before anyone else. I wanted you to know."
dlg.scn.support.avatar_liora.S.l09: "I’m glad you said so."
dlg.scn.support.avatar_liora.S.l10: "I was looking for you too. Just not out loud."
dlg.scn.support.avatar_liora.S.l11: "Then let’s say it now, both quietly."
dlg.scn.support.avatar_liora.S.l12: "I’ve fallen for you, Liora. Somewhere between the mountain and the fire."
dlg.scn.support.avatar_liora.S.l13: "So have I. The tea is going cold."
dlg.scn.support.brenna_kael.A.l01: "That wanted poster is worn soft, Captain. You read it as if something new were on it."
dlg.scn.support.brenna_kael.A.l02: "The same thing is on it. One number. It would be a new life for each of you."
dlg.scn.support.brenna_kael.A.l03: "For each of us. And who hands the Captain in?"
dlg.scn.support.brenna_kael.A.l04: "I haven’t said anything."
dlg.scn.support.brenna_kael.A.l05: "Exactly. You’ve said nothing for days, and it smells of farewell."
dlg.scn.support.brenna_kael.A.l06: "Without the company, nobody hunts you. The banner costs you more than it brings in."
dlg.scn.support.brenna_kael.A.l07: "Ah. You’re counting. I thought I was the one who did that in this company."
dlg.scn.support.brenna_kael.A.l08: "Brenna."
dlg.scn.support.brenna_kael.A.l09: "I know how it feels to carry guilt for others. It has never saved anyone."
dlg.scn.support.brenna_kael.A.l10: "You have a castle. I’m not asking you to come along."
dlg.scn.support.brenna_kael.A.l11: "If you go, I go. Just decide whether you tell me before."
dlg.scn.support.brenna_kael.A.l12: "…"
dlg.scn.support.brenna_kael.A.l13: "I’ll stay. Today."
dlg.scn.support.brenna_kael.A.l14: "Today will do for me. Tomorrow I’ll ask again."
dlg.scn.support.brenna_kael.B.l01: "Give here. The banner. You’re sewing as if you meant to punish it."
dlg.scn.support.brenna_kael.B.l02: "Gerrit always picked the thread himself. I don’t even know which one."
dlg.scn.support.brenna_kael.B.l03: "The brown one. He swore it holds better. It doesn’t, but he swore it."
dlg.scn.support.brenna_kael.B.l04: "I should have been with him."
dlg.scn.support.brenna_kael.B.l05: "You were with us. That’s a post you have to stand at too."
dlg.scn.support.brenna_kael.B.l06: "I have the map, the pay, the watch. And now this too…"
dlg.scn.support.brenna_kael.B.l07: "I’ll take the watch. The map tomorrow, the coin too."
dlg.scn.support.brenna_kael.B.l08: "That’s too much for one person."
dlg.scn.support.brenna_kael.B.l09: "It’s less than what you’re hauling. Just sit down, Kael."
dlg.scn.support.brenna_kael.B.l10: "…"
dlg.scn.support.brenna_kael.B.l11: "And if you don’t lie down in a minute, I’ll tell you a joke."
dlg.scn.support.brenna_kael.B.l12: "That’s a threat."
dlg.scn.support.brenna_kael.B.l13: "A promise. It holds as long as you’re awake."
dlg.scn.support.brenna_kael.C.l01: "What does an axe do when it’s tired, Captain? It hits the hay!"
dlg.scn.support.brenna_kael.C.l02: "Yesterday it was a shovel."
dlg.scn.support.brenna_kael.C.l03: "It retired. You never laugh. That’s no lack of wit."
dlg.scn.support.brenna_kael.C.l04: "I laugh when there’s a reason."
dlg.scn.support.brenna_kael.C.l05: "You didn’t laugh either when I came to the first fire. You just nodded."
dlg.scn.support.brenna_kael.C.l06: "You talked enough for two."
dlg.scn.support.brenna_kael.C.l07: "And you never asked why I came alone. Not once."
dlg.scn.support.brenna_kael.C.l08: "Did you want to tell me?"
dlg.scn.support.brenna_kael.C.l09: "No."
dlg.scn.support.brenna_kael.C.l10: "There you are."
dlg.scn.support.brenna_kael.C.l11: "Twelve years, and it’s still the same unasked question."
dlg.scn.support.brenna_kael.C.l12: "It has proven itself. Pass the ladle, the stew’s catching."
dlg.scn.support.brenna_kael.S.l01: "You’ve been standing there a while. The axe won’t get any sharper for it."
dlg.scn.support.brenna_kael.S.l02: "I have to tell you something."
dlg.scn.support.brenna_kael.S.l03: "You never say “I have to.” You say “so” or “no.”"
dlg.scn.support.brenna_kael.S.l04: "I haven’t said it in twelve years. I thought I had no right."
dlg.scn.support.brenna_kael.S.l05: "Kael…"
dlg.scn.support.brenna_kael.S.l06: "I love you, Brenna. That’s all. I didn’t prepare anything more."
dlg.scn.support.brenna_kael.S.l07: "…"
dlg.scn.support.brenna_kael.S.l08: "I knew it. Hoped it too. That isn’t the same thing."
dlg.scn.support.brenna_kael.S.l09: "I know."
dlg.scn.support.brenna_kael.S.l10: "I’ve got no joke. Not one, for the first time in years."
dlg.scn.support.brenna_kael.S.l11: "Then save it."
dlg.scn.support.brenna_kael.S.l12: "If I find one, it’ll be a bad one."
dlg.scn.support.brenna_kael.S.l13: "It always is."
dlg.scn.support.brenna_kael.S.l14: "Sit. Here. The fire still has wood."
dlg.scn.support.brenna_tobin.A.l01: "Sit down. No, not there, here, in the light. Give me the jerkin, the tear’s open again."
dlg.scn.support.brenna_tobin.A.l02: "It’s just a scratch. On the wall, in the defence, I barely got…"
dlg.scn.support.brenna_tobin.A.l03: "You stood alone before the battlements, Tobin. In front of everyone! With a lance, like a banner-bearer!"
dlg.scn.support.brenna_tobin.A.l04: "It worked! Morra’s people hesitated, I saw it plainly!"
dlg.scn.support.brenna_tobin.A.l05: "Ash and ember, it’s not about hesitating! You don’t think in a fight, you sing!"
dlg.scn.support.brenna_tobin.A.l06: "You said a hero is one who goes first."
dlg.scn.support.brenna_tobin.A.l07: "Never did. That was in your song."
dlg.scn.support.brenna_tobin.A.l08: "When you didn’t come back until all was quiet, I lost the thread three times."
dlg.scn.support.brenna_tobin.A.l09: "You were scared."
dlg.scn.support.brenna_tobin.A.l10: "I lost a home once. That’s enough for me. I won’t lose another."
dlg.scn.support.brenna_tobin.A.l11: "I’m not gone. I’m not leaving. But I don’t know how to be careful."
dlg.scn.support.brenna_tobin.A.l12: "Then you’ll learn it, with me beside you. Now hold still, or I’ll stab you."
dlg.scn.support.brenna_tobin.A.l13: "That needle’s smaller than the hole it’s mending!"
dlg.scn.support.brenna_tobin.B.l01: "You’re peeling that turnip like it owes you money. Thinner, chick, we don’t have so many."
dlg.scn.support.brenna_tobin.B.l02: "My father said anyone who peels like that is good for nothing. And on the farm…"
dlg.scn.support.brenna_tobin.B.l03: "Oh, forget it. He disinherited me, so I needn’t peel well anymore."
dlg.scn.support.brenna_tobin.B.l04: "Because you didn’t want the tenancy."
dlg.scn.support.brenna_tobin.B.l05: "Because I won’t pull turnips forever. He never understood that. Have you a father, Brenna?"
dlg.scn.support.brenna_tobin.B.l06: "Had one. A family, a brother. They put me out the door."
dlg.scn.support.brenna_tobin.B.l07: "For what? What did you do?"
dlg.scn.support.brenna_tobin.B.l08: "Something my brother did. I took the blame. There’s no more to it."
dlg.scn.support.brenna_tobin.B.l09: "You’re never angry about it. I’m still angry every day."
dlg.scn.support.brenna_tobin.B.l10: "Oh, I am. I just don’t let it into the stew. The stew’s bad enough already."
dlg.scn.support.brenna_tobin.B.l11: "It tastes of turnip. My turnip."
dlg.scn.support.brenna_tobin.B.l12: "Then I know where the anger went. Give here, I’ll stir. You’ve got a new sort of people, chick."
dlg.scn.support.brenna_tobin.B.l13: "The ones nobody puts out the door."
dlg.scn.support.brenna_tobin.B.l14: "Nobody’s tried. Too much work, with that lot."
dlg.scn.support.brenna_tobin.C.l01: "Brenna! Show me the trick where you throw the axe and it comes back on its own!"
dlg.scn.support.brenna_tobin.C.l02: "It doesn’t come back, chick. I go and fetch it. That’s the whole trick."
dlg.scn.support.brenna_tobin.C.l03: "Oh. But in the songs, the axe always…"
dlg.scn.support.brenna_tobin.C.l04: "Nobody in the songs whets the blade in the evening either. Hand over the whetstone."
dlg.scn.support.brenna_tobin.C.l05: "I can do it without a whetstone! I’m destined for heroism, I feel it all the way down my arm!"
dlg.scn.support.brenna_tobin.C.l06: "You feel your arm because you’ve held that lance wrong for two hours. Lower. No, lower."
dlg.scn.support.brenna_tobin.C.l07: "So? Hm. Let’s say a hero is a trade, like woodcutting. With better songs."
dlg.scn.support.brenna_tobin.C.l08: "Woodcutters live longer. But that wordplay’s mine, so don’t you dare steal it."
dlg.scn.support.brenna_tobin.C.l09: "The heroes in the songs never make it home in the end, do they? I can’t think of one."
dlg.scn.support.brenna_tobin.C.l10: "They die young, Tobin. Every one. That’s why they have such lovely songs."
dlg.scn.support.brenna_tobin.C.l11: "I want you to grow old. Old and dull, with a bad back."
dlg.scn.support.brenna_tobin.C.l12: "That’s a terrible goal."
dlg.scn.support.brenna_tobin.C.l13: "It is. Shield up, chick. From the top again."
dlg.scn.support.brenna_tobin.S.l01: "You’re late, chick. The stew’s cold, and the watch changes soon."
dlg.scn.support.brenna_tobin.S.l02: "I wanted to check whether the western wall holds. I’ll stay within hailing distance, promise."
dlg.scn.support.brenna_tobin.S.l03: "“Within hailing distance.” Who taught you that word?"
dlg.scn.support.brenna_tobin.S.l04: "An old woman with an axe. She means well."
dlg.scn.support.brenna_tobin.S.l05: "Sit down. I’ve got something for you. It’s nothing special, don’t look at me like that."
dlg.scn.support.brenna_tobin.S.l06: "A shield strap? It’s all worn thin."
dlg.scn.support.brenna_tobin.S.l07: "It was on my first shield. I took it with me when I left. I had nothing else."
dlg.scn.support.brenna_tobin.S.l08: "I can’t take that. You have nothing else from back then."
dlg.scn.support.brenna_tobin.S.l09: "Exactly why I’m giving it to you. Only bring it back safe when you’re old."
dlg.scn.support.brenna_tobin.S.l10: "Brenna. You’re no foster mother. That was never the right word."
dlg.scn.support.brenna_tobin.S.l11: "Nobody is waiting for me at home. You’re my family."
dlg.scn.support.brenna_tobin.S.l12: "You blockhead. I haven’t heard that in years. Now I’ve got smoke in my eye."
dlg.scn.support.brenna_tobin.S.l13: "There’s no fire nearby."
dlg.scn.support.brenna_tobin.S.l14: "Then it must be the turnips. Off you go and eat."
dlg.scn.support.brenna_varek.A.l01: "You stood by the gate when it got tight. I saw you."
dlg.scn.support.brenna_varek.A.l02: "Everybody stood by the gate. I just looked better doing it."
dlg.scn.support.brenna_varek.A.l03: "You could have gone over the wall. Nobody would have looked for you."
dlg.scn.support.brenna_varek.A.l04: "Yes, you. With a ladle."
dlg.scn.support.brenna_varek.A.l05: "The big one. The small one’s for chicks I feel sorry for."
dlg.scn.support.brenna_varek.A.l06: "I didn’t bet on it, Brenna, in case you think I did. I stayed."
dlg.scn.support.brenna_varek.A.l07: "I know. No one misses that badly by accident, not even a gambler."
dlg.scn.support.brenna_varek.A.l08: "That was on purpose. I wanted it to look like luck."
dlg.scn.support.brenna_varek.A.l09: "Here. Your place by the fire. The one with the wind at your back."
dlg.scn.support.brenna_varek.A.l10: "That’s Kael’s place."
dlg.scn.support.brenna_varek.A.l11: "Kael sits where I put him. And you’re one of my chicks now."
dlg.scn.support.brenna_varek.A.l12: "I’ll have to tell you someday why I left."
dlg.scn.support.brenna_varek.A.l13: "If you want. Not because I need it. Shift over, my feet are cold."
dlg.scn.support.brenna_varek.B.l01: "Your captain always sits with his back to the wall. He must have done that in the army."
dlg.scn.support.brenna_varek.B.l02: "In the army. You know Kael from the army."
dlg.scn.support.brenna_varek.B.l03: "Know is too strong a word. We saw each other. We talked about him."
dlg.scn.support.brenna_varek.B.l04: "You haven’t mentioned that till now. When were you going to say, dice-man?"
dlg.scn.support.brenna_varek.B.l05: "When it earns something. Right now it only brings trouble, so: late."
dlg.scn.support.brenna_varek.B.l06: "Then bring more trouble. Why did you leave?"
dlg.scn.support.brenna_varek.B.l07: "The rations. The sergeants’ song. Take your pick."
dlg.scn.support.brenna_varek.B.l08: "I don’t want excuses. I want the reason."
dlg.scn.support.brenna_varek.B.l09: "Brenna. Dice fall badly when you judge them on a single roll…"
dlg.scn.support.brenna_varek.B.l10: "You’re dodging. You’re good at it. But your hand is shaking."
dlg.scn.support.brenna_varek.B.l11: "I watched. For longer than I should have. And then… no. Leave it."
dlg.scn.support.brenna_varek.B.l12: "Fine. I’ll leave it. For today."
dlg.scn.support.brenna_varek.B.l13: "Today’s a good day for telling no stories. Will you give me more soup?"
dlg.scn.support.brenna_varek.C.l01: "Those are loaded dice, chick. I can hear it in the clatter."
dlg.scn.support.brenna_varek.C.l02: "Loaded? They’re honest. It’s me who gives them a little nudge."
dlg.scn.support.brenna_varek.C.l03: "Funny. Still, don’t sit beside the provisions."
dlg.scn.support.brenna_varek.C.l04: "You don’t trust me. Good. I wouldn’t trust me either."
dlg.scn.support.brenna_varek.C.l05: "Whoever walked out on the army once will walk out on a band of outlaws when it gets hot."
dlg.scn.support.brenna_varek.C.l06: "By the sums, a band of outlaws is the better hand. Less paperwork."
dlg.scn.support.brenna_varek.C.l07: "I’ve seen kids fall for a smile like that. I’m no child."
dlg.scn.support.brenna_varek.C.l08: "No. You’re the one who holds the company together, ladle in hand."
dlg.scn.support.brenna_varek.C.l09: "And with the ladle I hit back too. Remember that."
dlg.scn.support.brenna_varek.C.l10: "Noted. Bet on me, Brenna. The odds are bad, but the payout is good."
dlg.scn.support.brenna_varek.C.l11: "I bet on nothing. I watch. And now hand over the dice."
dlg.scn.support.fenn_mira.A.l01: "The Ring wanted me back, Mira. In exchange for everything they wanted to know about the broker."
dlg.scn.support.fenn_mira.A.l02: "I was there. You for a bit of information. For a rogue, that’s a decent price."
dlg.scn.support.fenn_mira.A.l03: "And nobody asked if I wanted it! I’d have stepped up myself if it had been…"
dlg.scn.support.fenn_mira.A.l04: "Would you? You dive for cover at the first noise."
dlg.scn.support.fenn_mira.A.l05: "True. But none of you sent me. Why not?"
dlg.scn.support.fenn_mira.A.l06: "Why hand over someone you let sleep beside you? Are you seriously asking?"
dlg.scn.support.fenn_mira.A.l07: "With the Ring it’s different. There, what you bring counts. Loyalty is only on loan."
dlg.scn.support.fenn_mira.A.l08: "Then your Ring has taken a word called honour and used it without knowing what it costs."
dlg.scn.support.fenn_mira.A.l09: "Honour among thieves! I know that song. Mostly sung by someone about to lift your purse."
dlg.scn.support.fenn_mira.A.l10: "Then stop singing it. I never betrayed my village, and that’s enough for me."
dlg.scn.support.fenn_mira.A.l11: "Is that honour now? Or are you just tired?"
dlg.scn.support.fenn_mira.A.l12: "Both. Eat your soup before Brenna takes it off you."
dlg.scn.support.fenn_mira.A.l13: "It’s mine! Fairly won, with every ounce of my fingertip finesse!"
dlg.scn.support.fenn_mira.B.l01: "You’re on watch, Fenn? Willingly? Who forced you?"
dlg.scn.support.fenn_mira.B.l02: "Nobody! I see better at night than any of you. That’s down to the trade."
dlg.scn.support.fenn_mira.B.l03: "The trade they threw you out of. With plenty of glory, you said."
dlg.scn.support.fenn_mira.B.l04: "I never claimed it was glory! You made that up."
dlg.scn.support.fenn_mira.B.l05: "Then it wasn’t glory. What was it?"
dlg.scn.support.fenn_mira.B.l06: "A thing with a kid. I was to rob it. It was about… well. About robbing."
dlg.scn.support.fenn_mira.B.l07: "And you did it."
dlg.scn.support.fenn_mira.B.l08: "No. I watched, and then my hand was suddenly back in my own pocket."
dlg.scn.support.fenn_mira.B.l09: "Don’t tell anyone, all right? Or I’m just the coward to them, the one who…"
dlg.scn.support.fenn_mira.B.l10: "I won’t say a word. Who likes telling why they left?"
dlg.scn.support.fenn_mira.B.l11: "You poached because they were starving?"
dlg.scn.support.fenn_mira.B.l12: "I poached because I could shoot. The hunger came on top of that. Goodnight, Fenn."
dlg.scn.support.fenn_mira.B.l13: "Goodnight. And, Mira… I believe you about the hunger all the same."
dlg.scn.support.fenn_mira.C.l01: "See the purse on my belt, Mira? It was Brenna’s a moment ago. She never noticed!"
dlg.scn.support.fenn_mira.C.l02: "Brenna just handed you that purse back, with a tug on your ear. I saw it."
dlg.scn.support.fenn_mira.C.l03: "That was a misunderstanding! I only borrowed it, hand to hand, very delicately."
dlg.scn.support.fenn_mira.C.l04: "How many picklocks have you got in there, anyway? Or don’t you count them?"
dlg.scn.support.fenn_mira.C.l05: "Eleven. Finest sort there is, opens any lock in Varnhold. Every one! Even the toll-keeper’s!"
dlg.scn.support.fenn_mira.C.l06: "Then why sit by a fire instead of in a stranger’s granary?"
dlg.scn.support.fenn_mira.C.l07: "That’s a long story. Full of glory. Maybe I’ll tell you sometime."
dlg.scn.support.fenn_mira.C.l08: "I’m only asking. Someone that good doesn’t get thrown out for nothing. Or are you just good at tales?"
dlg.scn.support.fenn_mira.C.l09: "Easy for you to talk, bow-lady! You shoot the count’s game and call it a trade."
dlg.scn.support.fenn_mira.C.l10: "That stag belonged to no one better than me, the moment it stood before my arrow."
dlg.scn.support.fenn_mira.C.l11: "Ha! That’s what a thief says too. Then we’re cut from the same cloth, us outlaws."
dlg.scn.support.fenn_mira.C.l12: "The same cloth. Now give back the purse you just lifted from Brenna again."
dlg.scn.support.fenn_mira.C.l13: "How did you… fine. Here. But only because it’s you."
dlg.scn.support.grosk_tobin.A.l01: "Grosk, may I ask you something? I’ve been counting. You always stand one step ahead of me."
dlg.scn.support.grosk_tobin.A.l02: "Chance."
dlg.scn.support.grosk_tobin.A.l03: "Every time since the starvation camp! That’s no chance, it’s a shield with a beard!"
dlg.scn.support.grosk_tobin.A.l04: "There were children in the camp. I stood in front of them. Every day."
dlg.scn.support.grosk_tobin.A.l05: "Habit. The legs do it on their own."
dlg.scn.support.grosk_tobin.A.l06: "I’m seventeen. That’s no child anymore. Nearly."
dlg.scn.support.grosk_tobin.A.l07: "Nearly."
dlg.scn.support.grosk_tobin.A.l08: "I wanted to be a hero, Grosk. With song and sword and all. Not that someone…"
dlg.scn.support.grosk_tobin.A.l09: "That someone watches over you."
dlg.scn.support.grosk_tobin.A.l10: "Yes. But that’s what you do, sir. What you do. And it sounds so quiet in no song."
dlg.scn.support.grosk_tobin.A.l11: "Quieter is better. Songs make noise."
dlg.scn.support.grosk_tobin.A.l12: "Then I’ll learn to be quiet. Just don’t walk ahead of me while I practise."
dlg.scn.support.grosk_tobin.A.l13: "No."
dlg.scn.support.grosk_tobin.A.l14: "Maybe a little."
dlg.scn.support.grosk_tobin.B.l01: "Grosk, was it terrible in battle? I mean, were you ever in a proper one? With banners?"
dlg.scn.support.grosk_tobin.B.l02: "In the army. Many years."
dlg.scn.support.grosk_tobin.B.l03: "In the army! Then you’re a hero! A real one, with scars and, and songs!"
dlg.scn.support.grosk_tobin.B.l04: "No songs."
dlg.scn.support.grosk_tobin.B.l05: "But why were you, well, on the border? Among the bandits?"
dlg.scn.support.grosk_tobin.B.l06: "They discharged me. Unfit. My body was no use anymore. That’s all."
dlg.scn.support.grosk_tobin.B.l07: "And before that? Weren’t you at least, well, glorious?"
dlg.scn.support.grosk_tobin.B.l08: "We did what was ordered. And hoped the soup stayed warm."
dlg.scn.support.grosk_tobin.B.l09: "The songs lie, Tobin. They’re only sung by those who weren’t there."
dlg.scn.support.grosk_tobin.B.l10: "My father says that too. He says it about everything that isn’t wheat."
dlg.scn.support.grosk_tobin.B.l11: "Your father isn’t entirely wrong."
dlg.scn.support.grosk_tobin.B.l12: "You must never tell him that. Never. Please pass me the rag for the lance."
dlg.scn.support.grosk_tobin.C.l01: "Grosk! May I, well, you’re the bandit leader, aren’t you?"
dlg.scn.support.grosk_tobin.C.l02: "Former."
dlg.scn.support.grosk_tobin.C.l03: "Former! That sounds like a ballad! The terror of the borderlands, who…"
dlg.scn.support.grosk_tobin.C.l04: "Hunger. That was the terror. Eat something."
dlg.scn.support.grosk_tobin.C.l05: "Done that. Twice. I can’t eat while looking at you. You’re so, so tall."
dlg.scn.support.grosk_tobin.C.l06: "Then look elsewhere."
dlg.scn.support.grosk_tobin.C.l07: "I wanted to. But then I see the orange rag. You wear it like we do."
dlg.scn.support.grosk_tobin.C.l08: "Hm."
dlg.scn.support.grosk_tobin.C.l09: "I chose the lance because it keeps distance. From giants, for example."
dlg.scn.support.grosk_tobin.C.l10: "Clever."
dlg.scn.support.grosk_tobin.C.l11: "Did you just smile? Or was that the beard?"
dlg.scn.support.grosk_tobin.C.l12: "Beard. Sit. You’re standing in the smoke."
dlg.scn.support.liora_ysolde.A.l01: "The seal is wax on leather. Old wax. With a warm blade it would open at once."
dlg.scn.support.liora_ysolde.A.l02: "Put the blade away."
dlg.scn.support.liora_ysolde.A.l03: "Which blade? I’m only describing what would be possible."
dlg.scn.support.liora_ysolde.A.l04: "We found them among the graves of young kings. Whoever seals such a thing doesn’t want it read."
dlg.scn.support.liora_ysolde.A.l05: "Or wants only the one who understands it to read it. A seal is not an answer!"
dlg.scn.support.liora_ysolde.A.l06: "I dreamed of that vault. All the names on the graves were blank."
dlg.scn.support.liora_ysolde.A.l07: "Blank. Hm. Means nothing to me. Perhaps it means more to you."
dlg.scn.support.liora_ysolde.A.l08: "I don’t fear the reading. I fear what is different afterwards."
dlg.scn.support.liora_ysolde.A.l09: "In Aurenhall they said ignorance is humility. I never believed it."
dlg.scn.support.liora_ysolde.A.l10: "Alone, I wouldn’t open them anyway. I admit that reluctantly."
dlg.scn.support.liora_ysolde.A.l11: "Then we’ll read them together. Not today."
dlg.scn.support.liora_ysolde.A.l12: "When, then?"
dlg.scn.support.liora_ysolde.A.l13: "When the time comes. We’ll know it."
dlg.scn.support.liora_ysolde.A.l14: "That’s not a method. But fine. I’ll stop looking."
dlg.scn.support.liora_ysolde.A.l15: "You’ve been looking for an hour."
dlg.scn.support.liora_ysolde.A.l16: "Two."
dlg.scn.support.liora_ysolde.B.l01: "You’re on watch, not I. I counted three times."
dlg.scn.support.liora_ysolde.B.l02: "I sleep badly. For days the same dream, a room without a door."
dlg.scn.support.liora_ysolde.B.l03: "Does that mean something?"
dlg.scn.support.liora_ysolde.B.l04: "With me, usually. I seldom know what."
dlg.scn.support.liora_ysolde.B.l05: "They gave me a choice: recant or be called a fool. One word would have sufficed."
dlg.scn.support.liora_ysolde.B.l06: "Which word?"
dlg.scn.support.liora_ysolde.B.l07: "“Error.” But there was none. I had measured it, again and again."
dlg.scn.support.liora_ysolde.B.l08: "I only asked why young kings so seldom grow old. A question, Ysolde."
dlg.scn.support.liora_ysolde.B.l09: "Mine was a series of measurements. They read both as an attack."
dlg.scn.support.liora_ysolde.B.l10: "I thought you were my opposite. You only believe what you count."
dlg.scn.support.liora_ysolde.B.l11: "And you only what you’re told. So I thought. We both ask, it seems."
dlg.scn.support.liora_ysolde.B.l12: "Two heretics by the fire. I had hoped for better company."
dlg.scn.support.liora_ysolde.B.l13: "Sit down. I’ll take the second half of the watch. Don’t count."
dlg.scn.support.liora_ysolde.B.l14: "I’ve already counted."
dlg.scn.support.liora_ysolde.C.l01: "Three finger-widths higher than in Aurenhall. Same formula, same effort. That’s no coincidence."
dlg.scn.support.liora_ysolde.C.l02: "You’re talking to the fire?"
dlg.scn.support.liora_ysolde.C.l03: "I’m measuring it. The closer to the mountains, the stronger the ember. Confirmed three times!"
dlg.scn.support.liora_ysolde.C.l04: "“The light is the crown’s ember.” That is how they taught it to me. Without numbers."
dlg.scn.support.liora_ysolde.C.l05: "The saying only asserts. It explains nothing. Measuring is no sacrilege."
dlg.scn.support.liora_ysolde.C.l06: "To the temple it is, if you measure something it has not allowed."
dlg.scn.support.liora_ysolde.C.l07: "So you’re defending them."
dlg.scn.support.liora_ysolde.C.l08: "I’m contradicting you. That’s something different, though I don’t yet know whom first."
dlg.scn.support.liora_ysolde.C.l09: "The other day wounds closed faster under my hands than usual. I called it grace."
dlg.scn.support.liora_ysolde.C.l10: "Where exactly? When? Tell me everything, I need every detail!"
dlg.scn.support.liora_ysolde.C.l11: "I quote the temple and you want tables. We’ll never agree."
dlg.scn.support.liora_ysolde.C.l12: "We needn’t. Just be precise."
dlg.scn.support.liora_ysolde.C.l13: "I never checked whether it truly was grace. One doesn’t."
dlg.scn.support.mira_tobin.A.l01: "You’re meant to be sleeping. Your watch isn’t till later."
dlg.scn.support.mira_tobin.A.l02: "I couldn’t. The vault won’t leave my head. Young kings, Mira, laid in stone."
dlg.scn.support.mira_tobin.A.l03: "I was there. They were graves, not a feast."
dlg.scn.support.mira_tobin.A.l04: "But so young! The songs say heroes die young, and then they lie there too, maybe, and…"
dlg.scn.support.mira_tobin.A.l05: "Stop that."
dlg.scn.support.mira_tobin.A.l06: "Stop what?"
dlg.scn.support.mira_tobin.A.l07: "The song. Who asked you whether you wanted to become one?"
dlg.scn.support.mira_tobin.A.l08: "I thought you found it ridiculous."
dlg.scn.support.mira_tobin.A.l09: "I do. Ridiculous lives longer."
dlg.scn.support.mira_tobin.A.l10: "When Morra’s people came, I lost you twice in the crush. I don’t usually count."
dlg.scn.support.mira_tobin.A.l11: "You were looking for me?"
dlg.scn.support.mira_tobin.A.l12: "I was looking for the target that shouted loudest. Wasn’t hard."
dlg.scn.support.mira_tobin.A.l13: "You never laughed at me when it counted. Only otherwise. I know that."
dlg.scn.support.mira_tobin.A.l14: "Go do your watch. And don’t run ahead of the banner."
dlg.scn.support.mira_tobin.B.l01: "You’re standing in the light. I’m gluing feathers here, not heroic songs."
dlg.scn.support.mira_tobin.B.l02: "I’m only watching! Why do you need so many arrows?"
dlg.scn.support.mira_tobin.B.l03: "Because arrows stay in the forest. Do you know what a winter eats in arrows?"
dlg.scn.support.mira_tobin.B.l04: "You hunted for the whole village, didn’t you? And for that they banished you."
dlg.scn.support.mira_tobin.B.l05: "The forest didn’t belong to us. Everyone got fed anyway. Who asks about the forest?"
dlg.scn.support.mira_tobin.B.l06: "But Erlbach wanted you back. And you’re here. Among wanted regicides!"
dlg.scn.support.mira_tobin.B.l07: "Yes. Don’t ask why. Or ask, and I’ll ask you back: why are you here?"
dlg.scn.support.mira_tobin.B.l08: "I was to take over the tenancy. I didn’t want it. So my father disinherited me, quite formally."
dlg.scn.support.mira_tobin.B.l09: "And what was so terrible about the farm?"
dlg.scn.support.mira_tobin.B.l10: "Nothing. That’s just it. You plough, you pay the rent, and the landlord knows you only from the rent book."
dlg.scn.support.mira_tobin.B.l11: "Your name is on more wanted posters now than in any rent book."
dlg.scn.support.mira_tobin.B.l12: "True! Hold on… that isn’t bad at all."
dlg.scn.support.mira_tobin.B.l13: "Here. This one’s freshly fletched. Don’t lose it."
dlg.scn.support.mira_tobin.C.l01: "Mira! Teach me archery. A hero hits from a thousand paces, and the foe falls before he…"
dlg.scn.support.mira_tobin.C.l02: "Before he what? A thousand paces. You can’t even hit the fire."
dlg.scn.support.mira_tobin.C.l03: "The fire is huge! That’s an unfair measure, really… Ah, just teach me."
dlg.scn.support.mira_tobin.C.l04: "With a lance, courage is enough. The bow wants patience. Have you got any?"
dlg.scn.support.mira_tobin.C.l05: "I’ve got courage for two. Doesn’t that even things out?"
dlg.scn.support.mira_tobin.C.l06: "No. Give it here. Not like that, you’re holding it like a broom."
dlg.scn.support.mira_tobin.C.l07: "My arm is shaking. In the songs, arms never shake."
dlg.scn.support.mira_tobin.C.l08: "In the songs, nobody draws from the wrist either. Shoulder. Breathe out, then release."
dlg.scn.support.mira_tobin.C.l09: "Hit! Did I hit?"
dlg.scn.support.mira_tobin.C.l10: "A tree. Not the one you were aiming for. That’s more than yesterday."
dlg.scn.support.mira_tobin.C.l11: "That goes in the song! “The archer who the forest…” What rhymes with forest?"
dlg.scn.support.mira_tobin.C.l12: "Sorest. Your arm, after this. Draw again before you start rhyming."
dlg.scn.bark.brenna.battle_start: "Behind me, chick! The axe is thirsty!"
dlg.scn.bark.brenna.crit: "There go the splinters!"
dlg.scn.bark.brenna.downed: "Chick … I’m only resting a moment …"
dlg.scn.bark.brenna.rescued: "Thanks, chick. You’re a treasure!"
dlg.scn.bark.brenna.level_up: "A year older, not one bit wearier!"
dlg.scn.bark.brenna.ember: "It burns! I thought it was the stew."
dlg.scn.bark.fenn.battle_start: "Already behind you! Er, in front of you!"
dlg.scn.bark.fenn.crit: "Didn’t I say? A masterpiece!"
dlg.scn.bark.fenn.downed: "Ouch! You’ll get that back. Later."
dlg.scn.bark.fenn.rescued: "Rescued! I had everything well in hand!"
dlg.scn.bark.fenn.level_up: "One more pick wiser!"
dlg.scn.bark.fenn.ember: "Sparkles finer than any silver!"
dlg.scn.bark.grosk.battle_start: "I stand in front."
dlg.scn.bark.grosk.crit: "Hm. Good."
dlg.scn.bark.grosk.downed: "Not … now."
dlg.scn.bark.grosk.rescued: "Thanks."
dlg.scn.bark.grosk.level_up: "Stronger."
dlg.scn.bark.grosk.ember: "Hot."
dlg.scn.bark.kael.battle_start: "Go."
dlg.scn.bark.kael.crit: "Hit."
dlg.scn.bark.kael.downed: "Not now …"
dlg.scn.bark.kael.rescued: "I owe you one."
dlg.scn.bark.kael.level_up: "Good. Onward."
dlg.scn.bark.kael.ember: "It burns. I’m holding it."
dlg.scn.bark.liora.battle_start: "May the light lead us onward."
dlg.scn.bark.liora.crit: "The light found its mark."
dlg.scn.bark.liora.downed: "The ember … sinks …"
dlg.scn.bark.liora.rescued: "You drew me out of the dark."
dlg.scn.bark.liora.level_up: "The flame grows, quiet and steady."
dlg.scn.bark.liora.ember: "The ember calls. I answer."
dlg.scn.bark.mira.battle_start: "Who first? I only ask."
dlg.scn.bark.mira.crit: "What did you expect?"
dlg.scn.bark.mira.downed: "Who took that shot?"
dlg.scn.bark.mira.rescued: "Did I ask for help? … Thanks."
dlg.scn.bark.mira.level_up: "Better. About time."
dlg.scn.bark.mira.ember: "What does that cost? It always costs."
dlg.scn.bark.tobin.battle_start: "For honor and glory! Er, forward!"
dlg.scn.bark.tobin.crit: "That goes in the song!"
dlg.scn.bark.tobin.downed: "The hero rests … only briefly …"
dlg.scn.bark.tobin.rescued: "My savior! Er, comrade! Both!"
dlg.scn.bark.tobin.level_up: "They’re writing my name larger!"
dlg.scn.bark.tobin.ember: "The ember! Like in the old sagas!"
dlg.scn.bark.varek.battle_start: "The dice are cast. Care to wager?"
dlg.scn.bark.varek.crit: "Double six!"
dlg.scn.bark.varek.downed: "A lost stake … bad throw."
dlg.scn.bark.varek.rescued: "You saved my stake."
dlg.scn.bark.varek.level_up: "The hand is improving."
dlg.scn.bark.varek.ember: "All in on the ember!"
dlg.scn.bark.ysolde.battle_start: "Hypothesis: we win. Let us test it."
dlg.scn.bark.ysolde.crit: "Just as calculated."
dlg.scn.bark.ysolde.downed: "Unforeseen … a variable …"
dlg.scn.bark.ysolde.rescued: "Your intervention was measurably helpful."
dlg.scn.bark.ysolde.level_up: "Measurable progress."
dlg.scn.bark.ysolde.ember: "Fascinating! Reproducible!"
dlg.scn.farewell.brenna.last: "The donkey … you know the rest. Tell it badly, chick."
dlg.scn.farewell.brenna.grief_kael: "Twelve years she talked. Now I listen, and there’s nothing."
dlg.scn.farewell.brenna.grief_tobin: "“Old and dull,” you said. I’m trying, Brenna."
dlg.scn.farewell.brenna.grief_varek: "She always heard from my voice when I was cheating. I’d have liked to be caught once more."
dlg.scn.farewell.fenn.last: "The picks … take them. Eleven. I counted, in case you ask."
dlg.scn.farewell.fenn.grief_mira: "He returned every pouch when I said so. Now I say it to no one."
dlg.scn.farewell.grosk.last: "I stood in front. Gladly. Now you stand."
dlg.scn.farewell.grosk.grief_tobin: "“Beard,” you said. I knew it was a smile, Grosk."
dlg.scn.farewell.liora.last: "It isn’t dark. Only quiet. You’re still with me."
dlg.scn.farewell.liora.grief_avatar: "You rolled bandages beside my watch. I’ll leave the place free, Liora."
dlg.scn.farewell.liora.grief_ysolde: "She never checked whether it truly was grace. I’d have liked to read her the tables."
dlg.scn.farewell.mira.last: "Why stand there? Take the arrows. They’ve just become yours."
dlg.scn.farewell.mira.grief_tobin: "“Draw again before you start rhyming.” She said that. I don’t rhyme, Mira."
dlg.scn.farewell.mira.grief_fenn: "She always caught me. Now nobody catches me. That’s worse."
dlg.scn.farewell.tobin.last: "Don’t tell anyone I was afraid. Say it was a quiet day."
dlg.scn.farewell.tobin.grief_brenna: "Lower the lance, chick. I’ll say it to the wind now. Maybe it listens."
dlg.scn.farewell.tobin.grief_mira: "He never hit the right tree. Now I have no one left to correct."
dlg.scn.farewell.tobin.grief_grosk: "He stood in the smoke. I said, sit. Now no one sits there."
dlg.scn.farewell.varek.last: "I’d have liked one more wager. Good hands, you lot. Very good ones."
dlg.scn.farewell.varek.grief_brenna: "I always wanted his dice. Now I don’t want them."
dlg.scn.farewell.ysolde.last: "The series isn’t finished. Carry it on. Exactly, please."
dlg.scn.farewell.ysolde.grief_liora: "She wanted every point noted. I’m writing it down now. Exactly, Ysolde."
dlg.scn.lt.hask.first: "Fire eats everything. You too."
dlg.scn.lt.hask.grudge_1: "{target}! I remembered you."
dlg.scn.lt.hask.grudge_2: "{target}! I owe you a scar."
dlg.scn.lt.hask.grudge_3: "{target}! I'll burn you down to the bone!"
dlg.scn.lt.hask.flee_1: "Ash and embers! I'll burn elsewhere!"
dlg.scn.lt.hask.flee_2: "Enough games. I'll be back."
dlg.scn.lt.hask.flee_3: "The fire doesn't die. Neither do I."
dlg.scn.lt.hask.mock: "{target} went cold. Fire eats everything!"
dlg.scn.lt.morra.first: "Your bounty, in gold. I'll count it."
dlg.scn.lt.morra.grudge_1: "{target}. You cost me gold."
dlg.scn.lt.morra.grudge_2: "{target}. I'm tallying what you owe me."
dlg.scn.lt.morra.grudge_3: "{target}. The bill is due. With interest."
dlg.scn.lt.morra.flee_1: "The contract stands. I'll be back."
dlg.scn.lt.morra.flee_2: "Too costly. For today."
dlg.scn.lt.morra.flee_3: "Payment comes last. We'll meet again."
dlg.scn.lt.morra.mock: "{target}? Dead, no price paid. Cheap."
dlg.scn.lt.ulvric.first: "My wolves smell king-killers."
dlg.scn.lt.ulvric.grudge_1: "{target}. The wolves know your scent."
dlg.scn.lt.ulvric.grudge_2: "{target}! My wolves haven't forgotten."
dlg.scn.lt.ulvric.grudge_3: "{target}! Today my pack tears you apart!"
dlg.scn.lt.ulvric.flee_1: "Back, wolf! The pack regroups."
dlg.scn.lt.ulvric.flee_2: "The hunt is yours today. Today."
dlg.scn.lt.ulvric.flee_3: "We keep hunting. We'll return."
dlg.scn.lt.ulvric.mock: "Hear that? The wolves howl for {target}."
dlg.scn.lt.grosk.first: "The camp is behind me. No further."
dlg.scn.lt.grosk.grudge_1: "{target}. I remember."
dlg.scn.lt.grosk.grudge_2: "{target}. You're back again."
dlg.scn.lt.grosk.grudge_3: "{target}. This time I stand. You won't."
dlg.scn.lt.grosk.flee_1: "I'm falling back. Only a little."
dlg.scn.lt.grosk.flee_2: "Not today. I'm going."
dlg.scn.lt.grosk.flee_3: "Enough. I have others waiting."
dlg.scn.lt.grosk.mock: "{target} should've carried a shield."
dlg.scn.lt.grosk.join: "The camp is safe. I stand with you."
dlg.scn.m1_6.intro.l01: "Halvard waits at the foot of the slope, staff in hand. Above him looms the Pactwatch, grey and silent."
dlg.scn.m1_6.intro.l02: "{avatar}, Kael. A roof over your head is half of peace. There is one up there, though a leaky one."
dlg.scn.m1_6.intro.l03: "The Pactwatch has belonged to no one for eighty years. A hideout nobody looks for is the best kind."
dlg.scn.m1_6.intro.l04: "And who sits in it now?"
dlg.scn.m1_6.intro.l05: "Hask and his gang, I fear. And Ulvric's riders prowl the slope. But you outnumber them."
dlg.scn.m1_6.intro.l06: "Walls, a roof and a gate, chick! I'd let a wolf bite me for that."
dlg.scn.m1_6.intro.l07: "Take what you need, children. And let the old stones sleep. They have earned their rest."
dlg.scn.m1_6.intro.l08: "We take the fortress. {avatar}, you lead."
dlg.scn.m1_6.outro.l01: "The smoke clears. On the highest tower of the Pactwatch, the Ashen Banner's flag flutters."
dlg.scn.m1_6.outro.l02: "The walls are black with fire, the gate hangs crooked. Yet the ruin stands."
dlg.scn.m1_6.outro.l03: "For the first time since the Pact Night, the company has a roof of its own."
dlg.scn.m1_6.outro.l04: "Walls, roof, gate. And nobody to drive us out. This is our house now."
dlg.scn.m1_6.outro.l05: "A bunch of nobodies with a fortress, chick! The world will stare."
dlg.scn.m1_6.outro.l06: "The ballad of the fortress of the – of the nobodies! The rhymes are missing, but the pathos stands!"
dlg.scn.m1_6.outro.l07: "I've already found the treasury. Empty, but it has a lock! One must start small."
dlg.scn.m1_6.outro.l08: "And who holds the wall when Hask comes back? Or is only one of us asking that?"
dlg.scn.m1_6.outro.l09: "A house that belongs to no one can belong to everyone. So the temple teaches. Today I believe it."
dlg.scn.m1_6.outro.l10: "Home. The word still sounds strange. I will gladly get used to it."
dlg.scn.m1_6.outro.l11: "A grey-haired man steps out of the gate's shadow and bows to Kael."
dlg.scn.m1_6.outro.l12: "I am the steward. All these years I have kept the keys to these walls, Captain."
dlg.scn.m1_6.outro.l13: "Hask locked me in the cellar, but he never got the keys. Now they are yours."
dlg.scn.m1_6.outro.l14: "Keep them. You know the walls, we don't."
dlg.scn.m1_6.outro.l15: "Then I will see to it that they stay standing. Whatever comes."
dlg.scn.m1_6.outro.l16: "Families from the borderland wait down the slope. They saw the banner and ask for shelter."
dlg.scn.m1_6.outro.l17: "The more people know where we live, the more visitors we get. Usually with torches."
dlg.scn.m1_6.outro.l18: "It is your fortress, {avatar}. You decide."
dlg.scn.m1_6.outro.l19.title: "The Pactwatch: Refugees or Secret"
dlg.scn.m1_6.outro.l19.shelter: "\"Open the gate. Whoever seeks shelter shall have it.\""
dlg.scn.m1_6.outro.l19.shelter.summary: "Refugees taken in"
dlg.scn.m1_6.outro.l19.secret: "\"The gate stays shut. Nobody learns where we live.\""
dlg.scn.m1_6.outro.l19.secret.summary: "The fortress stays secret"
dlg.scn.m1_7.intro.l01: "Night at the Pactwatch. A tremor shakes the walls, dust trickles from the beams."
dlg.scn.m1_7.intro.l02: "That was no storm, chick! My soup jumped right off the stove."
dlg.scn.m1_7.intro.l03: "Will the castle hold? This is our home."
dlg.scn.m1_7.intro.l04: "The grey-haired steward comes running with a lantern. A passage has broken open beneath the cellar."
dlg.scn.m1_7.intro.l05: "The vault, Captain. Sealed beyond memory, now it stands open. Strangers are inside."
dlg.scn.m1_7.intro.l06: "Voices echo from the depths. Looters have crawled into the crypt through a collapsed passage."
dlg.scn.m1_7.intro.l07: "Looters in our cellar? That's my trade! I mean … that's outrageous!"
dlg.scn.m1_7.intro.l08: "And what if that wasn't the last tremor? Who says the ceiling will hold?"
dlg.scn.m1_7.intro.l09: "We go down. Recover the chests before it all caves in."
dlg.scn.m1_7.intro.l10: "The wardens' vault. What does one keep so deep beneath a castle?"
dlg.scn.m1_7.collapse.l01: "A tremor! Dust trickles down, rock cracks somewhere. New voices come from the collapsed passage."
dlg.scn.m1_7.collapse.l02: "The ceiling is giving way. Fourteen rounds, then everything is buried."
dlg.scn.m1_7.collapse.l03: "Grab what you can carry, chicks. And don't let them catch you from behind!"
dlg.scn.m1_7.relief_west.l01: "A relief is carved into the wall: a young king with closed eyes, hands on his chest."
dlg.scn.m1_7.relief_west.l02: "\"Hadric II, crowned in the year 88 after the Pact, dead in the year 96.\" He did not reach thirty."
dlg.scn.m1_7.relief_west.l03: "Next to it a second stone: Osmund III, year 96 to 101. Five years on the throne."
dlg.scn.m1_7.relief_west.l04: "Two kings, thirteen years. Strange."
dlg.scn.m1_7.relief_crypt.l01: "Relief after relief lines the crypt. One young king beside the next, crowded close."
dlg.scn.m1_7.relief_crypt.l02: "Seven years, four, nine. Their reigns are strikingly short. Every single time."
dlg.scn.m1_7.relief_crypt.l03: "An empty niche beneath every name. Pages once lay here. Who took them away?"
dlg.scn.m1_7.relief_crypt.l04: "Who buries so many young kings and never asks why?"
dlg.scn.m1_7.relief_crypt.l05: "The floor trembles softly, fine ash trickles from the joints. Nobody can say where it comes from."
dlg.scn.m1_7.relief_crypt.l06: "Ash deep under the earth. Nobody can explain it. Move on."
dlg.scn.m1_7.chronicle.l01: "A heavy volume rests in a niche. Red wax and the wardens' seal keep it shut."
dlg.scn.m1_7.chronicle.l02: "The seal of the Pact Wardens, unbroken! Break it and you destroy the text. This belongs in an archive."
dlg.scn.m1_7.chronicle.l03: "Sealed? With a needle that would be … never mind, Kael. I touch nothing."
dlg.scn.m1_7.chronicle.l04: "We break no seal. The chronicle goes to the castle archive."
dlg.scn.m1_7.outro.l01: "Behind the company the passage collapses. The dust settles, and the vault is a grave again."
dlg.scn.m1_7.outro.l02: "The wardens' chronicle, still sealed, goes into the castle archive. Brenna posts a guard in front of it."
dlg.scn.m1_7.outro.l03: "It is dry and safe in the archive. Nobody touches it until you allow it, Captain."
dlg.scn.m1_7.outro.l04: "We can decipher it later, with light and quiet. Not today."
dlg.scn.m1_7.outro.l05: "A roof, walls and an archive, chick. Now we only need nobody to take an interest."
dlg.scn.m1_7.outro.l06: "The banner can be seen from afar. Somebody will take an interest."
dlg.scn.m1_7.outro.l07: "Then let them come. It is our house."
dlg.scn.m1_8.intro.l01: "Evening over the Pactwatch. Rain runs off the battlements, the torches in the yard hiss."
dlg.scn.m1_8.intro.l02: "The gates are barred, the postern doors manned, Captain. The fortress is ready."
dlg.scn.m1_8.intro.l03: "Then let them come. This is our home."
dlg.scn.m1_8.intro.l04: "A scout pants through the gate: Morra has found the company's hideout and is gathering the gangs."
dlg.scn.m1_8.intro.l05: "Word has spread about the refugees. Whoever gives shelter gets found."
dlg.scn.m1_8.intro.l06: "Ulvric's wolves have caught our scent. The fortress stayed secret, the trail did not."
dlg.scn.m1_8.intro.l07: "From the south, the west, the east: Hask, Ulvric and Morra come with everything they have."
dlg.scn.m1_8.intro.l07b: "Grosk is with them too. His starving people have joined Morra."
dlg.scn.m1_8.intro.l08: "The steward stays in the keep. Nothing may happen to him while the night lasts."
dlg.scn.m1_8.intro.l09: "We hold the night. Together."
dlg.scn.m1_8.morra_retreat.l01: "Fall back! The fortress isn't worth it. The bill stays open."
dlg.scn.m1_8.outro.l01: "The rain eases. In the south the last torches of the gangs vanish into the dark."
dlg.scn.m1_8.outro.l02: "Morra withdrew last, her bow lowered. Her pennant lies in the mud before the gate."
dlg.scn.m1_8.outro.l03: "Not a stone is missing, Captain. The walls held."
dlg.scn.m1_8.outro.l04: "They will come back. But this night is ours."
dlg.scn.m1_8.outro.l05: "For the first time, the company has defended something that belongs to it."
dlg.scn.m1_8.outro.l06: "A bunch of nobodies held a fortress. People will talk about that in ten years."
dlg.scn.m1_8.outro.l07: "The embers of the last fires glow in the yard. The rain has not smothered them."
dlg.scn.m1_8.outro.l08: "Two sparks lift from the embers and rise. They do not fall back."
dlg.scn.m1_8.outro.l09: "They are warm. And they crackle as if they wanted to say something."
