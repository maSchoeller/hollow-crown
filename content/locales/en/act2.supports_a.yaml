# Story 11.23: English texts of the act 2 campfire talks Jory × Nell, Nell × Varek, Odile × Varek.
dlg.scn.support.jory_nell.C.l01: "Stop. That verse is wrong. Your helmsman drowns in the second verse already."
dlg.scn.support.jory_nell.C.l02: "He drowns in the third. I just pushed him overboard early. The rhyme wanted it."
dlg.scn.support.jory_nell.C.l03: "The rhyme knows nothing of the sea. You’ve never been farther out than a horse trough."
dlg.scn.support.jory_nell.C.l04: "True. But I heard fishermen sing it that way. In Krähenholm, at the market."
dlg.scn.support.jory_nell.C.l05: "Fishermen sing for the fish. On a privateer you sing so nobody thinks of the gallows."
dlg.scn.support.jory_nell.C.l06: "That’s a sad reason to sing."
dlg.scn.support.jory_nell.C.l07: "It’s the only one I know. Hand it over, I’ll hum you the proper tune."
dlg.scn.support.jory_nell.C.l08: "Hum? You won’t sing? I thought smugglers were loud."
dlg.scn.support.jory_nell.C.l09: "Smugglers are quiet, minstrel. That’s why we outlive minstrels."
dlg.scn.support.jory_nell.C.l10: "Then hum. I’ll play along softly. To your long life."
dlg.scn.support.jory_nell.B.l01: "I finished your song. Seven verses, one chorus, and no helmsman drowns."
dlg.scn.support.jory_nell.B.l02: "Then it’s no sea song anymore. Someone always drowns."
dlg.scn.support.jory_nell.B.l03: "In this one the duchess drowns. Slowly. In her own gold."
dlg.scn.support.jory_nell.B.l04: "… How do you know about her?"
dlg.scn.support.jory_nell.B.l05: "You talk in your sleep. And the castle walls are thinner than they look."
dlg.scn.support.jory_nell.B.l06: "Dragon dung. What did I say?"
dlg.scn.support.jory_nell.B.l07: "Just her name. And that she left you behind on a sandbank."
dlg.scn.support.jory_nell.B.l08: "With an empty boat and full debts. She called it severance."
dlg.scn.support.jory_nell.B.l09: "My troupe left by night. I kept a lute. You at least kept a boat."
dlg.scn.support.jory_nell.B.l10: "The boat sank. You still have the lute. You win."
dlg.scn.support.jory_nell.B.l11: "Then I won’t sing it until you say she’s earned it."
dlg.scn.support.jory_nell.B.l12: "Sing it. But quietly. I want to learn the chorus."
dlg.scn.support.jory_nell.A.l01: "You’re not playing tonight. First time since you came to the castle."
dlg.scn.support.jory_nell.A.l02: "The low string snapped. Without it everything sounds like a joke with no ending."
dlg.scn.support.jory_nell.A.l03: "Here. Rigging twine. It holds through any storm at sea, so it’ll hold your lute."
dlg.scn.support.jory_nell.A.l04: "You carry twine around? What else, an anchor?"
dlg.scn.support.jory_nell.A.l05: "A sea chart. And a compass. The duchess gave it to me, on my first day."
dlg.scn.support.jory_nell.A.l06: "And you kept it? After everything?"
dlg.scn.support.jory_nell.A.l07: "It still points north. It can’t help who it belonged to."
dlg.scn.support.jory_nell.A.l08: "On my first ship there was a cabin boy who sang. Off-key, loud, every evening."
dlg.scn.support.jory_nell.A.l09: "What became of him?"
dlg.scn.support.jory_nell.A.l10: "A customs cutter came. I held the tiller, he held the rope. Only I came back."
dlg.scn.support.jory_nell.A.l11: "I haven’t sung since. I hum. There’s less to lose that way."
dlg.scn.support.jory_nell.A.l12: "I sing for those who no longer can. That’s how I taught myself."
dlg.scn.support.jory_nell.A.l13: "Tell me his name. Then the low string is his. It holds now."
dlg.scn.support.jory_nell.A.l14: "Tamm. His name was Tamm. Play him something off-key. And loud."
dlg.scn.support.nell_varek.C.l01: "Krähenholm, eh? I’ll bet a silver piece you’ve smuggled dice before."
dlg.scn.support.nell_varek.C.l02: "You win. Loaded ones, in salt barrels. Yours look like they came off my ship."
dlg.scn.support.nell_varek.C.l03: "Nonsense. I took these off a sergeant. Fair and square, at the table."
dlg.scn.support.nell_varek.C.l04: "Then your sergeant bought from me. Look under the five. There’s a tiny anchor."
dlg.scn.support.nell_varek.C.l05: "… Ash and ember. There’s an anchor."
dlg.scn.support.nell_varek.C.l06: "The silver piece, please. I never bet without knowing the cargo."
dlg.scn.support.nell_varek.C.l07: "That’s not betting, that’s cheating with a chart."
dlg.scn.support.nell_varek.C.l08: "Says the man with the loaded dice."
dlg.scn.support.nell_varek.C.l09: "Fine. One coin for you. But next time I pick the game."
dlg.scn.support.nell_varek.C.l10: "Pick away. I’ll pick the harbour you play it in."
dlg.scn.support.nell_varek.B.l01: "You bet too early. Every good hand, you straighten your hat."
dlg.scn.support.nell_varek.B.l02: "I don’t have a hat."
dlg.scn.support.nell_varek.B.l03: "Exactly. You reach for it anyway. I watched you for three rounds."
dlg.scn.support.nell_varek.B.l04: "And you look out to sea when you bluff. Even when there’s none."
dlg.scn.support.nell_varek.B.l05: "Old habit. At sea you watch the horizon, so nobody reads your eyes."
dlg.scn.support.nell_varek.B.l06: "In the border army you watch your boots. Nobody reads anything there either."
dlg.scn.support.nell_varek.B.l07: "Why did you leave? Gamblers stay at the table while there’s coin on it."
dlg.scn.support.nell_varek.B.l08: "Because the coins were villages. And I wasn’t the one placing the bets."
dlg.scn.support.nell_varek.B.l09: "Me, they threw off the table. My stake sits in the duchess’s pockets."
dlg.scn.support.nell_varek.B.l10: "Then we’re two without a table. That leaves the castle."
dlg.scn.support.nell_varek.B.l11: "The castle has a table. And you’re holding a seven. You touched your hat."
dlg.scn.support.nell_varek.B.l12: "By the Pact! I need to buy a hat, so it at least makes sense."
dlg.scn.support.nell_varek.A.l01: "Midnight, and you’re still writing. I thought smugglers never wrote anything down."
dlg.scn.support.nell_varek.A.l02: "This one does. Sit. And swear you won’t gamble on what I show you."
dlg.scn.support.nell_varek.A.l03: "I swear by the only thing I hold holy. Double sixes."
dlg.scn.support.nell_varek.A.l04: "These are the duchess’s money roads. Every cove, every tollman, every crate no harbour log ever saw."
dlg.scn.support.nell_varek.A.l05: "That’s no hand anymore. That’s the whole table."
dlg.scn.support.nell_varek.A.l06: "With this I could buy my way back. One letter to Maelis, and I’d have a ship again."
dlg.scn.support.nell_varek.A.l07: "So why haven’t you written it?"
dlg.scn.support.nell_varek.A.l08: "I wanted to see what you’d do when you read it. You’re the one who always eyes the price."
dlg.scn.support.nell_varek.A.l09: "Once I’d have done the sums. What it fetches, who buys, how far it gets you."
dlg.scn.support.nell_varek.A.l10: "I still do the sums. It just comes out the same every time: I stay here."
dlg.scn.support.nell_varek.A.l11: "Those are poor odds for a gambler."
dlg.scn.support.nell_varek.A.l12: "The worst. That’s why I like them. Don’t write the letter, Nell. But keep the map."
dlg.scn.support.nell_varek.A.l13: "What for?"
dlg.scn.support.nell_varek.A.l14: "In case we ever have to play against Maelis. Then we bet together. All of it."
dlg.scn.support.odile_varek.C.l01: "You’ve been polishing that breastplate for an hour. I can see myself in it. I look good."
dlg.scn.support.odile_varek.C.l02: "Then kindly step aside. You’re in my light."
dlg.scn.support.odile_varek.C.l03: "The princess is far away, Odile. Nobody here sees whether it shines."
dlg.scn.support.odile_varek.C.l04: "I see it. That’s enough."
dlg.scn.support.odile_varek.C.l05: "They dismissed you. Who are you still standing guard for?"
dlg.scn.support.odile_varek.C.l06: "For a duty. A word you could look up. The army surely had books."
dlg.scn.support.odile_varek.C.l07: "I know the word. I left it behind, with the rest of my kit."
dlg.scn.support.odile_varek.C.l08: "A deserter. Of course. The gate guard warned me."
dlg.scn.support.odile_varek.C.l09: "The gate guard owes me three coppers. He warns everyone about me."
dlg.scn.support.odile_varek.C.l10: "Then we agree. I don’t trust you. And you’re still in my light."
dlg.scn.support.odile_varek.B.l01: "You were on the wall this morning. Before anyone else. Why?"
dlg.scn.support.odile_varek.B.l02: "I sleep badly. And from up there you see the road before it sees you."
dlg.scn.support.odile_varek.B.l03: "That’s watch duty. I thought you thought nothing of duty."
dlg.scn.support.odile_varek.B.l04: "Nothing of the ordered kind. When I choose it myself, it’s a game."
dlg.scn.support.odile_varek.B.l05: "With the princess I stood at her door every night. Nobody was playing."
dlg.scn.support.odile_varek.B.l06: "Did she ever ask whether you were tired?"
dlg.scn.support.odile_varek.B.l07: "… Once. The first winter. I said no."
dlg.scn.support.odile_varek.B.l08: "And? Were you?"
dlg.scn.support.odile_varek.B.l09: "Of course. But a bodyguard doesn’t say so."
dlg.scn.support.odile_varek.B.l10: "Here you may. I’ll take the wall till sunrise. No orders needed."
dlg.scn.support.odile_varek.B.l11: "That’s not a trade I ought to accept."
dlg.scn.support.odile_varek.B.l12: "I’ll take it anyway. And tomorrow I polish your blade. It’s a disgrace."
dlg.scn.support.odile_varek.A.l01: "What are you writing? Every week you write, and no messenger ever leaves."
dlg.scn.support.odile_varek.A.l02: "Reports. To the princess. How many blades we have, how the walls stand."
dlg.scn.support.odile_varek.A.l03: "You’re betraying us?"
dlg.scn.support.odile_varek.A.l04: "No! I never send them. I write them because otherwise I don’t know whom I belong to."
dlg.scn.support.odile_varek.A.l05: "You belong to no one, Odile. That’s the first thing you learn when you run."
dlg.scn.support.odile_varek.A.l06: "And the second?"
dlg.scn.support.odile_varek.A.l07: "That then you have no one either. I ran from the army. And then I just kept running."
dlg.scn.support.odile_varek.A.l08: "I never sat down anywhere without a door at my back."
dlg.scn.support.odile_varek.A.l09: "You’re sitting with your back to the door. Right now."
dlg.scn.support.odile_varek.A.l10: "Yes. I only just noticed that myself."
dlg.scn.support.odile_varek.A.l11: "Then I’ll tell you something I never told the princess."
dlg.scn.support.odile_varek.A.l12: "When they dismissed me, I was relieved. For one night. Then I was ashamed."
dlg.scn.support.odile_varek.A.l13: "Don’t be. Relief isn’t betrayal. It’s just more honest than an oath."
dlg.scn.support.odile_varek.A.l14: "I’ll keep writing the reports. But the next one I show to you first."
dlg.scn.support.odile_varek.S.l01: "I burned the reports. All of them. Last night, in the guardroom hearth."
dlg.scn.support.odile_varek.S.l02: "All of them? Even the one where I came off well?"
dlg.scn.support.odile_varek.S.l03: "You came off well in none. I listed you as a danger to good order."
dlg.scn.support.odile_varek.S.l04: "That’s the loveliest thing anyone’s ever written about me."
dlg.scn.support.odile_varek.S.l05: "I lay awake half the night. With no door I had to stand before."
dlg.scn.support.odile_varek.S.l06: "And still I was waiting for something. For your steps up on the wall."
dlg.scn.support.odile_varek.S.l07: "I wasn’t up there tonight."
dlg.scn.support.odile_varek.S.l08: "I know. I heard it. It was too quiet."
dlg.scn.support.odile_varek.S.l09: "I had a die in my hand. Even, I tell you. Odd, I leave."
dlg.scn.support.odile_varek.S.l10: "And?"
dlg.scn.support.odile_varek.S.l11: "I didn’t throw it. For the first time I didn’t want to leave it to luck."
dlg.scn.support.odile_varek.S.l12: "I love you, Odile. I’m not betting on it. I know it."
dlg.scn.support.odile_varek.S.l13: "Then it’s a duty I choose for myself. I love you too."
dlg.scn.support.odile_varek.S.l14: "Now go up on the wall. I’m coming with you."
