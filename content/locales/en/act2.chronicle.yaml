# English texts of the act 2 chronicle pages (chronicle.<id>.title|text); German sits in acts/act2/chronicle.yaml.
chronicle.a2_salzpass.title: "What the King Gave"
chronicle.a2_salzpass.text: "Pact Night. The king knelt at the altar, the Ember Crown on his knees, and gave. What, I may not write; I only saw that he rose more slowly afterwards. The dukes cheered. By morning the altar was warm and the king grey at the temples, at thirty. I write it down so that someone keeps count."
