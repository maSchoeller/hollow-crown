# English texts of the act 1 chronicle pages (chronicle.<id>.title|text); German sits in acts/act1/chronicle.yaml.
chronicle.a1_watchtower.title: "The Tower Counts"
chronicle.a1_watchtower.text: "Pact Night, in autumn. The king climbed to the altar with the Ember Crown, upright and laughing. Before winter he was dead, not much past forty. He is the third king I have heard buried from this tower, and not one grew old. They call it honour. I call it counting, and I keep counting."
