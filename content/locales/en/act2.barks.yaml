# Story 11.23: English texts of the act 2 barks and farewells (the German text sits in the scene files).
dlg.scn.bark.jory.battle_start: "Strings tuned, blades honed. Let’s dance!"
dlg.scn.bark.jory.crit: "That struck a chord! And him with it."
dlg.scn.bark.jory.downed: "My song … breaks off mid-verse."
dlg.scn.bark.jory.rescued: "That earns you a verse of your own!"
dlg.scn.bark.jory.level_up: "One more string on my lute."
dlg.scn.bark.jory.ember: "Ember in the belly, fire in the chorus!"
dlg.scn.bark.nell.battle_start: "Ready to board! Hold your course."
dlg.scn.bark.nell.crit: "Broadside! Hit amidships."
dlg.scn.bark.nell.downed: "A leak in the hull … I’m going down."
dlg.scn.bark.nell.rescued: "Overboard, and you haul me back in."
dlg.scn.bark.nell.level_up: "Fresh wind in the sails."
dlg.scn.bark.nell.ember: "Full speed ahead, embers in our wake!"
dlg.scn.bark.odile.battle_start: "Post taken. No one gets past me."
dlg.scn.bark.odile.crit: "Clean and proper, as it should be."
dlg.scn.bark.odile.downed: "Forgive me … I have lost my post."
dlg.scn.bark.odile.rescued: "Thank you. I am in your debt."
dlg.scn.bark.odile.level_up: "My stance grows firmer."
dlg.scn.bark.odile.ember: "The ember is my duty. I bear it."
dlg.scn.bark.sable.battle_start: "Close ranks. Forward."
dlg.scn.bark.sable.crit: "Sabre through. Next."
dlg.scn.bark.sable.downed: "Hit … hold the line."
dlg.scn.bark.sable.rescued: "Understood. I’m back in."
dlg.scn.bark.sable.level_up: "Better. Carry on."
dlg.scn.bark.sable.ember: "Ember taken. To the attack."
dlg.scn.bark.ilka.battle_start: "Fresh tracks. Many."
dlg.scn.bark.ilka.crit: "The trail ends here."
dlg.scn.bark.ilka.downed: "The wolf … is down."
dlg.scn.bark.ilka.rescued: "Good. Thanks."
dlg.scn.bark.ilka.level_up: "Sharper. My eye."
dlg.scn.bark.ilka.ember: "Ember. I see farther."
dlg.scn.bark.brann.battle_start: "I … stay with you. The stone does too."
dlg.scn.bark.brann.crit: "Too strong … forgive me."
dlg.scn.bark.brann.downed: "The ground … lets me go."
dlg.scn.bark.brann.rescued: "You didn’t leave me alone."
dlg.scn.bark.brann.level_up: "The rock hears me. Calmer now."
dlg.scn.bark.brann.ember: "Not so hot … I’ll hold it. I must."
dlg.scn.bark.amos.battle_start: "Well then. I brought enough bandages."
dlg.scn.bark.amos.crit: "Nobody’s stitching that back up."
dlg.scn.bark.amos.downed: "Healer, heal yourself … later."
dlg.scn.bark.amos.rescued: "Not my day yet. The gravedigger can wait."
dlg.scn.bark.amos.level_up: "Old bones, new tricks."
dlg.scn.bark.amos.ember: "Ember in old veins. Who’d have thought."
dlg.scn.farewell.jory.last: "Finish the song. Not pretty. Just loud enough for me to hear."
dlg.scn.farewell.jory.grief_nell: "He sang my shanties wrong, on purpose. I corrected him every time. Now nobody sings."
dlg.scn.farewell.nell.last: "Take the chart. The compass points home. Not for me anymore."
dlg.scn.farewell.nell.grief_jory: "I promised her a song with no sea in it. It stays unsung."
dlg.scn.farewell.nell.grief_varek: "She never told me where her coin was hidden. I’d never have asked, Nell."
dlg.scn.farewell.odile.last: "My post … take it over. I held it gladly. With you."
dlg.scn.farewell.odile.grief_varek: "She never let me win. I’d have staked everything to make her stay."
dlg.scn.farewell.odile.grief_sable: "Two masters, she said. In the end she only had us. I’ll keep her watch."
dlg.scn.farewell.sable.last: "Tell the Iron March … I came home. In my own way."
dlg.scn.farewell.sable.grief_odile: "She stood beside me like a wall. Now there’s a gap, and the wind gets through."
dlg.scn.farewell.sable.grief_ilka: "She talked of home. I only nodded. Now I miss every word of it."
dlg.scn.farewell.ilka.last: "The trail … ends here. Don’t weep. Keep walking."
dlg.scn.farewell.ilka.grief_sable: "She said little. I said less. It was enough. Now it’s too quiet."
dlg.scn.farewell.ilka.grief_brann: "She brought me out of the mine. I couldn’t hold her. The stone is cold."
dlg.scn.farewell.brann.last: "The ember … is quiet at last. Don’t be afraid. I’m not anymore."
dlg.scn.farewell.brann.grief_ilka: "He feared himself. I never feared him. I should have told him more often."
dlg.scn.farewell.amos.last: "I treated everyone who bled. I regret none of them. Not one."
dlg.scn.farewell.amos.grief_liora: "He bound his enemies’ wounds and lost his order for it. I’ll pray for him, temple or no."
dlg.scn.farewell.amos.grief_grosk: "He laughed. At everything. I don’t anymore."
