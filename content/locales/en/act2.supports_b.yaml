# Story 11.23: English texts of the act 2 campfire talks Odile × Sable, Sable × Ilka, Ilka × Brann (German in the scene files).
dlg.scn.support.odile_sable.C.l01: "You hold that sabre too low, Captain. That won’t parry a thrust from above."
dlg.scn.support.odile_sable.C.l02: "Nobody thrusts from above in the border army. It all comes from the front, and plenty of it."
dlg.scn.support.odile_sable.C.l03: "At court it comes from everywhere. Usually with a smile attached."
dlg.scn.support.odile_sable.C.l04: "And you smiled back, right up until they put you out the door."
dlg.scn.support.odile_sable.C.l05: "I was dismissed. I betrayed no one."
dlg.scn.support.odile_sable.C.l06: "Nor did I. I just stopped burning for Dravn."
dlg.scn.support.odile_sable.C.l07: "An oath doesn’t end because one’s lord grows inconvenient."
dlg.scn.support.odile_sable.C.l08: "Mine did. It ended when Dravn meant to put the torch to my village."
dlg.scn.support.odile_sable.C.l09: "I … didn’t know that."
dlg.scn.support.odile_sable.C.l10: "Now you do. And drop the Captain. Here I’m Sable."
dlg.scn.support.odile_sable.C.l11: "Now show me that thrust from above. Slowly. I’m out of practice."
dlg.scn.support.odile_sable.B.l01: "You polish that breastplate every evening. Who for, exactly?"
dlg.scn.support.odile_sable.B.l02: "For no one now. A bodyguard with no body to guard is a ridiculous figure."
dlg.scn.support.odile_sable.B.l03: "The only ridiculous part is how grave you look doing it. As if she stood behind you."
dlg.scn.support.odile_sable.B.l04: "Sometimes she does. I hear steps on the wall-walk and turn around."
dlg.scn.support.odile_sable.B.l05: "Drums do that to me. I wake and want to fall in. There’s no company left."
dlg.scn.support.odile_sable.B.l06: "Was Dravn a good lord? Before he started handing out torches?"
dlg.scn.support.odile_sable.B.l07: "A good general. That’s not the same. I noticed too late."
dlg.scn.support.odile_sable.B.l08: "Seraphine was a good mistress. And still she let me go."
dlg.scn.support.odile_sable.B.l09: "Let you go, or sent you away?"
dlg.scn.support.odile_sable.B.l10: "I don’t know. That’s what keeps me up at night."
dlg.scn.support.odile_sable.B.l11: "Then keep polishing. But shift over on the bench. I brought oil for the sabre."
dlg.scn.support.odile_sable.A.l01: "Sable. If Seraphine sends for me tomorrow, what will you do?"
dlg.scn.support.odile_sable.A.l02: "Depends. Will you go?"
dlg.scn.support.odile_sable.A.l03: "I don’t know. That’s why I’m asking you and not myself."
dlg.scn.support.odile_sable.A.l04: "Then I’ll tell you something nobody here knows yet."
dlg.scn.support.odile_sable.A.l05: "The firebreak. I drew the map for it. With my own hand, on Dravn’s table."
dlg.scn.support.odile_sable.A.l06: "My village lay right in the middle. I saw it and kept drawing. All the way to the edge."
dlg.scn.support.odile_sable.A.l07: "And then?"
dlg.scn.support.odile_sable.A.l08: "Then you warned it. And there I stood with ink on my fingers."
dlg.scn.support.odile_sable.A.l09: "You turned around all the same. That weighs more than the ink."
dlg.scn.support.odile_sable.A.l10: "Maybe. But now I know how easily you follow a lord to the edge."
dlg.scn.support.odile_sable.A.l11: "I carry something from court too. Something I saw and may not speak of."
dlg.scn.support.odile_sable.A.l12: "Keep it. Just not so long that it eats you alive."
dlg.scn.support.odile_sable.A.l13: "If I ever walk to the edge again, will you stop me?"
dlg.scn.support.odile_sable.A.l14: "With the sabre, if I must. From above, the way you taught me."
dlg.scn.support.ilka_sable.C.l01: "You smell of resin and smoke. Like a winter morning in the Copper Mountains."
dlg.scn.support.ilka_sable.C.l02: "The wolf pelt. It smells like that when it gets wet."
dlg.scn.support.ilka_sable.C.l03: "I know the clans up there. Say little, shoot well."
dlg.scn.support.ilka_sable.C.l04: "And you say a lot. For a soldier."
dlg.scn.support.ilka_sable.C.l05: "Ash and ember! Nobody’s told me that in twenty years."
dlg.scn.support.ilka_sable.C.l06: "Then nobody was listening."
dlg.scn.support.ilka_sable.C.l07: "Which clan?"
dlg.scn.support.ilka_sable.C.l08: "None, any more."
dlg.scn.support.ilka_sable.C.l09: "I see. I won’t ask again."
dlg.scn.support.ilka_sable.C.l10: "The pelt comes from up there. If you miss the mountains, you can touch it."
dlg.scn.support.ilka_sable.C.l11: "… Thank you. It really does smell like home."
dlg.scn.support.ilka_sable.B.l01: "You go to the north wall every evening. Always the same spot. The stones there are worn smooth."
dlg.scn.support.ilka_sable.B.l02: "So now you’re tracking me too?"
dlg.scn.support.ilka_sable.B.l03: "You’re easy to track."
dlg.scn.support.ilka_sable.B.l04: "From there you see the Copper Mountains on a clear day. Beyond them would be the Brandhang."
dlg.scn.support.ilka_sable.B.l05: "Is. Not would be. Your village still stands."
dlg.scn.support.ilka_sable.B.l06: "True. I forget sometimes. You expect the worst for so long."
dlg.scn.support.ilka_sable.B.l07: "We have a saying: stare too long toward home and you step in the snare at your feet."
dlg.scn.support.ilka_sable.B.l08: "Sounds like my old sergeant. Only shorter."
dlg.scn.support.ilka_sable.B.l09: "I look too. Just not from the wall. I wait for the first snow."
dlg.scn.support.ilka_sable.B.l10: "It comes late here. The highlands are soft next to the Eisenmark."
dlg.scn.support.ilka_sable.B.l11: "Soft. Yes. That’s the word."
dlg.scn.support.ilka_sable.B.l12: "Come to the wall with me tomorrow. Homesickness is less cold for two."
dlg.scn.support.ilka_sable.A.l01: "When the war is over, I’m going back to the Brandhang. I know that now."
dlg.scn.support.ilka_sable.A.l02: "Good. Then you have somewhere to go."
dlg.scn.support.ilka_sable.A.l03: "And you?"
dlg.scn.support.ilka_sable.A.l04: "I can’t go back. The clan took my name out of the fire."
dlg.scn.support.ilka_sable.A.l05: "What does that mean?"
dlg.scn.support.ilka_sable.A.l06: "Every evening they call the names at the fire. Nobody calls mine. To them I’m dead."
dlg.scn.support.ilka_sable.A.l07: "By the Pact. What for?"
dlg.scn.support.ilka_sable.A.l08: "I read a trail nobody wanted to see. And I said it out loud."
dlg.scn.support.ilka_sable.A.l09: "Then you were the only one doing her job."
dlg.scn.support.ilka_sable.A.l10: "I never saw it that way."
dlg.scn.support.ilka_sable.A.l11: "I was a captain. I know what it’s like when someone reports and everyone looks away."
dlg.scn.support.ilka_sable.A.l12: "Come to the Brandhang with me when the time comes. We call names in the evening too."
dlg.scn.support.ilka_sable.A.l13: "Mine too?"
dlg.scn.support.ilka_sable.A.l14: "Yours first. I talk loud and often. You said so yourself."
dlg.scn.support.brann_ilka.C.l01: "You needn’t sit with me. The stone under me is warm."
dlg.scn.support.brann_ilka.C.l02: "That’s why I’m sitting here. The castle is cold."
dlg.scn.support.brann_ilka.C.l03: "The others sit by the fire."
dlg.scn.support.brann_ilka.C.l04: "By the fire they talk."
dlg.scn.support.brann_ilka.C.l05: "… Yes. A great deal."
dlg.scn.support.brann_ilka.C.l06: "In the mine you told me to keep my distance. I am. An arm’s length."
dlg.scn.support.brann_ilka.C.l07: "An arm’s length isn’t enough when it gets bad."
dlg.scn.support.brann_ilka.C.l08: "Then I’ll move. I see it coming. Your breath goes shallow before the stone glows."
dlg.scn.support.brann_ilka.C.l09: "You know that already?"
dlg.scn.support.brann_ilka.C.l10: "I read tracks. You’re one too."
dlg.scn.support.brann_ilka.C.l11: "Then stay. But tell me when my breathing goes shallow."
dlg.scn.support.brann_ilka.B.l01: "You breathed easy last night. The whole watch long."
dlg.scn.support.brann_ilka.B.l02: "You were counting?"
dlg.scn.support.brann_ilka.B.l03: "I couldn’t sleep. Counting beats brooding."
dlg.scn.support.brann_ilka.B.l04: "Back home they counted how often I made the ground shake. For the priest."
dlg.scn.support.brann_ilka.B.l05: "Dragon dung. That’s not counting. That’s keeping a charge sheet."
dlg.scn.support.brann_ilka.B.l06: "I know. I was eight."
dlg.scn.support.brann_ilka.B.l07: "This pelt. Do you want to know where it’s from?"
dlg.scn.support.brann_ilka.B.l08: "If you want to tell me."
dlg.scn.support.brann_ilka.B.l09: "A white wolf. He followed me three winters. I never hunted him. He died old."
dlg.scn.support.brann_ilka.B.l10: "And you wear him instead of leaving him behind."
dlg.scn.support.brann_ilka.B.l11: "He was the only one who came along."
dlg.scn.support.brann_ilka.B.l12: "Give me your hands. Don’t be afraid. I’m only warming the stone."
dlg.scn.support.brann_ilka.B.l13: "… Warm. Not hot."
dlg.scn.support.brann_ilka.B.l14: "Not hot. For the first time, it came out just the way I wanted."
dlg.scn.support.brann_ilka.A.l01: "Ilka. May I tell you why they drove me out?"
dlg.scn.support.brann_ilka.A.l02: "I’m listening."
dlg.scn.support.brann_ilka.A.l03: "My brother fell into a crevice. I called on the mountain to hold him."
dlg.scn.support.brann_ilka.A.l04: "The mountain held him. But the stone glowed, and his hand was burned."
dlg.scn.support.brann_ilka.A.l05: "He lives. He just doesn’t speak to me any more. No one in the village does."
dlg.scn.support.brann_ilka.A.l06: "You saved him."
dlg.scn.support.brann_ilka.A.l07: "And scarred him. Both. That’s the thing."
dlg.scn.support.brann_ilka.A.l08: "A track is never just one thing. The wolf takes a deer, and the crows eat well."
dlg.scn.support.brann_ilka.A.l09: "Are you comforting me?"
dlg.scn.support.brann_ilka.A.l10: "I’m trying. I’m bad at it."
dlg.scn.support.brann_ilka.A.l11: "No. You’re not."
dlg.scn.support.brann_ilka.A.l12: "My turn. I’m afraid you’ll leave once you master the ember. Then you won’t need me."
dlg.scn.support.brann_ilka.A.l13: "It isn’t the ember I need you for, Ilka."
dlg.scn.support.brann_ilka.A.l14: "… Good. Then I’ll say nothing more. With me, that’s a good sign."
dlg.scn.support.brann_ilka.S.l01: "It’s snowing. The first snow in the highlands."
dlg.scn.support.brann_ilka.S.l02: "You smelled it before it came."
dlg.scn.support.brann_ilka.S.l03: "Yesterday already. I wanted you to see it."
dlg.scn.support.brann_ilka.S.l04: "At the Brandhang it always melted on our roof first. People took it for an omen."
dlg.scn.support.brann_ilka.S.l05: "Was it one?"
dlg.scn.support.brann_ilka.S.l06: "Only that I sleep warm."
dlg.scn.support.brann_ilka.S.l07: "Brann. For weeks I’ve been reading your trail. Every evening it leads here."
dlg.scn.support.brann_ilka.S.l08: "So does yours."
dlg.scn.support.brann_ilka.S.l09: "I know. I only wanted to know if you knew."
dlg.scn.support.brann_ilka.S.l10: "I’m not good with words. But the stone under you is warm because I want it to be."
dlg.scn.support.brann_ilka.S.l11: "Since you came, the ember hardly ever rises from fear."
dlg.scn.support.brann_ilka.S.l12: "Then say it. Once. I’ll keep it."
dlg.scn.support.brann_ilka.S.l13: "I love you, Ilka. Quietly. But wholly."
dlg.scn.support.brann_ilka.S.l14: "And I you. Come closer. It’s already melting around us."
