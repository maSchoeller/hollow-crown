# Generated from the dialogue authoring script; keys = dialogue line keys.
dlg.prologue.intro.001: "(A voice, distant as a dream.) For three hundred years the dragons slept beneath the mountain. For three hundred years every king wore the Ember Crown."
dlg.prologue.intro.002: "On the night of the Pact Festival the ember went out. The king died. And the crown … was gone."
dlg.prologue.intro.003: "Late summer. A trade road in the Marches, two days' ride from Aurenhall."
dlg.prologue.intro.004: "Captain! The new one's awake! I told them we're the finest mercenary company in all of Valmora."
dlg.prologue.intro.005: "The finest one still standing, Tobin. There's a difference."
dlg.prologue.intro.006: "So you're {avatar}. The Academy recommended you – then struck you from its records. Why?"
dlg.prologue.intro.c1: "\"I don't remember. That's the truth.\""
dlg.prologue.intro.c2: "\"Maybe I was too good for them.\""
dlg.prologue.intro.007: "Hm. Honest, at least. That's more than most offer."
dlg.prologue.intro.008: "Modest, you are not. Good. We've had modest strategists – they're all dead."
dlg.prologue.intro.009: "Kael! Dust on the road, north. Lots of it. Not merchants."
dlg.prologue.intro.010: "Bandits. Ashen Banner – to the wagons! {avatar}, show me what you can do."
dlg.prologue.tutorial_move.001: "Tap one of our units. Blue is where it can move, red is what it can attack from there."
dlg.prologue.tutorial_move.002: "Tap a tile to preview, then tap it again to confirm. And before you swing: check the combat forecast."
dlg.prologue.grosk_battle.001: "Mercenaries? Bah. I'll make dice out of your bones!"
dlg.prologue.outro.001: "Not bad for a first day. You didn't get any of us killed."
dlg.prologue.outro.002: "The merchant talks of unrest in the capital. And smoke over Varnhold."
dlg.prologue.outro.003: "Varnhold? My aunt has a shop there!"
dlg.prologue.outro.004: "Then we ride. {avatar} – welcome to the Ashen Banner."
dlg.ch01.intro.001: "Captain! The town's burning – and people say the king is dead!"
dlg.ch01.intro.002: "Dead? Aldric was healthy as an ox when I last stood guard over him."
dlg.ch01.intro.003: "Marauders spread news faster than any herald. We need to cross that bridge before they tear it down."
dlg.ch01.intro.004: "{avatar}. You wanted to prove you can do more than read maps. Here's your chance."
dlg.ch01.intro.c1: "\"We stay together and avoid the fire.\""
dlg.ch01.intro.c2: "\"We cut a path straight through.\""
dlg.ch01.intro.005: "Careful. Good. Dead mercenaries don't collect pay."
dlg.ch01.intro.006: "Bold. Let's hope the fire agrees."
dlg.ch01.tutorial_fire.001: "See the flames in the grass? Fire spreads every round. Anyone standing in it burns."
dlg.ch01.tutorial_fire.002: "Our goal is the bridge to the north. I have to reach it – we don't need to kill Hask for that."
dlg.ch01.tutorial_fire.003: "And the houses? There are still people inside! We should visit them before the looters do."
dlg.ch01.ambush.001: "Ambush! They were waiting in the ruins!"
dlg.ch01.hask_battle.001: "Burns pretty, doesn't it? Soon you'll burn with it!"
dlg.ch01.village_north.001: "An old woman presses a pouch into Tobin's hand. \"For the bridge. Get the children across.\""
dlg.ch01.village_west.001: "A smith presses a javelin into your hands. \"Hit them before they hit you.\""
dlg.ch01.mira_village.001: "One more step and you'll have an arrow in your – oh. You're not with Hask's lot."
dlg.ch01.mira_village.002: "Ashen Banner. We're headed for the bridge. You shoot well?"
dlg.ch01.mira_village.003: "Better than any noble who ever hunted these woods. I'm Mira. I'll come along – but my village comes first."
dlg.ch01.mira_lost.001: "The house on the east edge … they set it alight. Someone was inside. We're too late."
dlg.ch01.outro.001: "The bridge stands. The town doesn't."
dlg.ch01.outro.002: "A rider of the Silver Lance came through. He asked after a seer – at the shrine in the Silverbrook valley."
dlg.ch01.outro.003: "The Lance hunts a seer while the realm burns? Then she matters. We find her first."
dlg.ch02.intro.001: "Early autumn. Mist lies over the Silverbrook. A single white light burns at the shrine."
dlg.ch02.intro.002: "You are late, Captain Kael. I saw you three days ago – in a dream made of ash."
dlg.ch02.intro.003: "You know my name."
dlg.ch02.intro.004: "I also know the name of the woman who has come to take me. Morra. Her sellswords are already at the brook."
dlg.ch02.intro.005: "Morra … she'd sell her own mother if the price was right."
dlg.ch02.intro.c1: "\"We hold the shrine until Morra gives up.\""
dlg.ch02.intro.c2: "\"Who paid Morra? That's what I want to know.\""
dlg.ch02.intro.006: "Eight rounds, I reckon. Then the contract gets too costly for her."
dlg.ch02.intro.007: "A good question. You will not like the answer."
dlg.ch02.tutorial_talk.001: "Liora is on the shrine. It heals her, but she won't last long alone. If she falls, it's all over."
dlg.ch02.tutorial_talk.002: "And Kael … the one in the plum coat over there. Isn't that Varek?"
dlg.ch02.tutorial_talk.003: "Varek. If I get close enough, I'll talk to him. He never fought for anything he didn't like."
dlg.ch02.varek_spotted.001: "Well, look at that. Kael of the Ashen Banner. Care to roll dice, or cross swords?"
dlg.ch02.varek_talk.001: "Varek. Since when do you kidnap seers?"
dlg.ch02.varek_talk.002: "Since Morra pays up front. But honestly … the client wears a golden mask. I don't like it."
dlg.ch02.varek_talk.003: "Then I'll pay you double. Later."
dlg.ch02.varek_talk.004: "Later. My favourite sum. Fine – the dice say: Ashen Banner."
dlg.ch02.reinforcements.001: "More are coming. From west and east – I see their shadows in the mist."
dlg.ch02.morra_battle.001: "Nothing personal, Kael. Just a contract. But I finish my contracts."
dlg.ch02.village_mill.001: "The miller slides a potion across. \"For the seer. She prayed my boy back to health.\""
dlg.ch02.village_herb.001: "A herbwoman hands you a rune, cool as brook water. \"Water quenches fire. Don't forget it.\""
dlg.ch02.outro.001: "Morra withdraws. You saved me, Ashen Banner. And I pay my debts."
dlg.ch02.outro.002: "The crown was not stolen, Captain. It was … taken back. I cannot say more yet."
dlg.ch02.outro.003: "Taken back? By whom?"
dlg.ch02.outro.004: "By the one it always belonged to. Let me travel with you. {avatar} – I saw you in my dream. You were holding the crown."
dlg.support.avatar_kael.C.001: "You're not sleeping. Nightmares?"
dlg.support.avatar_kael.C.002: "I only ask because I have them too. Since the night of the Pact Festival."
dlg.support.avatar_kael.C.003: "I stood outside the king's door. I heard nothing. Nothing. And by morning he was dead."
dlg.support.avatar_kael.C.004: "That's why I hired you. Someone who sees patterns where I only see shadows."
dlg.support.avatar_kael.B.001: "Your map of Varnhold … you predicted where the fire would spread. To within three tiles."
dlg.support.avatar_kael.B.002: "The Academy was foolish to let you go. Or afraid of you."
dlg.support.avatar_kael.B.003: "Whatever it was – you're Ashen Banner now. That means: we leave no one behind."
dlg.support.brenna_kael.C.001: "You're brooding again, Captain. I can hear it from the cooking pot."
dlg.support.brenna_kael.C.002: "I didn't scratch the emblem off completely. You can still see the lance."
dlg.support.brenna_kael.C.003: "I didn't buy you out of that dungeon so you could torture yourself over a piece of tin."
dlg.support.brenna_kael.C.004: "You bought me for twelve silver. A bargain, you always say."
dlg.support.brenna_kael.C.005: "And I don't regret a single penny. Now eat."
dlg.support.brenna_kael.B.001: "If we ever go back to Aurenhall … will they recognise you?"
dlg.support.brenna_kael.B.002: "They'll recognise me. As the guard who failed."
dlg.support.brenna_kael.B.003: "Then they'll have to get past me first. And my axe."
dlg.support.brenna_tobin.C.001: "Brenna! Teach me the trick where you throw the axe and it comes back!"
dlg.support.brenna_tobin.C.002: "It doesn't come back, kid. I go and fetch it. That's the trick."
dlg.support.brenna_tobin.C.003: "Oh. But heroes in the songs …"
dlg.support.brenna_tobin.C.004: "Heroes in the songs die young, Tobin. I want you to grow old. So: shield up."
dlg.support.mira_tobin.C.001: "Your hat's crooked. Again."
dlg.support.mira_tobin.C.002: "It sits exactly right! That way it protects the left ear."
dlg.support.mira_tobin.C.003: "And the right one? Never mind. Want to learn how to actually hit something with a bow?"
dlg.support.mira_tobin.C.004: "You'd show me?"
dlg.support.mira_tobin.C.005: "Tomorrow at dawn. Before the birds wake. Oversleep, and your hat becomes my target."
dlg.support.brenna_varek.C.001: "I'm keeping an eye on you, dice-man."
dlg.support.brenna_varek.C.002: "Just the one? I'm flattered."
dlg.support.brenna_varek.C.003: "Yesterday you fought for Morra. Today for us. And tomorrow?"
dlg.support.brenna_varek.C.004: "Tomorrow for whoever doesn't stab me in the back. So far, you're in the lead."
dlg.support.avatar_liora.C.001: "You look at me as if you don't know whether to believe me."
dlg.support.avatar_liora.C.002: "In my dream you had no eyes for the crown. Only for the mountain behind it."
dlg.support.avatar_liora.C.003: "I don't know what it means. But I know you will find out."
dlg.prologue.tutorial_danger.001: "Tap an enemy: the red area shows how far it reaches on its turn. Anyone wounded stays out of it."
dlg.prologue.tutorial_danger.002: "And use the trees. Whoever stands in the woods gets hit less often."
dlg.prologue.tutorial_heal.001: "Kael, you're bleeding! Drink a vulnerary – under \"Item\", before you wait."
dlg.ch01.tutorial_triangle.001: "Hask's men carry axes, the deserters lances, the sellswords swords. Remember: sword beats axe, axe beats lance, lance beats sword."
dlg.ch01.tutorial_triangle.002: "And my lance beats … swords! Leave the sellswords to me!"
dlg.ch01.tutorial_triangle.003: "A green ▲ in the forecast means advantage, a red ▼ disadvantage. I'll take the lancers."
dlg.ch01.outro.004: "{avatar} – this was in Hask's tent. An Ember folio. You studied magic at the academy, didn't you? Take it."
dlg.ch02.tutorial_magic.001: "Magic strikes the spirit, not the armour: it pits MAG against RES and reaches two tiles."
dlg.ch02.tutorial_magic.002: "{avatar}, your folio is made for the armoured ones. And keep away from their mage – armour won't help there."
dlg.ch02.tutorial_talk.004: "Put me next to him and choose \"Talk\". Until then, nobody attacks him."
