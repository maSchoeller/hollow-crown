- { id: tavern,    function: tavern,    icon: tavern,    fromAct: 1, homes: [camp, castle], requires: [{ completed: ch01 }], levels: [{ requires: [{ act: 2 }] }, { requires: [{ act: 2 }] }] }
- { id: campfire,  function: campfire,  icon: campfire,  fromAct: 1, homes: [camp, castle], requires: [{ completed: ch02 }], levels: [{ requires: [{ act: 2 }] }, { requires: [{ act: 2 }] }] }
