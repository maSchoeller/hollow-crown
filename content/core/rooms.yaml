# Räume der Heimat (Architektur §5.10, Stories 6.3 und 10.1). Reihenfolge = Anzeige. Namen: room.<id>.name, Kurztext: room.<id>.desc.
# homes: camp = wanderndes Lager (Akt 1), castle = Burg (ab Mission 1-6). requires = Bedingungen (Architektur §5.3), UND.
# levels = Ausbau auf Stufe 2 und 3 (Command buildRoom, Story 10.1): cost = Gold, requires = Bedingungen der Stufe. Stufe 2 kostet nur
# Gold (ab Akt 2), Stufe 3 braucht zusätzlich einen der zwei Raum-Gefährten (any: alive, einer reicht; Produktinhaber 2026-10-31,
# Readiness-Runde R2). Kosten 1 500 / 4 000 Gold: GDD-Annahme 9. Die Wirkungen der Stufen stehen als Stufen-Arrays in balance.yaml.
# unlocks = was ein Raum später freigibt. Sind die Bedingungen nicht erfüllt, steht die Station gestrichelt da, mit der ersten
# offenen Bedingung als Grund (Freischaltung aus U20).
- { id: convoy, function: convoy, icon: convoy, fromAct: 1, homes: [camp, castle], requires: [],
    levels: [{ cost: { gold: 1500 }, requires: [{ act: 2 }] },
             { cost: { gold: 4000 }, requires: [{ act: 2 }, { any: [{ alive: tobin }, { alive: nell }] }] }] }
- { id: merchant, function: merchant, icon: merchant, fromAct: 1, homes: [camp, castle], requires: [],
    levels: [{ cost: { gold: 1500 }, requires: [{ act: 2 }] },
             { cost: { gold: 4000 }, requires: [{ act: 2 }, { any: [{ alive: fenn }, { alive: nell }] }] }] }
- { id: smith, function: smith, icon: smith, fromAct: 1, homes: [camp, castle], requires: [{ any: [{ act: 2 }, { storyCount: { min: 3 } }] }],
    levels: [{ cost: { gold: 1500 }, requires: [{ act: 2 }] },
             { cost: { gold: 4000 }, requires: [{ act: 2 }, { any: [{ alive: brenna }, { alive: grosk }] }] }] }
- { id: healer, function: healer, icon: healer, fromAct: 1, homes: [camp, castle], requires: [{ any: [{ act: 2 }, { storyCount: { min: 3 } }] }],
    levels: [{ cost: { gold: 1500 }, requires: [{ act: 2 }] },
             { cost: { gold: 4000 }, requires: [{ act: 2 }, { any: [{ alive: liora }, { alive: amos }] }] }] }
- { id: tavern, function: tavern, icon: tavern, fromAct: 1, homes: [camp, castle], requires: [{ any: [{ act: 2 }, { storyCount: { min: 3 } }] }],
    levels: [{ cost: { gold: 1500 }, requires: [{ act: 2 }] },
             { cost: { gold: 4000 }, requires: [{ act: 2 }, { any: [{ alive: varek }, { alive: jory }] }] }] }
- { id: campfire, function: campfire, icon: campfire, fromAct: 1, homes: [camp, castle], requires: [{ any: [{ act: 2 }, { storyCount: { min: 4 } }] }],
    levels: [{ cost: { gold: 1500 }, requires: [{ act: 2 }] },
             { cost: { gold: 4000 }, requires: [{ act: 2 }, { any: [{ alive: jory }, { alive: brenna }] }] }] }
