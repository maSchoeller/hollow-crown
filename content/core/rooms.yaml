# Räume der Heimat (Architektur §5.10, Story 6.3). Reihenfolge = Anzeige. Namen: room.<id>.name, Kurztext: room.<id>.desc.
# homes: camp = wanderndes Lager (Akt 1), castle = Burg (ab Mission 1-6). requires = Bedingungen (Architektur §5.3), UND.
# levels = Bedingungen für Stufe 2 und 3 (Ausbau, Story 6.9; der Ausbau selbst kommt mit Epic 10), unlocks = was ein Raum später freigibt.
# Sind sie nicht erfüllt, steht die Station gestrichelt da, mit der ersten offenen Bedingung als Grund (Freischaltung aus U20).
- { id: convoy,    function: convoy,    icon: convoy,    fromAct: 1, homes: [camp, castle], requires: [], levels: [{ requires: [{ act: 2 }] }, { requires: [{ act: 2 }] }] }
- { id: merchant,  function: merchant,  icon: merchant,  fromAct: 1, homes: [camp, castle], requires: [], levels: [{ requires: [{ act: 2 }] }, { requires: [{ act: 2 }] }] }
- { id: smith,     function: smith,     icon: smith,     fromAct: 1, homes: [camp, castle], requires: [{ completed: ch01 }], levels: [{ requires: [{ act: 2 }] }, { requires: [{ act: 2 }] }] }
