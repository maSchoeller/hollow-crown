- { id: memorial,  function: memorial,  icon: stone,     fromAct: 1, homes: [castle], requires: [], levels: [{ requires: [{ act: 2 }] }, { requires: [{ act: 2 }] }], unlocks: [{ id: lessons, requires: [{ act: 2 }] }] }
