# Gelände (concept/06 §2, Bewegungskosten concept/04 §2). Startwerte [C].
# cost: Bewegungskosten je Bewegungstyp, null = nicht betretbar.
# ground: Bodenschicht fürs Dual-Grid-Rendering, prop: Requisite darüber (art/README.md).
# level: Höhenstufe als Regel (GDD; Standard 0; 1 Wehrgang, Dach, Terrasse; 2 Turm, Felsnase). Eine Karte hebt beliebiges Gelände zusätzlich mit `levels:` (Wald auf der Terrasse bleibt Wald). Die Mauer selbst bleibt unbetretbar und Stufe 0, begehbar ist `rampart`.
# connector: ramp|stairs|ladder führt von diesem Feld zum einen Nachbarn eine Stufe höher; wer sie nutzen darf, sagt cost. opensTo: geschlossener Durchgang, öffnet zu diesem Gelände.
# 3D-Brett, nur Darstellung (concept/01-decisions.md D3, D6): stand = Standhöhe einer Figur über height (auf ramp/stairs/ladder gilt die Modellfläche aus render.yaml board.connectors, Story 15.13); surface = Bodentextur, height = Oberkante in Feldern
# (Standard 0), cliff = Seitenwand earth|rock|wall (Standard earth), water = Wasserfläche darüber.
