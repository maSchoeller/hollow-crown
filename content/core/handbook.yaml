  - id: sets
    category: items
    icon: shield
    see: [rarity, upgrade]
  - id: weight
    category: items
    icon: bag
    values:
      - { id: foot, ref: balance.weight.carryBonus.foot, format: signed, icon: bag }
      - { id: armored, ref: balance.weight.carryBonus.armored, format: signed, icon: bag }
      - { id: over1, ref: balance.weight.movPenalty.0.overload, icon: bag }
      - { id: mov1, ref: balance.weight.movPenalty.0.mov, icon: next }
      - { id: over2, ref: balance.weight.movPenalty.1.overload, icon: bag }
      - { id: mov2, ref: balance.weight.movPenalty.1.mov, icon: next }
      - { id: bag, ref: balance.bag.size, icon: bag }
    see: [double_attack, movement]

  # ------------------------------------------------------------------ Klassen (nur spielbare, content:check verlangt jede)
  - { id: class_tactician, category: classes, graphic: class, class: tactician, see: [class_captain, phases] }
  - { id: class_captain, category: classes, graphic: class, class: captain, see: [class_tactician, supports] }
  - { id: class_vanguard, category: classes, graphic: class, class: vanguard, see: [class_bulwark, class_breaker, terrain_cover] }
  - { id: class_skirmisher, category: classes, graphic: class, class: skirmisher, see: [class_duelist, double_attack] }
  - { id: class_marksman, category: classes, graphic: class, class: marksman, see: [class_sharpshooter, fog] }
  - { id: class_elementalist, category: classes, graphic: class, class: elementalist, see: [class_sage, magic, elements] }
  - { id: class_healer, category: classes, graphic: class, class: healer, see: [class_bishop, rescue] }
  - { id: class_scout, category: classes, graphic: class, class: scout, see: [doors, fog, terrain_mountain] }
  - { id: class_minstrel, category: classes, graphic: class, class: minstrel, see: [class_captain, supports] }
  - { id: class_duelist, category: classes, graphic: class, class: duelist, fromAct: 2, see: [class_skirmisher, ember_spark] }
  - { id: class_bulwark, category: classes, graphic: class, class: bulwark, fromAct: 2, see: [class_vanguard, ember_spark] }
  - { id: class_breaker, category: classes, graphic: class, class: breaker, fromAct: 2, see: [class_vanguard, ember_spark] }
  - { id: class_sharpshooter, category: classes, graphic: class, class: sharpshooter, fromAct: 2, see: [class_marksman, ember_spark] }
  - { id: class_sage, category: classes, graphic: class, class: sage, fromAct: 2, see: [class_elementalist, ember_spark] }
  - { id: class_bishop, category: classes, graphic: class, class: bishop, fromAct: 2, see: [class_healer, ember_spark] }

  # ------------------------------------------------------------------ Lektionen (Text aus den Szenen selbst, keine Kopie)
  - { id: lesson_move, category: lessons, graphic: lesson, lesson: scn.prologue.tutorial_move, see: [movement, forecast] }
  - { id: lesson_danger, category: lessons, graphic: lesson, lesson: scn.prologue.tutorial_danger, see: [danger, terrain_cover] }
