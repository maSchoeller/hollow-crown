# Beschreibungen der Items (Detailansicht, ItemSheet) und Namen der Ausrüstungs-Sets. Werte stehen nicht im Text, die Detailansicht rechnet sie aus den Daten.
item.arcane_dust.desc: "Feiner, glimmender Staub. Der Verzauberer braucht ihn, um Eigenschaften einer Waffe neu zu würfeln."
item.ashen_badge.desc: "Ein Abzeichen aus geschwärztem Messing. Schärft den Blick im Kampf; Teil des Sets der Aschenbanner-Wacht."
item.ashen_blade.desc: "Eine Klinge, die nie ganz erkaltet. Ihr Hieb kann das Ziel in Brand setzen."
item.bounty.desc: "Morras Armbrust. Sie trifft selten daneben und findet oft die verwundbare Stelle."
item.chainmail.desc: "Solide Mittelrüstung aus Ringen. Guter Schutz, ohne zu sehr zu bremsen; Teil des Sets der Aschenbanner-Wacht."
item.dark_rune_1.desc: "Eine Rune aus schwarzem Stein. Gibt einer Waffe das Element Dunkel."
item.dawnbreaker.desc: "Ein Bogen aus hellem Holz, der im Morgenlicht zu glühen scheint. Besonders tödlich gegen Flieger, Monster und Drachen."
item.door_key.desc: "Ein schwerer Eisenschlüssel. Öffnet eine verschlossene Tür oder Truhe und ist danach verbraucht."
item.dragon_scale.desc: "Eine Schuppe, härter als jedes Metall. Der Schmied braucht sie für die höchste Aufwertung."
item.drake_breath.desc: "Der Feueratem eines Drachen. Nur Monster führen ihn."
item.earth_amulet.desc: "Ein Amulett aus Flussstein. Schützt gegen Magie und lehrt, Wunden mit der Zeit selbst zu heilen."
item.earth_rune_1.desc: "Eine Rune aus Erdstein. Gibt einer Waffe das Element Erde."
item.earth_rune_2.desc: "Eine stärkere Erdrune. Treffer können das Ziel verlangsamen."
item.earth_rune_3.desc: "Die stärkste Erdrune. Treffer verlangsamen das Ziel noch zuverlässiger."
item.edge_rune.desc: "Eine Hilfsrune, die die Schneide schärft: mehr kritische Treffer."
item.ember.desc: "Ein Feuerzauber für den Einstieg. Kann das Ziel und trockenes Gelände in Brand setzen."
item.ember_focus.desc: "Ein glühender Stein für die Nebenhand. Stärkt Magie; Teil des Sets Gewand der Glut."
item.ember_robe.desc: "Eine Robe mit eingewebter Glut. Schützt gegen Magie und gibt dem Träger die Affinität Feuer; Teil des Sets Gewand der Glut."
item.ember_spark.desc: "Ein Funke, der nicht verlischt. Wird beim Aufstieg einer Figur verbraucht und bleibt bis dahin im Konvoi."
item.feather_rune.desc: "Eine Hilfsrune, die die Waffe leichter macht."
item.fire_bomb.desc: "Ein Tonkrug voll Brandöl. Aus der Entfernung werfen: Feuerschaden, das Ziel brennt, Gelände fängt Feuer."
item.fire_rune_1.desc: "Eine Rune aus Glutstein. Gibt einer Waffe das Element Feuer."
item.fire_rune_2.desc: "Eine stärkere Feuerrune. Treffer können das Ziel in Brand setzen."
item.fire_rune_3.desc: "Die stärkste Feuerrune. Setzt Ziele zuverlässiger in Brand und entzündet das Gelände."
item.force_rune.desc: "Eine Hilfsrune für mehr Wucht: mehr Schaden, aber die Waffe wird schwerer."
item.gust.desc: "Ein leichter Windzauber. Sehr treffsicher und stößt das Ziel zurück."
item.hammer.desc: "Ein zweihändiger Kriegshammer. Schwer und ungenau, aber verheerend gegen Gepanzerte."
item.hand_axe.desc: "Eine Wurfaxt. Trifft auch auf Abstand, dafür ungenauer als die Eisenaxt."
item.haste_scroll.desc: "Eine Schriftrolle, die Beine leicht macht. Ein Verbündeter in der Nähe zieht diese Runde weiter."
item.heal_staff.desc: "Ein einfacher Heilstab. Heilt einen Verbündeten im Nachbarfeld; die Magie der Figur verstärkt die Heilung."
item.heirloom.desc: "Tobins Erbstück, eine alte Lanze. Wird stärker, wenn ein Gefährte in der Nähe am Boden liegt."
item.horseslayer.desc: "Eine Lanze mit Widerhaken. Besonders tödlich gegen Berittene."
item.hunting_bow.desc: "Ein leichter Jagdbogen für Späher. Wenig Schaden, aber sehr treffsicher und kaum Gewicht."
item.iron_axe.desc: "Eine einfache Axt. Viel Schaden, aber ungenauer als Schwert und Lanze. Schlägt die Lanze im Waffendreieck."
item.iron_bow.desc: "Ein solider Bogen. Schießt nur auf Abstand, nie ins Nachbarfeld."
item.iron_dagger.desc: "Ein leichter Dolch. Wenig Schaden, aber hohe Chance auf kritische Treffer."
item.iron_helm.desc: "Ein einfacher Helm. Teil des Sets der Aschenbanner-Wacht."
item.iron_lance.desc: "Eine einfache Lanze. Ausgewogen und verlässlich. Schlägt das Schwert im Waffendreieck."
item.iron_ore.desc: "Rohes Eisenerz. Der Schmied braucht es für die ersten Aufwertungen."
item.iron_shield.desc: "Ein Schild aus Eisen. Guter Schutz; Teil des Sets der Aschenbanner-Wacht."
item.iron_sword.desc: "Ein einfaches Schwert. Treffsicher und leicht. Schlägt die Axt im Waffendreieck."
item.javelin.desc: "Ein Wurfspeer. Trifft auch auf Abstand, dafür weniger Schaden als die Eisenlanze."
item.leather_cap.desc: "Eine Lederkappe. Etwas Schutz, kaum Gewicht."
item.leather_vest.desc: "Eine leichte Lederweste. Wenig Schutz, aber auch kaum Gewicht."
item.light_rune_1.desc: "Eine Rune aus hellem Kristall. Gibt einer Waffe das Element Licht."
item.light_rune_2.desc: "Eine stärkere Lichtrune."
item.light_rune_3.desc: "Die stärkste Lichtrune. Macht die Waffe besonders tödlich gegen Monster und Untote."
item.little_hands.desc: "Grosks Schild, bemalt mit Kinderhänden. Lehrt, Wunden mit der Zeit selbst zu heilen."
item.longbow.desc: "Ein großer Bogen mit großer Reichweite. Ungenauer, dafür sicher aus der zweiten Reihe."
item.lucky_charm.desc: "Ein abgegriffener Glücksbringer. Erhöht das Glück und lehrt, einen tödlichen Treffer zu überstehen."
item.mage_hood.desc: "Eine Haube aus Wollstoff. Schützt gegen Magie; Teil des Sets Gewand der Glut."
item.mage_robe.desc: "Eine leichte Robe. Schützt gegen Magie und stärkt die eigene."
item.magpie.desc: "Fenns Dolch. Lehrt, dem Gegner sogar das zu stehlen, was er in der Hand hält."
item.mend_staff.desc: "Ein stärkerer Heilstab. Heilt deutlich mehr als der Heilstab."
item.moonsteel.desc: "Bläulich schimmerndes Metall. Der Schmied braucht es für höhere Aufwertungen."
item.pact_warden_shield.desc: "Ein uralter Schild der Paktwächter, noch schlafend. Schützt Verbündete auf Nachbarfeldern."
item.plate_armor.desc: "Eine schwere Plattenrüstung. Sehr viel Schutz, aber sie macht langsamer und wiegt viel."
item.power_ring.desc: "Ein Ring aus dunklem Eisen. Erhöht die Stärke."
item.precision_rune.desc: "Eine Hilfsrune, die die Hand ruhig macht: mehr Treffer."
item.promotion_seal.desc: "Ein Siegel mit dem Wappen der Krone. Lässt eine erfahrene Figur in eine stärkere Klasse aufsteigen."
item.remedy_salve.desc: "Eine kühlende Salbe. Entfernt alle schlechten Zustände wie Brennen oder Nässe."
item.remedy_staff.desc: "Ein Stab, der reinigt. Heilt wenig, entfernt aber schlechte Zustände und reicht etwas weiter."
item.rockfall.desc: "Ein Erdzauber. Viel Schaden, aber ungenau; kann das Ziel verlangsamen."
item.seers_herb.desc: "Ein seltenes Kraut der Seherin. Entfernt eine Narbe; nur im Lager anwendbar."
item.shine.desc: "Ein Lichtzauber. Treffsicher und besonders tödlich gegen Monster und Untote."
item.slim_sword.desc: "Ein schmales, sehr leichtes Schwert. Wenig Schaden, trifft aber fast immer."
item.steel_axe.desc: "Eine Axt aus Stahl. Mehr Schaden als die Eisenaxt, aber schwerer und ungenauer."
item.steel_bow.desc: "Ein Bogen aus Stahl. Mehr Schaden als der Eisenbogen, aber schwerer."
item.steel_lance.desc: "Eine Lanze aus Stahl. Mehr Schaden als die Eisenlanze, aber schwerer."
item.steel_sword.desc: "Ein Schwert aus Stahl. Mehr Schaden als das Eisenschwert, aber schwerer und ungenauer."
item.stone_wall.desc: "Ein Erdzauber ohne Schaden: Er lässt einen Felswall aus dem Boden wachsen, der Wege versperrt."
item.surge.desc: "Ein Wasserzauber. Macht das Ziel nass und löscht brennendes Gelände."
item.tinder.desc: "Hasks Axt, rußgeschwärzt. Ihr Hieb kann das Ziel in Brand setzen."
item.torch.desc: "Eine Pechfackel. Erhellt die Umgebung im Dunkeln für einige Runden."
item.tower_shield.desc: "Ein mannshoher Schild. Sehr viel Schutz, aber er macht langsamer."
item.travel_lute.desc: "Eine Laute für die Nebenhand des Spielmanns. Erhöht das Glück."
item.vulnerary.desc: "Ein Heiltrank. Heilt die Figur, die ihn trinkt; füllt sich nach jeder Mission wieder auf."
item.water_rune_1.desc: "Eine Rune aus Flussglas. Gibt einer Waffe das Element Wasser."
item.water_rune_2.desc: "Eine stärkere Wasserrune. Treffer können das Ziel nass machen."
item.water_rune_3.desc: "Die stärkste Wasserrune. Macht Ziele zuverlässiger nass und löscht brennendes Gelände."
item.wind_feather.desc: "Eine Feder, die nie still liegt. Mehr Bewegung, und sie lehrt, nach der Aktion weiterzuziehen."
item.wind_rune_1.desc: "Eine Rune aus Windstein. Gibt einer Waffe das Element Wind."
item.wind_rune_2.desc: "Eine stärkere Windrune. Treffer können das Ziel zurückstoßen."
item.wind_rune_3.desc: "Die stärkste Windrune. Stößt Ziele zuverlässiger zurück."
item.wolf_fang.desc: "Ulvrics Lanze. Lehrt, nach einer Aktion noch ein Stück weiterzuziehen."
item.wooden_shield.desc: "Ein einfacher Holzschild. Etwas Schutz, wenig Gewicht."
set.ashen_watch.name: "Aschenbanner-Wacht"
set.ember_garb.name: "Gewand der Glut"
