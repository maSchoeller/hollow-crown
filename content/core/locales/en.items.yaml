# Item descriptions (detail view, ItemSheet) and names of the gear sets. Values stay out of the text; the detail view works them out from the data.
item.arcane_dust.desc: "Fine, glittering dust. The enchanter needs it to reroll the traits of a weapon."
item.ashen_badge.desc: "A badge of blackened brass. Sharpens the eye in battle; part of the Ashen Banner Watch set."
item.ashen_blade.desc: "A blade that never quite cools. Its strike can set the target ablaze."
item.bounty.desc: "Morra's crossbow. It rarely misses and often finds the weak spot."
item.chainmail.desc: "Solid medium armor of rings. Good protection without slowing you much; part of the Ashen Banner Watch set."
item.dark_rune_1.desc: "A rune of black stone. Gives a weapon the dark element."
item.dawnbreaker.desc: "A bow of pale wood that seems to glow at dawn. Especially deadly against fliers, monsters and dragons."
item.door_key.desc: "A heavy iron key. Opens one locked door or chest and is used up."
item.dragon_scale.desc: "A scale harder than any metal. The smith needs it for the highest upgrade."
item.drake_breath.desc: "The fiery breath of a drake. Only monsters wield it."
item.earth_amulet.desc: "An amulet of river stone. Guards against magic and teaches how to heal wounds over time."
item.earth_rune_1.desc: "A rune of earthstone. Gives a weapon the earth element."
item.earth_rune_2.desc: "A stronger earth rune. Hits can slow the target."
item.earth_rune_3.desc: "The strongest earth rune. Hits slow the target more reliably."
item.edge_rune.desc: "A utility rune that hones the edge: more critical hits."
item.ember.desc: "A beginner's fire spell. Can set the target and dry terrain ablaze."
item.ember_focus.desc: "A glowing stone for the off hand. Strengthens magic; part of the Ember Garb set."
item.ember_robe.desc: "A robe with embers woven in. Guards against magic and gives the wearer the fire affinity; part of the Ember Garb set."
item.ember_spark.desc: "A spark that never dies. Used up when a figure is promoted; it stays in the convoy until then."
item.feather_rune.desc: "A utility rune that makes the weapon lighter."
item.fire_bomb.desc: "A clay jar full of fire oil. Throw it from a distance: fire damage, the target burns, terrain catches fire."
item.fire_rune_1.desc: "A rune of emberstone. Gives a weapon the fire element."
item.fire_rune_2.desc: "A stronger fire rune. Hits can set the target ablaze."
item.fire_rune_3.desc: "The strongest fire rune. Sets targets ablaze more reliably and ignites the terrain."
item.force_rune.desc: "A utility rune for more force: more damage, but the weapon gets heavier."
item.gust.desc: "A light wind spell. Very accurate and knocks the target back."
item.hammer.desc: "A two-handed war hammer. Heavy and inaccurate, but devastating against armored foes."
item.hand_axe.desc: "A throwing axe. Hits at a distance too, but less accurate than the iron axe."
item.haste_scroll.desc: "A scroll that lightens the legs. A nearby ally moves farther this round."
item.heal_staff.desc: "A simple healing staff. Heals an adjacent ally; the figure's magic adds to the healing."
item.heirloom.desc: "Tobin's heirloom, an old lance. Grows stronger while a companion nearby is down."
item.horseslayer.desc: "A barbed lance. Especially deadly against mounted foes."
item.hunting_bow.desc: "A light hunting bow for scouts. Little damage, but very accurate and barely any weight."
item.iron_axe.desc: "A plain axe. Lots of damage, but less accurate than sword and lance. Beats the lance in the weapon triangle."
item.iron_bow.desc: "A solid bow. Shoots only at a distance, never at an adjacent tile."
item.iron_dagger.desc: "A light dagger. Little damage, but a high chance of critical hits."
item.iron_helm.desc: "A plain helm. Part of the Ashen Banner Watch set."
item.iron_lance.desc: "A plain lance. Balanced and reliable. Beats the sword in the weapon triangle."
item.iron_ore.desc: "Raw iron ore. The smith needs it for the first upgrades."
item.iron_shield.desc: "A shield of iron. Good protection; part of the Ashen Banner Watch set."
item.iron_sword.desc: "A plain sword. Accurate and light. Beats the axe in the weapon triangle."
item.javelin.desc: "A throwing spear. Hits at a distance too, but deals less damage than the iron lance."
item.leather_cap.desc: "A leather cap. A little protection, barely any weight."
item.leather_vest.desc: "A light leather vest. Little protection, but barely any weight either."
item.light_rune_1.desc: "A rune of pale crystal. Gives a weapon the light element."
item.light_rune_2.desc: "A stronger light rune."
item.light_rune_3.desc: "The strongest light rune. Makes the weapon especially deadly against monsters and undead."
item.little_hands.desc: "Grosk's shield, painted with children's hands. Teaches how to heal wounds over time."
item.longbow.desc: "A great bow with great range. Less accurate, but safe from the second row."
item.lucky_charm.desc: "A worn lucky charm. Raises luck and teaches how to survive a deadly blow."
item.mage_hood.desc: "A hood of wool. Guards against magic; part of the Ember Garb set."
item.mage_robe.desc: "A light robe. Guards against magic and strengthens your own."
item.magpie.desc: "Fenn's dagger. Teaches how to steal even what the enemy holds in hand."
item.mend_staff.desc: "A stronger healing staff. Heals much more than the heal staff."
item.moonsteel.desc: "A bluish, shimmering metal. The smith needs it for higher upgrades."
item.pact_warden_shield.desc: "An ancient shield of the Pact Wardens, still asleep. Protects allies on adjacent tiles."
item.plate_armor.desc: "Heavy plate armor. A great deal of protection, but it slows you down and weighs a lot."
item.power_ring.desc: "A ring of dark iron. Raises strength."
item.precision_rune.desc: "A utility rune that steadies the hand: more hit."
item.promotion_seal.desc: "A seal bearing the crest of the crown. Lets an experienced figure rise to a stronger class."
item.remedy_salve.desc: "A cooling salve. Removes all harmful conditions such as burning or wet."
item.remedy_staff.desc: "A cleansing staff. Heals little, but removes harmful conditions and reaches a bit farther."
item.rockfall.desc: "An earth spell. Lots of damage, but inaccurate; can slow the target."
item.seers_herb.desc: "A rare herb of the seer. Removes one scar; only usable at home."
item.shine.desc: "A light spell. Accurate and especially deadly against monsters and undead."
item.slim_sword.desc: "A slender, very light sword. Little damage, but it almost never misses."
item.steel_axe.desc: "An axe of steel. More damage than the iron axe, but heavier and less accurate."
item.steel_bow.desc: "A bow of steel. More damage than the iron bow, but heavier."
item.steel_lance.desc: "A lance of steel. More damage than the iron lance, but heavier."
item.steel_sword.desc: "A sword of steel. More damage than the iron sword, but heavier and less accurate."
item.stone_wall.desc: "An earth spell without damage: it raises a rock wall from the ground that blocks the way."
item.surge.desc: "A water spell. Makes the target wet and puts out burning terrain."
item.tinder.desc: "Hask's axe, black with soot. Its strike can set the target ablaze."
item.torch.desc: "A pitch torch. Lights up the surroundings in the dark for a few rounds."
item.tower_shield.desc: "A shield as tall as a man. A great deal of protection, but it slows you down."
item.travel_lute.desc: "A lute for the minstrel's off hand. Raises luck."
item.vulnerary.desc: "A healing potion. Heals the figure who drinks it; refills after every mission."
item.water_rune_1.desc: "A rune of river glass. Gives a weapon the water element."
item.water_rune_2.desc: "A stronger water rune. Hits can make the target wet."
item.water_rune_3.desc: "The strongest water rune. Makes targets wet more reliably and puts out burning terrain."
item.wind_feather.desc: "A feather that never lies still. More movement, and it teaches how to move on after acting."
item.wind_rune_1.desc: "A rune of windstone. Gives a weapon the wind element."
item.wind_rune_2.desc: "A stronger wind rune. Hits can knock the target back."
item.wind_rune_3.desc: "The strongest wind rune. Knocks targets back more reliably."
item.wolf_fang.desc: "Ulvric's lance. Teaches how to move on a little after acting."
item.wooden_shield.desc: "A plain wooden shield. A little protection, little weight."
set.ashen_watch.name: "Ashen Banner Watch"
set.ember_garb.name: "Ember Garb"
