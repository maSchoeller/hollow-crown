# Darstellungswerte des Kampfbretts (concept/01-decisions.md D2, D8–D10, D16). Startwerte [C].
# Keine Regelwerte: src/core liest diese Datei nie.
camera:
  tiltDeg: 35            # D2: Neigung aus der Senkrechten, Feinabstimmung im Playtest
  margin: 0.25           # D10: Anteil der freien Sichtfläche, um den die Karte über den Rand darf
  zoomSteps: [7, 10, 15] # D9: sichtbare Spalten auf der kürzeren Bildschirmseite (Nah, Mittel, Übersicht)
  zoomMs: 240            # Dauer des Übergangs zwischen zwei Zoomstufen

# D1/D10: Brett. skirt = Landschaft rund um die Karte (Felder), skirtDim = Abdunklung dort (0–1),
# waterLevel = Wasserspiegel, baseDepth = Unterkante des Dioramas (Felder unter Bodenniveau)
board:
  skirt: 10
  skirtDim: 0.45
  waterLevel: -0.1
  baseDepth: 0.8
  lightsMax: { high: 8, mid: 5, low: 0 }   # Punktlichter (Karte + Feuer) je Qualitätsstufe
  sceneryPropsLow: 3                      # D8: auf „Niedrig“ nur Bäume/Felsen bis so viele Felder um die Karte
  fpsActive: 60                           # D8: Bildrate, solange sich etwas bewegt (auch auf 120-Hz-Displays)
  fpsIdle: 30                             # Bildrate in Ruhe (nur Idle-Animationen, Wasser, Feuer): spart Akku
  figureScale: 1.3                        # D4: 3D-Figuren gegenüber dem Blender-Maßstab, damit sie wie die Sprites ~80 % eines Felds füllen

# GA9 (concept/23-art-direction §4.2): sichtbares Waffenteil je Waffengruppe der ausgerüsteten Waffe bzw. je Art des
# Gegenstands in der Nebenhand. model = art/models/weapons/<model>.glb (tools/art/blender_weapons.py), hand = Hand-Sockel
# der Figur, motion = eigene Angriffsanimation attack_<motion> (§4.5; ohne: der Schwerthieb), hold = Drehung in Grad um die
# X-Achse des Sockels außerhalb des Angriffs (das Modell ist im Angriffsgriff gebaut). Nur Bild-zu-3D-Figuren haben
# Sockel; die Blender-Figuren tragen ihre Waffe fest im Modell.
gear:
  weapons:
    sword: { model: sword, hand: right }
    lance: { model: lance, hand: right, motion: thrust, hold: -125 }
    axe: { model: axe, hand: right, motion: chop }
    bow: { model: bow, hand: left, motion: shoot }
    anima: { model: book, hand: left, motion: cast }
    light: { model: book, hand: left, motion: cast }
    dark: { model: book, hand: left, motion: cast }
    staff: { model: staff, hand: right, motion: cast }
  offHand:
    shield: { model: shield, hand: left }

# D8: Qualitätsstufen. maxDpr = höchste Pixeldichte der Render-Auflösung, shadowMap = Kantenlänge der Schattenkarte (0 = keine Schatten)
quality:
  high: { maxDpr: 2.5, shadowMap: 2048 }
  mid: { maxDpr: 1.5, shadowMap: 1024 }
  low: { maxDpr: 1, shadowMap: 0 }
