# Darstellungswerte des Kampfbretts (concept/01-decisions.md D2, D8–D10, D16). Startwerte [C].
# Keine Regelwerte: src/core liest diese Datei nie.
camera:
  tiltDeg: 35            # D2: Neigung aus der Senkrechten, Feinabstimmung im Playtest
  margin: 0.25           # D10: Anteil der freien Sichtfläche, um den die Karte über den Rand darf
  zoomSteps: [7, 10, 15] # D9: sichtbare Spalten auf der kürzeren Bildschirmseite (Nah, Mittel, Übersicht)
  zoomMs: 240            # Dauer des Übergangs zwischen zwei Zoomstufen
  markFrameMargin: 1     # Ziel markieren: so viele Felder Rand bleiben um die markierten Felder, wenn die Kamera sie ins Bild holt (verschiebt, geht bei Bedarf Zoomstufen heraus)

# Tempo der Gegner- und Drittpartei-Phasen bei Geschwindigkeit 1x [C]; die Geschwindigkeit „Gegnerphase“ (2x) teilt die Zeiten.
# Der Spieler soll sehen, wer zieht und was er tut: Figur pulsiert, geht langsam, bleibt kurz stehen, dann folgt der Schlag.
aiPace:
  stepMs: 260         # ein Feld des Gegnerwegs (eigene Figuren des Spielers: 140)
  focusMs: 450        # der Handelnde pulsiert so lange, bevor er zieht oder schlägt
  afterMoveMs: 350    # Pause auf dem Zielfeld, bevor er schlägt oder der Nächste zieht
  afterStrikeMs: 450  # Pause nach einem Gegnerschlag

# D1/D10: Brett. skirt = Landschaft rund um die Karte (Felder), skirtDim = Abdunklung dort (0–1),
# waterLevel = Wasserspiegel, baseDepth = Unterkante des Dioramas (Felder unter Bodenniveau)
board:
  skirt: 10
  skirtDim: 0.45
  waterLevel: -0.1
  baseDepth: 0.8
  waterFrameMs: 450                        # Wasser-Animation: Dauer je Textur-Bild (ruhige Bewegung)
  lightsMax: { high: 8, mid: 5, low: 0 }   # Punktlichter (Karte + Feuer) je Qualitätsstufe
  sceneryPropsLow: 3                      # D8: auf „Niedrig“ nur Bäume/Felsen bis so viele Felder um die Karte
  sceneryVariants: 2                      # Story 8.11/7.8: die Landschaft um die Karte nutzt je Klasse nur die ersten n Modelle der Liste (jedes Modell kostet Draw Calls); auf der Karte gelten alle
  # Varianten der Requisiten (Modell `<prop>_<state>`, Gewicht): die Auswahl ist ein Feld-Hash mit dem Brett-Seed (deterministisch, zwei gleiche
  # Nachbarn werden nach Möglichkeit vermieden); eine Karte kann einzelne Felder mit `propVariants` festlegen (content:check prüft die Modell-Id
  # gegen diese Listen). Modelle, die das Manifest (public/assets/manifest.json models.props) noch nicht kennt, fallen weg; bleibt keines übrig,
  # gilt das erste der Liste. Zustände (besucht, zerstört) hängt das Brett an das Modell der Liste: `lodge_intact` -> `lodge_visited`.
  variants:
    # Kulissenhäuser (Terrain building, nicht besuchbar): vier Häuser
    house: [{ model: house_intact, weight: 3 }, { model: house_b_intact, weight: 2 }, { model: house_c_intact, weight: 2 }, { model: house_d_intact, weight: 2 }]
    # Besuchshaus (Terrain village, Objekt village): eigenes, deutlich anderes Modell mit den Zuständen intact, visited, razed
    lodge: [{ model: lodge_intact, weight: 1 }]
    # Felsen (Terrain mountain, rock, rockwall)
    rock: [{ model: rock_idle, weight: 4 }, { model: rock_b, weight: 2 }, { model: rock_c, weight: 2 }]
    # Bäume je Akt: 1 Spätsommer, 2 Herbst, 3 Winter; ein Akt ohne Eintrag nimmt die Bäume des Akts 1
    tree:
      1: [{ model: tree_a, weight: 3 }, { model: tree_b, weight: 3 }, { model: tree_c, weight: 2 }, { model: tree_d, weight: 2 }, { model: tree_e, weight: 2 }]
      2: [{ model: autumn_a, weight: 4 }, { model: autumn_b, weight: 4 }, { model: autumn_c, weight: 3 }, { model: tree_c, weight: 1 }]
      3: [{ model: snowfir_a, weight: 5 }, { model: snowfir_b, weight: 4 }, { model: tree_c, weight: 1 }]
  # Ersatzmodell, solange ein Modell noch nicht gebaut ist (Manifest kennt es nicht): sonst bliebe das Feld leer (Besuchshaus -> Haus, Brunnen -> Fels)
  propFallback: { well_idle: rock_idle, lodge_intact: house_intact, lodge_visited: house_visited, lodge_razed: house_razed }
  # Ziel markieren (Tipp auf ein Nebenziel im HUD): so lange (ms) stehen die Markierungen der offenen Ziel-Orte, ein zweiter Tipp nimmt sie früher weg
  markMs: 4000
  # Niedrige Deko auf freien Gras-/Flachlandfeldern ohne Requisite, Objekt, Einheit oder Aufstellfeld: Wahrscheinlichkeit je Feld
  # auf der Karte (map) und in der Landschaft darum (scenery), Größenbereich; Bäume wählt die Jahreszeit des Akts (trees)
  decor:
    bushes: { model: bush_a, map: 0.05, scenery: 0.1, scale: [0.7, 0.95] }
    stones: { model: rocks_small, map: 0.04, scenery: 0.07, scale: [0.75, 1.1] }
  fpsActive: 60                           # D8: Bildrate, solange sich etwas bewegt (auch auf 120-Hz-Displays)
  fpsIdle: 30                             # Bildrate in Ruhe (nur Idle-Animationen, Wasser, Feuer): spart Akku
  idleHz: 10                              # Story 7.7: Skelett-Rate der Figuren, die nichts tun (Idle, gefallen); wer geht, kämpft oder getroffen wird, läuft mit voller Bildrate
  vat: true                               # Story 7.8: Figuren mit .vat-Datei (Bild-zu-3D) laufen als gebackene Vertex-Animation statt als Skelett; false = Skelettpfad (Messvergleich)
  warm: 2                                 # Story 7.8: wie viel beim Laden vorgewärmt wird: 0 = nur Vorkompilieren, 1 = + Blitz-/Verblass-Varianten und Requisiten-Zwillinge, 2 = + Aufwärm-Zeichnen
  tintPool: 24                            # Story 7.8: so viele Blitz-/Verblassen-Materialien je (Textur, Fall) bleiben für die nächsten Treffer erhalten, statt je Treffer neu erzeugt zu werden
  precompileMs: 8000                      # Story 7.7: so lange wartet das Brett beim Laden höchstens auf das Vorkompilieren der Shader
  figureScale: 1.3                        # D4: 3D-Figuren gegenüber dem Blender-Maßstab, damit sie wie die Sprites ~80 % eines Felds füllen
  # Story 8.10: Requisiten vor oder auf dem Feld einer Einheit werden halbdurchsichtig. alpha = Deckkraft der verblassten
  # Requisite, cover = so viele Felder der Figurenhöhe muss sie verdecken (aus Kameraneigung und Modellmaßen berechnet),
  # figureWidth = halbe Breite der Figur in Feldern für die seitliche Überdeckung
  fade: { alpha: 0.35, cover: 0.2, figureWidth: 0.3 }

# Story 8.6: Licht und Wetter (Art Direction §2.1, §2.4, §2.5, §8). Startwerte [C], am Bildschirm eingestellt.
# Eine Karte ohne timeOfDay und weather sieht aus wie bisher; Farben als Hex.
look:
  # Teamfarben §2.1: ui = Bodenring und Markierungsfarbe, ramp = Tuch dunkel -> hell (K0..K3); das Tuch ist ungelit
  teams:
    player: { ui: "#2F64C8", ramp: ["#1E3F86", "#2F64C8", "#5C8EE6", "#A9C6F4"] }
    enemy:  { ui: "#B83A2E", ramp: ["#7A2219", "#B83A2E", "#DB6A5C", "#F2B2A8"] }
    other:  { ui: "#3FA65A", ramp: ["#25693A", "#3FA65A", "#74C98A", "#BFE6C9"] }
  # Markierung der Ziel-Orte (Art Direction: ungelit, nie Glutorange, nie Teamfarbe): heller Ring mit dunkler Kontur auf Feldhöhe (radius = Außenradius in Feldern, width = Ringbreite,
  # outlineWidth = Kontur auf beiden Seiten) und ein Pfeil darüber (chevronHeight über dem Feld, chevronSize = Breite, bobTiles = Auf und Ab); pulse = Atmen der Deckkraft
  marker: { color: "#fbf3d4", outline: "#2a2140", alpha: 0.95, pulse: 0.1, radius: 0.65, width: 0.15, outlineWidth: 0.06, chevronHeight: 1.45, chevronSize: 0.7, bobTiles: 0.12 }
  # Helligkeit einer Figur am Mittag (Anteil ihrer Grundfarbe), auf die sich figureFloor bezieht: Untergrenze = figureFloor * figureReference * Grundfarbe
  figureReference: 0.85
  # Grau der neutralen Textur unter dem Teamtuch der Bild-zu-3D-Figuren (tools/art/prepare_tripo_unit.py CLOTH_GREY)
  clothGrey: 0.85
  # Tuchschluessel K0..K3 der Figuren -> Stufe der Teamrampe (Entscheidung 2026-10-26): die Bild-zu-3D-Figuren tragen K2, das Tuch soll aber in der UI-Farbe (K1) stehen wie der Ring
  clothSteps: [0, 1, 1, 3]
  # Tageszeit: Basis fuer ambient und sun; ambient/sun der Karte ueberschreiben sie Feld fuer Feld (nach der Jahreszeit).
  # azimuthDeg: 0 = Norden (+Z), 90 = Osten; sky = Himmel (Szenenhintergrund); figureFloor = Untergrenze der Figuren (§2.5, nicht der Landschaft);
  # rim = Randlicht der Figuren (strength 0 = aus); pointBoost = Faktor auf die Punktlichter (Karten-lights und Feuer)
  timeOfDay:
    morning: { ambient: { color: "#dce6f4", intensity: 0.95 }, sun: { color: "#cfe0ff", intensity: 1.0,  azimuthDeg: 90,  elevationDeg: 20 }, sky: "#a9c4e8", figureFloor: 0.85, rim: { color: "#ffffff", strength: 0 }, pointBoost: 1.0 }
    noon:    { ambient: { color: "#fff6e6", intensity: 0.75 }, sun: { color: "#fff4e0", intensity: 0.8,  azimuthDeg: 180, elevationDeg: 68 }, sky: "#8fc0ee", figureFloor: 1.0,  rim: { color: "#ffffff", strength: 0 }, pointBoost: 1.0 }
    evening: { ambient: { color: "#e6c9c4", intensity: 0.95 }, sun: { color: "#ff9a50", intensity: 1.2,  azimuthDeg: 270, elevationDeg: 14 }, sky: "#7b5f9e", figureFloor: 0.8,  rim: { color: "#ffffff", strength: 0 }, pointBoost: 1.0 }
    night:   { ambient: { color: "#3a4a7a", intensity: 0.45 }, sun: { color: "#9fb4ff", intensity: 0.4,  azimuthDeg: 120, elevationDeg: 40 }, sky: "#0f1428", figureFloor: 0.6,  rim: { color: "#8fb0ff", strength: 0.35 }, pointBoost: 1.5 }
  # Wetter: acts = Akte, in denen es vorkommt (content:check meldet andere als Fehler); grade = Licht/Himmel (gilt auf allen Stufen):
  # ambientScale * Umgebungsstaerke, der Himmel nimmt den Farbton von sky zu skyMix an und behaelt die Helligkeit der Tageszeit.
  # particles = Zahl je Qualitaetsstufe (low 0, mid die Haelfte von high), wet = Glanz des Bodens (auch auf low), puddles nicht auf low,
  # mist = Szenennebel (auch auf low; near/far = Tiefe in Feldern um den Kamerapunkt), ground = Bodennebel-Ebenen (nicht auf low)
  weather:
    clear: { acts: [1, 2, 3] }
    rain:
      acts: [1, 2]
      grade: { ambientScale: 0.9, sky: "#8b98a8", skyMix: 0.6 }
      particles: { high: 600, mid: 300, low: 0, fallSpeed: 14, size: 0.02, length: 0.5, color: "#cfe3f5", alpha: 0.5 }
      wet: { specular: 0.3, power: 28 }
      puddles: { count: 0, alpha: 0.4, color: "#9fb4c8" }
    fog:
      acts: [1, 2]
      grade: { ambientScale: 0.95, sky: "#c4cdd2", skyMix: 0.6 }
      mist: { color: "#c9d2d8", near: -4, far: 16 }
      ground: { layers: 1, height: 0.22, alpha: 0.28, driftSpeed: 0.05, color: "#dfe5e8" }
    ash:
      acts: [1, 3]
      grade: { ambientScale: 0.92, sky: "#8d8a90", skyMix: 0.5 }
      particles: { high: 260, mid: 130, low: 0, fallSpeed: 0.9, size: 0.1, color: "#5b5a5e", alpha: 0.9, emberShare: 0.1 }
    snow:
      acts: [3]
      grade: { ambientScale: 1.0, sky: "#cfd8e4", skyMix: 0.5 }
      particles: { high: 320, mid: 160, low: 0, fallSpeed: 1.1, size: 0.11, color: "#ffffff", alpha: 0.95 }
  # Jahreszeit je Akt (§2.4), ueber jeder Tageszeit (nur mit timeOfDay): tint wird zu strength in Licht und Himmel gemischt,
  # sunElevationOffsetDeg verschiebt die Sonnenhoehe (Sommer hoeher, Winter flacher)
  season:
    1: { tint: "#ffd89a", strength: 0.12, sunElevationOffsetDeg: 6 }   # Spaetsommer: warm-golden
    2: { tint: "#f0a870", strength: 0.1,  sunElevationOffsetDeg: 0 }   # Herbst
    3: { tint: "#d8e6ff", strength: 0.12, sunElevationOffsetDeg: -8 }  # Winter
  # Effekte, Zeiten in ms bei 1x (bei 2x und in der Gegnerphase durch die Geschwindigkeit geteilt)
  fx:
    # Krit: Band gleitet ein (cutInInMs), steht (cutInHoldMs, bis zum Treffer), gleitet aus (cutInOutMs, ab dem Treffer, laeuft in den Freeze);
    # Freeze (freezeMs: Figuren und Effekte stehen), dann Stern, Wackeln (shakeMs, Staerke shake), Rueckstoss des Ziels (recoilMs),
    # Rueckweg (returnMs), Pause (settleMs). Summe = Treffer + freeze + recoil + return + settle <= 600 (Test)
    crit: { cutInInMs: 120, cutInHoldMs: 130, cutInOutMs: 60, freezeMs: 80, shakeMs: 140, shake: 0.12, recoilMs: 120, returnMs: 70, settleMs: 30, numberScale: 2 }
    # Tod in Asche: Flockenstoss ashMs, Verblassen fadeMs nach oben (rise Felder), kurzes Wackeln; flakes = Zahl Aschenflocken je Qualitaet, embers davon Glutpunkte
    death: { ashMs: 560, fadeMs: 500, rise: 0.35, shakeMs: 100, shake: 0.06, flakes: { high: 40, mid: 24, low: 12 }, embers: 6, colour: "#5b5a5e", emberColour: "#ff9a3c" }
    # Statussymbol ueber der Figur: Ein-/Ausblenden und Kantenlaenge in CSS-px
    # feet = Sprite-Effekt (art/fx) am Fuss der Figur, wenn der Status eintritt (§8: Flamme, Tropfen, Erdklumpen)
    status: { fadeMs: 150, sizePx: 24, feet: { burning: flame, wet: water_burst, slowed: earth_spikes } }

# Epic 13 „Kampf lesbar machen“ (EXPERIENCE.md, DESIGN.md hp-bar/grid-mark/range-tile/threat/kill-marker). Ungelit, Farben aus DESIGN.md.
# Längen in Feldern, wo nicht anders genannt. Startwerte [C], am Bildschirm eingestellt (Prolog auf dem iPhone-13-Profil).
legibility:
  # Story 13.1: Raster. subtle = Creme-Kreuze an den Feldecken (arm = Armlänge, width = Strichbreite), strong = feine Linien rund um jedes Feld
  grid:
    color: "#FFF8EC"
    subtle: { alpha: 0.55, arm: 0.12, width: 0.03 }
    strong: { alpha: 0.4, width: 0.022 }
  # Story 13.2: Bereiche als Einzelkacheln (gap = Lücke zwischen zwei Kacheln, corner = Eckradius) mit gemeinsamer Außenkante
  # (Creme unter Teamblau: cream = Breite der Creme-Kante, edge = Breite der blauen darüber), Weg als runder Pfeil
  range:
    gap: 0.06
    corner: 0.14
    move: { color: "#2F64C8", alpha: 0.42 }
    attack: { color: "#B83A2E", alpha: 0.36 }
    heal: { color: "#2F8A4C", alpha: 0.38 }
    cream: "#FFF8EC"
    edge: { cream: 0.085, line: 0.045 }
  path: { color: "#2F64C8", cream: "#FFF8EC", width: 0.17, outline: 0.05, head: 0.42, headLength: 0.36 }
  # Story 13.5: Gefahrenzone in drei Stufen (1 / 2 / 3+ Gegner), rote Außenkante auf Creme, Zahl im Creme-Kreis ab countFrom Angreifern;
  # sleeping = gestrichelte Kante schlafender Gegner (dash/gap Strichlänge), watch = Kante eines einzelnen Gegners (Langdruck) in dunklerem Rot
  threat:
    color: "#B83A2E"
    alpha: [0.14, 0.26, 0.4]
    edge: { cream: 0.08, line: 0.045 }
    countFrom: 2
    countSize: 0.5
    sleeping: { color: "#B83A2E", width: 0.05, dash: 0.22, gap: 0.14 }
    watch: { color: "#7A2219", cream: 0.1, line: 0.06 }
  # Story 13.6: gestrichelte Linien von den Gegnern, die das Zielfeld erreichen
  lines: { color: "#B83A2E", cream: "#FFF8EC", width: 0.06, dash: 0.24, gap: 0.16 }
  # Story 13.3: Lebensleiste über dem Kopf. tick = Teilstrich je so viele TP, ab wideFrom max. TP je tickWide; critical = Anteil der max. TP,
  # unter dem der Glutrand pulsiert; Breite = widthTiles Felder, begrenzt auf minPx..maxPx CSS-px; heightPx = Höhe; lift = Höhe über dem Feld (Felder)
  hpBar: { tick: 5, tickWide: 10, wideFrom: 40, critical: 0.25, widthTiles: 0.8, minPx: 24, maxPx: 54, heightPx: 8, lift: 1.0 }
  # Story 13.9: Zoomstufe „ganze Karte“ (Rand in Feldern um die Karte) und die Zeit, in der zwei Tipps als Doppeltipp zählen
  view: { wholeMapMargin: 1 }
  doubleTapMs: 300

# GA9 (concept/23-art-direction §4.2): sichtbares Waffenteil je Waffengruppe der ausgerüsteten Waffe bzw. je Art des
# Gegenstands in der Nebenhand. model = art/models/weapons/<model>.glb (tools/art/blender_weapons.py), hand = Hand-Sockel
# der Figur, motion = eigene Angriffsanimation attack_<motion> (§4.5; ohne: der Schwerthieb), hold = Drehung in Grad um die
# X-Achse des Sockels außerhalb des Angriffs (das Modell ist im Angriffsgriff gebaut). Nur Bild-zu-3D-Figuren haben
# Sockel; die Blender-Figuren tragen ihre Waffe fest im Modell.
gear:
  weapons:
    sword: { model: sword, hand: right }
    dagger: { model: dagger, hand: right }   # ohne eigene Bewegung: der Schwerthieb (ein Dolchstich ist noch nicht animiert)
    lance: { model: lance, hand: right, motion: thrust, hold: -125 }
    axe: { model: axe, hand: right, motion: chop }
    bow: { model: bow, hand: left, motion: shoot }
    anima: { model: book, hand: left, motion: cast }
    light: { model: book, hand: left, motion: cast }
    dark: { model: book, hand: left, motion: cast }
    staff: { model: staff, hand: right, motion: cast }
  offHand:
    shield: { model: shield, hand: left }
    lute: { model: lute, hand: left }   # nach Waffengruppe des Gegenstands (Nebenhand), nicht nach kind: Laute und Fokus sind beide Zubehör

# D8: Qualitätsstufen. maxDpr = höchste Pixeldichte der Render-Auflösung, shadowMap = Kantenlänge der Schattenkarte (0 = keine Schatten)
quality:
  high: { maxDpr: 2.5, shadowMap: 2048 }
  mid: { maxDpr: 1.5, shadowMap: 1024 }
  low: { maxDpr: 1, shadowMap: 0 }

# Story 5.1: geteilter Asset-Cache des Szenen-Hosts. keepUnused = so viele Modelle/Texturen, die gerade keine Szene
# benutzt, bleiben geladen (ein Szenenwechsel lädt nichts neu); darüber fallen die am längsten unbenutzten weg.
assets:
  keepUnused: 80

# Story 5.2: flache Weltkarte (concept/23-art-direction §6): das gemalte Bild `art/world/map_flat_v1.png` mit den Orten darauf.
# zoomSteps = Breite des Bildes als Vielfaches der Bildschirmbreite (Übersicht, Nah); focusZoom = so viel näher beim Tipp auf einen Ort.
worldMap:
  zoomSteps: [1.6, 2.4]
  zoomMs: 260
  focusZoom: 1.12
