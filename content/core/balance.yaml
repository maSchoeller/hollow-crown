# Startwerte [C] – alle Konstanten des Regelkerns. Siehe concept/03, 04, 05, 07.
# Quelle: concept/data-samples/balance.yaml, ergänzt um statusOf, rally, bag, ai, rarity*.
combat:
  hitPerSkl: 2
  hitPerLckDivisor: 2
  avoidPerAs: 2
  critPerSklDivisor: 2
  critMultiplier: 3
  doubleAttackThreshold: 4
  effectiveMightMultiplier: 3
  twoRnHit: true
triangle:
  hit: 15
  damage: 1
  beats: { sword: axe, axe: lance, lance: sword }
element:
  cycle: { fire: wind, wind: earth, earth: water, water: fire }   # Schlüssel schlägt Wert
  opposed: [[light, dark]]
  advantage: 1.2
  disadvantage: 0.8
  sameElement: 0.8
  maxBonusPercent: 40
  lightEffectiveVs: [monster, undead]
  darkBonusVs: [holy]
  statusOf: { fire: burning, water: wet, earth: slowed, wind: knockback }
status:
  durationRounds: 2
  burnPercentMaxHp: 10
  wetSpdPenalty: 3
  slowMovPenalty: 1
  knockbackBlockedDamage: 2
  rune2StatusChance: 30
  rune3StatusChance: 50
terrainEffects:
  burningDuration: 2
  burningEnterDamage: 5
  burningSpreadChance: 25
  rockwallDuration: 2
  windFogClearRadius: 2
weight:
  carryBonus: { foot: 4, armored: 8, mounted: 6, flier: 2, monster: 10 }
  movPenalty: [{ overload: 5, mov: 1 }, { overload: 10, mov: 2 }]
supports:
  thresholds: { C: 10, B: 25, A: 45, S: 70 }
  adjacencyBonus:
    C: { hit: 5 }
    B: { hit: 5, avoid: 5 }
    A: { hit: 10, avoid: 10 }
    S: { hit: 15, avoid: 10, crit: 5 }
  adjacencyBonusCap: { hit: 20, avoid: 20 }
  pointsAdjacentEnd: 1
  pointsTandemHealRescue: 2
  tandemMinRank: B
  tandemDamagePercent: 50
  guardChance: { A: 20, S: 30 }
  griefHitPenalty: 10
  griefMissions: 3
  # highest rank the campfire unlocks, by its level (story 4.9): the camp of act 1 = level 1 → C and B; A and S come with the castle (Epic 10)
  campfireMaxRank: [B, A, S]
  # fixed pairs of the season and how many of them reach S (GDD Supports, narrative "Die 25 Support-Paare")
  seasonPairs: 25
  corePairs: 6
experience:
  levelUpAt: 100
  advancedLevelOffset: 15
  combatBase: 10
  combatMin: 1
  combatMax: 30
  killBase: 30
  killPerLevelDiff: 3
  killMin: 10
  killMax: 100
  bossBonus: 20
  heal: 12
  healExtraTarget: 3
  rescueOrTalk: 10
growth:
  smoothingLower: 1.0
  smoothingUpper: 1.5
  minOneStatPerLevel: true
levels:
  max: 20
  promoteFrom: 10
skills:
  spPerCombat: 1
  spPerMissionEnd: 5
  loadoutBase: 4
  loadoutAdvanced: 5
death:
  scarsUntilInstantDeath: 2
  # own phases a downed unit lasts in Standard before it dies (GDD: 3; 01-decisions O2 is settled by GDD/epic 1.6)
  bleedOutTurns: 3
# scenes (story 4.5): auto mode waits autoBaseMs + autoPerCharMs per character; a speech bubble in battle waits
# bubbleAutoMs (UX: 2.5 s) and holds at most bubbleMaxChars characters per page (two lines)
# Tageswechsel (Story 5.4, architecture §5.6): neuer Tag um resetHour Uhr Ortszeit; wer länger weg war, bekommt höchstens
# catchUp Tagespakete nach (zurückgestellte Uhr bringt nichts)
day:
  resetHour: 4
  catchUp: 3
# Heimsuchungen (Story 5.5, Architektur §5.6): Wiederkehr-Aufgaben auf bekannten Story-Karten gegen Leutnants. Startwerte [C].
# perDay: Heimsuchungen je Tagespaket; maxOpen: mehr offene -> die älteste verfällt; extraEnemies: Gegner = Plätze + 2 inkl. Leutnant
# (leicht -1, schwer +1); goldPct/expPct: Belohnung in % der Story-Karte, catchUpExpPct: EP-Anteil über der erwarteten Stufe;
# halveFromNth: ab der n-ten Heimsuchung seit der letzten Story-Mission halbe Belohnung; material: Akt-Material je Heimsuchung (Story 5.6)
haunt:
  perDay: { min: 1, max: 3 }
  maxOpen: 6
  extraEnemies: 2
  goldPct: 40
  expPct: 60
  catchUpExpPct: 50
  halveFromNth: 4
  material: { min: 1, max: 2 }
  # Gegner warten (Profil trigger), bis die Truppe so nah kommt (Story-Karten: 3-5); der Leutnant hat seinen eigenen Radius [C]
  triggerRadius: { enemy: 4, lieutenant: 5 }
scene:
  autoBaseMs: 1200
  autoPerCharMs: 45
  typeCharsPerTick: 2
  typeTickMs: 16
  bubbleAutoMs: 2500
  bubbleMaxChars: 56
# chronicle (story 4.7): pages of the whole season, 4 per act (narrative "Found Documents")
chronicle:
  seasonPages: 12
# farewell card after a death (story 6.7, UX: the first 2 s cannot be skipped)
farewell:
  lockMs: 2000
# chained act simulation (story 6.8, pnpm sim --campaign act1): what it checks each story mission against
simulation:
  # GDD Figurensystem: effektive Armee-Stufe = Durchschnitt der 6 stärksten
  armySize: 6
  # Abweichung der Armee-Stufe von expectedLevel des Knotens, ab der die Simulation markiert
  levelTolerance: 1
  # NFR12: Sieg-Anteil und Niedergestreckte je Lauf (erster Versuch)
  corridors:
    easy: { winMin: 0.95, downsMax: 0.5 }
    normal: { winMin: 0.75, winMax: 1.0, downsMin: 0.4, downsMax: 1.3 }
    hard: { winMin: 0.30, winMax: 0.70 }
  # GDD Wirtschaft: Gold je Story-Mission ohne Nebenziele (Prolog 300, Akt 1 800–1 500); Nebenziele +30–50 %
  gold:
    perNode: { prologue: [300, 300] }
    perAct: { '1': [800, 1500], '2': [2000, 3000], '3': [3000, 4500] }
    sideShare: [0.3, 0.5]
# loading before missions (story 7.6): a download that stays silent this long counts as failed (shows the retry)
loading:
  fetchTimeoutMs: 30000
  # Akt-Pakete im Hintergrund (Story 7.2): Pause vor dem n-ten neuen Versuch = base · 2^(n−1), höchstens max
  packRetryBaseMs: 2000
  packRetryMaxMs: 60000
rally: { radius: 2, damage: 2, hit: 10 }
# Klassen-Aktionen (Story 2.3): Zielen = ohne Bewegung angreifen, Fernbergen = Niedergestreckte auf bis zu range Feldern, Anfeuern = Nachbar bis Zugende
# Halten (Story 2.4): die KI umgeht eine Haltezone, wenn der Umweg in Bewegungskosten höchstens detourMax länger ist als der kürzeste Weg ohne Rücksicht auf Haltezonen
classActions:
  aim: { rangeBonus: 1, hit: 15 }
  farRescue: { range: 2 }
  cheer: { mov: 1, hit: 10 }
  hold: { detourMax: 2 }
  # Wirken (Story 2.5): Reichweite = Waffenreichweite der Zauberwaffe; Brand-/Wall-Dauer in terrainEffects; waterRadius = Löschradius um das Zielfeld, fogDuration = Runden, die Wind den Nebel lichtet (Radius windFogClearRadius)
  cast: { waterRadius: 1, fogDuration: 2 }
bag: { size: 3 }
# Nebel (Story 2.6): Sicht = Manhattan-Radius um jede eigene (und verbündete) Einheit mit Sichtlinie; baseVision + höchster Bonus
# (Boni stapeln nicht): roleBonus nach Klassenrolle, moveTypeBonus nach Bewegungsart. blockers = Gelände, hinter dem die Sicht endet
# (das Feld selbst bleibt sichtbar). Die Gegner-KI sieht alles; der Nebel gilt nur für Brett, UI, Vorschau und abgespielte Events der Spielerseite.
fog:
  baseVision: 3
  roleBonus: { marksman: 2, scout: 2 }
  moveTypeBonus: { flier: 1 }
  blockers: [wall, door, rockwall]
economy:
  sellRatio: 0.5
  upgradeCost:
    - { level: 1, gold: 300,  materials: { iron_ore: 2 } }
    - { level: 2, gold: 600,  materials: { iron_ore: 3 } }
    - { level: 3, gold: 1000, materials: { moonsteel: 2 } }
    - { level: 4, gold: 1600, materials: { moonsteel: 3 } }
    - { level: 5, gold: 2500, materials: { dragon_scale: 1 } }
  upgradePerLevel: { weaponMight: 1, weaponHit: 3, armorDefOrRes: 1 }
  rerollAffix: { gold: 500, arcane_dust: 2, epicGold: 800, epicArcaneDust: 3 }
  runeMerge: { count: 3, goldPerTier: 200 }
  recruitCost: { base: 600, perLevel: 150 }
  scarRemoval: { gold: 2500, altItem: seers_herb }
  potionUpgrade: [{ gold: 400, heal: 5 }, { gold: 900, heal: 5 }]
  villageAid: { healCharges: 1 }           # Wirkung villageAid (E1 Dorfhilfe): +1 Ladung je Heiltrank (use.heal) bis zum Ende des Akts
  tavernOffersPerChapter: 3
  armyLimit: 20
  mercenaryLimit: 6                      # zusätzlich zu den 20 Gefährten (GDD Armee-Limit)
  smithMaxUpgrade: [3, 4, 5]             # höchste Aufwertung je Schmied-Stufe (Lager = Stufe 1)
  rerollFromSmithLevel: 3                # Affix neu würfeln ab Schmied-Stufe
  tavern:
    levelSpread: 1                       # Angebotsstufe = erwartete Stufe der nächsten Mission minus 0..spread
    names: [merc.name.1, merc.name.2, merc.name.3, merc.name.4, merc.name.5, merc.name.6, merc.name.7, merc.name.8, merc.name.9, merc.name.10, merc.name.11, merc.name.12]
    classes:
      - { class: skirmisher, items: [iron_sword, leather_vest] }
      - { class: vanguard,   items: [iron_lance, leather_vest] }
      - { class: vanguard,   items: [iron_axe, leather_cap] }
      - { class: marksman,    items: [iron_bow, leather_vest] }
      - { class: elementalist,      items: [ember], requires: [{ storyCount: { min: 3 } }] }       # ab der 3. Story-Mission (wie bisher nach Kapitel 1)
      - { class: healer,    items: [heal_staff], requires: [{ storyCount: { min: 3 } }] }
  convoySize: 200
  rarityAffixes: { common: 0, rare: 1, epic: 2, legendary: 0 }
  rarityRuneSlots: { common: 1, rare: 2, epic: 2, legendary: 2 }
difficulty:
  easy:   { enemyStatPercent: -15, aiFinishDowned: never,    enemyAffixes: false }
  normal: { enemyStatPercent: 0,   aiFinishDowned: fallback, enemyAffixes: false }
  hard:   { enemyStatPercent: 15,  aiFinishDowned: prefer,   enemyAffixes: true, aiDangerAware: true, ambushReinforcements: true }
ai:
  killChanceWeight: 50
  counterWeight: 0.5
  healerBonus: 10
  lowestHpBonus: 5
  objectiveBonus: 30
  dangerPerAttacker: 5
  supportHealBelowPercent: 70
  selfHealBelowPercent: 40
  grudgeTargetBonus: 20
  # Wirken der gegnerischen Elementaristen (Story 2.5): Spieler-Einheiten minus eigene im Brand-Ausbreitungsbereich (mindestens), Felswall nur bei mindestens so viel längerem Spielerweg zum Ziel, kein Wirken bei Kill-Chance des besten Angriffs ab so viel Prozent
  castMinTargets: 2
  castWallDetour: 3
  castLethalChance: 100
  # Profil „follow“ (Story 4.8, Eskorte-NPC): wartet, bis ein Spieler höchstens so viele Felder entfernt ist, bleibt beim Ziehen in diesem Abstand zu einem Spieler; ein bedrohtes Feld kostet so viele Wegpunkte je Gegner
  followRadius: 4
  wardGuardRadius: 8     # Autoplay (Simulation): bei defend trifft die Truppe Gegner innerhalb dieses Abstands vom Schutzbefohlenen, statt Besuche zu erledigen
  followDanger: 100
# Leutnants (Story 3.4): Stufe = kaufmännisch gerundeter Durchschnitt der effektiven Stufen der armySize stärksten Einheiten der Truppe + Groll;
# Waffe(n) der Karteneinheit je Groll eine Stufe höher entlang tierUp (gleiche Waffengruppe, Eintrag fehlt = Deckel); die Signaturwaffe trägt er nie.
# Leutnants (Story 3.5): Kopfgeld je Vertreibung = goldPerLevel x (Groll vor dieser Vertreibung + 1) Gold + min..max Material des Akts;
# Signatur-Item mit chance je Vertreibung, garantiert ab der guaranteedRout-ten, je Leutnant nur einmal. materialByAct: Akt -> Material-ID.
lieutenant:
  grudge: { max: 3 }   # Groll 0-3; je Stufe eine Groll-Fähigkeit und eine Zeile grudge_<n> (content:check prüft)
  scaling:
    armySize: 6
    tierUp: { iron_sword: steel_sword, iron_lance: steel_lance, iron_axe: steel_axe, iron_bow: steel_bow }
  bounty:
    goldPerLevel: 200
    materials: { min: 1, max: 2 }
    materialByAct: { 1: iron_ore }
  signature: { chance: 0.1, guaranteedRout: 4 }
