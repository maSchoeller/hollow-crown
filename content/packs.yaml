# Content- und Asset-Pakete (concept/24-architecture/architecture.md §5.14, Story 7.1).
#
# Eine Datei gehört zum ersten Paket, dessen Globs passen; was kein Paket nennt, gehört zu core.
#   content: Pfade relativ zu content/ (YAML), werden zum virtuellen Modul virtual:hc-pack/<id>
#   assets:  Pfade relativ zu public/assets/ (Ausgabe von pnpm art:build)
# Nur Pakete mit released: true kommen in den Build; Dateien unveröffentlichter Pakete fehlen dort ganz.
# load: precache = Service Worker beim Installieren; background = direkt nach dem Start, sobald der Akt erreicht ist;
#       voice = nur die gewählte Sprache, nach dem Akt-Paket.
# budgetMb: Transfergröße (gzip, Bilder und Audio wie sie sind); core bricht den Build ab, die übrigen warnen.
# Budget je Brettfigur (art-direction §4.6), geprüft von tools/figure-budget.mjs (Build und pnpm art:tripo): zu große
# Figuren erscheinen als Warnung, der Build bricht nicht ab. triangles = Dreiecke, texture = Kantenlänge der Grundfarb-
# Textur in Pixeln, transferMb = Transfergröße (gzip). large = Ids großer Einheiten (Reittiere, Drachen), die das
# largeFactor-Fache dürfen; bisher gibt es keine.
# Erwartete Größe des ersten Downloads (Paket core, Transfer) in MB: darüber warnt tools/check-bundle-size.mjs (das Budget des Pakets bricht ab). 12 MB seit 2026-10-27 (vorher 11): der Precache enthält die .vat-Dateien der ersten Mission (Story 7.8)
firstDownloadTargetMb: 12

figureBudget:
  triangles: 7000
  texture: 512
  transferMb: 0.5
  largeFactor: 2
  large: []

packs:
  - id: core
    released: true
    load: precache
    act: 1
    # 30 MB seit 2026-10-25 (vorher 15): der Precache enthält auch die Dateien der ersten Mission, damit eine neue Kampagne offline startet
    budgetMb: 30
    content:
      - core/**
      - world/**
      - home/**
      - acts/act1/campaign.yaml
      - acts/act1/units.yaml
      - acts/act1/flags.yaml
      # Support-Paare und Chronik gelten über den ganzen Akt (Lager, Weltkarte), nicht nur in Missionen
      - acts/act1/supports.yaml
      - acts/act1/chronicle.yaml
      # die Gedächtnishalle der Burg zeigt die festen Steine sofort, nicht erst wenn act1 im Hintergrund da ist
      - acts/act1/memorials.yaml
      - locales/en/act1.memorials.yaml
      - acts/act1/maps/prologue_*.yaml
      - acts/act1/scenes/scn.prologue.*.yaml
      # enthält auch die englischen Prolog-Zeilen; ohne sie zeigte der Prolog auf Englisch nur Schlüssel
      - locales/en/act1.dialogue.yaml
    # Hintergrund von Titel und Kampagnen-Liste; sonst stünde der erste Start grau da, bis act1 geladen ist
    # Figuren des Prologs (Story 8.2): tools/art/model_packs.py legt jedes Einheitenmodell unter <Paket>/models/units/ ab
    assets:
      - locations/lager_unterwegs.webp
      # Titelbild (art/title/title_act1.png, Story 8.7): der Titel wird beim Start gebraucht
      - title/title_act1.webp
      - core/**

  - id: act1
    released: true
    load: background
    act: 1
    budgetMb: 40
    content:
      - acts/act1/**
      - locales/*/act1.*
    # Requisiten-Modelle (art/models/props/<prop>_<zustand>.glb), die erst mit diesem Paket kommen und nicht in den ersten Download gehören:
    # Dateinamen ohne .glb. Alle Requisiten, die kein Paket nennt, gelten als core (Vorab-Cache der ersten Mission, tools/build/first-mission.mjs).
    # Die Dateien liegen weiter unter models/props/ (das Brett lädt sie von dort, bei Bedarf); fehlt eine, lässt das Brett das Feld leer
    # bzw. nimmt propFallback aus render.yaml. Zuordnung: tools/art/model_packs.py `prop_packs`.
    props:
      - house_b_intact
      - house_c_intact
      - house_d_intact
      - lodge_intact
      - lodge_visited
      - lodge_razed
      - tree_d
      - tree_e
      - autumn_a
      - autumn_b
      - autumn_c
      - snowfir_a
      - snowfir_b
      # Story 15.15: Jahreszeit-Modelle (Waldfeld Herbst und Winter, Schneehauben von Mauer und Turm), erst ab Akt 2 gebraucht
      - grove_autumn_a
      - grove_snow_a
      # Story 15.16: je zwei weitere Waldfelder für Herbst und Winter, der verschneite Busch (Deko im Winter)
      - grove_autumn_b
      - grove_autumn_c
      - grove_snow_b
      - grove_snow_c
      - bush_snow_a
      - snowcap_wall_idle
      - snowcap_tower_idle
      - rock_b
      - rock_c
      - massif_c
      - gatehouse_closed
      - ramp_idle
      - ladder_idle
      - well_idle
      - fence_gate
      - grove_c
      - lodge_b_intact
      - lodge_b_visited
      - lodge_b_razed
      - field_open
      - reed_a
      - reed_b
      - lily_a
      - tussock_a
      - boardwalk_straight
      - boardwalk_corner
      - boardwalk_end
      - relief_a
      - sarcophagus_a
      - lever_up
      - lever_down
      - ballista_idle
      - torch_idle
      - roof_tile_idle
      # Story 15.8: Galerie-Modelle, die die Karten von Akt 1 brauchen (Marktstände 1-1, Lagerzelt 1-5, Mühle N3)
      - market_a
      - market_b
      - camp_tent_a
      - mill_idle
      # das alte Zelt zeichnet seit Story 15.8 kein Gelände mehr (Stand = Marktstand bzw. Lagerzelt): nicht mehr im ersten Download
      - tent_idle
    # bisher bei Bedarf geladen (Story 7.6): Orte, Halbfiguren, Weltkarte, Sprites, Item-Bilder, Modelle, Musik ohne Titel
    assets:
      - act1/**
      # Story 15.15: Boden von Herbst und Winter, erst ab Akt 2 gebraucht (das Brett lädt nur die Texturen der gezeigten Jahreszeit)
      - ground/grass_autumn.png
      - ground/snow.png
      - ground/dirt_frozen.png
      - ground/road_snow.png
      - locations/**
      - busts/**
      - halves/**
      - world/**
      - sprites/**
      - items/**
      - models/**
      - audio/battle_player.*
      - audio/battle_enemy.*
      - audio/camp.*
      - audio/worldmap.*

  - id: voice.act1.de
    released: false
    load: voice
    act: 1
    lang: de
    budgetMb: 15
    assets:
      - audio/voice/act1/de/**

  - id: voice.act1.en
    released: false
    load: voice
    act: 1
    lang: en
    budgetMb: 15
    assets:
      - audio/voice/act1/en/**
