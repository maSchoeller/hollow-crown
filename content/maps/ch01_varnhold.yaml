# Kapitel 1 – Asche über Varnhold. Ziel: Kael erreicht die Brücke im Norden.
# Aus concept/data-samples/maps/ch01_varnhold.yaml. Werte = Startwerte [C].
id: ch01_varnhold
nameKey: map.ch01_varnhold.name
size: [12, 18]
fog: false
legend:
  ".": plain
  ",": grass
  "T": forest
  "^": mountain
  "~": river
  "=": bridge
  "#": wall
  "H": village
  "F": fort
#          x: 0123456789AB
terrain: |
  ^^,,,..,,,^^
  ~~~~~==~~~~~
  ~~~~~==~~~~~
  ,,TT,..,TT,,
  ,TTT,..,,T,,
  ,,,,....,,,F
  ##.H..##..##
  #...,,#....#
  ..,,TT,,..,,
  .,TTT,,,.TT,
  ..,,,,..,,..
  ##..##..##.H
  #H..#....#..
  ....,,,,....
  .,,TT..TT,,.
  ..,,......,,
  ...F....F...
  ............

ambient: { color: "#e0a6b8", intensity: 0.72 }
lights:
  - { at: [11, 5], color: "#ffb35c", radius: 3 }
  - { at: [3, 16], color: "#ffb35c", radius: 3 }
  - { at: [8, 16], color: "#ffb35c", radius: 3 }

objects:
  - { id: v_north, type: village, at: [3, 6],  reward: { gold: 300, dialogue: dlg.ch01.village_north } }
  - { id: v_east,  type: village, at: [11, 11], reward: { recruit: mira, dialogue: dlg.ch01.mira_village } }
  - { id: v_west,  type: village, at: [1, 12], reward: { item: { def: javelin }, dialogue: dlg.ch01.village_west } }

initialEffects:
  - { effect: burning, tiles: [[4, 13], [5, 13]], turns: 3 }     # Brand in der Stadtmitte, breitet sich aus

deploy:
  max: 4
  forced: [avatar, kael]
  slots: [[4, 17], [5, 17], [6, 17], [7, 17], [5, 16], [6, 16]]

# Lektion: Waffendreieck. Drei Waffenarten im Gemisch – Banditen (Axt), Deserteure (Lanze),
# Söldner (Schwert) –, damit jede eigene Einheit ein „richtiges“ Ziel hat.
units:
  - id: hask
    nameKey: unit.hask.name
    team: enemy
    class: brigand
    level: 4
    at: [5, 3]
    boss: true
    sprite: hask
    portrait: hask
    items: [ { def: steel_axe }, { def: vulnerary } ]
    drops: [0]
    ai: { profile: guard }
    quote: dlg.ch01.hask_battle
  - { id: e1, team: enemy, class: brigand,   sprite: brigand,   level: 2, at: [3, 9],  items: [{ def: iron_axe }],   ai: { profile: aggressive } }
  - { id: e2, team: enemy, class: soldier,   sprite: soldier,   level: 2, at: [8, 10], items: [{ def: iron_lance }], ai: { profile: aggressive } }
  - { id: e3, team: enemy, class: archer,    sprite: bandit_archer, nameKey: unit.bandit_archer.name, level: 2, at: [9, 8], items: [{ def: iron_bow }], ai: { profile: trigger, radius: 3, then: aggressive }, difficulty: [normal, hard] }
  - { id: e4, team: enemy, class: mercenary, sprite: mercenary, level: 2, at: [2, 7],  items: [{ def: iron_sword }], ai: { profile: trigger, radius: 3, then: aggressive } }
  - { id: e5, team: enemy, class: soldier,   sprite: soldier,   level: 3, at: [7, 4],  items: [{ def: iron_lance }], ai: { profile: hold } }
  - { id: e6, team: enemy, class: brigand,   sprite: brigand,   level: 2, at: [4, 5],  items: [{ def: iron_axe }],   ai: { profile: raider, target: v_east } }   # erreicht das Dorf in Gegnerphase 3
  - { id: e7, team: enemy, class: mercenary, sprite: mercenary, level: 3, at: [9, 5],  items: [{ def: iron_sword }, { def: vulnerary }], drops: [1], ai: { profile: hold } }
  - { id: e8, team: enemy, class: brigand,   sprite: brigand,   level: 3, at: [10, 9], items: [{ def: hand_axe }],   ai: { profile: trigger, radius: 3, then: aggressive }, difficulty: [normal, hard] }

pairs: []

reinforcements:
  - turn: 4
    phase: enemy
    announce: true
    units:
      - { team: enemy, class: brigand,   sprite: brigand,   level: 2, at: [0, 10],  items: [{ def: hand_axe }],   ai: { profile: aggressive } }
      - { team: enemy, class: soldier,   sprite: soldier,   level: 2, at: [11, 8],  items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [hard] }
      - { team: enemy, class: mercenary, sprite: mercenary, level: 3, at: [11, 13], items: [{ def: iron_sword }], ai: { profile: aggressive }, difficulty: [hard] }

objectives:
  victory: { type: reach, unit: kael, area: { tiles: [[5, 0], [6, 0]] } }
  defeat:
    - { type: unit_dies, unit: kael }
    - { type: unit_dies, unit: avatar }
  side:
    - { id: s_villages, type: visit_villages, reward: { gold: 500 } }
    - { id: s_fast,     type: turn_limit, turns: 12, reward: { item: { def: iron_shield } } }

triggers:
  - id: t_intro_triangle
    once: true
    when: { type: turn_start, turn: 1, phase: player }
    then:
      - { action: dialogue, id: dlg.ch01.tutorial_triangle }
  - id: t_fire
    once: true
    when: { type: unit_enters, team: player, area: { rect: [2, 11, 8, 15] } }
    then:
      - { action: dialogue, id: dlg.ch01.tutorial_fire }
  - id: t_ambush
    once: true
    when: { type: unit_enters, team: player, area: { rect: [0, 7, 11, 8] } }
    then:
      - { action: dialogue, id: dlg.ch01.ambush }
      - { action: set_ai, units: [e3, e4], profile: aggressive }
  - id: t_village_razed
    once: true
    when: { type: object_destroyed, object: v_east }
    then:
      - { action: dialogue, id: dlg.ch01.mira_lost }   # Mira ist dann in V1 nicht rekrutierbar

goldReward: 1000
music: battle_a
devNote: >
  Neue Mechanik: Waffendreieck (Runde 1). Nebenbei: Dörfer besuchen (Raider e6 setzt Zeitdruck auf das
  Dorf mit Mira), Feuer breitet sich aus (Hinweis beim ersten Betreten der Stadtmitte). Das Brückenfeld
  x=6 bleibt frei, man muss Hask nicht besiegen. Leicht: ohne Schützen und Bandit e8, eine Verstärkung;
  Schwer: drei Verstärkungen in Runde 4.
