# Prolog – Die letzte Wacht. Banditen überfallen die Karawane. Ziel: alle Gegner besiegen (rout).
# Tutorial: Bewegen, Angriff, Waffendreieck, Kampfvorschau. Startwerte [C].
id: prologue_caravan
nameKey: map.prologue_caravan.name
size: [10, 12]
fog: false
legend:
  ".": plain
  ",": grass
  "_": road
  "T": forest
  "^": mountain
  "F": fort
  "W": wagon
#          x: 0123456789
terrain: |
  TT,,^^,,TT
  T,,.F..,,T
  ,,..__..,,
  ,T,.__.,T,
  ,,,.__.,,,
  TT,,__,,TT
  ,,,,__,,,,
  ,T,,__,T,,
  ,,,W__W,,,
  ,,,.__.,,,
  T,,.__.,,T
  TT,.__.,TT
ambient: { color: "#ffe2b0", intensity: 1.0 }
lights:
  - { at: [4, 1], color: "#ffb35c", radius: 3 }
objects: []
initialEffects: []
deploy:
  max: 4
  forced: [avatar, kael]
  slots: [[4, 9], [5, 9], [4, 10], [5, 10], [3, 10], [6, 10]]
units:
  - id: grosk
    nameKey: unit.grosk.name
    team: enemy
    class: brigand
    level: 3
    at: [4, 1]
    boss: true
    sprite: grosk
    portrait: grosk
    items: [ { def: iron_axe }, { def: vulnerary } ]
    drops: [1]
    ai: { profile: guard }
    quote: dlg.prologue.grosk_battle
  - { id: p_e1, team: enemy, class: brigand, level: 1, at: [2, 4], sprite: brigand, items: [{ def: iron_axe }], ai: { profile: aggressive } }
  - { id: p_e2, team: enemy, class: brigand, level: 1, at: [7, 3], sprite: brigand, items: [{ def: iron_axe }], ai: { profile: aggressive } }
  - { id: p_e3, team: enemy, class: archer, level: 1, at: [6, 2], sprite: bandit_archer, nameKey: unit.bandit_archer.name, items: [{ def: iron_bow }], ai: { profile: hold } }
  - { id: p_e4, team: enemy, class: brigand, level: 2, at: [8, 6], sprite: brigand, items: [{ def: hand_axe }, { def: vulnerary }], drops: [1], ai: { profile: trigger, radius: 3, then: aggressive } }
pairs: []
reinforcements: []
objectives:
  victory: { type: rout }
  defeat:
    - { type: unit_dies, unit: kael }
    - { type: unit_dies, unit: avatar }
  side:
    - { id: s_clean, type: no_downs, reward: { item: { def: vulnerary } } }
    - { id: s_fast, type: turn_limit, turns: 7, reward: { gold: 200 } }
triggers:
  - id: t_intro
    when: { type: turn_start, turn: 1, phase: player }
    then:
      - { action: dialogue, id: dlg.prologue.tutorial_move }
  - id: t_turn2
    when: { type: turn_start, turn: 2, phase: player }
    then:
      - { action: dialogue, id: dlg.prologue.tutorial_triangle }
goldReward: 300
music: battle_a
devNote: "Kompakte Tutorialkarte. Grosk bewacht die Festung im Norden, die Karawane steht in der Mitte der Straße."
