# Gegner-Pools der Heimsuchungen von Akt 1 (Story 5.5, Architektur §5.6, Paket act1). Startwerte [C].
# factions: je Fraktion der Leutnants des Akts (lieutenants.yaml faction) die Gegnertypen mit Anteil (share, %, Summe 100);
# items = Ausrüstungs-Tier des Akts (Akt 1: Eisen). Der Leutnant selbst kommt aus lieutenants.yaml (Klasse, Modell); seine Waffe
# nimmt er aus dem Eintrag seiner Klasse.
factions:
  border_bands:
    - { class: brigand,    sprite: brigand,       nameKey: unit.marauder.name, items: [{ def: iron_axe }],   share: 40 }
    - { class: skirmisher, sprite: mercenary,     nameKey: unit.marauder.name, items: [{ def: iron_sword }], share: 20 }
    - { class: vanguard,   sprite: soldier,       nameKey: unit.marauder.name, items: [{ def: iron_lance }], share: 20 }
    - { class: marksman,   sprite: bandit_archer, nameKey: unit.marauder.name, items: [{ def: iron_bow }],   share: 20 }
# Der Mensch, den defend und escort schützen: wie der Dorfälteste in 1-2 ein Zivilist (Klasse civilian, Nichtkämpfer), Figur und Porträt villager_elder.
civilian: { class: civilian, sprite: villager_elder, portrait: villager_elder, nameKey: unit.civilian.name }
# Inhalt der Truhen bei treasure: Einträge (Gold oder Gegenstand); wie sie auf die Truhen kommen, legt Story 5.6 fest
chestLoot:
  - { gold: 150 }
  - { item: { def: vulnerary } }
  - { gold: 100 }
