# Abschied (Story 9.13): letzte Zeile beim Tod und Trauerzeilen der Support-Partner
id: scn.farewell.brenna
lines:
  - id: last
    speaker: [brenna]
    fallback: skip
    mood: sad
    text: "Der Esel, der … den Rest kennt ihr. Erzählt ihn schlecht, Küken."
  - id: grief_kael
    speaker: [kael]
    fallback: skip
    mood: sad
    text: "Zwölf Jahre hat sie geredet. Jetzt hör ich hin, und da ist nichts."
  - id: grief_tobin
    speaker: [tobin]
    fallback: skip
    mood: sad
    text: "Alt und langweilig, hast du gesagt. Ich geb mir Mühe, Brenna."
  - id: grief_varek
    speaker: [varek]
    fallback: skip
    mood: sad
    text: "Sie hörte jedes Mal am Klang, dass ich schummle. Ich wäre gern noch erwischt worden."
