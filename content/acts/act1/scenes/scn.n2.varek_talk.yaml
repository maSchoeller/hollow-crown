# Nebenquest N2, Anwerben im Kampf: Kael spricht Varek an (recruit der Karte, by: [kael]). Varek, Deserteur des Grenzheers (Brücke General), kennt Kael und Dravn; er versteckt sich
# im Turm an Kaels alter Front. Der Grund seiner Desertion bleibt in Akt 1 offen (Decision-Log 2026-10-24). Keine Antworten (Kampfszene). Brenna × Varek: Misstrauen gegenüber dem Deserteur.
id: scn.n2.varek_talk
