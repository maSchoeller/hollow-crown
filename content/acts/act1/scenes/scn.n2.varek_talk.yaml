lines:
  - id: l01
    speaker: [varek]
    mood: happy
    text: "Kael! Ausgerechnet du, ausgerechnet an deiner alten Mauer. Die Würfel liegen heute wirklich schlecht."
  - id: l02
    speaker: [kael]
    mood: neutral
    text: "Varek. Es heißt, du hast dem Grenzheer den Rücken gekehrt."
  - id: l03
    speaker: [varek]
    mood: sad
    text: "Es heißt viel. Ich wollte nur über die Mauer. Jetzt stehen meine alten Kameraden vor der Tür."
  - id: l04
    speaker: [kael]
    mood: neutral
    text: "Lange hält dieser Turm nicht. Komm mit uns, Varek."
  - id: l05
    speaker: [varek]
    mood: happy
    text: "Ein guter Wurf. Und wenn Dravn fragt: Du hast mich nie gesehen."
  - id: l06
    speaker: [brenna]
    fallback: skip
    mood: neutral
    text: "Ein Deserteur in der Truppe. Ich behalte dich im Auge, Küken."
