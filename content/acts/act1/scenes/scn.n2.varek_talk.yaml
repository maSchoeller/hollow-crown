# Nebenquest N2, Anwerben im Kampf: Lucan spricht Varek an (recruit der Karte, by: [lucan]). Varek, Deserteur des Grenzheers (Brücke General), kennt Lucan und Dravn; er versteckt sich
# im Turm an Lucans alter Front. Der Grund seiner Desertion bleibt in Akt 1 offen (Decision-Log 2026-10-24). Keine Antworten (Kampfszene). Brenna × Varek: Misstrauen gegenüber dem Deserteur.
id: scn.n2.varek_talk
background: wachturm
lines:
  - id: l01
    speaker: [varek]
    mood: happy
    text: "Lucan! Ausgerechnet du, ausgerechnet an deiner alten Mauer. Die Würfel liegen heute wirklich schlecht."
  - id: l01b
    speaker: [varek]
    mood: neutral
    text: "Damals noch mit Wappen auf dem Rock, Herr Ritter. Wie ich sehe, hat man es dir abgetrennt."
  - id: l01c
    speaker: [lucan]
    mood: neutral
    text: "Mein Haus wollte mich nicht mehr. Mehr musst du nicht wissen."
  - id: l01d
    speaker: [varek]
    mood: neutral
    text: "Weil du den Mund aufgemacht hast."
  - id: l02
    speaker: [lucan]
    mood: neutral
    text: "Varek. Es heißt, du hast dem Grenzheer den Rücken gekehrt."
  - id: l03
    speaker: [varek]
    mood: sad
    text: "Es heißt viel. Ich wollte nur über die Mauer. Jetzt stehen meine alten Kameraden vor der Tür."
  - id: l04
    speaker: [lucan]
    mood: neutral
    text: "Lange hält dieser Turm nicht. Komm mit uns, Varek."
  - id: l05
    speaker: [varek]
    mood: happy
    text: "Ein guter Wurf. Und wenn Dravn fragt: Du hast mich nie gesehen."
  - id: l06
    speaker: [brenna]
    fallback: skip
    mood: neutral
    text: "Ein Deserteur in der Truppe. Ich behalte dich im Auge, Küken."
