id: scn.ch02.tutorial_magic
lines:
  - id: l01
    speaker: [kael]
    mood: neutral
    text: "Liora steht auf dem Schrein. Sie heilt sich dort, aber allein hält sie nicht lange."
  - id: l01b
    speaker: [kael]
    mood: neutral
    text: "Fällt sie, ist alles verloren."
  - id: l02
    speaker: [liora]
    fallback: skip
    mood: neutral
    text: "Magie trifft den Geist, nicht die Rüstung: Sie rechnet mit MAG gegen RES und reicht zwei Felder weit."
  - id: l03
    speaker: [kael]
    mood: neutral
    text: "{avatar}, dein Folio taugt gegen die Gepanzerten."
  - id: l03b
    speaker: [kael]
    mood: neutral
    text: "Und haltet Abstand zu ihrer Magierin – Rüstung hilft da nicht."
