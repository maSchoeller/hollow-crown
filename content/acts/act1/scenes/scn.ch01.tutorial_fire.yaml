id: scn.ch01.tutorial_fire
lines:
  - id: l01
    speaker: [brenna]
    fallback: skip
    mood: neutral
    text: "Siehst du die Flammen im Gras? Feuer breitet sich jede Runde aus. Wer darin steht, verbrennt."
  - id: l02
    speaker: [tobin]
    fallback: skip
    mood: neutral
    text: "Und die Häuser? Da sind noch Leute drin! Wir sollten sie besuchen, bevor die Plünderer es tun."
