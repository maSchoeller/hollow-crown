id: scn.ch01.tutorial_triangle
lines:
  - id: l01
    speaker: [kael]
    mood: neutral
    text: "Ziel ist die Brücke im Norden. Ich muss sie erreichen – Hask müssen wir dafür nicht töten."
  - id: l02
    speaker: [kael]
    mood: neutral
    text: "Hasks Leute tragen Äxte, die Deserteure Lanzen, die Söldner Schwerter."
  - id: l02b
    speaker: [kael]
    mood: neutral
    text: "Merkt euch: Schwert schlägt Axt, Axt schlägt Lanze, Lanze schlägt Schwert."
  - id: l03
    speaker: [tobin]
    fallback: skip
    mood: happy
    text: "Und meine Lanze schlägt … Schwerter! Lasst mir die Söldner!"
  - id: l04
    speaker: [brenna]
    fallback: skip
    mood: neutral
    text: "Grünes ▲ in der Vorschau heißt Vorteil, rotes ▼ Nachteil. Ich nehme mir die Lanzenträger."
