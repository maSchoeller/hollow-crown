# Nebenquest N1 „Der Ring von Varnhold“ (Story 9.10), Szene vor der Karte: Fenn will seine Elster zurück. Fenn: Gaunersprache, prahlt.
# Hintergrund: E2 „schützen“ (die Truppe hat Fenn nicht an den Ring ausgeliefert). Gedenk-Variante: scn.n1.memorial_intro.
id: scn.n1.intro
background: varnhold_nacht
music: tense
lines:
  - id: l01
    mood: neutral
    text: "Varnhold bei Nacht. Nebel im Gerberviertel, es stinkt nach Lohe. Die Gassen sind leer."
  - id: l02
    speaker: [fenn]
    fallback: skip
    mood: happy
    text: "Bleibt dicht hinter mir. Im Nebel kenn ich jeden Pflasterstein. Die meisten hab ich selbst gelockert."
  - id: l03
    speaker: [kael]
    mood: neutral
    text: "Du sagtest, es geht um etwas, das dir gehört."
  - id: l04
    speaker: [fenn]
    fallback: skip
    mood: neutral
    text: "Meine Elster. Ein Dolch, so flink, dass man ihn nicht kommen sieht. Der Ringmeister behielt ihn."
  - id: l05
    speaker: [brenna]
    fallback: skip
    mood: neutral
    text: "Rausgeworfen, weil du einem Kind den Beutel ließest. Ich hätte dich auch genommen, Küken."
  - id: l06
    speaker: [fenn]
    fallback: skip
    mood: neutral
    text: "Der Ring wollte mich zurück, gegen eine Auskunft. Ihr habt nein gesagt. Das hat noch keiner für mich getan."
  - id: l07
    speaker: [kael]
    mood: neutral
    text: "Du schuldest uns nichts. Wo hält er den Dolch?"
  - id: l08
    speaker: [fenn]
    fallback: skip
    mood: happy
    text: "Im Nest auf den Dächern, ganz im Nordosten. Leitern stehen in den Gassen, ein paar hab ich selbst geklaut."
  - id: l09
    speaker: [brenna]
    fallback: skip
    mood: happy
    text: "Dann steigen wir ihm aufs Dach. Wer nicht runterkommt, kriegt den Axtstiel. Ich nenne das Hausbesuch."
  - id: l10
    speaker: [kael]
    mood: neutral
    text: "Waffen bereit. Wir bleiben beisammen."
