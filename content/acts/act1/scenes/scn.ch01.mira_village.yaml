    mood: angry
    text: "Noch ein Schritt und du hast einen Pfeil im – oh. Ihr seid nicht von Hasks Bande."
  - id: l02
    speaker: [kael]
    mood: neutral
    text: "Aschenbanner. Wir wollen zur Brücke. Du schießt gut?"
  - id: l03
    speaker: [mira]
    fallback: skip
    mood: happy
    text: "Besser als jeder Adlige, der je in diesem Wald gejagt hat."
  - id: l03b
    speaker: [mira]
    fallback: skip
    mood: happy
    text: "Ich bin Mira. Ich komme mit – aber ich verteidige zuerst mein Dorf."
