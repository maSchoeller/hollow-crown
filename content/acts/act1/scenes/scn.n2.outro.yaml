# Nebenquest N2, Szene nach der Karte. Der Glutfunke ist die Knotenwirkung (campaign.yaml), Seite und Relikt kommen aus den Truhen (scn.n2.page, scn.n2.relic). Varek spricht nur, wenn er beigetreten ist.
id: scn.n2.outro
background: wachturm
music: camp
lines:
  - id: l01
    mood: neutral
    text: "Der Suchtrupp zieht ab. Der Wind pfeift durch die leeren Schießscharten des Turms."
  - id: l02
    mood: neutral
    text: "Im Torstein glimmt ein Splitter Glut, vom Frost freigelegt. Ein Glutfunke."
  - id: l03
    speaker: [kael]
    mood: neutral
    text: "Der Turm war der letzte seiner Art. Jemand muss ihn eine lange Zeit allein gehalten haben."
  - id: l04
    speaker: [liora, ysolde, avatar]
    mood: neutral
    text: "Dann behalten wir, was er bewahrt hat. Das ist mehr, als der Tempel getan hat."
  - id: v01
    requires: [{ alive: varek }]
    speaker: [varek]
    fallback: skip
    mood: happy
    text: "Der Turm hat mich länger behalten, als die Würfel versprachen. Weiter, Kael?"
