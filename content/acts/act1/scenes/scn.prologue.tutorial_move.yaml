id: scn.prologue.tutorial_move
lines:
  - id: l01
    speaker: [kael]
    mood: neutral
    text: "Tipp eine unserer Einheiten an. Blau ist, wohin sie laufen kann, Rot, was sie von dort angreifen kann."
  - id: l02
    speaker: [brenna]
    fallback: skip
    mood: neutral
    text: "Tipp ein Feld für die Vorschau, dann noch einmal zum Bestätigen."
  - id: l02b
    speaker: [brenna]
    fallback: skip
    mood: neutral
    text: "Und bevor du zuschlägst: Schau dir die Kampfvorschau an."
