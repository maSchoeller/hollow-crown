# Mission 1-5, Szene nach der Karte (nach Runde 8) mit Entscheidung E3 (Narrative „Entscheidungen“, Gewissen): Grosk kommt mit erhobenen Händen ins Lager der Truppe, seine Leute sind
# Hungernde, keine Mörder. Er stand im Kampf auf dem Brett und floh dort bei 0 TP; die Wirkung `meet` lässt ihn auch dann als begegnet gelten, wenn ihn die Truppe im Nebel nie sah (Steckbrief, Heimsuchungen, Finale).
# `spare`: Grosk tritt bei (recruit: { lt: grosk }, setzt joined_grosk), Hask-Groll −1, E3-Flag spare. `bounty`: +600 Gold, Grosk wird abgeführt, E3-Flag bounty (er kehrt im Finale
# 1-8 als Leutnant zurück, solange er nicht gewechselt ist). Hask-Groll −1 steht so im Konzept; eine Vorgeschichte zwischen Grosk und Hask gibt das Konzept nicht her und wird nicht erfunden.
# Gefährten sprechen nur, wenn sie in der Truppe sind (alive).
id: scn.m1_5.outro
background: hungerlager
music: camp
lines:
  - id: o01
    mood: neutral
    text: "Die achte Runde endet. Die Hungernden lassen Äxte und Knüppel sinken, im Lager verstummen die Rufe."
  - id: o02
    mood: neutral
    text: "Über den Steg kommt ein Hüne, beide Hände erhoben, die Lanze hat er im Schlamm gelassen."
  - id: o03
    speaker: [grosk]
    fallback: skip
    mood: neutral
    text: "Genug! Ich bin Grosk. Der Zettel will mich. Rührt die Kinder nicht an."
  - id: o04
    speaker: [lucan]
    mood: neutral
    text: "Du führst diese Bande. Dein Kopf ist Gold wert."
  - id: o05
    speaker: [grosk]
    fallback: skip
    mood: sad
    text: "Führen? Ich bin der, der noch laufen kann. Das Heer schickte mich heim wie einen alten Karren."
  - id: o06
    speaker: [grosk]
    fallback: skip
    mood: sad
    text: "Wir nahmen Brot, wo es lag. Mörder sind meine Leute nicht, nur hungrig."
  - id: o07
    speaker: [tobin]
    fallback: skip
    mood: sad
    text: "Der Zettel hat gelogen, Hauptmann. Das sind Leute wie wir."
  - id: o08
    mood: neutral
    text: "Hinter Grosk spähen Kinder aus den Zelten. Auf einem Baumstumpf liegt ein Holzpferdchen."
  - id: o09
    speaker: [brenna]
    fallback: skip
    mood: neutral
    text: "Das Gold liegt bereit, Küken. Die Frage ist nur, was es kostet."
  - id: o10
    speaker: [avatar]
    mood: sad
    text: "Das Kopfgeld füllt unsere Kasse. Aber wer füllt ihre Töpfe?"
  - id: o11
    speaker: [lucan]
    mood: neutral
    text: "Wir haben den Zettel angenommen. Du entscheidest, {avatar}."
  - id: c01
    title: "Das Hungerlager: Kopfgeld oder Gnade"
    choice:
      - id: spare
        stance: warm
        text: "„Das Lager bleibt unberührt. Und du kommst mit uns, Grosk.“"
        summary: "Grosk tritt bei, das Lager bleibt verschont"
        effects: [{ setFlag: { e03: spare } }, { meet: { lt: grosk } }, { recruit: { lt: grosk } }, { grudge: { lt: hask, delta: -1 } }]
      - id: bounty
        stance: sober
        text: "„Das Kopfgeld gehört uns. Lucan, fessle ihn.“"
        summary: "Grosk wird abgeführt, die Kasse füllt sich"
        effects: [{ setFlag: { e03: bounty } }, { meet: { lt: grosk } }, { gold: 600 }]
  - id: s01
    requires: [{ flag: { e03: spare } }]
    speaker: [grosk]
    fallback: skip
    mood: happy
    text: "Ihr lasst sie leben. Dann gehört mein Arm euch, und das vergesse ich nie."
  - id: s02
    requires: [{ flag: { e03: spare } }]
    mood: neutral
    text: "Grosk steckt das Holzpferdchen in den Gürtel. Die Hungernden bleiben im Tal, und niemand jagt sie."
  - id: s03
    requires: [{ flag: { e03: spare } }]
    speaker: [tobin]
    fallback: skip
    mood: happy
    text: "Ein Riese in der Truppe! Die Barden werden sich überschlagen, Hauptmann!"
  - id: s04
    requires: [{ flag: { e03: spare } }]
    speaker: [brenna]
    fallback: skip
    mood: happy
    text: "Er isst für drei, Küken. Aber er steht für vier."
  - id: s06
    requires: [{ flag: { e03: spare } }]
    speaker: [lucan]
    mood: neutral
    text: "Wer heute Brot bekommt, vergisst es nicht. Weiter."
  - id: b01
    requires: [{ flag: { e03: bounty } }]
    mood: neutral
    text: "Lucan fesselt Grosk die Hände. Die Hungernden schweigen, ein Kind drückt sein Holzpferdchen an die Brust."
  - id: b02
    requires: [{ flag: { e03: bounty } }]
    speaker: [grosk]
    fallback: skip
    mood: sad
    text: "Nehmt mich, aber lasst ihnen etwas zu essen da."
  - id: b03
    requires: [{ flag: { e03: bounty } }]
    mood: neutral
    text: "Die Truppe führt Grosk ab. Das Gold ist so gut wie in der Kasse."
  - id: b04
    requires: [{ flag: { e03: bounty } }]
    speaker: [tobin]
    fallback: skip
    mood: sad
    text: "Das war nicht heldenhaft."
  - id: b06
    requires: [{ flag: { e03: bounty } }]
    speaker: [lucan]
    mood: neutral
    text: "Gold ist Gold. Es schmeckt nur nach weniger, als ich dachte."
