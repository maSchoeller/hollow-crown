# Prolog, Szene vor der Karte. Schlüsselgespräch 1 „Die Wache am Ring“ (Narrative: Kael, Rhen, Gerrit, Brenna, Tobin; warm, Vorabend;
# Familie zeigen, Rhens Vertrag andeuten), danach die Tafel „Die Paktnacht: Alarm im Glutdom“ (l17 ff.).
# Die Tafel „Alarm im Glutdom“ ist ein Illustrationsbild (`panel`, l17 bis l20, vier Textboxen); danach (`panel: none`) gilt wieder der Szenenhintergrund.
# Platzhalter bis Story 8.7: bg_glutdom_night existiert noch nicht; fehlt das Bild, zeigt die Szene den Szenenhintergrund.
id: scn.prologue.intro
background: bg_glutdom_night
music: title
lines:
  - id: l01
    speaker: [liora]
    fallback: skip
    mood: neutral
    text: "(Eine Stimme, fern wie ein Traum.) Dreihundert Jahre lang schliefen die Drachen unter dem Berg."
  - id: l01b
    speaker: [liora]
    fallback: skip
    mood: neutral
    text: "Dreihundert Jahre lang trug jeder König die Glutkrone."
  - id: l02
    speaker: [liora]
    fallback: skip
    mood: sad
    text: "In der Nacht des Paktfestes erlosch die Glut. Der König starb. Und die Krone … war fort."
  - id: l03
    mood: neutral
    text: "Aurenhall, Spätsommer. Paktfest. Das Aschenbanner hält Wache am äußeren Ring des Glutdoms."
  - id: l04
    speaker: [gerrit]
    fallback: skip
    mood: happy
    text: "Dreißig Jahre trag ich dieses Banner, und noch nie hat eine Wache nach Weihrauch gerochen."
  - id: l05
    speaker: [tobin]
    fallback: skip
    mood: happy
    text: "Eines Tages singt man Lieder über – über die Nacht, in der das Aschenbanner den König bewachte!"
  - id: l06
    speaker: [brenna]
    fallback: skip
    mood: happy
    text: "Man singt über Könige, Küken. Über Wachen singt man höchstens, wenn sie schnarchen. Gerrit?"
  - id: l07
    speaker: [gerrit]
    fallback: skip
    mood: happy
    text: "Ich schnarche im Takt. Das nennt man Marschmusik."
  - id: l08
    speaker: [kael]
    mood: neutral
    text: "Ring halten, Tür bewachen, nach Hause gehen. Der Sold ist gut."
  - id: l09
    speaker: [brenna]
    fallback: skip
    mood: neutral
    text: "Dreifacher Sold für eine Nacht Türstehen. Ich traue Gold nicht, das so leicht kommt."
  - id: l10
    speaker: [kael]
    mood: neutral
    text: "{avatar} hat den Vertrag besorgt. Oder?"
  - id: l11
    speaker: [avatar]
    mood: sad
    text: "Der Auftraggeber hat im Voraus gezahlt. Ich hätte mehr fragen sollen."
  - id: l12
    speaker: [gerrit]
    fallback: skip
    mood: neutral
    text: "Wer fragt, bevor der Sold stimmt, bleibt hungrig. Mach dir keinen Kopf, {avatar}."
  - id: l13
    speaker: [kael]
    mood: neutral
    text: "Wochen bei uns, {avatar}, und ich weiß immer noch nicht, warum die Akademie dich gestrichen hat."
  - id: c01
    choice:
      - id: honest
        stance: warm
        text: "„Ich erinnere mich nicht. Das ist die Wahrheit.“"
        effects: [{ setFlag: avatar_honest }]
      - id: proud
        stance: defiant
        text: "„Vielleicht war ich zu gut für sie.“"
        effects: [{ setFlag: avatar_proud }]
  - id: l14
    speaker: [kael]
    mood: neutral
    text: "Hm. Ehrlich, wenigstens. Das ist mehr, als die meisten bieten."
    requires: [{ flag: avatar_honest }]
  - id: l15
    speaker: [kael]
    mood: happy
    text: "Bescheiden ist was anderes. Gut. Bescheidene Strategen hatten wir schon – die sind alle tot."
    requires: [{ flag: avatar_proud }]
  - id: l16
    speaker: [gerrit]
    fallback: skip
    mood: happy
    text: "Passt schon. Hier zählt, wer bleibt, wenn es brenzlig wird."
  # Tafel „Die Paktnacht: Alarm im Glutdom“
  - id: l17
    panel: bg_glutdom_night
    mood: neutral
    text: "Da läutet im Glutdom eine Glocke, einmal, zu hoch und falsch. Hinter den Türen schreit jemand."
  - id: l18
    mood: sad
    text: "Der König ist tot. Die Krone ist fort. Und die Wachen des Tempels wenden sich gegen die Söldner."
  - id: l19
    speaker: [brenna]
    fallback: skip
    mood: angry
    text: "Das sind keine Ausrufer, Kael. Das sind gezogene Klingen!"
  - id: l20
    speaker: [gerrit]
    fallback: skip
    mood: angry
    text: "Der Ring ist hin. Bringt alle hier raus. Ich gebe euch den Rücken frei!"
  - id: l21
    panel: none
    speaker: [kael]
    mood: angry
    text: "Alle zum Tempeltor im Süden. Niemand bleibt zurück. Ich gehe als Letzter. {avatar}, führ uns."
