# Mission 1-7, Karten-Szene beim Grabrelief (2,12) im Gruftsaal (Beat 6 „Junge Könige“): leere Nischen, aus denen Chronik-Seiten fehlen; Beben, Asche in der Luft, niemand kann sie erklären.
# Der Pakt als Opfervertrag wird hier NICHT ausgesprochen. Ersatzsprecher-Kette: Ysolde, sonst Liora, sonst Rhen.
id: scn.m1_7.relief_crypt
lines:
  - id: l01
    panel: grabreliefs
    mood: neutral
    text: "Im Gruftsaal reiht sich Relief an Relief. Ein junger König neben dem anderen, dicht an dicht."
  - id: l02
    speaker: [ysolde, liora, avatar]
    mood: neutral
    text: "Sieben Jahre, vier, neun. Ihre Regierungszeiten sind auffallend kurz. Und das jedes Mal."
  - id: l03
    speaker: [liora, ysolde, avatar]
    mood: sad
    text: "Unter jedem Namen eine leere Nische. Hier lagen einmal Seiten. Wer hat sie fortgenommen?"
  - id: l04
    speaker: [mira]
    fallback: skip
    mood: neutral
    text: "Wer begräbt so viele junge Könige und fragt nie nach dem Grund?"
  - id: l05
    panel: none
    mood: neutral
    text: "Der Boden zittert leise, feine Asche rieselt aus den Fugen. Woher sie kommt, kann niemand sagen."
  - id: l06
    speaker: [kael]
    mood: neutral
    text: "Asche tief unter der Erde. Erklären kann sie keiner. Weiter."
