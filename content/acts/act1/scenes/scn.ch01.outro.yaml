id: scn.ch01.outro
background: erlbach
music: camp
lines:
  - id: l01
    speaker: [kael]
    mood: sad
    text: "Die Brücke steht. Die Stadt nicht."
  - id: l02
    speaker: [brenna]
    fallback: skip
    mood: neutral
    text: "Ein Bote der Silbernen Lanze war hier. Er hat nach einer Seherin gefragt – am Schrein im Silberbach-Tal."
  - id: l03
    speaker: [kael]
    mood: neutral
    text: "Die Lanze sucht eine Seherin, während das Land brennt? Dann ist sie wichtig. Wir finden sie zuerst."
  - id: l04
    speaker: [kael]
    mood: neutral
    text: "{avatar} – das lag in Hasks Zelt. Ein Glut-Folio. Du hast an der Akademie Magie gelernt, oder? Nimm es."
