# Mission 1-3, Szene vor der Karte: Morgen, Nebel im Grenzwald. Ein Zettel mit grauem Siegel führt die Truppe zum Schrein am Weißdorn (Halvards heimlicher Kontakt,
# über Liora). Morra stellt der Truppe im Wald nach. Auftrag: Rhen erreicht den Schrein; die Heilerin dort darf nicht fallen. Liora selbst spricht erst auf der Lichtung (scn.m1_3.shrine).
id: scn.m1_3.intro
background: silberbach
music: tense
lines:
  - id: l01
    mood: neutral
    text: "Grenzwald, früher Morgen. Nebel zwischen den Eichen. Der Zettel nennt nur einen Ort: den Schrein am Weißdorn."
  - id: l02
    speaker: [brenna]
    fallback: skip
    mood: neutral
    text: "Ein Zettel ohne Namen, nur ein Siegel aus grauem Wachs. Und wir laufen ihm nach. Küken, Küken."
  - id: l03
    speaker: [lucan]
    fallback: skip
    mood: neutral
    text: "Jemand, der uns kennt und nicht aufhängen will. Das sind wenige. Ich sehe nach."
  - id: l04
    speaker: [avatar]
    fallback: skip
    mood: neutral
    text: "„Am Schrein wartet eine Heilerin. Bringt sie durch.“ Mehr steht hier nicht."
  - id: l07
    speaker: [tobin]
    fallback: skip
    mood: angry
    text: "Hauptmann, zwischen den Bäumen! Bewaffnete, und sie tragen Zettel – unsere Zettel!"
  - id: l08
    speaker: [brenna]
    fallback: skip
    mood: neutral
    text: "Morras Leute. Die Jägerin aus Varnhold hat unsere Spur. Haltet die Augen offen im Dickicht, Küken."
  - id: l09
    speaker: [fenn]
    fallback: skip
    mood: neutral
    text: "Kopfgeldjäger. Natürlich. Es ist noch nicht mal Mittag, und schon will uns jemand zu Geld machen."
  - id: l10
    speaker: [lucan]
    fallback: skip
    mood: neutral
    text: "Die Straße ist lang, die Wildwechsel sind eng. Wir müssen zum Schrein, und die Heilerin fällt nicht."
  - id: l12
    speaker: [lucan]
    fallback: skip
    mood: neutral
    text: "{avatar}, ordne die Reihen. Du gehst hinauf zum Schrein, wir halten dir den Weg frei."
