# Mission 1-1, Besuch im Händlerhaus [1,6]: Saat Kharesh (Missionsliste): Marktgerücht über Unruhe am Grenzposten; Kael schweigt, seine Narben stammen von dort.
id: scn.m1_1.kharesh_rumor
background: varnhold
lines:
  - id: l01
    mood: neutral
    text: "Ein Händler packt hastig seine Waren. „Am Grenzposten rumort es wieder, sagen die Fuhrleute. Kharesh.“"
  - id: l02
    mood: neutral
    text: "„Nehmt das Wechselgeld und geht. Hier will keiner sehen, wer bei mir war.“"
  - id: l03
    speaker: [tobin]
    fallback: skip
    mood: neutral
    text: "Kharesh? Hauptmann, warst du da nicht im Krieg?"
  - id: l04
    mood: sad
    text: "Kael sieht zur Seite und reibt sich die Narbe am Arm. Er sagt nichts."
