# Prolog, Szene nach der Karte. Schlüsselgespräch 2 „Gerrits Grab“ (Narrative: ganze Truppe, erste Gedenkszene, Trauer, leise), jetzt auf dem
# Lastkahn durch die Aureklamm (geografie-valmora.md, Reise: Brenna führt durch die Unterstadt zu den Kanälen). Humor setzt in Trauerszenen nie ein.
# Keine Tafel: Ortsbild aureklamm_lastkahn; eine Tafel gleich dem Hintergrund würde nur die Halbfiguren verdecken.
id: scn.prologue.outro
background: aureklamm_lastkahn
music: camp
lines:
  - id: l01
    mood: sad
    text: "Dieselbe Nacht. Zwischen Säcken auf einem Lastkahn treibt die Truppe durch die Aureklamm."
  - id: l01b
    speaker: [brenna]
    fallback: skip
    mood: neutral
    text: "Unterstadt, Kanäle, ein Kahn, der keine Fragen stellt. Wer da unten aufwächst, kennt den Weg hinaus, Küken."
  - id: l02
    speaker: [tobin]
    fallback: skip
    mood: sad
    text: "Er hat uns die Tür gehalten. Ich hab mich noch umgedreht. Ich hätte … ich hätte nicht …"
  - id: l03
    speaker: [brenna]
    fallback: skip
    mood: sad
    text: "Dreißig Jahre hat er das Ding getragen. Und er hat es nicht losgelassen. Bis zuletzt nicht."
  - id: l04
    speaker: [lucan]
    mood: sad
    text: "Gerrit hat dieses Banner getragen, seit es eins gibt."
  - id: l05
    speaker: [avatar]
    mood: sad
    text: "Ich weiß nicht, was ich sagen soll."
  - id: l06
    speaker: [lucan]
    mood: sad
    text: "Dann sag nichts. Bleib einfach hier."
  - id: l07
    speaker: [brenna]
    fallback: skip
    mood: sad
    text: "Die Wache übernehme ich. Schlaft, Küken. Heute Nacht bleibt er bei uns."
  - id: l08
    mood: sad
    text: "Im Morgengrauen legt der Kahn an. Am Ufer schichten sie Steine für Gerrit, das erste Grab."
  - id: l08b
    mood: sad
    text: "Hinter der Klamm läuten die Glocken von Aurenhall, als wäre nichts geschehen."
  - id: l09
    speaker: [lucan]
    mood: neutral
    text: "Ab hier zu Fuß. Nach Süden, über den Wachpass bis nach Varnhold. Dort suchen sie uns zuletzt."
