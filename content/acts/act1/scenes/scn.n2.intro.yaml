# Nebenquest N2 „Der letzte Wachturm“, Szene vor der Karte: ein Turm der Paktwächter an der Grenzmauer, davor ein Suchtrupp des Grenzheers. Nach Mission 1-5. Lucan erzählt vom Grenzkrieg (Saat Kharesh).
id: scn.n2.intro
background: wachturm
music: tense
lines:
  - id: l01
    mood: neutral
    text: "Abend an der Grenzmauer, dahinter im Dunst Kharesh. Davor ein Turm, über dem Tor Drache und Krone."
  - id: l02
    speaker: [liora, ysolde, avatar]
    mood: neutral
    text: "Das Zeichen der Paktwächter. Sie hüteten die Grenze, bevor der Tempel den Orden auflöste."
  - id: l03
    speaker: [liora, ysolde, avatar]
    mood: sad
    text: "Im Tempel hieß es, es habe sie nie gegeben. Wer nach ihnen fragte, bekam keine Antwort mehr."
  - id: l04
    speaker: [tobin]
    fallback: skip
    mood: happy
    text: "Ein Turm der Paktwächter! Hüter der Wahrheit, Schützer der … äh … von irgendwas mit Wahrheit!"
  - id: l05
    speaker: [lucan]
    mood: neutral
    text: "An dieser Mauer stand ich im Grenzkrieg. Kharesh sah damals genauso aus: still und viel zu nah."
  - id: l06
    speaker: [lucan]
    mood: neutral
    text: "Ein Suchtrupp des Grenzheers belagert den Turm. Holen wir, was dort liegt, bevor sie es tun."
