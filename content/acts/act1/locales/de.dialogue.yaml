# Generated from the dialogue authoring script; keys = dialogue line keys.
dlg.prologue.intro.001: "(Eine Stimme, fern wie ein Traum.) Dreihundert Jahre lang schliefen die Drachen unter dem Berg. Dreihundert Jahre lang trug jeder König die Glutkrone."
dlg.prologue.intro.002: "In der Nacht des Paktfestes erlosch die Glut. Der König starb. Und die Krone … war fort."
dlg.prologue.intro.003: "Spätsommer. Eine Handelsstraße in den Grenzmarken, zwei Tagesreisen vor Aurenhall."
dlg.prologue.intro.004: "Hauptmann! Der Neue ist wach! Ich hab ihm gesagt, dass wir die beste Söldnerkompanie in ganz Valmora sind."
dlg.prologue.intro.005: "Die beste, die noch übrig ist, Tobin. Das ist ein Unterschied."
dlg.prologue.intro.006: "Du bist also {avatar}. Die Akademie hat dich empfohlen – und dann aus ihren Büchern gestrichen. Warum?"
dlg.prologue.intro.c1: "„Ich erinnere mich nicht. Das ist die Wahrheit.“"
dlg.prologue.intro.c2: "„Vielleicht war ich zu gut für sie.“"
dlg.prologue.intro.007: "Hm. Ehrlich, wenigstens. Das ist mehr, als die meisten bieten."
dlg.prologue.intro.008: "Bescheiden ist was anderes. Gut. Bescheidene Strategen hatten wir schon – die sind alle tot."
dlg.prologue.intro.009: "Kael! Staub auf der Straße, Norden. Viele. Keine Händler."
dlg.prologue.intro.010: "Banditen. Aschenbanner – an die Wagen! {avatar}, zeig mir, was du kannst."
dlg.prologue.tutorial_move.001: "Tipp eine unserer Einheiten an. Blau ist, wohin sie laufen kann, Rot, was sie von dort angreifen kann."
dlg.prologue.tutorial_move.002: "Tipp ein Feld für die Vorschau, dann noch einmal zum Bestätigen. Und bevor du zuschlägst: Schau dir die Kampfvorschau an."
dlg.prologue.grosk_battle.001: "Söldner? Pah. Ich mach aus euren Knochen Würfel!"
dlg.prologue.outro.001: "Nicht schlecht für den ersten Tag. Du hast keinen von uns verheizt."
dlg.prologue.outro.002: "Der Händler spricht von Unruhen in der Hauptstadt. Und von Rauch über Varnhold."
dlg.prologue.outro.003: "Varnhold? Da hat meine Tante einen Laden!"
dlg.prologue.outro.004: "Dann reiten wir. {avatar} – willkommen im Aschenbanner."
dlg.ch01.intro.001: "Hauptmann! Die Stadt brennt – und die Leute sagen, der König ist tot!"
dlg.ch01.intro.002: "Tot? Aldric war gesund wie ein Ochse, als ich ihn zuletzt bewacht habe."
dlg.ch01.intro.003: "Marodeure nutzen die Nachricht schneller als jeder Herold. Wir müssen über die Brücke, bevor sie sie einreißen."
dlg.ch01.intro.004: "{avatar}. Du wolltest beweisen, dass du mehr kannst als Karten lesen. Jetzt ist die Gelegenheit."
dlg.ch01.intro.c1: "„Wir bleiben zusammen und meiden das Feuer.“"
dlg.ch01.intro.c2: "„Wir schlagen eine Schneise mitten hindurch.“"
dlg.ch01.intro.005: "Vorsichtig. Gut. Tote Söldner kassieren keinen Sold."
dlg.ch01.intro.006: "Mutig. Hoffen wir, dass das Feuer das auch so sieht."
dlg.ch01.tutorial_fire.001: "Siehst du die Flammen im Gras? Feuer breitet sich jede Runde aus. Wer darin steht, verbrennt."
dlg.ch01.tutorial_fire.002: "Ziel ist die Brücke im Norden. Ich muss sie erreichen – Hask müssen wir dafür nicht töten."
dlg.ch01.tutorial_fire.003: "Und die Häuser? Da sind noch Leute drin! Wir sollten sie besuchen, bevor die Plünderer es tun."
dlg.ch01.ambush.001: "Hinterhalt! Sie haben in den Ruinen gewartet!"
dlg.ch01.hask_battle.001: "Brennt schön, nicht wahr? Bald brennt ihr mit!"
dlg.ch01.village_north.001: "Eine alte Frau drückt Tobin einen Beutel in die Hand. „Für die Brücke. Bringt die Kinder rüber.“"
dlg.ch01.village_west.001: "Ein Schmied drückt euch einen Wurfspieß in die Hand. „Damit trefft ihr sie, bevor sie euch treffen.“"
dlg.ch01.mira_village.001: "Noch ein Schritt und du hast einen Pfeil im – oh. Ihr seid nicht von Hasks Bande."
dlg.ch01.mira_village.002: "Aschenbanner. Wir wollen zur Brücke. Du schießt gut?"
dlg.ch01.mira_village.003: "Besser als jeder Adlige, der je in diesem Wald gejagt hat. Ich bin Mira. Ich komme mit – aber ich verteidige zuerst mein Dorf."
dlg.ch01.mira_lost.001: "Das Haus am Ostrand … sie haben es angezündet. Da war jemand drin. Wir kommen zu spät."
dlg.ch01.outro.001: "Die Brücke steht. Die Stadt nicht."
dlg.ch01.outro.002: "Ein Bote der Silbernen Lanze war hier. Er hat nach einer Seherin gefragt – am Schrein im Silberbach-Tal."
dlg.ch01.outro.003: "Die Lanze sucht eine Seherin, während das Land brennt? Dann ist sie wichtig. Wir finden sie zuerst."
dlg.ch02.intro.001: "Frühherbst. Nebel liegt über dem Silberbach. Am Schrein brennt ein einzelnes weißes Licht."
dlg.ch02.intro.002: "Ihr kommt spät, Hauptmann Kael. Ich habe euch vor drei Tagen gesehen – in einem Traum aus Asche."
dlg.ch02.intro.003: "Du kennst meinen Namen."
dlg.ch02.intro.004: "Ich kenne auch den Namen der Frau, die mich holen will. Morra. Ihre Söldner stehen schon am Bach."
dlg.ch02.intro.005: "Morra … die verkauft ihre eigene Mutter, wenn der Preis stimmt."
dlg.ch02.intro.c1: "„Wir halten den Schrein, bis Morra aufgibt.“"
dlg.ch02.intro.c2: "„Wer hat Morra bezahlt? Das will ich wissen.“"
dlg.ch02.intro.006: "Acht Runden, schätze ich. Dann wird ihr der Auftrag zu teuer."
dlg.ch02.intro.007: "Eine gute Frage. Die Antwort wird euch nicht gefallen."
dlg.ch02.tutorial_talk.001: "Liora steht auf dem Schrein. Sie heilt sich dort, aber allein hält sie nicht lange. Fällt sie, ist alles verloren."
dlg.ch02.tutorial_talk.002: "Und Kael … der Kerl mit dem Pflaumenmantel da drüben. Das ist doch Varek?"
dlg.ch02.tutorial_talk.003: "Varek. Wenn ich nah genug rankomme, rede ich mit ihm. Er hat nie für etwas gekämpft, das er nicht mochte."
dlg.ch02.varek_spotted.001: "Na sieh an. Kael vom Aschenbanner. Willst du würfeln oder fechten?"
dlg.ch02.varek_talk.001: "Varek. Seit wann entführst du Seherinnen?"
dlg.ch02.varek_talk.002: "Seit Morra im Voraus zahlt. Aber, ehrlich gesagt … der Auftraggeber trägt eine goldene Maske. Das gefällt mir nicht."
dlg.ch02.varek_talk.003: "Dann zahl ich dir das Doppelte. Später."
dlg.ch02.varek_talk.004: "Später. Mein Lieblingsbetrag. Na gut – die Würfel sagen: Aschenbanner."
dlg.ch02.reinforcements.001: "Mehr kommen. Von Westen und Osten – ich sehe ihre Schatten im Nebel."
dlg.ch02.morra_battle.001: "Nichts Persönliches, Kael. Nur ein Auftrag. Aber ich erfülle meine Aufträge."
dlg.ch02.village_mill.001: "Der Müller schiebt euch einen Heiltrank zu. „Für die Seherin. Sie hat meinen Sohn gesund gebetet.“"
dlg.ch02.village_herb.001: "Eine Kräuterfrau gibt euch eine Rune, kühl wie Bachwasser. „Wasser löscht Feuer. Vergesst das nicht.“"
dlg.ch02.outro.001: "Morra zieht ab. Ihr habt mich gerettet, Aschenbanner. Und ich bezahle meine Schulden."
dlg.ch02.outro.002: "Die Krone ist nicht gestohlen worden, Hauptmann. Sie wurde … zurückgenommen. Mehr kann ich noch nicht sagen."
dlg.ch02.outro.003: "Zurückgenommen? Von wem?"
dlg.ch02.outro.004: "Von dem, dem sie immer gehört hat. Lasst mich mit euch gehen. {avatar} – ich habe dich in meinem Traum gesehen. Du hast die Krone gehalten."
dlg.support.avatar_kael.C.001: "Du schläfst nicht. Albträume?"
dlg.support.avatar_kael.C.002: "Ich frage nur, weil ich sie auch habe. Seit der Nacht des Paktfestes."
dlg.support.avatar_kael.C.003: "Ich stand vor der Tür des Königs. Ich habe nichts gehört. Nichts. Und am Morgen war er tot."
dlg.support.avatar_kael.C.004: "Deshalb habe ich dich angeheuert. Jemand, der Muster sieht, wo ich nur Schatten sehe."
dlg.support.avatar_kael.B.001: "Deine Karte von Varnhold … du hast die Brandrichtung vorhergesagt. Auf drei Felder genau."
dlg.support.avatar_kael.B.002: "Die Akademie war dumm, dich gehen zu lassen. Oder sie hatte Angst vor dir."
dlg.support.avatar_kael.B.003: "Was es auch ist – du gehörst jetzt zum Aschenbanner. Das bedeutet: Wir lassen niemanden zurück."
dlg.support.brenna_kael.C.001: "Du grübelst wieder, Hauptmann. Man hört es bis zum Kochtopf."
dlg.support.brenna_kael.C.002: "Ich habe das Emblem nicht ganz abgekratzt. Man sieht noch die Lanze."
dlg.support.brenna_kael.C.003: "Ich hab dich nicht aus dem Kerker gekauft, damit du dich mit einem Stück Blech quälst."
dlg.support.brenna_kael.C.004: "Du hast mich für zwölf Silberstücke gekauft. Ein Schnäppchen, sagst du immer."
dlg.support.brenna_kael.C.005: "Und ich bereue keinen Heller. Jetzt iss."
dlg.support.brenna_kael.B.001: "Wenn wir je nach Aurenhall zurückgehen … erkennen sie dich?"
dlg.support.brenna_kael.B.002: "Sie werden mich erkennen. Als den Wächter, der versagt hat."
dlg.support.brenna_kael.B.003: "Dann sollen sie erst mal an mir vorbei. Und an meiner Axt."
dlg.support.brenna_tobin.C.001: "Brenna! Bring mir den Trick bei, wo du die Axt wirfst und sie zurückkommt!"
dlg.support.brenna_tobin.C.002: "Sie kommt nicht zurück, Kleiner. Ich hole sie. Das ist der Trick."
dlg.support.brenna_tobin.C.003: "Oh. Aber Helden in den Liedern …"
dlg.support.brenna_tobin.C.004: "Helden in den Liedern sterben jung, Tobin. Ich will, dass du alt wirst. Also: Schild hoch."
dlg.support.mira_tobin.C.001: "Dein Hut sitzt schief. Schon wieder."
dlg.support.mira_tobin.C.002: "Der sitzt genau richtig! So schützt er das linke Ohr."
dlg.support.mira_tobin.C.003: "Und das rechte? Egal. Willst du lernen, wie man mit einem Bogen trifft?"
dlg.support.mira_tobin.C.004: "Du würdest mir das zeigen?"
dlg.support.mira_tobin.C.005: "Morgen früh. Bevor die Vögel wach sind. Verschlaf, und ich nehme deinen Hut als Zielscheibe."
dlg.support.brenna_varek.C.001: "Ich behalte dich im Auge, Würfelmann."
dlg.support.brenna_varek.C.002: "Nur eins? Ich bin geschmeichelt."
dlg.support.brenna_varek.C.003: "Gestern hast du für Morra gekämpft. Heute für uns. Und morgen?"
dlg.support.brenna_varek.C.004: "Morgen für den, der mir nicht in den Rücken fällt. Bisher führt ihr."
dlg.support.avatar_liora.C.001: "Du siehst mich an, als wüsstest du nicht, ob du mir glauben sollst."
dlg.support.avatar_liora.C.002: "In meinem Traum hattest du keine Augen für die Krone. Nur für den Berg dahinter."
dlg.support.avatar_liora.C.003: "Ich weiß nicht, was es bedeutet. Aber ich weiß, dass du es herausfinden wirst."
dlg.prologue.tutorial_danger.001: "Tipp einen Gegner an: Das rote Feld zeigt, wie weit er in seiner Phase kommt. Wer verwundet ist, bleibt draußen."
dlg.prologue.tutorial_danger.002: "Und nutzt die Bäume. Wer im Wald steht, wird seltener getroffen."
dlg.prologue.tutorial_heal.001: "Kael, du blutest! Nimm einen Heiltrank – unter „Item“, bevor du wartest."
dlg.ch01.tutorial_triangle.001: "Hasks Leute tragen Äxte, die Deserteure Lanzen, die Söldner Schwerter. Merkt euch: Schwert schlägt Axt, Axt schlägt Lanze, Lanze schlägt Schwert."
dlg.ch01.tutorial_triangle.002: "Und meine Lanze schlägt … Schwerter! Lasst mir die Söldner!"
dlg.ch01.tutorial_triangle.003: "Grünes ▲ in der Vorschau heißt Vorteil, rotes ▼ Nachteil. Ich nehme mir die Lanzenträger."
dlg.ch01.outro.004: "{avatar} – das lag in Hasks Zelt. Ein Glut-Folio. Du hast an der Akademie Magie gelernt, oder? Nimm es."
dlg.ch02.tutorial_magic.001: "Magie trifft den Geist, nicht die Rüstung: Sie rechnet mit MAG gegen RES und reicht zwei Felder weit."
dlg.ch02.tutorial_magic.002: "{avatar}, dein Folio taugt gegen die Gepanzerten. Und haltet Abstand zu ihrer Magierin – Rüstung hilft da nicht."
dlg.ch02.tutorial_talk.004: "Stellt mich neben ihn und wählt „Ansprechen“. Greift ihn bis dahin nicht an."
