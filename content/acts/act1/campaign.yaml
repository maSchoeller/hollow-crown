# Akt 1 (Paket act1), Kampagne V1: Prolog, Missionen 1-1 bis 1-3 (concept/11 §7, concept/08 §4). Startwerte [C].
# Knoten (Architektur §5.4): kind story|side (Standard story), fixed first|finale, requires (Bedingungen), memorialIf + memorial { pre, post }.
# Verfügbar ist, was availableNodes ausrechnet: erst nur fixed: first, dann alles mit erfüllten requires, das Finale nach allen anderen Story-Knoten.
act: 1
# Stufendeckel des Akts (GDD Figurensystem): EP darüber verfallen
levelCap: 10
# Gestaffelte Einführung (GDD, Architektur §5.4): Mechanik → Zahl abgeschlossener Story-Missionen des Akts, ab der sie gilt.
# Kapitel 3 ist noch nicht gebaut; bis dahin bleiben Elemente und Unterstützungen aus.
mechanics:
  triangle: 1
  magic: 2
  elements: 3
  supports: 3
# Wo die Truppe zu Beginn des Akts lebt; die Räume stehen in content/core/rooms.yaml (U20 Freischaltung dort als requires).
home: camp
startGold: 500
# Ortsbild, das ein Knoten ohne eigenes place beim Laden zeigt (art/mockups/locations-s1); place eines Knotens: Ort (art/mockups/locations-s1/<id>.png)
defaultPlace: lager_unterwegs
startConvoy:
  - { def: vulnerary }
  - { def: iron_lance }
nodes:
  - { id: prologue, expectedLevel: 1, map: prologue_paktnacht, titleKey: node.prologue.title, pre: scn.prologue.intro, post: scn.prologue.outro, fixed: first, place: paktnacht_glutdom, merchantTier: 0 }
  # Glutbuch (Ember) für Rhen nach der 2. Story-Mission: mit ihr wird die Magie frei (mechanics magic: 2)
  - { id: m1_1, expectedLevel: 2, map: m1_1_steckbriefe, titleKey: node.m1_1.title, pre: scn.m1_1.intro, post: scn.m1_1.outro, requires: [{ completed: prologue }], place: varnhold, merchantTier: 1, effects: [{ recruit: fenn }], grants: [{ unit: avatar, item: { def: ember } }] }
  # 1-2: Mira tritt nach dem Sieg bei, wenn ihr Haus nicht abgebrannt ist (Battle-Flag mira_house_razed, gesetzt vom Karten-Trigger); wer es im Kampf besucht hat, ist schon dabei
  - { id: m1_2, expectedLevel: 3, map: m1_2_erlbach, titleKey: node.m1_2.title, pre: scn.m1_2.intro, post: scn.m1_2.outro, requires: [{ completed: m1_1 }], place: erlbach, merchantTier: 1, effectsIf: [{ requires: [{ not: { flag: mira_house_razed } }], effects: [{ recruit: mira }] }] }
  # 1-3: Liora wird eskortiert und tritt danach bei (Ziel escort, Beitritt im Kern); Halvards erster Auftritt in scn.m1_3.outro
  - { id: m1_3, expectedLevel: 3, map: m1_3_silberbach, titleKey: node.m1_3.title, pre: scn.m1_3.intro, post: scn.m1_3.outro, requires: [{ completed: m1_1 }], place: silberbach, merchantTier: 1 }
  # Nebenquest N2 (Story 9.11, Lore): öffnet nach Mission 1-3. Glutfunke mit dem Sieg (Knotenwirkung); Chronik-Seite und Relikt nur aus den Truhen der Karte, sonst für diese Kampagne verpasst (Produktinhaber 2026-10-26). expectedLevel nach 1-3 [C].
  - { id: n2, kind: side, expectedLevel: 3, map: n2_wachturm, titleKey: node.n2.title, pre: scn.n2.intro, post: scn.n2.outro, requires: [{ completed: m1_3 }], place: wachturm, merchantTier: 1, effects: [{ item: { def: ember_spark } }] }
  # Nebenquest N1 (Story 9.10): öffnet mit E2 „schützen“, bleibt über die Akte offen (eine Nebenquest verfällt nie). Belohnung bei Sieg im Konvoi: Elster + Glutfunke, auch in der Gedenk-Variante (Produktinhaber 2026-10-26). expectedLevel nach 1-4 [C].
  - { id: n1, kind: side, expectedLevel: 4, map: n1_ring, titleKey: node.n1.title, pre: scn.n1.intro, post: scn.n1.outro, requires: [{ flag: { e02: protect } }], memorialIf: { dead: fenn }, memorial: { pre: scn.n1.memorial_intro, post: scn.n1.memorial_outro }, place: varnhold_nacht, merchantTier: 1, effects: [{ item: { def: magpie } }, { item: { def: ember_spark } }] }
  # Mission 1-6: Eroberung der Paktwacht, danach die Burg als Heimat und Entscheidung E4. expectedLevel/merchantTier: technische Startwerte, final per Simulation.
  # Übergang: m1_4 und m1_5 kommen dazu, sobald 9.5/9.6 auf main sind (Produktinhaber 2026-10-26: m1_6 verlangt m1_2–m1_5)
  - { id: m1_6, expectedLevel: 7, map: m1_6_paktwacht, titleKey: node.m1_6.title, pre: scn.m1_6.intro, post: scn.m1_6.outro, requires: [{ completed: m1_2 }, { completed: m1_3 }], place: paktwacht_ruine, merchantTier: 2, effects: [{ setHome: castle }] }
  # Mission 1-7: Gewölbe unter der Paktwacht (treasure), danach das Finale (Story 9.9). expectedLevel/merchantTier laut Produktinhaber 2026-10-26; Wirkung bei Sieg: die versiegelte Chronik
  - { id: m1_7, expectedLevel: 8, map: m1_7_gewoelbe, titleKey: node.m1_7.title, pre: scn.m1_7.intro, post: scn.m1_7.outro, requires: [{ completed: m1_6 }], place: paktwacht_gewoelbe, merchantTier: 2, effects: [{ setFlag: wardens_chronicle }] }
  # Mission 1-8: das Finale des Akts (fixed: finale, öffnet nach allen übrigen Story-Knoten). Die Burg ist Heimat (place paktwacht_heimat). expectedLevel/merchantTier laut Produktinhaber 2026-10-26.
  # Die zwei Glutfunken sind zwei Knoten-Wirkungen `item` (nur bei Sieg); die Szene post zeigt sie als Moment (Tafel glutfunken, Funken, Karte „2 × Glutfunke“).
  - { id: m1_8, expectedLevel: 9, map: m1_8_paktwacht_halten, titleKey: node.m1_8.title, pre: scn.m1_8.intro, post: scn.m1_8.outro, requires: [{ completed: m1_7 }], fixed: finale, place: paktwacht_heimat, merchantTier: 2, effects: [{ item: { def: ember_spark } }, { item: { def: ember_spark } }] }
merchant:
  - tier: 0
    items: [vulnerary, iron_sword, iron_lance, iron_axe, iron_bow, iron_dagger, hunting_bow, travel_lute, leather_vest, leather_cap, wooden_shield, door_key]
  - tier: 1
    items: [javelin, hand_axe, steel_sword, chainmail, iron_helm, ember, remedy_salve, heal_staff, mage_robe]
  # Stufe 2 öffnet mit der 4. abgeschlossenen Story-Mission, egal welche (storyCount), oder über merchantTier eines Knotens
  - tier: 2
    storyCount: 4
    items: [steel_lance, steel_axe, steel_bow, iron_shield, fire_bomb, gust, surge, rockfall, shine, mend_staff, slim_sword, ashen_badge, mage_hood]
scars:
  - { id: lame_leg, mods: { mov: -1 } }
  - { id: shaky_hand, mods: { hit: -10 } }
  - { id: broken_ribs, mods: { hp: -3 } }
  - { id: weak_eye, mods: { crit: -5, hit: -5 } }
  - { id: shattered_shoulder, mods: { str: -2 } }
  - { id: nightmares, mods: { lck: -3, avoid: -5 } }
