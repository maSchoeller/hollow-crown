  - { id: m1_1, expectedLevel: 2, map: m1_1_steckbriefe, titleKey: node.m1_1.title, pre: scn.m1_1.intro, post: scn.m1_1.outro, requires: [{ completed: prologue }], place: varnhold, pos: [70, 47], merchantTier: 1, effects: [{ recruit: fenn }] }
  # Brücke bis Story 9.3/9.4: die PoC-Knoten ch01 und ch02 bleiben nach 1-1 im Graphen, bis 1-2 und 1-3 sie ersetzen
  - { id: ch01, expectedLevel: 2, map: ch01_varnhold, titleKey: node.ch01.title, pre: scn.ch01.intro, post: scn.ch01.outro, requires: [{ completed: m1_1 }], place: erlbach, pos: [60, 42], merchantTier: 1, grants: [{ unit: avatar, item: { def: ember } }] }
  - { id: ch02, expectedLevel: 3, map: ch02_silverbrook, titleKey: node.ch02.title, pre: scn.ch02.intro, post: scn.ch02.outro, requires: [{ completed: ch01 }], place: varnhold, pos: [43, 66], merchantTier: 2 }
