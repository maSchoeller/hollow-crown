# Mission 1-7 – Unter der Paktwacht (Knoten m1_7). Entwurf s1_1_7_gewoelbe (abgenommen 2026-11-01), Missionsliste: K 16×20, treasure, 6 / 14, Plünderer, kein Leutnant. Startwerte [C].
# Gewölbe im Fels des Grauen Kamms hinter der Burg, eben (keine Höhenstufen): Eingangshalle im Süden, ein Hauptgang nach Norden, vier Grabkammern seitlich, Königskammer mit der versiegelten Chronik im Norden. Nebel, Fackeln.
# Zweite veränderliche Karte: Ab Runde 4 bebt es aus dem Norden (scn.m1_7.quake). Runde 5 stürzt die Königskammer ein, Runde 6 die oberen, Runde 7 die unteren Kammern; alles als `set_terrain` zu `rockwall`.
# Figuren werden nicht geschoben: Ein Feld bleibt, solange dort jemand steht (Regel 2026-11-05, die Entwurfsnotiz sagte anderes). Verschüttete Truhen sind verloren: Das Objekt bleibt, aber kein Weg führt mehr hin.
# Hauptziel nur die Chronik c_chronicle in 10 Runden (Story 15.10, vorher 8: Leicht 88 % Siege, alle Niederlagen an der Frist), die Wahl der Karte ist Chronik oder Beute. Der Hauptgang und der Weg zur Chronik bleiben offen.
# Abweichung vom Entwurf: In Runde 5 bleiben zusätzlich [7,3] und [8,3] stehen, sonst wäre die Chronik abgeschnitten (die Entwurfsnotiz nannte nur [7–8,1–2]).
# Abweichung vom Entwurf: Schlüssel. Die Mission bleibt ohne Späher lösbar (E2 „ausliefern“, Fenn fehlt): Jeder Plünderer trägt einen Schlüssel und lässt ihn fallen, nicht nur der Anführer.
# Die Chronik ist kein Gegenstand: Die Truhe enthält nichts; das Flag wardens_chronicle setzt der Knoten m1_7 beim Sieg (campaign.yaml). Grabreliefs: Gelände `relief`, heilt nicht, [1,6] und [14,12] lösen je eine Szene aus.
# Balancing 2026-11-05 [C]: Der Hauptgang bleibt leicht (Stufe 4–5, seit Story 15.10 3–5), sonst scheitert der Simulator-Spieler an der Frist; die Kammern und Spaltenwellen sind mit Stufe 4–6 und Radius 4 die Gefahr (Entwurf Stufe 3–4 gab 0,15 Niedergestreckte).
# Story 15.10 [C]: drei Plünderer mehr aus den Seitenhallen (p12–p14, Normal und Schwer) und einer mehr in Runde 3; dafür p1, p9, p10 eine Stufe tiefer. Normal vorher 0,32 Niedergestreckte.
