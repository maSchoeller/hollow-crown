      - { nameKey: unit.looter.name, team: enemy, class: brigand, sprite: brigand, level: 4, at: [12, 4], items: [{ def: iron_axe }], ai: { profile: aggressive }, difficulty: [normal, hard] }
  - turn: 5
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.looter.name, team: enemy, class: brigand, sprite: brigand, level: 5, at: [1, 13], items: [{ def: iron_axe }], ai: { profile: aggressive } }
      - { nameKey: unit.looter.name, team: enemy, class: scout, sprite: mercenary, level: 5, at: [14, 13], items: [{ def: iron_dagger }], ai: { profile: aggressive }, difficulty: [normal, hard] }
objectives:
  # treasure löst die Niederlage durch die Rundenfrist selbst aus (kein defeat turn_limit)
  victory: { type: treasure, chests: [c_chronicle], turns: 12 }
  defeat:
    - { type: unit_dies, unit: lucan }
    - { type: unit_dies, unit: avatar }
  side:
    - { id: s_chests, type: open_chests, reward: { gold: 300 } }
    - { id: s_clean, type: no_downs, reward: { item: { def: vulnerary } } }
triggers:
  # Das Beben aus dem Norden, Warnung vor dem Einsturz
  - id: t_quake
    once: true
    when: { type: turn_start, turn: 7, phase: player }
    then:
      - { action: dialogue, id: scn.m1_7.quake }
  # Runde 8: Königskammer außer der Chronik und dem Weg zu ihr
  - id: t_collapse_king
    once: true
    when: { type: turn_start, turn: 8, phase: player }
    then:
      - { action: set_terrain, area: { rect: [4, 1, 6, 3] }, terrain: rockwall }
      - { action: set_terrain, area: { rect: [9, 1, 11, 3] }, terrain: rockwall }
  # Runde 9: die oberen Kammern
  - id: t_collapse_upper
    once: true
    when: { type: turn_start, turn: 9, phase: player }
    then:
      - { action: set_terrain, area: { rect: [1, 6, 4, 8] }, terrain: rockwall }
      - { action: set_terrain, area: { rect: [11, 6, 14, 8] }, terrain: rockwall }
  # Runde 10: die unteren Kammern; der Hauptgang bleibt
  - id: t_collapse_lower
    once: true
    when: { type: turn_start, turn: 10, phase: player }
    then:
      - { action: set_terrain, area: { rect: [1, 12, 4, 14] }, terrain: rockwall }
      - { action: set_terrain, area: { rect: [11, 12, 14, 14] }, terrain: rockwall }
  # Grabreliefs junger Könige (Beat 6): einmalig beim Betreten, nur durch die Truppe
  - id: t_relief_west
    once: true
    when: { type: unit_enters, team: player, area: { rect: [1, 6, 1, 6] } }
    then:
      - { action: dialogue, id: scn.m1_7.relief_west }
  - id: t_relief_crypt
    once: true
    when: { type: unit_enters, team: player, area: { rect: [14, 12, 14, 12] } }
    then:
      - { action: dialogue, id: scn.m1_7.relief_crypt }
  # die versiegelte Chronik: gefunden, bleibt versiegelt
  - id: t_chronicle
    once: true
    when: { type: object_activated, object: c_chronicle }
    then:
      - { action: dialogue, id: scn.m1_7.chronicle }
# Szenen (Knoten m1_7): scn.m1_7.intro vorher; scn.m1_7.outro nachher (Heimkehr, Chronik ins Burgarchiv).
goldReward: 800
music: battle_a
design:
  title: Unter der Paktwacht
  intent: >
    Zweite veränderliche Karte: Das Gewölbe stürzt ab Runde 8 von Norden her ein. Der Spieler muss wählen zwischen der Chronik
    (Sieg) und den Grabkammern (Beute), bevor sie verschüttet sind. Enge Gänge, Dunkelheit, Plünderer aus Felsspalten.
  mood: Dunkles Felsgewölbe, Fackeln an den Wänden, Steinsarkophage junger Könige mit Kronen-Reliefs, Staub rieselt, ein fahles Glühen im Norden.
  phases:
    - { id: p1, turns: [1, 6], label: Gang, note: "Plünderer in Gang und unteren Kammern; Spaltenwelle Nordost (R3)." }
    - { id: p2, turns: [7, 9], label: Beben, note: "R7 Beben; R8 stürzt die Königskammer bis auf die Chronik ein, R9 die oberen Kammern." }
    - { id: p3, turns: [10, 12], label: Flucht nach vorn, note: "R10 stürzen die unteren Kammern ein; der Hauptgang bleibt offen." }
  paths:
    - { team: player, points: [[7, 18], [7, 13], [7, 4], [7, 2]], label: Hauptgang }
    - { team: player, points: [[6, 13], [3, 13]], label: Kammer W1 }
    - { team: player, points: [[9, 13], [12, 13]], label: Kammer O1 }
    - { team: enemy, points: [[13, 4], [11, 3], [9, 3]], phase: p1, label: R3 Spalte }
  zones:
    - { area: { rect: [4, 1, 11, 3] }, label: Königskammer, phase: p2 }
    - { area: { rect: [1, 6, 4, 8] }, label: Einsturz R6, phase: p2 }
    - { area: { rect: [11, 6, 14, 8] }, label: Einsturz R6, phase: p2 }
    - { area: { rect: [1, 12, 4, 14] }, label: Einsturz R7, phase: p3 }
    - { area: { rect: [11, 12, 14, 14] }, label: Einsturz R7, phase: p3 }
  marks:
    - { at: [5, 7], label: T, note: "Verschlossene Tür zur Kammer oben links; Schlüssel oder Fenn." }
    - { at: [12, 13], label: A, note: "Anführer der Plünderer mit Schlüssel." }
    - { at: [7, 1], label: C, note: "Versiegelte Chronik: Siegtruhe; Grabreliefs zeigen den Pakt (Saat Pakt)." }
  notes:
    - "Normal 14 Gegner (3 davon R3/R5) gegen 6 eigene; Leicht 11, Schwer 15."
    - "Verschüttete Truhen sind verloren; die Chronik selbst bleibt bis Runde 8 erreichbar."
