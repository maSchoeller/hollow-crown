# Mission 1-3 – Der Fremde mit dem Siegel (Knoten m1_3). Entwurf s1_1_3_weissdorn (abgenommen), Missionsliste: M 20×25, reach, 7 / 18, Leutnant Morra. Startwerte [C].
# Grenzwald, früher Morgen, Nebel des Krieges (fog) und Wetter Nebel. Ziel: Rhen erreicht den Schrein am Weißdorn auf der Lichtung im Norden (reach, nicht mehr rout).
# Der Dateiname und die ID bleiben m1_3_silberbach (Spielstände, Knoten, Tests); Ort ist laut Missionsliste der Schrein am Weißdorn.
# Höhe: Der Schrein liegt auf einer niedrigen Terrasse (x 6–13, y 1–2, Stufe 1), das Ziel liegt oben. Hinauf führt eine Rampe in der Mitte, zwei Felder breit ([9,3], [10,3]).
# Morras zwei Schützen stehen oben in den Ruinen ([7,2], [12,2]) und treffen die Rampe von oben auf 2–3 Felder. Der Rest der Karte ist flach.
# Drei Wege: die Waldstraße in Schleifen (lang, Holzsteg über den Bach), zwei Wildwechsel West und Ost (kurz, schmal, Hinterhalte).
# Halvard (unangreifbar, Platzhalterfigur villager_elder, bis es eine eigene gibt) und Liora warten am Schrein. Liora heilt von dort, darf nicht fallen und tritt nach dem Sieg bei (Kern: jede Figur der dritten Partei mit Charakter).
# Morra flieht bei 0 TP (gone: fled), Groll, Kopfgeld; Signaturwaffe Kopfgeld (bounty). Ihre Kartenwaffe ist Eisen (iron_bow), damit „+1 Tier je Groll“ greift.
# Fix 1-3 (2026-11-07): Morra greift nur die Truppe an (ai.prefer: player), sonst fiel sie an Lioras Gegenschlag, bevor die Truppe sie erreichte.
# Die Ost-Truhe liegt in der Waldtasche am Wildwechsel Ost ([18,11] statt [18,7]), bewacht von einer Klinge (Normal), Schütze m11 nur auf Schwer.
# Abweichungen vom Entwurf: Schützen auf der Terrasse statt am Lichtungsrand; Liora und Halvard auf den Schreinfeldern [9,1], [10,1], damit die Rampe frei bleibt und die Schützen Liora nicht von Beginn an treffen.
# Szenen: scn.m1_3.intro vor der Karte (Knoten pre), scn.m1_3.shrine beim Betreten der Lichtung, scn.m1_3.morra_battle (quote), scn.m1_3.outro (Halvard, Beitritt Liora) nach dem Sieg.
