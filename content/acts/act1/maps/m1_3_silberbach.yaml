design:
  title: Der Fremde mit dem Siegel
  intent: >
    Waldkarte mit Nebel des Krieges: Späher sehen weiter, Hinterhalte in Waldtaschen strafen Eile. Die Straße ist sicher, aber lang;
    die Wildwechsel sind schnell, aber eng. Am Ende Morras Schützen über der Rampe zur Terrasse des Schreins.
  mood: Früher Morgen, Nebel zwischen alten Eichen, Lichtstrahlen auf die Lichtung, der Weißdorn voller roter Beeren, moosiger Schrein.
  phases:
    - { id: p1, turns: [1, 3], label: Waldrand, note: "Wegwahl: Straße, Wildwechsel West oder Ost; Hinterhalte in den Taschen." }
    - { id: p2, turns: [4, 6], label: Bach, note: "Häscher folgen von Süden (R4); Holzsteg am Bach als Engstelle." }
    - { id: p3, turns: [7, 11], label: Lichtung, note: "Morras Linie, Flankenleute (R6), Liora heilt vom Schrein aus." }
  paths:
    - { team: player, points: [[9, 22], [9, 20], [13, 20], [13, 12], [7, 12], [7, 9], [10, 9], [10, 3]], label: Waldstraße }
    - { team: player, points: [[6, 21], [3, 16], [3, 12], [5, 7], [8, 3]], label: Wildwechsel West }
    - { team: player, points: [[14, 21], [16, 18], [17, 13], [15, 8], [12, 3]], label: Wildwechsel Ost }
    - { team: enemy, points: [[5, 24], [6, 21]], phase: p2, label: R4 }
    - { team: enemy, points: [[0, 7], [5, 7]], phase: p3, label: R6 }
  zones:
    - { area: { rect: [6, 1, 13, 6] }, label: Lichtung, phase: p3 }
  marks:
    - { at: [9, 3], label: R, note: "Rampe auf die Terrasse (zwei Felder breit), Schützen darüber in den Ruinen." }
    - { at: [13, 14], label: E, note: Holzsteg über den Bach; daneben Furt (langsam). }
    - { at: [5, 16], label: A1, note: Hinterhalt am Wildwechsel West. }
    - { at: [10, 16], label: A2, note: "Hinterhalt nahe der Straße, Schütze dabei." }
    - { at: [17, 13], label: A3, note: Hinterhalt am Wildwechsel Ost. }
  notes:
    - "Normal 16 Gegner mit Morra (4 davon R4/R6) gegen 7 eigene, Stufe 2–3; Leicht 13, Schwer 20 (Fix 1-3: Ost-Truhe vorgerückt, ein Schütze dort nur noch auf Schwer)."
    - "Aufstellbar 7: Rhen, Lucan, Brenna, Tobin, Fenn + Mira, falls 1-2 zuerst gespielt; sonst Söldner."
    - "Halvard tritt hier zum ersten Mal auf und kennt jeden Namen (Nachszene am Schrein); Liora tritt nach dem Sieg bei."
    - Keine Geländeveränderung (nächste veränderliche Karte 1-4).
