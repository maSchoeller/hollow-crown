# Mission 1-3 – Der Fremde mit dem Siegel (Story 9.4, Knoten m1_3). Startwerte [C], Stufen und Profile per Simulation abgestimmt.
# Ort: der Schrein am Silberbach. Tageszeit: Morgen, Wetter: Nebel (Wetter, kein Kriegsnebel; art-direction §2.5; weather: fog).
# Ziel: rout – die Truppe hält den Schrein und vertreibt Morras Jäger; Liora (dritte Partei, Profil hold) bleibt dort und darf nicht fallen
# (defeat unit_dies liora). Nach dem Sieg tritt sie bei (Kern: jede Figur der dritten Partei mit Charakter). Erste Begegnung mit Leutnant Morra
# und ihren Jägern. Vorher war das Ziel escort (Liora zum Ausgang im Süden); PO 2026-10-28: die Eskorte trieb die Truppe am Haus und den
# Gegnern vorbei zum Ausgang, Häuser besuchen und Gegner besiegen blieb unmöglich (narrative decision-log, Eintrag 2026-10-28).
# Halvards Auftritt ist die Nachszene scn.m1_3.outro, nicht Teil der Karte.
# Lehrstück: Engstelle Brücke (x=7) für Vorkämpfer, Furten (x=3, x=12) nur Fußtruppen; Wald an den Flanken als Deckung für Späher/Hinterhalt.
# 16 × 18 (Hochformat).
id: m1_3_silberbach
nameKey: map.m1_3_silberbach.name
size: [16, 18]
fog: false
legend:
  ".": plain
  ",": grass
  "T": forest
  "^": mountain
  "~": river
  "w": shallows
  "=": bridge
  "s": sand
  "H": village
  "R": ruins
  "S": shrine
#          x: 0123456789ABCDEF
terrain: |
  ^^TT,,,,,,,,TT^^
  ^T,,,,R,,R,,,T^^
  T,,,,,,,S,,,,,,T
  ,,TT,,,..,,,TT,,
  T,TT,,,..,,,TT,,
  ,,,,,,,..,,,,,,,
  ss,,,,,..,,,,,ss
  ssss,,,..,,,ssss
  ~~~w~~~=~~~~w~~~
  ~~~w~~~=~~~~w~~~
  ssss,,,..,,,ssss
  ,,,,,,T..T,,H,,,
  T,,TT,,..,,,TT,,
  ,,TT,,,..,,,TT,,
  T,,,,,,..,,,,,,T
  ,,,H,,,..,,,,,,,
  ,,,,,,,..,,,,,,,
  ,,,,,,,..,,,,,,,
# Tageszeit und Wetter (Story 8.6): Preset aus render.yaml look.timeOfDay/weather
timeOfDay: morning
weather: fog
lights:
  - { at: [8, 2], color: "#fff1c4", radius: 3 }
objects:
  - { id: v_hut,  type: village, at: [3, 15],  reward: { gold: 200, dialogue: scn.m1_3.house_hut } }
  - { id: v_mill, type: village, at: [12, 11], reward: { item: { def: vulnerary }, dialogue: scn.m1_3.house_mill } }
initialEffects: []
deploy:
  max: 5
  forced: [avatar, kael]
  slots: [[8, 4], [7, 4], [9, 4], [6, 4], [8, 5], [7, 5], [8, 3], [7, 3]]
# Heimsuchungs-Anker (Story 5.5): höchstens einer je Variante, die Gründe stehen als Kommentar darüber
haunts:
  # Grund: der Schrein am Silberbach, an dem die Truppe Liora fand – hier beginnt der Weg nach Süden. Der Zivilist wartet nördlich der Brücke, die Jäger
  # setzen aus dem Norden nach (Simulation 2026-10-28: Jäger im Süden, am Weg zum Ausgang, ließen die Truppe stehen bleiben – 38 %, so 83 %).
  - variant: escort
    target: { at: [8, 6] }
    enemySpawn: { rect: [4, 0, 11, 1] }
    deploy: { tiles: [[8, 7], [8, 4], [7, 5], [9, 5], [7, 4], [9, 4], [7, 6], [9, 6]] }
    exit: { rect: [6, 17, 9, 17] }
  # Grund: die Brücke über den Silberbach – Hinterhalt an der Engstelle.
  - variant: rout
    target: { at: [7, 8] }
    enemySpawn: { rect: [5, 3, 10, 5] }
    deploy: { rect: [6, 14, 9, 15] }
  # Grund: der Wald an der Westflanke, aus dem Morras Jäger traten.
  - variant: boss
    target: { at: [3, 12] }
    enemySpawn: { rect: [0, 10, 2, 13] }
    deploy: { rect: [6, 14, 9, 15] }
# Epic 3: Morra flieht bei 0 TP (gone: fled), Groll, Kopfgeld; Signaturwaffe Kopfgeld (bounty). Ihre Kartenwaffe ist Eisen (iron_bow), damit
# „+1 Tier je Groll“ greift (Review R14/R15). Morra ist Schützin (Klasse marksman aus lieutenants.yaml), kein Boss: das Ziel ist escort.
# Liora: dritte Partei am Schrein (Heilstab), Profil hold – sie bleibt am Schrein, heilt aus der Nähe und wird von der Truppe gedeckt.
# Balancing 2026-10-28 [C]: Stufen der Banditen 3 statt 2 (h2 bleibt 3, h4 Stufe 4, h8/Schütze Stufe 4 nur Schwer), Auslöseradius der Schleichwege 6 statt 4/5, h7 trigger statt hold (Normal/Schwer). Hintergrund: Schwer lag bei 97 % Sieg (Korridor 30-70), Normal bei 0,3 Niedergestreckten (Korridor 0,4-1,3).
units:
  - { char: liora, id: liora, team: other, class: healer, level: 3, at: [8, 2], items: [{ def: shine }, { def: heal_staff }, { def: mage_robe }, { def: vulnerary }, { def: leather_vest }, { def: leather_cap }], ai: { profile: hold } }
  - id: morra
    nameKey: unit.morra.name
    team: enemy
    class: marksman
    level: 5
    at: [14, 14]
    lieutenant: morra
    sprite: morra
    portrait: morra
    items: [ { def: iron_bow }, { def: vulnerary } ]
    drops: [1]
    ai: { profile: trigger, radius: 4, then: aggressive }
    quote: scn.m1_3.morra_battle
  - { id: h1, nameKey: unit.bounty_hunter.name, team: enemy, class: vanguard,   sprite: soldier,       level: 3, at: [2, 6],  items: [{ def: iron_lance }], ai: { profile: trigger, radius: 6, then: aggressive } }
  - { id: h2, nameKey: unit.bounty_hunter.name, team: enemy, class: brigand,    sprite: brigand,       level: 3, at: [13, 5], items: [{ def: iron_axe }],   ai: { profile: trigger, radius: 6, then: aggressive } }
  - { id: h3, nameKey: unit.bounty_hunter.name, team: enemy, class: marksman,   sprite: bandit_archer, level: 3, at: [2, 10], items: [{ def: iron_bow }],   ai: { profile: trigger, radius: 6, then: aggressive } }
  - { id: h4, nameKey: unit.bounty_hunter.name, team: enemy, class: skirmisher, sprite: mercenary,     level: 4, at: [13, 10], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 6, then: aggressive } }
  - { id: h5, nameKey: unit.bounty_hunter.name, team: enemy, class: brigand,    sprite: brigand,       level: 3, at: [4, 12], items: [{ def: iron_axe }],   ai: { profile: trigger, radius: 6, then: aggressive } }
  - { id: h6, nameKey: unit.bounty_hunter.name, team: enemy, class: vanguard,   sprite: soldier,       level: 3, at: [11, 13], items: [{ def: iron_lance }, { def: vulnerary }], drops: [1], ai: { profile: hold } }
  - { id: h7, nameKey: unit.bounty_hunter.name, team: enemy, class: marksman,   sprite: bandit_archer, level: 3, at: [12, 3], items: [{ def: iron_bow }],   ai: { profile: trigger, radius: 4, then: aggressive }, difficulty: [normal, hard] }
  - { id: h8, nameKey: unit.bounty_hunter.name, team: enemy, class: skirmisher, sprite: mercenary,     level: 4, at: [1, 13], items: [{ def: iron_sword }], ai: { profile: aggressive }, difficulty: [hard] }
pairs: []
# Wellen von den Seiten, angekündigt: Runde 3 (links/rechts) [C] (vorher schwer Runde 5; der Schütze von links unten entfiel mit dem Ziel rout, 2026-10-28)
reinforcements:
  - turn: 3
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.bounty_hunter.name, team: enemy, class: brigand, sprite: brigand, level: 2, at: [0, 5], items: [{ def: iron_axe }], ai: { profile: aggressive } }
      - { nameKey: unit.bounty_hunter.name, team: enemy, class: vanguard, sprite: soldier, level: 3, at: [15, 5], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [normal, hard] }
objectives:
  victory: { type: rout }
  defeat:
    - { type: unit_dies, unit: kael }
    - { type: unit_dies, unit: avatar }
    - { type: unit_dies, unit: liora }
  side:
    - { id: s_villages, type: visit_villages, reward: { gold: 300 } }
    - { id: s_clean, type: no_downs, reward: { item: { def: vulnerary } } }
    - { id: s_fast, type: turn_limit, turns: 10, reward: { gold: 200 } }   # [C] Startwert
triggers: []
# Szenen: scn.m1_3.intro vor der Karte (Knoten pre), scn.m1_3.morra_battle bei Morras Auftritt (quote), scn.m1_3.outro (Beitritt Liora, Halvard) nach dem Sieg
goldReward: 1100   # [C]
music: battle_a
devNote: >
  Halten und Vertreiben. 16 × 18: Schrein im Norden (Liora), Brücke x=7 als Engstelle, Furten x=3/x=12, zwei Häuser im Süden und Osten. Fällt Liora, ist die Mission verloren.
  Leicht: 8 Gegner; Normal: 10; Schwer: 11 (einschließlich der Welle Runde 3).
