# Prolog – Die letzte Wacht. Banditen überfallen die Karawane. Ziel: alle Gegner besiegen (rout).
# Lektionen: Bewegen, Angriff, Kampfvorschau (Runde 1), Gefahrenzone + Deckung (Runde 2), Heiltrank (bei Bedarf). Startwerte [C].
id: prologue_caravan
nameKey: map.prologue_caravan.name
size: [12, 12]
fog: false
legend:
  ".": plain
  ",": grass
  "_": road
  "T": forest
  "^": mountain
  "F": fort
  "W": wagon
#          x: 0123456789AB
terrain: |
  TTT,,^^,,TTT
  ,T,,.F..,,T,
  T,,..__..,,,
  ,,T,.__.,T,T
  ,,,,.__.,,,,
  ,TT,,__,,TT,
  T,,,,__,,,,,
  ,,T,,__,T,,T
  ,,,,W__W,,,,
  ,,,,.__.,,,,
  TT,,.__.,,TT
  TTT,.__.,TTT
ambient: { color: "#ffe2b0", intensity: 1.0 }
sun: { color: "#ffd9a0", intensity: 1.1, azimuthDeg: 250, elevationDeg: 30 }    # 3D-Brett (D7): tiefe Nachmittagssonne aus Westsüdwest
lights:
  - { at: [5, 1], color: "#ffb35c", radius: 3 }
objects: []
initialEffects: []
deploy:
  max: 4
  forced: [avatar, kael]
  slots: [[5, 9], [6, 9], [5, 10], [6, 10], [4, 10], [7, 10]]
units:
  - id: grosk
    nameKey: unit.grosk.name
    team: enemy
    class: brigand
    level: 3
    at: [5, 1]
    boss: true
    sprite: grosk
    portrait: grosk
    items: [ { def: iron_axe }, { def: vulnerary } ]
    drops: [1]
    ai: { profile: guard }
    quote: dlg.prologue.grosk_battle
  # Nur eine Gegnerart (Axt-Banditen) und keine Fernkämpfer: Der Prolog lehrt Bewegen, Angreifen,
  # Kampfvorschau, Gefahrenzone und Deckung. Das Waffendreieck ist hier noch aus (campaign.yaml mechanics).
  - { id: p_e1, team: enemy, class: brigand, level: 1, at: [3, 4], sprite: brigand, items: [{ def: iron_axe }], ai: { profile: aggressive } }
  - { id: p_e2, team: enemy, class: brigand, level: 1, at: [8, 3], sprite: brigand, items: [{ def: iron_axe }], ai: { profile: aggressive } }
  - { id: p_e3, team: enemy, class: brigand, level: 1, at: [7, 2], sprite: brigand, items: [{ def: iron_axe }], ai: { profile: hold }, difficulty: [normal, hard] }
  - { id: p_e4, team: enemy, class: brigand, level: 2, at: [9, 6], sprite: brigand, items: [{ def: hand_axe }, { def: vulnerary }], drops: [1], ai: { profile: trigger, radius: 3, then: aggressive } }
  - { id: p_e5, team: enemy, class: brigand, level: 2, at: [2, 6], sprite: brigand, items: [{ def: iron_axe }], ai: { profile: trigger, radius: 3, then: aggressive }, difficulty: [hard] }
pairs: []
reinforcements:
  # Schwer: Zwei Nachzügler fallen der Karawane in den Rücken.
  - turn: 3
    phase: enemy
    announce: true
    units:
      - { team: enemy, class: brigand, sprite: brigand, level: 1, at: [1, 11], items: [{ def: iron_axe }], ai: { profile: aggressive }, difficulty: [hard] }
      - { team: enemy, class: brigand, sprite: brigand, level: 1, at: [10, 11], items: [{ def: hand_axe }], ai: { profile: aggressive }, difficulty: [hard] }
objectives:
  victory: { type: rout }
  defeat:
    - { type: unit_dies, unit: kael }
    - { type: unit_dies, unit: avatar }
  side:
    - { id: s_clean, type: no_downs, reward: { item: { def: vulnerary } } }
    - { id: s_fast, type: turn_limit, turns: 7, reward: { gold: 200 } }
triggers:
  # Eine Lektion pro Runde, kurz und genau dann, wenn sie gebraucht wird.
  - id: t_intro
    when: { type: turn_start, turn: 1, phase: player }
    then:
      - { action: dialogue, id: dlg.prologue.tutorial_move }
  - id: t_turn2
    when: { type: turn_start, turn: 2, phase: player }
    then:
      - { action: dialogue, id: dlg.prologue.tutorial_danger }
  - id: t_heal
    when: { type: hp_below, unit: kael, percent: 60 }
    then:
      - { action: dialogue, id: dlg.prologue.tutorial_heal }
goldReward: 300
music: battle_a
devNote: "Kompakte Tutorialkarte. Grosk bewacht die Festung im Norden, die Karawane steht in der Mitte der Straße. Leicht: 3 Banditen + Grosk; Normal: +1; Schwer: +1 und Rückenangriff in Runde 3."
