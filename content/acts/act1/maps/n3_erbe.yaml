# Nebenquest N3 – Das Erbe (Story 9.12). Startwerte [C].
# Variante von m1_2_erlbach (gleiche Geländebasis: Bach im Süden mit Brücke x=7 und Furten, Felder, Wald im Norden), statt der Dorfmitte der Pachthof von Tobins Vater.
# Tageszeit: Mittag, Wetter: klar (art-direction §2.5, Felder timeOfDay/weather). Ziel: alle Gegner besiegen (rout).
# Die Pachteintreiber des Grundherrn (Söldner) haben den Hof besetzt. Hofplatz mit Zaun, Eingang im Süden (x=7–8) als Engstelle.
# Belohnung: Signaturlanze „Erbstück“ (heirloom) bei Sieg als Knotenwirkung in den Konvoi, kein Glutfunke (campaign.yaml n3 effects).
# Gedenk-Variante (Tobin gefallen, memorialIf): kein Kartenunterschied, volle Belohnung, Szenen scn.n3.memorial_intro/outro statt intro/outro.
# Tobin ist Pflichtfigur (Produktinhaber 2026-10-26): forced avatar, kael, tobin; ist er gefallen, filtert die Aufstellung ihn (forced ∩ Truppe) weg.
# Stufen 5–6 [C] Platzhalter, Abgleich per Simulation.
id: n3_erbe
nameKey: map.n3_erbe.name
size: [16, 16]
fog: false
timeOfDay: noon
weather: clear
legend:
  ".": plain
  ",": grass
  "_": road
  "T": forest
  "~": river
  "w": shallows      # Furt, nur Fußtruppen
  "=": bridge
  "H": village       # Wohnhaus/Scheune (besuchbar)
  "A": farm          # Hofgebäude (Requisite farm)
  "f": field
  "x": fence
#          x: 0123456789ABCDEF
terrain: |
  TTTTTTT,,TTTTTTT
  TTTT,,,,,,,,TTTT
  TT,,,,,,,,,,,,TT
  ,,ffff,,,,ffff,,
  ,,ffffx,,xffff,,
  ,,,,,xxxxxx,,,,,
  ,,,,,x,A,,x,,,,,
  ,,,,,x,,,Hx,,,,,
  ,,,,,x,,,,x,,,,,
  ,,,,,xx__xx,,,,,
  ,ffff,,__,,ffff,
  ,ffff,,__,,ffff,
  ~~~w~~~=~~~~w~~~
  ~~~w~~~=~~~~w~~~
  T,,,,,,_.,,,,,,T
  TT,,,,,..,,,,,TT
lights: []
objects:
  - { id: v_home, type: village, at: [9, 7], reward: { gold: 300, dialogue: scn.n3.home } }   # Elternhaus; Szene scn.n3.home (Dorfbelohnung)
initialEffects: []
# Heimsuchungs-Anker (Story 5.5, noch ohne Schema):
#   [8,7] Grund: der Hofplatz – Tobins Elternhof, hierhin kommen die Eintreiber zurück.
#   [7,11] Grund: der Weg vom Bach zum Hof.
deploy:
  max: 5
  forced: [avatar, kael, tobin]
  slots: [[7, 14], [8, 14], [6, 14], [9, 14], [7, 15], [8, 15], [6, 15]]
# Pachteintreiber des Grundherrn (Söldner). Normal 7, Leicht 5, Schwer 9.
# Balancing 2026-10-28 [C]: c1 Stufe 7 (vorher 6), c4/c5 Stufe 6 (vorher 5), c2/c3 trigger Radius 3 statt hold, c6/c7 Stufe 6 (nur Normal/Schwer), c7 trigger Radius 4 statt hold; Normal lag bei 0,12 Niedergestreckten (Korridor 0,4-1,3).
units:
  - { id: c1, nameKey: unit.rent_collector.name, team: enemy, class: skirmisher, sprite: mercenary,     level: 7, at: [8, 7],  items: [{ def: steel_sword }, { def: vulnerary }], drops: [1], ai: { profile: trigger, radius: 4, then: aggressive } }   # Vogt der Eintreiber
  - { id: c2, nameKey: unit.rent_collector.name, team: enemy, class: vanguard,   sprite: soldier,       level: 5, at: [6, 8],  items: [{ def: iron_lance }], ai: { profile: trigger, radius: 3, then: aggressive } }
  - { id: c3, nameKey: unit.rent_collector.name, team: enemy, class: brigand,    sprite: brigand,       level: 5, at: [9, 8],  items: [{ def: iron_axe }],   ai: { profile: trigger, radius: 3, then: aggressive } }
  - { id: c4, nameKey: unit.rent_collector.name, team: enemy, class: vanguard,   sprite: soldier,       level: 6, at: [7, 10], items: [{ def: iron_lance }], ai: { profile: trigger, radius: 3, then: aggressive } }
  - { id: c5, nameKey: unit.rent_collector.name, team: enemy, class: skirmisher, sprite: mercenary,     level: 6, at: [3, 4],  items: [{ def: iron_sword }], ai: { profile: aggressive } }
  - { id: c6, nameKey: unit.rent_collector.name, team: enemy, class: brigand,    sprite: brigand,       level: 6, at: [12, 4], items: [{ def: iron_axe }],   ai: { profile: aggressive }, difficulty: [normal, hard] }
  - { id: c7, nameKey: unit.rent_collector.name, team: enemy, class: marksman,   sprite: bandit_archer, level: 6, at: [8, 3],  items: [{ def: iron_bow }],   ai: { profile: trigger, radius: 4, then: aggressive }, difficulty: [normal, hard] }
  - { id: c8, nameKey: unit.rent_collector.name, team: enemy, class: marksman,   sprite: bandit_archer, level: 6, at: [12, 10], items: [{ def: iron_bow }],  ai: { profile: trigger, radius: 4, then: aggressive }, difficulty: [hard] }
  - { id: c9, nameKey: unit.rent_collector.name, team: enemy, class: vanguard,   sprite: soldier,       level: 6, at: [3, 10], items: [{ def: iron_lance }], ai: { profile: trigger, radius: 4, then: aggressive }, difficulty: [hard] }
pairs: []
reinforcements: []
objectives:
  victory: { type: rout }
  defeat:
    - { type: unit_dies, unit: kael }
    - { type: unit_dies, unit: avatar }
  side:
    - { id: s_clean, type: no_downs, reward: { item: { def: vulnerary } } }
    - { id: s_fast, type: turn_limit, turns: 8, reward: { gold: 200 } }   # [C] Startwert
    - { id: s_home, type: visit_villages, reward: { gold: 200 } }
triggers: []
# Szenen (9.12): scn.n3.intro / scn.n3.outro (Knoten pre/post, Erbstück als Knotenwirkung); Gedenk-Varianten über den Knoten; scn.n3.home beim Elternhaus (9,7)
goldReward: 700   # [C] Nebenquest kompakt
