# Mission 1-8 – Die Heimat halten (Knoten m1_8, Akt-Finale). Entwurf s1_1_8_heimat (abgenommen 2026-11-01), Missionsliste: G 30×40, defend, 14 / 42, Morra führt, Hask, Ulvric, Grosk. Startwerte [C].
# Gelände und Stufen wie m1_6_paktwacht (dieselben `levels`-Bereiche, dieselben Wehrgänge). Die Burg gehört jetzt der Truppe: Burgtor offen, kein Hebel (dort Wehrgang), Ostpforte [21,15] vermauert.
# Der Reiz der Karte: Was in 1-6 Engstelle für den Angreifer war, hält jetzt die Truppe, und ihre Schützen stehen auf dem Wehrgang (Aufstellplätze darauf).
# Hask, Ulvric und Grosk steigen von Süden die Terrassen hinauf, ab Runde 4 fällt Morra über den Wachpass und das Westtor [6,5] in den Rücken. Zu schützen: der Verwalter im Bergfried, 12 Runden.
# Der Verwalter heilt: Er bleibt auf dem Thronfeld (hold) und heilt Verbündete in Reichweite, ohne Waffe (Abweichung vom Entwurf, dort Zivilist: Absicht der Karte seit Story 9.9).
# Grosk: Wer bei E3 verschont (`spare`), bekommt die Wirkung recruit { lt: grosk }, Flag joined_grosk. Der Entwurf nannte „e03: join“, den Wert gibt es nicht. Ein beigetretener Leutnant
# kommt von selbst nicht auf die Karte, seine Hungernden hängen per `requires` am selben Flag.
# Morra ruft in Runde 10 den Rückzug (Trigger t_morra_retreat: Zeile + Profil flee zum Wachpass; erreicht sie ihn, gilt sie als geschlagen: Groll, Kopfgeld).
# Abweichungen vom Entwurf: Gold kleiner (Korridor Akt 1: goldReward 1200, Hof 300, Nebenziel 500); Morra mit Eisenbogen statt Stahl, damit „+1 Stufe je Groll“ greift.
# Balancing 2026-11-05 [C], Normal über die verkettete Kampagne: Morras Häscher Stufe 3 statt 4, Wellen R9/R10 Stufe 4 statt 5, zwei Häscher nur auf Schwer.
# Finale: keine Heimsuchung (Produktinhaber 2026-10-26).
