triggers:
  # Runde 10, Beginn: Morra ruft den Rückzug (Blase über ihr, nur solange sie noch auf der Karte steht) und weicht mit dem Profil flee zum Wachpass.
  # Erreicht sie ihn, gilt sie als geschlagen (Groll, Kopfgeld). Fällt sie vorher auf 0 TP, flieht sie wie jeder Leutnant.
  - id: t_morra_retreat
    once: true
    when: { type: turn_start, turn: 10, phase: player }
    then:
      - { action: dialogue, id: scn.m1_8.morra_retreat, onBoard: morra }
      - { action: set_ai, units: [morra], profile: flee }
# Szenen (Knoten m1_8): scn.m1_8.intro vorher (eine Zeile je E4-Ausgang); scn.m1_8.outro nachher (Sieg, Tafel, Glutfunken); scn.m1_8.morra_retreat im Kampf (Runde 10).
goldReward: 1200
music: battle_a
design:
  title: Die Heimat halten
  intent: >
    Akt-Finale, erste große Verteidigung: Was in 1-6 Engstelle für den Angreifer war, hält jetzt die Truppe. Von Süden steigen drei Leutnants
    die Terrassen hinauf, ab Runde 4 fällt Morra über den Wachpass in den Rücken. Die Truppe muss sich auf zwei Fronten teilen, ihre Schützen stehen auf dem Wehrgang.
  mood: Abend, Asche weht vom Norden, Fackeln auf den neu gesetzten Mauern, unten in den Feldern die Feuer der Belagerer, Morras Laternen am Pass.
  phases:
    - { id: p1, turns: [1, 3], label: Aufmarsch, note: "Hask, Ulvric und Grosk rücken durch die Felder; Truppe besetzt Wehrgänge und Vorburg." }
    - { id: p2, turns: [4, 7], label: Zwei Fronten, note: "Morra über den Wachpass (R4, R7) gegen das Westtor; Südwellen R3, R6." }
    - { id: p3, turns: [8, 12], label: Halten, note: "Letzte Wellen R9 Süd und R10 über den Ziegenpfad; Morra zieht in Runde 10 ab." }
  paths:
    - { team: enemy, points: [[15, 33], [15, 25], [21, 22], [22, 20], [15, 18]], label: Hask }
    - { team: enemy, points: [[5, 32], [7, 26], [7, 21], [7, 19]], label: Ulvric }
    - { team: enemy, points: [[24, 32], [25, 25], [22, 21]], label: Grosk }
    - { team: enemy, points: [[5, 0], [5, 5], [6, 5], [11, 8], [15, 6]], phase: p2, label: Morra }
    - { team: enemy, points: [[28, 30], [28, 19], [26, 19]], phase: p3, label: R10 Ziegenpfad }
  zones:
    - { area: { rect: [12, 5, 17, 6] }, label: Bergfried }
    - { area: { rect: [9, 13, 20, 17] }, label: Vorburg }
  marks:
    - { at: [6, 5], label: O, note: "Westtor zum Hangweg vom Wachpass: Morras Weg in den Rücken." }
    - { at: [15, 18], label: E4, note: "Vorburgtor gegen Süden, eigene Schützen auf dem Wehrgang darüber." }
    - { at: [21, 15], label: X, note: "Ostpforte vermauert (Unterschied zu 1-6)." }
  notes:
    - "Normal 39 Gegner (34 ohne Grosks Gruppe nach E3 „verschonen“), Leicht 33, Schwer 43. Missionsliste und Entwurf sagen 41–42: Die Truppe ist kleiner als die 14 Plätze, zwei Häscher aus R4/R7 stehen deshalb nur auf Schwer [C]."
    - "Morras Weg zum Versteck hängt an E4 (Szene); auf der Karte kommt sie immer über den Pass."
    - Keine Geländeveränderung (nächste veränderliche Karte in Akt 2).
