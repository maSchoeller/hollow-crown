  - { id: r5, nameKey: unit.marauder.name, team: enemy, class: marksman, sprite: bandit_archer, level: 2, at: [12, 22], items: [{ def: iron_bow }], ai: { profile: trigger, radius: 4, then: aggressive, wakeTurn: 6 } }
  # Westfurt: Plünderer aufs Westhaus
  - { id: r6, nameKey: unit.marauder.name, team: enemy, class: brigand, sprite: brigand, level: 1, at: [4, 21], items: [{ def: iron_axe }], ai: { profile: raider, target: v_w } }
