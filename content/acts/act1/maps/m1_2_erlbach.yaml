# Heimsuchungs-Anker (Story 5.5): höchstens einer je Variante, die Gründe stehen als Kommentar darüber
haunts:
  # Grund: die Dorfstraße vor der Linde – hier hat die Truppe Erlbach gehalten, hier kehrt Hasks Groll zurück. Der Älteste steht mitten auf der Straße,
  # die Truppe um ihn, die Angreifer kommen vom Bach her.
  - variant: defend
    target: { at: [9, 7] }
    enemySpawn: { rect: [8, 12, 12, 13] }
    deploy: { tiles: [[9, 8], [8, 7], [10, 7], [9, 6], [8, 8], [10, 8], [8, 6], [10, 6]] }
    turns: 8
  # Grund: die Brücke über den Bach – Hinterhalt an der Engstelle auf dem Rückweg.
  - variant: rout
    target: { at: [10, 14] }
    enemySpawn: { rect: [8, 11, 11, 13] }
    deploy: { rect: [9, 16, 11, 18] }
  # Grund: die Straße nach Süden zu Hasks Lager, auf der die Marodeure kamen.
  - variant: boss
    target: { at: [10, 22] }
    enemySpawn: { rect: [8, 20, 12, 21] }
    deploy: { rect: [8, 12, 12, 13] }
