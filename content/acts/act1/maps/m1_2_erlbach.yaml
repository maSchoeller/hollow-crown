# Mission 1-2 – Asche über Erlbach (Knoten m1_2). Entwurf s1_1_2_erlbach (abgenommen), Missionsliste: M 20×24, defend, 7 / 18, Leutnant Hask. Startwerte [C].
# Dorf Erlbach nördlich des Bachs, Abend, Asche. Die Truppe startet am Nordufer; Hask zieht aus seinem Lager im Süden über die Brücke und zwei Furten (nur zu Fuß) heran.
# Seine Leute haben die Kornfelder südlich des Bachs angezündet, das Feuer frisst sich durch die Felder. Bleibt flach (keine Höhenstufen).
# Ziel: Der Dorfälteste (dritte Partei, Klasse civilian) übersteht 8 Runden (defend).
# Marodeure mit Profil raider zerstören Häuser; ein Besuch rettet das Haus. Miras Haus v_e (Hütte am Ostrand [17,8]): Besuch im Kampf, Belohnung `recruit: mira`.
# Zerstört ein Marodeur es vorher (Trigger object_destroyed), ist Mira dauerhaft weg (scn.m1_2.mira_lost, Flag mira_house_razed) und E1 entfällt. Von den Aufstellfeldern ist das Haus in Runde 2 erreichbar, frühestens in Runde 4 steht ein Plünderer davor.
# Hask flieht bei 0 TP (gone: fled), Groll, Kopfgeld, Signaturwaffe Zunder (tinder). Seine Kartenwaffe ist Eisen (iron_axe), damit „+1 Tier je Groll“ greift.
# Balancing 2026-11-05 [C]: Mit dem Entwurf (alle sofort aggressiv) Normal 4 % Sieg. Die Südtruppe wartet gestaffelt (wakeTurn 3–7), Hask ab Runde 6 statt 3, Stufen 2 statt 3, Flankenwellen Stufe 1 und eine Runde später (R4, R6). Gegnerzahl wie im Entwurf.
# Balancing 2026-11-05 [C], Schwer: Der Älteste fiel in 40 von 40 Läufen in Runde 7–8, getroffen fast nur von den beiden Flanken-Plänklern (R4 Ost, R6 West) und r12. Auf Schwer ziehen Wellen schon in der Runde ihres Erscheinens (ambushReinforcements).
# Deshalb erscheinen die Flanken-Plänkler auf Schwer eine Runde später (R5, R7) und kommen so an wie auf Normal; r11/r12 Stufe 2 und erst ab Runde 7 wach. Schwer danach 55 % Sieg (76 Läufe), 20 Gegner (Missionsliste 18).
# Häuser-IDs der alten Karte bleiben (v_elder, v_n1, v_n2, v_w, v_e), die Szenen scn.m1_2.house_* wandern mit.
# Szenen: scn.m1_2.intro / .outro (Knoten pre/post, E1 in der Nachszene), scn.m1_2.hask_battle (Kampfzeile), Besuchsszenen scn.m1_2.house_*.
