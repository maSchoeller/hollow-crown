# Mission 1-1 – Steckbriefe (Knoten m1_1). Entwurf s1_1_1_steckbriefe (abgenommen), Missionsliste: K 16×20, rout, 5 / 12, kein Leutnant. Startwerte [C].
# Varnhold an der Erle, Spätsommer, Mittag, klar: Die Truppe kommt von Süden, die Brücke ist die Engstelle in die Stadt, westlich eine Furt nur zu Fuß.
# Morras Häscher lesen die Steckbriefe. Ziel: alle Gegner besiegen (rout). Neue Regel: Waffendreieck (campaign.yaml mechanics triangle: 1).
# Höhe: Die Stadtmauer im Norden ist Wehrgang (y 0, Stufe 1) mit zwei Mauertürmen ([4,0], [12,0], tower_top, Stufe 2); der Rest der Stadt ist flach.
# Der Wehrgang reicht von Turm zu Turm (x 6–10), außen bleibt die Mauer unbetretbar. Hinauf: Treppen vom Markt ([6,1], [9,1]) auf den Wehrgang, Treppen auf dem Wehrgang ([5,0], [11,0], Stufe 1) in die Türme.
# Von diesen Treppen schlägt man die Turmschützen, von unten trifft man sie nur mit Fernwaffen.
# Abweichungen vom Entwurf: Fenn steht nicht auf der Karte, er tritt laut Knoten nach dem Sieg bei (campaign.yaml effects, Szene scn.m1_1.outro: „Du hast vom Dach aus zugesehen“); damit 4 statt 5 eigene.
# Marktstände als stall, Brunnen als well, Stadtblöcke als building statt wall (Entwurf hatte noch keine Modelle).
# Szenen: scn.m1_1.intro / .outro (Knoten pre/post), scn.m1_1.tutorial_triangle (Runde 1), scn.m1_1.posters (am Markt), Häuser scn.m1_1.house_*, Gerücht scn.m1_1.kharesh_rumor im Händlerhaus [1,6].
id: m1_1_steckbriefe
nameKey: map.m1_1_steckbriefe.name
size: [16, 20]
fog: false
legend:
  ".": plain
  ",": grass
  "_": road
  "T": forest
  "~": river
  "w": shallows
  "=": bridge
  "W": wall          # Stadtmauer außerhalb des Wehrgangs
  "r": rampart       # Wehrgang auf der Stadtmauer, Stufe 1
  "t": tower_top     # Mauerturm, Stufe 2
  "S": stairs        # Treppen vom Markt auf den Wehrgang und vom Wehrgang in die Türme
  "B": building      # Stadtblöcke, nicht betretbar
  "O": well          # Brunnen auf dem Markt
  "H": village       # Haus (besuchbar)
  "m": stall         # Marktstand
#          x: 0123456789012345
terrain: |
  WWWWtSrrrrrStWWW
  BBB...S__S...BBB
  BHB.BB.__.BB.BHB
  B...BB.__.BB...B
  BB.__________.BB
  B..__m____m__..B
  BH.__________.HB
  B..__m_O__m__..B
  BB.__________.BB
  B..__m____m__..B
  BBB.BB.__.BB.BBB
  .,H....__......,
  ________________
  ~ww~~~~==~~~~~~~
  ~ww~~~~==~~~~~~~
  ,,..,,,__,,,TT,,
  ,TT,,..__..,,TT,
  ,,,,,..__..,,,,,
  ,,,,,..__..,,,,,
  TT,,,,.__.,,,,TT
# Stufen: Die Treppen auf dem Wehrgang liegen selbst auf Stufe 1 und führen in die Türme.
levels:
  - { level: 1, area: { tiles: [[5, 0], [11, 0]] } }
timeOfDay: noon
weather: clear
lights: []
objects:
  - { id: v_bounty, type: village, at: [1, 2], reward: { gold: 200, dialogue: scn.m1_1.house_nw } }
  - { id: v_rumor, type: village, at: [1, 6], reward: { gold: 100, dialogue: scn.m1_1.kharesh_rumor } }
  - { id: v_east, type: village, at: [14, 6], reward: { item: { def: vulnerary }, dialogue: scn.m1_1.house_e } }
  - { id: v_north, type: village, at: [14, 2], reward: { item: { def: iron_bow }, dialogue: scn.m1_1.house_ne } }
  - { id: v_shore, type: village, at: [2, 11], reward: { gold: 150, dialogue: scn.m1_1.house_w } }
initialEffects: []
# Heimsuchungs-Anker (Story 5.5, Architektur §5.6): je Variante höchstens einer; Startwerte [C].
haunts:
  # Grund: der Brunnen auf dem Marktplatz – hier hängen die Steckbriefe, hier trifft man Leute aus allen Gassen. Der Zivilist steht im Südteil des Marktes,
  # die Truppe um ihn, die Angreifer kommen aus dem Nordviertel; vier Runden Standhalten.
  - variant: defend
    target: { at: [7, 9] }
    enemySpawn: { rect: [6, 1, 9, 2] }
    deploy: { tiles: [[7, 10], [6, 9], [8, 9], [6, 8], [7, 8], [8, 8], [6, 10], [8, 10]] }
    turns: 4
  # Grund: das Nordviertel vor der Kopfgeldstube – von hier kamen die Häscher, später kommt wieder jemand. Der Leutnant wartet in der Gasse, die Truppe kommt über die Brücke.
  - variant: boss
    target: { at: [7, 1] }
    enemySpawn: { rect: [3, 4, 12, 4] }
    deploy: { rect: [6, 15, 9, 16] }
  # Grund: die Südstraße, auf der die Truppe in die Stadt kam – ein Hinterhalt auf dem Rückweg. Ein Zivilist hängt vor der Brücke fest und soll durch das Nordviertel
  # aus der Stadt; die Jäger fallen über die Uferstraße ein.
  - variant: escort
    target: { at: [7, 16] }
    enemySpawn: { rect: [11, 11, 15, 12] }
    deploy: { rect: [6, 17, 9, 18] }
    exit: { rect: [6, 1, 9, 1] }
deploy:
  max: 4
  forced: [avatar, lucan]
  slots: [[6, 17], [7, 17], [8, 17], [9, 17], [7, 18], [8, 18], [6, 18]]
units:
  # Brückenkopf: zwei Lanzen halten die Brücke (Engstelle)
  - { id: h1, nameKey: unit.bounty_hunter.name, team: enemy, class: vanguard, sprite: soldier, level: 2, at: [7, 11], items: [{ def: iron_lance }], ai: { profile: guard } }
  - { id: h2, nameKey: unit.bounty_hunter.name, team: enemy, class: vanguard, sprite: soldier, level: 2, at: [8, 11], items: [{ def: iron_lance }], ai: { profile: guard } }
  # Uferstraße: kommen von den Seiten an die Brücke
  - { id: h3, nameKey: unit.bounty_hunter.name, team: enemy, class: skirmisher, sprite: mercenary, level: 1, at: [3, 11], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 4, then: aggressive } }
  - { id: h4, nameKey: unit.bounty_hunter.name, team: enemy, class: brigand, sprite: brigand, level: 2, at: [12, 11], items: [{ def: iron_axe }], ai: { profile: trigger, radius: 4, then: aggressive } }
  # Markt: hinter den Ständen
  - { id: h5, nameKey: unit.bounty_hunter.name, team: enemy, class: brigand, sprite: brigand, level: 2, at: [5, 6], items: [{ def: iron_axe }], ai: { profile: trigger, radius: 4, then: aggressive } }
  - { id: h6, nameKey: unit.bounty_hunter.name, team: enemy, class: skirmisher, sprite: mercenary, level: 2, at: [10, 6], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 4, then: aggressive } }
  - { id: h7, nameKey: unit.bounty_hunter.name, team: enemy, class: vanguard, sprite: soldier, level: 2, at: [6, 9], items: [{ def: iron_lance }], ai: { profile: trigger, radius: 4, then: aggressive } }
  # Mauertürme: Schützen bleiben oben
  - { id: h8, nameKey: unit.bounty_hunter.name, team: enemy, class: marksman, sprite: bandit_archer, level: 2, at: [4, 0], items: [{ def: iron_bow }], ai: { profile: hold } }
  - { id: h9, nameKey: unit.bounty_hunter.name, team: enemy, class: marksman, sprite: bandit_archer, level: 2, at: [12, 0], items: [{ def: iron_bow }], ai: { profile: hold }, difficulty: [normal, hard] }
  # Anführer vor der Kopfgeldstube
  - { id: bh_leader, nameKey: unit.bounty_leader.name, team: enemy, class: brigand, sprite: brigand, level: 4, at: [7, 2], items: [{ def: steel_axe }, { def: vulnerary }], drops: [1], ai: { profile: hold } }
  # Story 15.10 [C]: h10 und h11 jetzt ab Normal (vorher nur Schwer), Normal vorher 0,22 Niedergestreckte je Lauf
  - { id: h10, nameKey: unit.bounty_hunter.name, team: enemy, class: marksman, sprite: bandit_archer, level: 2, at: [9, 4], items: [{ def: iron_bow }], ai: { profile: trigger, radius: 4, then: aggressive }, difficulty: [normal, hard] }
  - { id: h11, nameKey: unit.bounty_hunter.name, team: enemy, class: brigand, sprite: brigand, level: 2, at: [2, 8], items: [{ def: iron_axe }], ai: { profile: trigger, radius: 4, then: aggressive }, difficulty: [normal, hard] }
pairs: []
reinforcements:
  # Häscher aus der Vorstadt im Rücken
  - turn: 4
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.bounty_hunter.name, team: enemy, class: brigand, sprite: brigand, level: 1, at: [0, 16], items: [{ def: iron_axe }], ai: { profile: aggressive } }
      - { nameKey: unit.bounty_hunter.name, team: enemy, class: skirmisher, sprite: mercenary, level: 1, at: [15, 16], items: [{ def: iron_sword }], ai: { profile: aggressive }, difficulty: [normal, hard] }
objectives:
  victory: { type: rout }
  defeat:
    - { type: unit_dies, unit: lucan }
    - { type: unit_dies, unit: avatar }
  side:
    - { id: s_villages, type: visit_villages, reward: { gold: 200 } }
    - { id: s_fast, type: turn_limit, turns: 12, reward: { item: { def: vulnerary } } }
triggers:
  - id: t_intro_triangle
    once: true
    when: { type: turn_start, turn: 1, phase: player }
    then:
      - { action: dialogue, id: scn.m1_1.tutorial_triangle }
  # Die Steckbriefe am Markt: sobald jemand die Südreihe des Marktes betritt
  - id: t_posters
    once: true
    when: { type: unit_enters, team: player, area: { rect: [3, 9, 12, 9] } }
    then:
      - { action: dialogue, id: scn.m1_1.posters }
goldReward: 800   # [C] Akt 1, Story-Mission 800–1 500 (balance.yaml simulation.gold)
music: battle_a
design:
  title: Steckbriefe
  intent: >
    Erste offene Schlacht nach der Flucht, Lektion Waffendreieck. Brücke als Engstelle oder Furt als langsamer Umweg im Westen;
    im Händlerhaus das Gerücht über Kharesh, auf der Stadtmauer Schützen über dem Markt.
  mood: Mittag in einer Kleinstadt am Fluss, Steckbriefe an jeder Mauer, Marktstände mit bunten Planen, Spätsommerlicht auf Fachwerk.
  phases:
    - { id: p1, turns: [1, 3], label: Brücke, note: "Lanzen an der Brücke, Plänkler von den Ufern." }
    - { id: p2, turns: [4, 8], label: Markt, note: "Kampf zwischen den Ständen; Häscher aus der Vorstadt im Rücken (R4)." }
    - { id: p3, turns: [9, 12], label: Nordviertel, note: Anführer und Turmschützen. }
  paths:
    - { team: player, points: [[7, 17], [7, 12], [7, 4]], label: Brücke }
    - { team: player, points: [[6, 17], [2, 15], [1, 12], [2, 8]], label: Furt }
    - { team: enemy, points: [[0, 16], [4, 17]], phase: p2, label: R4 West }
    - { team: enemy, points: [[15, 16], [10, 17]], phase: p2, label: R4 Ost }
  zones:
    - { area: { rect: [3, 4, 12, 9] }, label: Markt, phase: p2 }
  marks:
    - { at: [7, 13], label: E, note: Brücke als Engstelle; Lanzen halten sie. }
    - { at: [1, 13], label: F, note: "Furt, nur zu Fuß, kostet Bewegung, umgeht die Brücke." }
    - { at: [6, 1], label: T, note: "Treppe vom Markt auf den Wehrgang, Gegenstück [9,1]." }
    - { at: [4, 0], label: S, note: "Mauerturm, Stufe 2: Schütze trifft von oben auf 2–3 Felder. Treppe [5,0] vom Wehrgang, von dort auch Nahkampf." }
  notes:
    - "Normal 12 Gegner (2 davon R4) gegen 4 eigene (Rhen, Lucan, Brenna, Tobin); Fenn tritt nach dem Sieg bei."
    - "Saat Kharesh im Händlerhaus [1,6]; Lucan schweigt dazu in der Szene."
