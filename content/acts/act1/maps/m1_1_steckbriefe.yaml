# Mission 1-1 – Steckbriefe (Story 9.2). Varnhold, Grenzstädtchen, Spätsommer, Mittag, klar. Die ganze Gegend hält die Truppe für die
# Mörder des Königs; freie Kopfgeldjäger (nicht Morras Leute, Morra kommt in 1-3) lesen die Steckbriefe. Ziel: alle Gegner besiegen (rout).
# Neue Regel: Waffendreieck (campaign.yaml mechanics triangle: 1). Kein Leutnant. Fenn tritt nach dem Sieg bei (Szene scn.m1_1.outro). Startwerte [C].
# Die Truppe kommt von Süden über die Straße; Markt mit Ständen, Brunnen und Steckbriefwand in der Mitte, Kopfgeldjäger aus drei Gassen
# (Nord, West, Ost). Die Häuser am Rand sind besuchbar (Belohnung: Gold, kleine Gegenstände, ein Satz über die Steckbriefe).
id: m1_1_steckbriefe
nameKey: map.m1_1_steckbriefe.name
size: [14, 16]
fog: false
legend:
  ".": plain
  ",": grass
  "_": road
  "T": forest
  "#": wall          # Mauerstück; (6,3) und (7,3) sind die Steckbriefwand
  "H": village       # Haus (besuchbar)
  "W": stall         # Marktstand (Requisite tent)
  "B": building      # Wohnhaus, nicht besuchbar und nicht betretbar (Requisite house, ohne Objekt: house_intact); Stadtrand
  "C": wagon         # Karren/Wagen am Rand (nur Flieger kommen drüber)
  "F": fence         # Zaun am Südrand
  "o": well          # Brunnen; kein eigenes Modell, bis dahin der Felsblock (Platzhalter, siehe terrain.yaml)
#          x: 0123456789ABCD
terrain: |
  TTB##.__.##BTT
  BB.H..__..H.BB
  BB....__....BB
  B..___##___..B
  ,.._W_____W_.,
  B.._________.B
  BH.____o___.HB
  B.._________.B
  ,C.__W____W_C,
  BB..______..BB
  T,W..____..W,T
  TTB,..__..,BTT
  ,T,C..__..C,T,
  ,,T,..__..,T,,
  ,,FF..__..FF,,
  BB,,..__..,,BB
# Mittag, klar: Sonne hoch, neutral-warm, gedämpft (vorher überbelichtet, art-direction §2.5/§3)
ambient: { color: "#e9e9e6", intensity: 0.75 }
sun: { color: "#fff4e2", intensity: 0.85, azimuthDeg: 200, elevationDeg: 65 }
lights: []
objects:
  - { id: v_nw, type: village, at: [3, 1],  reward: { gold: 200, dialogue: scn.m1_1.house_nw } }
  - { id: v_ne, type: village, at: [10, 1], reward: { item: { def: vulnerary }, dialogue: scn.m1_1.house_ne } }
  - { id: v_w,  type: village, at: [1, 6],  reward: { gold: 200, dialogue: scn.m1_1.house_w } }
  - { id: v_e,  type: village, at: [12, 6], reward: { item: { def: remedy_salve }, dialogue: scn.m1_1.house_e } }
initialEffects: []
# Heimsuchungs-Anker (Story 5.5, Architektur §5.6): je Variante höchstens einer; Startwerte [C].
haunts:
  # Grund: der Brunnen auf dem Marktplatz – hier hängen die Steckbriefe, hier trifft man Leute aus allen Gassen. (Der Brunnen [7,6] ist
  # ein Hindernis; der Zivilist steht im Südteil des Marktes auf [7,10], die Truppe bei ihm.) Die Angreifer kommen aus der Nordgasse.
  - variant: defend
    target: { at: [7, 10] }
    enemySpawn: { rect: [5, 0, 8, 1] }
    deploy: { rect: [4, 12, 9, 12] }
    turns: 6
  # Grund: die Nordgasse – von hier kamen die Kopfgeldjäger, später kommt wieder jemand. Der Leutnant wartet in der Gasse, die Truppe
  # kommt von der Südstraße.
  - variant: boss
    target: { at: [6, 1] }
    enemySpawn: { rect: [3, 2, 10, 3] }
    deploy: { rect: [5, 13, 8, 14] }
  # Grund: die Südstraße, auf der die Truppe in die Stadt kam – ein Hinterhalt auf dem Rückweg. Ein Zivilist hängt auf der Südstraße fest
  # und soll durch die Nordgasse aus der Stadt gebracht werden; die Jäger fallen aus der Westgasse ein.
  - variant: escort
    target: { at: [6, 12] }
    enemySpawn: { rect: [0, 3, 2, 5] }
    deploy: { rect: [4, 14, 9, 14] }
    exit: { rect: [5, 0, 8, 0] }
deploy:
  max: 4
  forced: [avatar, kael]
  slots: [[6, 15], [7, 15], [5, 15], [8, 15], [6, 14], [7, 14]]
# Lektion: Waffendreieck. Axt, Lanze und Schwert gemischt, damit jede eigene Einheit ein „richtiges“ Ziel hat.
# Gegnerstufen 2 bis 3 (Anführer 3) liegen um expectedLevel 2, abgestimmt per Simulation (Truppe tritt bei etwa Stufe 1,5 an) [C].
# Kopfgeldjäger: freie Jäger, kein Leutnant; der Anführer (ohne Leutnant-Status) hält sich bei der Steckbriefwand.
units:
  - { id: bh_leader, nameKey: unit.bounty_leader.name, team: enemy, class: brigand, level: 3, at: [7, 2], sprite: brigand, items: [{ def: steel_axe }, { def: vulnerary }], drops: [1], ai: { profile: trigger, radius: 3, then: aggressive }, difficulty: [easy, normal] }
  - { id: bh_leaderh, nameKey: unit.bounty_leader.name, team: enemy, class: brigand, level: 5, at: [7, 2], sprite: brigand, items: [{ def: steel_axe }, { def: vulnerary }], drops: [1], ai: { profile: trigger, radius: 3, then: aggressive }, difficulty: [hard] }
  - { id: bh1, nameKey: unit.bounty_hunter.name, team: enemy, class: brigand, level: 3, at: [6, 1], sprite: brigand, items: [{ def: iron_axe }], ai: { profile: trigger, radius: 4, then: aggressive }, difficulty: [easy, normal] }
  - { id: bh1h, nameKey: unit.bounty_hunter.name, team: enemy, class: brigand, level: 5, at: [6, 1], sprite: brigand, items: [{ def: iron_axe }], ai: { profile: trigger, radius: 4, then: aggressive }, difficulty: [hard] }
  - { id: bh2, nameKey: unit.bounty_hunter.name, team: enemy, class: vanguard, level: 2, at: [2, 4], sprite: soldier, items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [easy, normal] }
  - { id: bh2h, nameKey: unit.bounty_hunter.name, team: enemy, class: vanguard, level: 5, at: [2, 4], sprite: soldier, items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [hard] }
  - { id: bh3, nameKey: unit.bounty_hunter.name, team: enemy, class: skirmisher, level: 3, at: [11, 4], sprite: mercenary, items: [{ def: iron_sword }], ai: { profile: aggressive }, difficulty: [easy, normal] }
  - { id: bh3h, nameKey: unit.bounty_hunter.name, team: enemy, class: skirmisher, level: 5, at: [11, 4], sprite: mercenary, items: [{ def: iron_sword }], ai: { profile: aggressive }, difficulty: [hard] }
  - { id: bh4, nameKey: unit.bounty_hunter.name, team: enemy, class: brigand, level: 6, at: [3, 9], sprite: brigand, items: [{ def: hand_axe }], ai: { profile: hold }, difficulty: [easy, normal] }
  - { id: bh4h, nameKey: unit.bounty_hunter.name, team: enemy, class: brigand, level: 4, at: [3, 9], sprite: brigand, items: [{ def: hand_axe }], ai: { profile: hold }, difficulty: [hard] }
  - { id: bh5, nameKey: unit.bounty_hunter.name, team: enemy, class: vanguard, level: 4, at: [11, 9], sprite: soldier, items: [{ def: steel_lance }], ai: { profile: trigger, radius: 3, then: aggressive }, difficulty: [easy, normal] }
  - { id: bh5h, nameKey: unit.bounty_hunter.name, team: enemy, class: vanguard, level: 5, at: [11, 9], sprite: soldier, items: [{ def: iron_lance }], ai: { profile: trigger, radius: 3, then: aggressive }, difficulty: [hard] }
  - { id: bh6, nameKey: unit.bounty_hunter.name, team: enemy, class: skirmisher, level: 3, at: [4, 6], sprite: mercenary, items: [{ def: iron_sword }], ai: { profile: hold }, difficulty: [normal, hard] }
  - { id: bh7, nameKey: unit.bounty_hunter.name, team: enemy, class: brigand, level: 2, at: [9, 7], sprite: brigand, items: [{ def: iron_axe }], ai: { profile: trigger, radius: 3, then: aggressive }, difficulty: [hard] }
pairs: []
# Hart: Welle von hinten (Süden), Runde 3, angekündigt
reinforcements:
  - turn: 3
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.bounty_hunter.name, team: enemy, class: vanguard, sprite: soldier, level: 2, at: [4, 14], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [hard] }
      - { nameKey: unit.bounty_hunter.name, team: enemy, class: skirmisher, sprite: mercenary, level: 2, at: [9, 14], items: [{ def: iron_sword }], ai: { profile: aggressive }, difficulty: [hard] }
objectives:
  victory: { type: rout }
  defeat:
    - { type: unit_dies, unit: kael }
    - { type: unit_dies, unit: avatar }
  side:
    - { id: s_villages, type: visit_villages, reward: { gold: 200 } }
    - { id: s_clean, type: no_downs, reward: { item: { def: vulnerary } } }
    # Rundenzahl per Simulation abgestimmt (Normal: Median 9 Runden bis zum Sieg), Belohnung Startwert [C]
    - { id: s_fast, type: turn_limit, turns: 9, reward: { gold: 100 } }
triggers:
  - id: t_intro_triangle
    once: true
    when: { type: turn_start, turn: 1, phase: player }
    then:
      - { action: dialogue, id: scn.m1_1.tutorial_triangle }
  - id: t_posters
    once: true
    when: { type: unit_enters, team: player, area: { rect: [5, 4, 8, 5] } }
    then:
      - { action: dialogue, id: scn.m1_1.posters }
goldReward: 800   # [C] Akt 1, Story-Mission 800–1 500 (balance.yaml simulation.gold)
music: battle_a
devNote: >
  Neue Mechanik: Waffendreieck (Runde 1). 14 × 16: Südstraße (Aufstellung), Marktplatz mit Ständen, Brunnen (7,6) und Steckbriefwand
  (6,3)/(7,3), vier besuchbare Häuser an den Rändern, Kopfgeldjäger aus Nord-, West- und Ostgasse. Leicht: 6 Gegner (mit Anführer);
  Normal: 7; Schwer: 8 plus zwei Jäger aus dem Süden in Runde 3.
