  - { id: b7, nameKey: unit.border_soldier.name, team: enemy, class: skirmisher, sprite: mercenary, level: 2, at: [12, 9], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 4, then: aggressive } }
  # Schütze auf dem Grenzhügel, über der Rampe: von oben Reichweite 2–3
