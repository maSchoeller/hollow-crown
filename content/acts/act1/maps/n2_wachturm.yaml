# Nebenquest N2 – Der letzte Wachturm (Knoten n2, öffnet nach 1-5). Entwurf s1_n2_wachturm (abgenommen 2026-11-01), Missionsliste: K 16×20, treasure, Beitritt Varek. Startwerte [C].
# Grenzhügel an der Grenzmauer, dahinter liegt Kharesh. Im Norden die Ruine des Wachturms, in der sich Varek verschanzt hat; ein Suchtrupp des Grenzheers belagert ihn.
# Stufen (Höhenstufen, GDD): Turminneres x 6–9, y 2–4 ist Stufe 1, die Treppe im Süden [7,5]/[8,5] und die Leiter in der Westbresche [5,3] führen hinein; die alte Plattform [7,3] ist `tower_top` (Stufe 2) über die innere Treppe [7,4].
# Der Grenzhügel [6–8, 10–11] ist Fels auf Stufe 1 mit einer Rampe im Osten [9,11]: Er teilt den Anmarsch weiter in West und Ost (oben führt kein Weg nach Norden hinab), oben steht ein Schütze.
# Lucan spricht Varek an (recruit, Szene scn.n2.varek_talk), Sichtungszeile scn.n2.varek_spotted. Wer es versäumt, hat ihn für die Staffel nicht; die Quest bleibt gewonnen (Missionsliste).
# Truhen wie bisher: c_page (Chronik-Seite a1_watchtower, Szene scn.n2.page) und c_relic (Schild der Paktwächter, Szene scn.n2.relic); der Entwurf nennt sie c_chronicle/c_shield, pactwarden_shield heißt im Spiel pact_warden_shield.
# Der Glutfunke kommt mit dem Sieg als Knotenwirkung (campaign.yaml). Sieg, sobald beide Turmtruhen offen sind: Wer Varek und das Versteck will, holt sie vorher.
# Abweichungen vom Entwurf: Drei Schlüssel statt einem, jede Truhe braucht Späher oder Schlüssel, ein Schlüssel hat eine Ladung und Fenn kann fehlen: je einer bei den Lanzen vor der Treppe, einer beim Feldwebel. Die Lanzen b1/b2 rücken bei Radius 4 vor, statt die Treppe zu sperren (Balancing [C]: Sieg Normal 38 % bei Rundenlimit). Varek ohne Kartenwaffe, er nimmt seine eigene Ausrüstung (char), und `hold`: Er schlägt nur, wer ihm zu nahe kommt.
# Balancing 2026-11-05 [C]: Stufen wie im Entwurf; Normal Sieg 85 %, 0,42 Niedergestreckte, Leicht 94 %, 0,22 (Korridor ab 95 %, offen).
# Heimsuchungs-Anker (Story 5.5, noch ohne Schema):
#   [7,6] Grund: der Vorplatz des Turms, wo der Suchtrupp lagerte.
#   [7,10] Grund: der Grenzhügel, von dem man Kharesh sieht.
#   [7,3] Grund: die Turmplattform, Ort der Chronik-Seite.
