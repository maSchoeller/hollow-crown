# Nebenquest N2 – Der letzte Wachturm (Story 9.11, Lore; Voraussetzung: Mission 1-3 gespielt). Alter Wachturm der Paktwächter auf einem Felssporn im Hochmoor.
# Plünderer haben sich im Turm eingenistet. Startwerte [C].
# Tageszeit: Morgen. Wetter: Nebel (Wetternebel, kein Sichtnebel: fog: false; art-direction §2.5, Feld folgt mit Story 8.6).
# Aufbau (Nord oben): Turm mit Truhen (5–8,1–2), Turmtor (6–7,3), Vorplatz mit Mauerresten, Moorweg nach Süden (Aufstellung).
# OFFEN: seize oder rout – vorläufig seize (Kael) auf dem Turmtor; die Alternative wäre rout.
# OFFEN: Relikt „Schild der Paktwächter“ und Chronik-Seite existieren noch nicht als Item/Flag; bis dahin Gold in den Truhen.
# Rollen: Nebelwetter (Sicht und Späher), Mauerreste als Deckung, Turmtor als Engstelle für Vorkämpfer.
id: n2_wachturm
nameKey: map.n2_wachturm.name
size: [14, 14]
fog: false
legend:
  ".": plain
  ",": grass
  "_": road
  "T": forest
  "^": mountain
  "#": wall          # Turmmauer
  "R": ruins         # Mauerreste
  "G": gate          # Turmtor (Ziel: seize)
#          x: 0123456789ABCD
terrain: |
  ^^^^^^^^^^^^^^
  ^^^^#....#^^^^
  ^^^^#....#^^^^
  ^^^^##GG##^^^^
  ^^,,.RR..,,,^^
  ^,,,..__..,,,^
  ^,,T,.__.,T,,^
  ^,,,,__,,,,,,^
  ^,T,____,,,T,^
  ^,,,,__,,,,,,^
  ,,,T,__,,T,,,,
  ,,,,,__,,,,,,,
  ,,T,,__,,,,T,,
  ,,,,,__,,,,,,,
# Morgen im Hochmoor, Nebel: blasses, graues Licht, schwache tiefe Sonne
ambient: { color: "#cfd6dc", intensity: 0.9 }
sun: { color: "#e8e4d8", intensity: 0.6, azimuthDeg: 110, elevationDeg: 30 }
lights: []
objects:
  # OFFEN: Relikt Schild der Paktwächter (kein Item) und Chronik-Seite (kein Flag); Gold als Platzhalter. Truhen brauchen Schlüssel oder Späher.
  - { id: c_relic, type: chest, at: [5, 1], contents: { gold: 500 } }
  - { id: c_page, type: chest, at: [8, 1], contents: { gold: 200 } }
initialEffects: []
# Heimsuchungs-Anker (Story 5.5, noch ohne Schema):
#   [6,4] Grund: der Vorplatz des Turms – wer den Turm besetzt, sieht den ganzen Moorweg.
#   [6,8] Grund: der Moorweg im Nebel – ein Hinterhalt zwischen den Heidebüschen.
#   [6,1] Grund: das Innere des Turms – Ort der Chronik-Seite.
deploy:
  max: 5
  forced: [avatar, kael]
  slots: [[6, 13], [7, 13], [5, 13], [8, 13], [6, 12], [7, 12], [5, 12]]
# Stufen um 5–6 [C] Stufe vorläufig, Abgleich per Simulation, sobald spielbar.
units:
  - { id: e1, nameKey: unit.looter.name, team: enemy, class: brigand, level: 6, at: [6, 2], sprite: brigand, items: [{ def: iron_axe }, { def: door_key }], drops: [1], ai: { profile: hold } }
  - { id: e2, nameKey: unit.looter.name, team: enemy, class: marksman, level: 6, at: [7, 2], sprite: archer, items: [{ def: iron_bow }], ai: { profile: hold } }
  - { id: e3, nameKey: unit.looter.name, team: enemy, class: vanguard, level: 6, at: [5, 5], sprite: soldier, items: [{ def: iron_lance }], ai: { profile: hold } }
  - { id: e4, nameKey: unit.looter.name, team: enemy, class: brigand, level: 5, at: [9, 6], sprite: brigand, items: [{ def: iron_axe }], ai: { profile: trigger, radius: 4, then: aggressive } }
  - { id: e5, nameKey: unit.looter.name, team: enemy, class: skirmisher, level: 5, at: [3, 8], sprite: mercenary, items: [{ def: iron_sword }], ai: { profile: trigger, radius: 4, then: aggressive } }
  - { id: e6, nameKey: unit.looter.name, team: enemy, class: marksman, level: 5, at: [9, 4], sprite: archer, items: [{ def: iron_bow }], ai: { profile: hold }, difficulty: [normal, hard] }
  - { id: e7, nameKey: unit.looter.name, team: enemy, class: brigand, level: 5, at: [10, 9], sprite: brigand, items: [{ def: iron_axe }], ai: { profile: trigger, radius: 4, then: aggressive }, difficulty: [normal, hard] }
  - { id: e8, nameKey: unit.looter.name, team: enemy, class: skirmisher, level: 6, at: [4, 4], sprite: mercenary, items: [{ def: iron_sword }], ai: { profile: hold }, difficulty: [hard] }
  - { id: e9, nameKey: unit.looter.name, team: enemy, class: vanguard, level: 6, at: [8, 8], sprite: soldier, items: [{ def: iron_lance }], ai: { profile: hold }, difficulty: [hard] }
pairs: []
reinforcements: []
objectives:
  # OFFEN: seize oder rout (siehe Kopf)
  victory: { type: seize, area: { rect: [6, 3, 7, 3] } }
  defeat:
    - { type: unit_dies, unit: kael }
    - { type: unit_dies, unit: avatar }
  side:
    - { id: s_chests, type: open_chests, reward: { gold: 300 } }
    - { id: s_clean, type: no_downs, reward: { item: { def: vulnerary } } }
triggers: []
# Szenen (9.11): scn.n2.intro bei Runde 1; scn.n2.page bei der Chronik-Truhe (8,1); scn.n2.relic bei der Relikt-Truhe (5,1).
goldReward: 600   # [C] Nebenquest
music: battle_a
devNote: >
  14 × 14, Felssporn im Hochmoor, Nebelwetter. Turm im Norden (Tor 6–7,3, zwei Truhen), Moorweg nach Süden. Leicht: 5 Plünderer; Normal: 7; Schwer: 9.
