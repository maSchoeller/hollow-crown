  - { id: b2, nameKey: unit.border_soldier.name, team: enemy, class: vanguard, sprite: soldier, level: 3, at: [8, 6], items: [{ def: iron_lance }, { def: door_key }], drops: [1], ai: { profile: trigger, radius: 4, then: aggressive } }
  - { id: b3, nameKey: unit.border_soldier.name, team: enemy, class: marksman, sprite: bandit_archer, level: 2, at: [4, 7], items: [{ def: iron_bow }], ai: { profile: hold } }
  - { id: b4, nameKey: unit.border_soldier.name, team: enemy, class: marksman, sprite: bandit_archer, level: 2, at: [11, 7], items: [{ def: iron_bow }], ai: { profile: hold } }
  - { id: b5, nameKey: unit.border_soldier.name, team: enemy, class: skirmisher, sprite: mercenary, level: 2, at: [2, 4], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 4, then: aggressive } }
