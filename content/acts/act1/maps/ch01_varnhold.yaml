# Kapitel 1 – Asche über Varnhold. Ziel: Kael erreicht die Brücke im Norden.
# Aus concept/data-samples/maps/ch01_varnhold.yaml, für das 3D-Brett neu gelayoutet (16 × 16, D11). Werte = Startwerte [C].
id: ch01_varnhold
nameKey: map.ch01_varnhold.name
size: [16, 16]
fog: false
legend:
  ".": plain
  ",": grass
  "T": forest
  "^": mountain
  "~": river
  "_": road
  "=": bridge
  "#": wall
  "H": village
  "F": fort
#          x: 0123456789ABCDEF
terrain: |
  ^^^,,TT__,,TT^^^
  ~~~~~~~==~~~~~~~
  ~~~~~~~==~~~~~~~
  ,,TT,,,__,,,TT,,
  ,TTT,,.__.,,,T,F
  ,,,,...__...,,,,
  ##.H..#__.###..#
  #.....,__......#
  ..,,TT,__,,,,,..
  .,TTT,,__..TT,,.
  ..,,,,.__.,,,TT.
  ##..##.__...##.H
  #H..#..__....#..
  ....,,,__,,,,...
  .,,TT..__..TT,,.
  ...F...__.....F.

ambient: { color: "#e0a6b8", intensity: 0.72 }
sun: { color: "#ff9a6a", intensity: 0.8, azimuthDeg: 270, elevationDeg: 18 }     # 3D-Brett (D7): Abendrot über der brennenden Stadt
lights:
  - { at: [15, 4], color: "#ffb35c", radius: 3 }
  - { at: [3, 15], color: "#ffb35c", radius: 3 }
  - { at: [14, 15], color: "#ffb35c", radius: 3 }

objects:
  - { id: v_north, type: village, at: [3, 6],  reward: { gold: 300, dialogue: scn.ch01.village_north } }
  - { id: v_east,  type: village, at: [15, 11], reward: { recruit: mira, dialogue: scn.ch01.mira_village } }
  - { id: v_west,  type: village, at: [1, 12], reward: { item: { def: javelin }, dialogue: scn.ch01.village_west } }

initialEffects:
  - { effect: burning, tiles: [[5, 13], [6, 13]], turns: 3 }     # Brand in der Stadtmitte, breitet sich aus

deploy:
  max: 4
  forced: [avatar, kael]
  slots: [[7, 15], [8, 15], [6, 15], [9, 15], [7, 14], [8, 14]]

# Lektion: Waffendreieck. Drei Waffenarten im Gemisch – Banditen (Axt), Deserteure (Lanze),
# Söldner (Schwert) –, damit jede eigene Einheit ein „richtiges“ Ziel hat.
units:
  - id: hask
    nameKey: unit.hask.name
    team: enemy
    class: brigand
    level: 4
    at: [10, 3]
    boss: true
    sprite: hask
    portrait: hask
    items: [ { def: steel_axe }, { def: vulnerary } ]
    drops: [0]
    ai: { profile: guard }
    quote: scn.ch01.hask_battle
  - { id: e1, team: enemy, class: brigand,   sprite: brigand,   level: 2, at: [3, 8], items: [{ def: iron_axe }],   ai: { profile: aggressive } }
  - { id: e2, team: enemy, class: soldier,   sprite: soldier,   level: 2, at: [10, 9], items: [{ def: iron_lance }], ai: { profile: aggressive } }
  - { id: e3, team: enemy, class: archer,    sprite: bandit_archer, nameKey: unit.bandit_archer.name, level: 2, at: [12, 7], items: [{ def: iron_bow }], ai: { profile: trigger, radius: 3, then: aggressive }, difficulty: [normal, hard] }
  - { id: e4, team: enemy, class: mercenary, sprite: mercenary, level: 2, at: [2, 7], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 3, then: aggressive } }
  - { id: e5, team: enemy, class: soldier,   sprite: soldier,   level: 3, at: [9, 4], items: [{ def: iron_lance }], ai: { profile: hold } }
  - { id: e6, team: enemy, class: brigand,   sprite: brigand,   level: 2, at: [6, 5], items: [{ def: iron_axe }],   ai: { profile: raider, target: v_east } }   # erreicht das Dorf in Gegnerphase 3
  - { id: e7, team: enemy, class: mercenary, sprite: mercenary, level: 3, at: [12, 4], items: [{ def: iron_sword }, { def: vulnerary }], drops: [1], ai: { profile: hold } }
  - { id: e8, team: enemy, class: brigand,   sprite: brigand,   level: 3, at: [13, 8], items: [{ def: hand_axe }],   ai: { profile: trigger, radius: 3, then: aggressive }, difficulty: [normal, hard] }
  - { id: e9, team: enemy, class: soldier,   sprite: soldier,   level: 2, at: [8, 6], items: [{ def: iron_lance }], ai: { profile: hold }, difficulty: [normal, hard] }   # hält das Nordtor, damit die Straße kein Durchmarsch ist

pairs: []

reinforcements:
  - turn: 4
    phase: enemy
    announce: true
    units:
      - { team: enemy, class: brigand,   sprite: brigand,   level: 2, at: [0, 10], items: [{ def: hand_axe }],   ai: { profile: aggressive } }
      - { team: enemy, class: soldier,   sprite: soldier,   level: 2, at: [15, 8], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [hard] }
      - { team: enemy, class: mercenary, sprite: mercenary, level: 3, at: [15, 13], items: [{ def: iron_sword }], ai: { profile: aggressive }, difficulty: [hard] }

objectives:
  victory: { type: reach, unit: kael, area: { tiles: [[7, 0], [8, 0]] } }
  defeat:
    - { type: unit_dies, unit: kael }
    - { type: unit_dies, unit: avatar }
  side:
    - { id: s_villages, type: visit_villages, reward: { gold: 500 } }
    - { id: s_fast,     type: turn_limit, turns: 12, reward: { item: { def: iron_shield } } }

triggers:
  - id: t_intro_triangle
    once: true
    when: { type: turn_start, turn: 1, phase: player }
    then:
      - { action: dialogue, id: scn.ch01.tutorial_triangle }
  - id: t_fire
    once: true
    when: { type: unit_enters, team: player, area: { rect: [3, 11, 10, 14] } }
    then:
      - { action: dialogue, id: scn.ch01.tutorial_fire }
  - id: t_ambush
    once: true
    when: { type: unit_enters, team: player, area: { rect: [0, 7, 15, 8] } }
    then:
      - { action: dialogue, id: scn.ch01.ambush }
      - { action: set_ai, units: [e3, e4], profile: aggressive }
  - id: t_village_razed
    once: true
    when: { type: object_destroyed, object: v_east }
    then:
      - { action: dialogue, id: scn.ch01.mira_lost }   # Mira ist dann in V1 nicht rekrutierbar

goldReward: 1000
music: battle_a
devNote: >
  Neue Mechanik: Waffendreieck (Runde 1). Nebenbei: Dörfer besuchen (Raider e6 setzt Zeitdruck auf das
  Dorf mit Mira), Feuer breitet sich aus (Hinweis beim ersten Betreten der Stadtmitte). Die Brücke ist
  zwei Felder breit (x=7–8), man muss Hask nicht besiegen. 16 × 16 (D11): Pflasterstraße von Süd nach Nord,
  zwei Mauerriegel mit Toren, Dörfer im Nordwesten, Südosten (Mira) und Südwesten. Leicht: ohne Schützen und Bandit e8, eine Verstärkung;
  Schwer: drei Verstärkungen in Runde 4.
