# Mission 1-5 – Das Hungerlager (Knoten m1_5). Entwurf s1_1_5_hungerlager (abgenommen 2026-11-01), Missionsliste: M 20×25, survive, 8 / 24, Leutnant Grosk. Startwerte [C].
# Erlenmoor an der Erlenbucht: Inseln im Sumpf, Priele (nicht betretbar), Stege als Engstellen. Die Truppe hält die Mittelinsel; Hungernde kommen aus dem Lager im Norden und von den Inseln West und Ost.
# Stufen (Höhenstufen, GDD): Der alte Wachhügel um das Fort ist die einzige Erhöhung, Stufe 1 auf x 8–11, y 11–13, zwei Rampen auf der Stegachse: West [7,12] und Ost [12,12].
# Nahkampf von unten geht nur über die Rampen, Schützen oben gewinnen +1 Reichweite. Das Moor bleibt flach (Produktinhaber 2026-11-05).
# Grosk rückt ab Runde 4 vor und flieht bei 0 TP (Leutnant); E3 fällt nach dem Überleben in scn.m1_5.outro. Er steht wieder auf dem Brett (Missionsliste löst „nicht auf dem Brett“ vom 2026-10-27 ab).
# Varek ist nicht mehr hier: Er tritt in N2 bei (Missionsliste 2026-11-01); die Hütte im Westen kündigt ihn an (scn.m1_5.watchtower_hint).
# Kinder des Lagers: Zivilisten, die kein Gegner angreift (`untargetable`, Story 9.6). Der Entwurf zeigt sie nicht; sie bleiben, weil Narrative „Elend, Kinder, Rauch“ und die Szenen sie tragen. Sie zählen nicht mit.
# Abweichungen vom Entwurf: Vorratsmeister mit zwei Schlüsseln statt einem (zwei Truhen, eine Ladung je Schlüssel, ohne Fenn sonst nicht erreichbar). Nordsteg eine Reihe länger bis zur Insel ([9–10,7]): Grosk ist gepanzert und käme sonst nie durch den Sumpf.
# Balancing 2026-11-05 [C]: Stufen wie im Entwurf; Normal Sieg 100 %, 0,82 Niedergestreckte, Leicht 100 %, 0,24.
# Szenen: scn.m1_5.intro vor der Karte (Knoten pre), scn.m1_5.watchtower_hint (Hütte), scn.m1_5.outro nach Runde 8 (Grosk redet, Entscheidung E3).
