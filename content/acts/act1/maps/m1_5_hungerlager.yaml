design:
  title: Das Hungerlager
  intent: >
    Überleben auf einer Insel im Sumpf: Priele sind Wände, Stege die Engstellen, der Sumpf kostet Bewegung und sperrt Gepanzerte aus.
    Der alte Wachhügel lässt Nahkampf nur über zwei Rampen zu, Schützen reichen von oben weiter.
    Die Gegner sind schwach und hungrig, aber viele; die Gewissensfrage (E3) entscheidet, ob Grosk wechselt.
  mood: Morgennebel über dem Moor, Schilf und Stege, ausgemergelte Gestalten zwischen Zelten aus Segeltuch, Möwen über der Erlenbucht.
  phases:
    - { id: p1, turns: [1, 3], label: Nebel, note: "Erste Hungernde von Norden und von den Inseln; Wellen R2 Nord, R3 West." }
    - { id: p2, turns: [4, 6], label: Grosk, note: "Grosk rückt über den Nordsteg vor; Wellen R4 Ost, R5 Nord, R6 beidseits." }
    - { id: p3, turns: [7, 8], label: Durchhalten, note: "E3 fällt nach Runde 8 in der Szene." }
  paths:
    - { team: enemy, points: [[10, 2], [10, 6], [10, 10], [7, 12]], phase: p2, label: Grosk }
    - { team: enemy, points: [[0, 13], [3, 12], [5, 12], [7, 12]], label: Steg West }
    - { team: enemy, points: [[19, 12], [16, 12], [14, 12], [12, 12]], label: Steg Ost }
    - { team: player, points: [[10, 14], [10, 18], [12, 19], [11, 21]], label: zum Wrack }
  zones:
    - { area: { rect: [8, 11, 11, 13] }, label: Wachhügel }
    - { area: { rect: [3, 0, 16, 4] }, label: Hungerlager }
  marks:
    - { at: [9, 6], label: S1, note: "Nordsteg: Hauptweg des Lagers." }
    - { at: [4, 12], label: S2, note: Steg West. }
    - { at: [15, 12], label: S3, note: Steg Ost. }
    - { at: [7, 12], label: Ra, note: "Rampe West: von hier unten trifft Nahkampf den Hügel." }
    - { at: [12, 12], label: Ra, note: "Rampe Ost." }
    - { at: [1, 16], label: N2, note: "Hütte eines alten Hungernden: erzählt vom Deserteur am Wachturm (N2 öffnet nach dem Sieg)." }
    - { at: [10, 22], label: K, note: "Schmugglerkiste im Bootswrack; Schlüssel beim Vorratsmeister im Lager oder Fenn." }
  notes:
    - "Normal 24 Gegner (14 davon in Wellen R2–R6) gegen 8 eigene plus Grosk; Leicht 19, Schwer 27. Die drei Kinder zählen nicht mit."
    - "Sumpf: Fuß 3, Reiter 4, Gepanzerte gar nicht; Priele nur für Flieger."
