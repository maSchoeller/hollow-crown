# Mission 1-5 – Das Hungerlager (Story 9.6, Knoten m1_5). Startwerte [C], Stufen und Profile per Simulation abgestimmt.
# Ort: Lager der Hungernden in einem Talkessel; die Truppe sitzt auf einem Hügel mit Ruinen in der Mitte (Festungsfelder, Heilung).
# Tageszeit: Abend, Wetter: Asche (Rauch, Elend; art-direction §2.5; Felder timeOfDay/weather). Ortsbild „hungerlager“.
# Ziel: 6 Runden standhalten (survive). Grosk steht NICHT auf dem Brett (Produktinhaber 2026-10-27): er kommt erst nach Runde 6 ins Lager der Truppe und
# redet (scn.m1_5.outro, E3 „verschonen oder Kopfgeld“); die Wirkung `meet` lässt ihn dort als begegnet gelten.
# Die Hungernden strömen aus dem Lager ringsum in Wellen (Runde 2 und 4) auf den Hügel. Gegner sind bewusst schwach für ihre Zahl.
# Varek: Deserteur des Grenzheers, hängt bei den Hungernden fest; Team enemy + hold + keine Waffe + ignoreForRout (Muster Ysolde in 1-4), Kael spricht ihn an
# (recruit mit Szene scn.m1_5.varek_talk). Kinder: eigene Zivilisten (Klasse civilian, Team other, `untargetable`: Gegner greifen sie nie an, Story 9.6).
# Zelte des Lagers sind Gelände (stall) und Lagerfeuer (brazier): nicht begehbar, nicht brennbar.
# Lehrstück: Hügel mit Festungsfeldern (Deckung/Heilung) als Rolle für Vorkämpfer, Ascheflächen und Zelte am Rand für Elementaristen.
id: m1_5_hungerlager
nameKey: map.m1_5_hungerlager.name
size: [16, 16]
fog: false
legend:
  ".": plain
  ",": grass
  "T": forest
  "a": ash
  "R": ruins
  "F": fort          # Hügelkuppe (Festungsfeld: Deckung, Heilung)
  "W": stall         # Zelt (Requisite tent)
  "b": brazier       # Lagerfeuer (Requisite campfire)
  "H": village       # Hütte (besuchbar)
#          x: 0123456789ABCDEF
terrain: |
  TTT,,,,,,,,,,TTT
  TTT,,,a,,,,,,TTT
  ,,,,,W,,,,W,,,a,
  ,,,W,,,,,,,,W,,,
  ,,,,b......b,,,,
  ,a,,.aaaaaa.,b,,
  ,,,,.a.RR.a.,,,,
  ,,W,.aRFFRa.,,,,
  ,,,,.aRFFRa.,W,,
  ,,b,.a....a.,,,,
  ,,,,.aaaaaa.,,a,
  ,,,,H......H,,,,
  ,a,W,,,,,,,,W,,,
  ,,,,,W,,b,W,,,,,
  TTT,,,,,,a,,,TTT
  TTT,,,,,,,,,,TTT
# Tageszeit und Wetter (Story 8.6): Preset aus render.yaml look.timeOfDay/weather
timeOfDay: evening
weather: ash
lights:
  - { at: [4, 4], color: "#ffb35c", radius: 3 }
  - { at: [11, 4], color: "#ffb35c", radius: 3 }
  - { at: [2, 9], color: "#ffb35c", radius: 3 }
  - { at: [13, 5], color: "#ffb35c", radius: 3 }
  - { at: [8, 13], color: "#ffb35c", radius: 3 }
objects:
  # Besuchsszenen scn.m1_5.hut_*; Belohnungen [C]
  - { id: v_w, type: village, at: [4, 11],  reward: { item: { def: remedy_salve }, dialogue: scn.m1_5.hut_w } }
  - { id: v_e, type: village, at: [11, 11], reward: { gold: 200, dialogue: scn.m1_5.hut_e } }
initialEffects: []
deploy:
  max: 6
  forced: [avatar, kael]
  slots: [[7, 8], [8, 8], [7, 7], [8, 7], [7, 9], [8, 9], [6, 9], [9, 9]]
# Heimsuchungs-Anker (Story 5.5): höchstens einer je Variante, die Gründe stehen als Kommentar darüber
haunts:
  # Grund: der Hügel mit den Ruinen – hier hielt die Truppe stand.
  - variant: defend
    target: { at: [8, 8] }
    enemySpawn: { rect: [3, 1, 12, 1] }
    deploy: { rect: [6, 9, 9, 10] }
    max: 5
    turns: 8
  # Grund: das Hungerlager im Norden, Grosks Platz.
  - variant: boss
    target: { at: [8, 2] }
    enemySpawn: { rect: [4, 12, 11, 12] }
    deploy: { rect: [6, 8, 9, 9] }
    max: 5
  # Grund: das südliche Lagerfeuer am Talausgang – Flüchtende kehren zurück.
  - variant: rout
    target: { at: [8, 14] }
    enemySpawn: { rect: [3, 1, 12, 1] }
    deploy: { rect: [6, 8, 9, 9] }
    max: 5
# Grosk (Leutnant, Seitenwechsler) steht nicht auf der Karte; er redet nach Runde 6 (scn.m1_5.outro). Hungernde: Stufen 3–4 [C], gegen ihre Zahl schwach.
units:
  # Varek: Deserteur des Grenzheers (Brücke General). Kael spricht ihn an; Szene scn.m1_5.varek_talk
  - { id: varek, char: varek, team: enemy, class: skirmisher, level: 5, at: [13, 6], items: [], ai: { profile: hold }, ignoreForRout: true, recruit: { by: [kael], dialogue: scn.m1_5.varek_talk } }
  # Kinder des Lagers: Zivilisten, die kein Gegner angreift (untargetable); sie blockieren ihr Feld
  - { id: child1, nameKey: unit.child.name, team: other, class: civilian, level: 1, at: [4, 3],  sprite: villager_child, portrait: villager_child, items: [], ai: { profile: hold }, untargetable: true }
  - { id: child2, nameKey: unit.child.name, team: other, class: civilian, level: 1, at: [11, 2], sprite: villager_child, portrait: villager_child, items: [], ai: { profile: hold }, untargetable: true }
  - { id: child3, nameKey: unit.child.name, team: other, class: civilian, level: 1, at: [4, 12], sprite: villager_child, portrait: villager_child, items: [], ai: { profile: hold }, untargetable: true }
  - { id: h1, nameKey: unit.starving_raider.name, team: enemy, class: brigand,    sprite: brigand,       level: 6, at: [3, 4],  items: [{ def: hand_axe }],   ai: { profile: trigger, radius: 6, then: aggressive } }
  - { id: h2, nameKey: unit.starving_raider.name, team: enemy, class: brigand,    sprite: brigand,       level: 6, at: [12, 4], items: [{ def: hand_axe }],   ai: { profile: trigger, radius: 6, then: aggressive } }
  - { id: h3, nameKey: unit.starving_raider.name, team: enemy, class: vanguard,   sprite: soldier,       level: 6, at: [3, 8],  items: [{ def: iron_lance }], ai: { profile: trigger, radius: 6, then: aggressive } }
  - { id: h4, nameKey: unit.starving_raider.name, team: enemy, class: skirmisher, sprite: mercenary,     level: 6, at: [12, 9], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 6, then: aggressive } }
  - { id: h5, nameKey: unit.starving_raider.name, team: enemy, class: marksman,   sprite: bandit_archer, level: 6, at: [5, 12], items: [{ def: iron_bow }],   ai: { profile: trigger, radius: 6, then: aggressive } }
  - { id: h6, nameKey: unit.starving_raider.name, team: enemy, class: brigand,    sprite: brigand,       level: 7, at: [9, 13], items: [{ def: iron_axe }],   ai: { profile: trigger, radius: 6, then: aggressive } }
  - { id: h9, nameKey: unit.starving_raider.name, team: enemy, class: vanguard,   sprite: soldier,       level: 7, at: [8, 3],  items: [{ def: iron_lance }], ai: { profile: trigger, radius: 6, then: aggressive } }
  - { id: h7, nameKey: unit.starving_raider.name, team: enemy, class: vanguard,   sprite: soldier,       level: 7, at: [6, 3],  items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [normal, hard] }
  - { id: h8, nameKey: unit.starving_raider.name, team: enemy, class: marksman,   sprite: bandit_archer, level: 7, at: [11, 13], items: [{ def: iron_bow }],  ai: { profile: aggressive }, difficulty: [hard] }
pairs: []
# Wellen aus dem Lager ringsum, angekündigt: Runde 2 und 4
reinforcements:
  - turn: 2
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.starving_raider.name, team: enemy, class: brigand, sprite: brigand, level: 6, at: [0, 6], items: [{ def: hand_axe }], ai: { profile: aggressive } }
      - { nameKey: unit.starving_raider.name, team: enemy, class: skirmisher, sprite: mercenary, level: 6, at: [15, 8], items: [{ def: iron_sword }], ai: { profile: aggressive } }
  - turn: 4
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.starving_raider.name, team: enemy, class: vanguard, sprite: soldier, level: 7, at: [7, 0], items: [{ def: iron_lance }], ai: { profile: aggressive } }
      - { nameKey: unit.starving_raider.name, team: enemy, class: brigand, sprite: brigand, level: 7, at: [0, 11], items: [{ def: iron_axe }], ai: { profile: aggressive }, difficulty: [normal, hard] }
      - { nameKey: unit.starving_raider.name, team: enemy, class: marksman, sprite: bandit_archer, level: 7, at: [15, 12], items: [{ def: iron_bow }], ai: { profile: aggressive }, difficulty: [hard] }
objectives:
  victory: { type: survive, turns: 6 }
  defeat:
    - { type: unit_dies, unit: kael }
    - { type: unit_dies, unit: avatar }
  side:
    - { id: s_varek, type: recruit, unit: varek, reward: { gold: 300 } }
    - { id: s_villages, type: visit_villages, reward: { gold: 300 } }
    - { id: s_clean, type: no_downs, reward: { item: { def: vulnerary } } }
triggers:
  # Ein Spieler nähert sich Varek: kurze Sichtungszeile, danach Ansprechen durch Kael
  - id: t_varek_spotted
    once: true
    when: { type: unit_enters, team: player, area: { rect: [10, 3, 15, 9] } }
    then:
      - { action: dialogue, id: scn.m1_5.varek_spotted }
# Szenen: scn.m1_5.intro vor der Karte (Knoten pre), scn.m1_5.varek_spotted (Sichtung), scn.m1_5.varek_talk (Anwerben), scn.m1_5.hut_w / hut_e (Hütten),
# scn.m1_5.outro nach Runde 6 (Grosk redet, Entscheidung E3)
goldReward: 1200   # [C]
music: battle_a
devNote: >
  Standhalten. 16 × 16: Hügel mit Ruinen und Festungsfeldern in der Mitte, Ascheringe, Zelte und Feuer des Lagers ringsum, zwei Hütten im
  Süden. Gegner: Leicht 10, Normal 12, Schwer 14 (einschließlich Wellen Runde 2 und 4); Varek und die Kinder zählen nicht mit; Grosk steht nicht auf der Karte.
