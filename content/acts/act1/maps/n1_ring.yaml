# Szenen (9.10): scn.n1.intro / scn.n1.outro (Knoten pre/post); scn.n1.ring beim Fall des Ringmeisters (Trigger oben); Gedenk-Variante (Fenn gefallen) über den Knoten.
goldReward: 500
music: battle_a
design:
  title: Der Ring von Varnhold
  intent: >
    Kurze Nachtkarte für Fenns Vergangenheit: Dächer als zweite Ebene, Schützen oben, Klingen in den Gassen, Nebel und Sichtgrenze.
    Wer zuerst die Dachschützen holt, gewinnt die Gassen. Fenn öffnet die Truhen ohne Schlüssel.
  mood: Nacht im Gerberviertel, Nebel vom Fluss, Laternen an den Stegen, nasse Schindeldächer, Gerbbottiche auf dem Platz.
  phases:
    - { id: p1, turns: [1, 3], label: Uferweg, note: "Ankunft über die Stege, erste Gassenkämpfe." }
    - { id: p2, turns: [4, 6], label: Gerberplatz, note: Nachzügler durchs Nordtor (R4). }
    - { id: p3, turns: [7, 9], label: Diebesnest, note: Ringmeister auf dem Dach im Nordosten. }
  paths:
    - { team: player, points: [[6, 14], [4, 13], [4, 5], [9, 4], [9, 3], [10, 3]], label: Gassen }
    - { team: enemy, points: [[6, 1], [6, 5]], phase: p2, label: R4 }
  zones:
    - { area: { rect: [4, 5, 9, 9] }, label: Gerberplatz }
  marks:
    - { at: [11, 3], label: R, note: "Ringmeister mit Schlüsseln; ohne Fenn sind die Truhen erst nach ihm offen." }
    - { at: [2, 3], label: D, note: "Dächer: begehbar zu Fuß, Ausweichen-Bonus, gute Schussposition." }
    - { at: [4, 3], label: L, note: "Leiter an der Dachkante: hinauf nur zu Fuß, je Block mindestens eine." }
  notes:
    - "Normal 14 Gegner (2 davon R4) gegen 6 eigene; Leicht 12, Schwer 15."
