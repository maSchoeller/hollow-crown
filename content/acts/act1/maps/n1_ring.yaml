# Nebenquest N1 – Der Ring von Varnhold (Knoten n1, öffnet nach 1-4 mit E2 „schützen“). Entwurf s1_n1_ring (abgenommen 2026-11-01), Missionsliste: K 14×18, rout, Nacht. Startwerte [C].
# Gerberviertel von Varnhold am Fluss: Gassen im Raster, Häuserblöcke mit begehbaren Dächern (`roof`, Stufe 1, nur zu Fuß) und geschlossene Gerberhallen.
# Jeder Dachblock hat Leitern, die von der Gasse an der Dachkante lehnen (`ladders:`, Fuß in der Gasse, Fix 2026-11-08: das Gassenfeld bleibt für alle begehbar, hinauf nur zu Fuß): NW [4,3], NO [9,3] und [11,1], Ost [9,7], SW [4,12], Süd [6,12]. Nahkampf geht nicht über die Leiter: Wer die Schützen will, muss hinauf.
# Der Ringmeister (ring_master) sitzt auf dem Dach des Diebesnests und trägt die Truhenschlüssel: zwei Schlüssel für zwei Truhen, je eine Ladung. Beim Fall scn.n1.ring (Trigger), Zeilen für beide Fälle.
# Belohnung (Story 9.10): Glutfunke (ember_spark) und Elster (magpie) kommen mit dem Sieg als Knotenwirkung (campaign.yaml n1 effects), nicht aus einer Truhe.
# Gedenk-Variante (Fenn gefallen, memorialIf): gleiche Karte, gleiche Belohnung, nur andere Szenen. Pflicht und Niederlage bleiben eingetragen: Die Aufstellung filtert forced auf die Truppe, `unit_dies` greift nur für Figuren auf dem Brett, das Zielblatt nennt nur diese.
# Abweichungen vom Entwurf: Niederlage auch bei Lucans Tod, falls er mitkommt (Lucan verlässt die Truppe nie, PERMANENT_COMPANIONS); zwei Schlüssel statt einem; IDs ring_master statt ringmaster.
# Gerberhallen als Häuser (`building`) statt Mauer, Gerbbottiche als `well`, damit die Blöcke nicht wie begehbare Flächen wirken.
# Balancing 2026-11-05 [C]: Stufen wie im Entwurf; Normal Sieg 89 %, 1,30 Niedergestreckte (oberer Rand), Leicht 98 %, 0,62 (Korridor bis 0,5, offen).
# Heimsuchungs-Anker (Story 5.5, noch ohne Schema):
#   [11,3] Grund: das Dach des Diebesnests, hier hielt der Ringmeister sein Diebesgut.
#   [6,6] Grund: die Gerbbottiche auf dem Platz, Treffpunkt der Diebe.
#   [6,13] Grund: die Gasse am Uferweg, auf der die Truppe ins Viertel kam.
