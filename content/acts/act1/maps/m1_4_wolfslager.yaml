# Mission 1-4 – Die Spur des Maklers (Story 9.5). Layout-Entwurf, kein Knoten, keine Szenen. Startwerte [C].
# Ort: Lager der Wolfsreiter auf einer Waldlichtung. Tageszeit: Nacht, Wetter: klar (Lagerfeuer als Kohlebecken, art-direction §2.5; Felder timeOfDay/weather).
# Ziel: Boss Osric Dunn besiegen (boss). Er hat sich im Zelt am Nordende verschanzt. Leutnant Ulvric führt die Wolfsreiter.
# Ysolde sitzt im Käfig im Nordosten: Tür (geschlossen, Schlüssel oder Späher/Dietrich), danach Ansprechen = Anwerben (recruit).
# Kriegsnebel an (Nachtwald): Späher sehen weiter; die offene Lichtung begünstigt die Reiter, die Waldränder geben Fußtruppen Deckung.
# 16 × 18. Einmarsch von Süden über den Waldweg (x=7–8).
# E2 „ausliefern“ (Entscheidung vor der Mission: Fenn ausliefern → Mission leichter): OFFEN, welche Gegner dann entfallen; Vorschlag nur als Kommentar
#   bei g3, g4, wr3, wr4 (E2 „ausliefern“: …). Umsetzung folgt mit der Kampagnenbedingung (Condition auf E2-Flag), nicht in dieser Karte.
# OFFEN: Klasse und Sprite von Osric Dunn (Makler/Söldner; skirmisher + Sprite mercenary sind Platzhalter).
# OFFEN (2.9): wolf_rider – Ulvric und die Wolfsreiter sind vorläufig vanguard mit Lanze (Berittene fehlen noch).
# OFFEN: Szene scn.ch03.ysolde_cell (Anwerbe-Dialog) existiert nicht; recruit ohne dialogue bis die Szene da ist (Story 9.5).
# PLATZHALTER: Stufen 5–6 [C], Szenen: scn.m1_4.intro, scn.m1_4.dunn_battle, scn.m1_4.outro (Dunn stirbt, Rhens Geständnis).
id: m1_4_wolfslager
nameKey: map.m1_4_wolfslager.name
size: [16, 18]
fog: true
legend:
  ".": plain
  ",": grass
  "_": road
  "T": forest
  "W": stall         # Zelt (Requisite tent)
  "b": brazier       # Lagerfeuer (Requisite campfire)
  "x": fence         # Käfiggitter (Requisite fence)
  "D": door          # Käfigtür (geschlossen)
#          x: 0123456789ABCDEF
terrain: |
  TTTTTTTTTTTTTTTT
  TTTT,,,,,,,,TTTT
  TT,,,,WW,WW,,,xT
  TT,,,,W,,,W,,D,x
  TT,,,,,b,b,,,,xT
  TT,..........,TT
  TTTTW......W.,TT
  TTTT........TTTT
  TT,...b..b..TTTT
  TT,W........W,TT
  TT,..........,TT
  TTTT....b...TTTT
  TTTT.b.....bTTTT
  TTTT........TTTT
  TTTTTT,__,TTTTTT
  TTTTTT,__,TTTTTT
  TTTTTT,__,TTTTTT
  TTTTTT,__,TTTTTT
# Tageszeit und Wetter (Story 8.6): Preset aus render.yaml look.timeOfDay/weather
timeOfDay: night
weather: clear
lights:
  - { at: [7, 4], color: "#ffb35c", radius: 3 }
  - { at: [9, 4], color: "#ffb35c", radius: 3 }
  - { at: [6, 8], color: "#ffb35c", radius: 3 }
  - { at: [9, 8], color: "#ffb35c", radius: 3 }
  - { at: [8, 11], color: "#ffb35c", radius: 3 }
  - { at: [5, 12], color: "#ffb35c", radius: 3 }
  - { at: [11, 12], color: "#ffb35c", radius: 3 }
objects:
  - { id: cage, type: door, at: [13, 3] }   # Ysolde im Käfig; Schlüssel trägt Ulvric
initialEffects: []
# Heimsuchungs-Anker (Story 5.5, noch ohne Schema):
#   [8,8] Grund: die Lagermitte zwischen den Feuern – das Wolfslager, in das Ulvric zurückkehrt.
#   [8,2] Grund: Dunns Zelt am Nordende – der Makler, dessen Spur hierher führte.
#   [7,16] Grund: der Waldweg, auf dem die Truppe ins Lager einmarschierte.
deploy:
  max: 6
  forced: [avatar, kael]
  slots: [[7, 17], [8, 17], [7, 16], [8, 16], [6, 17], [9, 17], [6, 16], [9, 16]]
# Epic 3: Ulvric flieht bei 0 TP (gone: fled), Groll, Kopfgeld. Signaturwaffe Wolfszahn (wolf_fang) fehlt in items.yaml → OFFEN (items.md §6.3).
# Kein quote (Szenen folgen in 9.5). Ulvric hält den Käfigschlüssel (drops [1]).
units:
  - id: osric_dunn
    nameKey: unit.osric_dunn.name
    team: enemy
    class: skirmisher
    sprite: mercenary
    level: 6
    at: [8, 2]
    boss: true
    items: [ { def: steel_sword }, { def: vulnerary } ]
    drops: [1]
    ai: { profile: guard }
  - id: ulvric
    nameKey: unit.ulvric.name
    team: enemy
    class: vanguard
    level: 6
    at: [10, 8]
    lieutenant: ulvric
    sprite: ulvric
    portrait: ulvric
    items: [ { def: steel_lance }, { def: door_key } ]
    drops: [1]
    ai: { profile: trigger, radius: 5, then: aggressive }
  # Wolfsreiter (OFFEN (2.9): wolf_rider): vanguard mit Lanze, bis die Berittenen-Klasse da ist
  - { id: wr1, nameKey: unit.wolf_rider.name, team: enemy, class: vanguard, sprite: soldier, level: 5, at: [6, 10], items: [{ def: iron_lance }], ai: { profile: trigger, radius: 5, then: aggressive } }
  - { id: wr2, nameKey: unit.wolf_rider.name, team: enemy, class: vanguard, sprite: soldier, level: 5, at: [11, 9], items: [{ def: iron_lance }], ai: { profile: trigger, radius: 5, then: aggressive } }
  - { id: wr3, nameKey: unit.wolf_rider.name, team: enemy, class: vanguard, sprite: soldier, level: 5, at: [4, 8],  items: [{ def: iron_lance }], ai: { profile: aggressive } }   # E2 „ausliefern“: entfällt (OFFEN, welche)
  - { id: wr4, nameKey: unit.wolf_rider.name, team: enemy, class: vanguard, sprite: soldier, level: 5, at: [9, 6],  items: [{ def: iron_lance }], ai: { profile: aggressive } }   # E2 „ausliefern“: entfällt (OFFEN, welche)
  # Lagerwachen
  - { id: g1, nameKey: unit.bounty_hunter.name, team: enemy, class: brigand,  sprite: brigand,       level: 5, at: [7, 5],  items: [{ def: iron_axe }],  ai: { profile: trigger, radius: 4, then: aggressive } }
  - { id: g2, nameKey: unit.bounty_hunter.name, team: enemy, class: marksman, sprite: bandit_archer, level: 5, at: [9, 3],  items: [{ def: iron_bow }],  ai: { profile: hold } }
  - { id: g3, nameKey: unit.bounty_hunter.name, team: enemy, class: marksman, sprite: bandit_archer, level: 5, at: [12, 10], items: [{ def: iron_bow }], ai: { profile: hold }, difficulty: [normal, hard] }   # E2 „ausliefern“: entfällt (OFFEN)
  - { id: g4, nameKey: unit.bounty_hunter.name, team: enemy, class: brigand,  sprite: brigand,       level: 5, at: [5, 5],  items: [{ def: hand_axe }],  ai: { profile: hold }, difficulty: [normal, hard] }   # E2 „ausliefern“: entfällt (OFFEN)
  - { id: g5, nameKey: unit.bounty_hunter.name, team: enemy, class: vanguard, sprite: soldier,       level: 5, at: [12, 3],  items: [{ def: iron_lance }], ai: { profile: hold } }   # Käfigwache
  - { id: g6, nameKey: unit.bounty_hunter.name, team: enemy, class: brigand,  sprite: brigand,       level: 6, at: [3, 10],  items: [{ def: iron_axe }],  ai: { profile: aggressive }, difficulty: [hard] }
  - { id: g7, nameKey: unit.bounty_hunter.name, team: enemy, class: marksman, sprite: bandit_archer, level: 6, at: [11, 13],  items: [{ def: iron_bow }], ai: { profile: hold }, difficulty: [hard] }
  # OFFEN: Team der Gefangenen – hier enemy + hold + items leer wie Varek in ch02 (kann nicht kämpfen), ignoreForRout
  - { id: ysolde, char: ysolde, team: enemy, class: elementalist, level: 5, at: [14, 3], items: [], ai: { profile: hold }, ignoreForRout: true, recruit: { by: any } }
pairs: []
reinforcements:
  - turn: 4
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.wolf_rider.name, team: enemy, class: vanguard, sprite: soldier, level: 5, at: [2, 12], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [hard] }
      - { nameKey: unit.wolf_rider.name, team: enemy, class: vanguard, sprite: soldier, level: 5, at: [13, 12], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [hard] }
objectives:
  victory: { type: boss, unit: osric_dunn }
  defeat:
    - { type: unit_dies, unit: kael }
    - { type: unit_dies, unit: avatar }
  side:
    - { id: s_ysolde, type: recruit, unit: ysolde, reward: { gold: 300 } }
    - { id: s_clean, type: no_downs, reward: { item: { def: vulnerary } } }
    - { id: s_fast, type: turn_limit, turns: 10, reward: { gold: 200 } }   # [C] Startwert
triggers: []
# Szene (9.5): scn.m1_4.intro bei Rundenbeginn 1; scn.m1_4.dunn_battle; scn.m1_4.outro (Dunn stirbt; „Rhens Geständnis“)
goldReward: 1300   # [C]
music: battle_a
devNote: >
  Nachtlager im Nebel des Krieges. 16 × 18: Lichtung mit Zelten und Feuern, Dunns Zelt im Norden, Käfig im Nordosten (Tür bei [13,3]).
  Gegner: Leicht 9, Normal 11, Schwer 13 plus 2 Wolfsreiter in Runde 4 (Wellenzählung: Schwer 15 gesamt).
