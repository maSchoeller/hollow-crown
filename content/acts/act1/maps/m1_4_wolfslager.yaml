      - { action: set_flag, flag: m1_4_rockfall }
      - { action: set_terrain, area: { tiles: [[19, 14], [19, 15], [20, 14], [21, 14]] }, terrain: rockwall, level: 1 }
goldReward: 1000
music: battle_a
design:
  title: Die Spur des Maklers
  intent: >
    Erste veränderliche Karte: Wer den Hebel auf der Felsnase erreicht, verschüttet die Osthöhle und schneidet die Wolfswellen ab.
    Zwei Kämme machen Rampen und Lücken zu Engstellen; Wolfsreiter sind im Wald und am Fels langsam, auf dem Gras schnell.
  mood: Abendrot über kahlen Felskuppen, Wolfsgeheul aus den Höhlen, Lagerfeuer vor Dunns Höhle, Knochen und Fahnen der Wolfsbande.
  phases:
    - { id: p1, turns: [1, 3], label: Erste Rampe, note: "Rampe West, Mitte, Ost; erste Welle aus der Osthöhle (R3)." }
    - { id: p2, turns: [4, 7], label: Mittelterrasse, note: "Ulvric auf der Anhöhe; Felsrutsch möglich; Wellen R5 West, R6 Ost." }
    - { id: p3, turns: [8, 12], label: Dunns Höhle, note: "Lücke im zweiten Kamm, Schützen über den Rampen, Ysolde im Westen." }
  paths:
    - { team: player, points: [[10, 22], [10, 19], [10, 11], [10, 4]], label: Hauptweg }
    - { team: player, points: [[13, 22], [18, 21], [18, 18], [19, 17], [19, 13], [18, 13], [18, 11]], phase: p2, label: zum Hebel }
    - { team: player, points: [[3, 20], [2, 12], [2, 9], [2, 6], [2, 3]], phase: p3, label: zu Ysolde }
    - { team: enemy, points: [[21, 14], [18, 18], [18, 21], [13, 21]], phase: p1, label: Osthöhle }
    - { team: enemy, points: [[0, 14], [3, 18], [3, 21], [8, 21]], phase: p2, label: Westhöhle }
  zones:
    - { area: { rect: [9, 13, 12, 16] }, label: Anhöhe Ulvric, phase: p2 }
    - { area: { rect: [8, 1, 13, 3] }, label: Dunns Höhle, phase: p3 }
  marks:
    - { at: [19, 11], label: H, note: "Hebel: Felsrutsch, Felder [19,14], [19,15], [20,14], [21,14] werden zu rockwall; die Wellen der Osthöhle entfallen." }
    - { at: [10, 9], label: E, note: "Lücke im zweiten Kamm, zwei Lanzen halten sie." }
    - { at: [12, 8], label: S, note: "Schütze über der Mittelrampe: von oben Reichweite 2–3." }
    - { at: [1, 2], label: Y, note: "Ysolde gefangen; {avatar} spricht sie an. Der Kerkermeister trägt den Schlüssel für die Truhen." }
  notes:
    - "Gegner mit Wellen (R3/R5/R6) und Ysolde: Leicht 20, Normal 22, Schwer 25, gegen 8 eigene. Bei E2 „ausliefern“ vier, auf Leicht drei weniger."
    - "Truhen: Fenn öffnet ohne Schlüssel, alle anderen brauchen den Schlüssel des Kerkermeisters (Regel aus Story 2.6)."
    - Dunns letzte Worte (Saat Stimme) und E2 davor stehen in den Szenen.
