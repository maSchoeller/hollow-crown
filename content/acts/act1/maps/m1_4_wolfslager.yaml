# Mission 1-4 – Die Spur des Maklers (Knoten m1_4). Entwurf s1_1_4_wolfshuegel (abgenommen 2026-11-01), Missionsliste: M 22×26, boss Osric Dunn, 8 / 22, Leutnant Ulvric. Startwerte [C].
# Wolfshügel: zwei Felskämme teilen die Karte in drei Stufen (Höhenstufen, GDD): Fuß Süd = 0, Mittelterrasse y 10–19 = 1, Oberterrasse und Höhlen y 0–9 = 2.
# Die Kämme sind zwei Reihen dick: Die Lücken sind je ein Rampenfeld in der unteren Kammreihe (y 20 auf Stufe 0, y 10 auf Stufe 1), das Feld darüber (y 19, y 9) gehört schon zur höheren Stufe.
# Drei Rampen je Kamm: West, Mitte (zwei Felder breit), Ost. Ulvric hält mit Wolfsreitern die Anhöhe in der Mitte, aus zwei Wolfshöhlen (West, Ost) kommen Wellen. Dunn sitzt in der Höhle im Norden.
# Veränderliche Karte: Der Hebel l_rock steht auf der Felsnase (Stufe 2, Treppe von der Mittelterrasse); der Felsrutsch verschüttet die Osthöhle, ihre noch ausstehenden Wellen entfallen (`unlessFlag`).
# Ysolde sitzt gefangen in der Westhöhle ({avatar} spricht sie an, Szene scn.m1_4.ysolde_talk); der Kerkermeister trägt den Schlüssel für die Truhen, Fenn öffnet ohne Schlüssel.
# Team der Gefangenen wie bisher: enemy + hold + keine Waffe + ignoreForRout. Im Kampf ist Dunn nur besiegt; sein Tod und Rhens Geständnis stehen in der Nachszene scn.m1_4.outro.
# Entscheidung E2 (Szene scn.m1_4.intro, Flag e02): „ausliefern“ (e02 = hand_over) lässt wr3, wr4, g3, g4 entfallen (`requires`); Fenn geht dann.
# Abweichung vom Entwurf: w4 steht über der Mittelrampe statt auf der Ruine [14,7], damit +1 Reichweite von oben zählt: Er trifft die Rampe [11,10], von dort reicht ein Bogen nicht zurück.
# Balancing 2026-11-05 [C]: wr3 wartet (trigger, Radius 5) statt anzugreifen, s_ysolde 300 Gold wie auf der alten Karte (Normal vorher 1,44 Niedergestreckte, Korridor bis 1,3); Schwer: die drei Figuren nur für Schwer Stufe 4 statt 3 (Sieg blieb bei 94 %, Korridor bis 70 %; Messung nur über die 18 von 100 Läufen, die 1-4 erreichen, offen).
# Szenen: scn.m1_4.intro vor der Karte (Knoten pre, E2), scn.m1_4.dunn_battle, scn.m1_4.ysolde_talk, scn.m1_4.rockfall (Hebel), scn.m1_4.outro nach dem Sieg.
