# Mission 1-4 – Die Spur des Maklers (Story 9.5, Knoten m1_4). Startwerte [C], Stufen und Profile per Simulation abgestimmt.
# Ort: Lager der Wolfsreiter auf einer Waldlichtung. Tageszeit: Nacht, Wetter: klar (Lagerfeuer als Kohlebecken, art-direction §2.5; Felder timeOfDay/weather).
# Ziel: Boss Osric Dunn besiegen (boss). Er hat sich im Zelt am Nordende verschanzt. Im Kampf ist Dunn nur besiegt; sein Tod (Armbrustbolzen aus dem Wald)
# und Rhens Geständnis stehen in der Nachszene scn.m1_4.outro. Leutnant Ulvric (wolf_rider) führt die Wolfsreiter und trägt den Käfigschlüssel.
# Ysolde sitzt im Käfig im Nordosten: Tür `cage` (geschlossen; Schlüssel von Ulvric, Brenna trägt einen, ein Späher knackt sie), danach Ansprechen durch
# {avatar} = Anwerben (recruit mit Szene scn.m1_4.ysolde_talk). Team der Gefangenen wie Varek in 1-5: enemy + hold + keine Waffe + ignoreForRout.
# Kriegsnebel an (Nachtwald): Späher sehen weiter; die offene Lichtung begünstigt die Reiter, die Waldränder geben Fußtruppen Deckung.
# 16 × 18. Einmarsch von Süden über den Waldweg (x=7–8).
# Entscheidung E2 (Szene scn.m1_4.intro, Flag e02): „ausliefern“ (e02 = hand_over) lässt wr3, wr4, g3, g4 entfallen (`requires`, Story 9.5); Fenn geht dann.
# Das Versteck (dieses Lager) kennt jeder; der Tausch betrifft nur Wachwechsel und Hintereingang (PO 2026-10-27).
id: m1_4_wolfslager
nameKey: map.m1_4_wolfslager.name
size: [16, 18]
fog: true
legend:
  ".": plain
  ",": grass
  "_": road
  "T": forest
  "W": stall         # Zelt (Requisite tent)
  "b": brazier       # Lagerfeuer (Requisite campfire)
  "x": fence         # Käfiggitter (Requisite fence)
  "D": door          # Käfigtür (geschlossen)
#          x: 0123456789ABCDEF
terrain: |
  TTTTTTTTTTTTTTTT
  TTTT,,,,,,,,TTTT
  TT,,,,WW,WW,,,xT
  TT,,,,W,,,W,,D,x
  TT,,,,,b,b,,,,xT
  TT,..........,TT
  TTTTW......W.,TT
  TTTT........TTTT
  TT,...b..b..TTTT
  TT,W........W,TT
  TT,..........,TT
  TTTT....b...TTTT
  TTTT.b.....bTTTT
  TTTT........TTTT
  TTTTTT,__,TTTTTT
  TTTTTT,__,TTTTTT
  TTTTTT,__,TTTTTT
  TTTTTT,__,TTTTTT
# Tageszeit und Wetter (Story 8.6): Preset aus render.yaml look.timeOfDay/weather
timeOfDay: night
weather: clear
lights:
  - { at: [7, 4], color: "#ffb35c", radius: 3 }
  - { at: [9, 4], color: "#ffb35c", radius: 3 }
  - { at: [6, 8], color: "#ffb35c", radius: 3 }
  - { at: [9, 8], color: "#ffb35c", radius: 3 }
  - { at: [8, 11], color: "#ffb35c", radius: 3 }
  - { at: [5, 12], color: "#ffb35c", radius: 3 }
  - { at: [11, 12], color: "#ffb35c", radius: 3 }
objects:
  - { id: cage, type: door, at: [13, 3] }   # Ysolde im Käfig; Schlüssel trägt Ulvric
initialEffects: []
deploy:
  max: 6
  forced: [avatar, kael]
  slots: [[7, 17], [8, 17], [7, 16], [8, 16], [6, 17], [9, 17], [6, 16], [9, 16]]
# Heimsuchungs-Anker (Story 5.5): höchstens einer je Variante, die Gründe stehen als Kommentar darüber
haunts:
  # Grund: die Lagermitte zwischen den Feuern – das Wolfslager, in das Ulvric zurückkehrt.
  - variant: rout
    target: { at: [8, 8] }
    enemySpawn: { rect: [3, 5, 12, 6] }
    deploy: { rect: [6, 15, 9, 16] }
    max: 5
  # Grund: Dunns Zelt am Nordende – der Makler, dessen Spur hierher führte.
  - variant: boss
    target: { at: [8, 2] }
    enemySpawn: { rect: [3, 9, 12, 10] }
    deploy: { rect: [6, 15, 9, 16] }
    max: 5
  # Grund: der Waldweg, auf dem die Truppe ins Lager einmarschierte – hier hält sie den Rückzug.
  - variant: defend
    target: { at: [7, 16] }
    enemySpawn: { rect: [3, 5, 12, 6] }
    deploy: { rect: [5, 12, 10, 13] }
    max: 5
    turns: 8
# Epic 3: Ulvric flieht bei 0 TP (gone: fled), Groll, Kopfgeld; Signaturwaffe Wolfszahn (wolf_fang) ist Beute (Story 3.5). Seine Kartenwaffe ist Eisen
# (Review R14/R15), damit „+1 Tier je Groll“ greift; Klasse wolf_rider (kein Reittier, Wolfsfell nur Optik; Figur ulvric).
# Osric Dunn: Platzhalterfigur des Söldners (sprite mercenary) bis zur eigenen Figur (Epic 8); Halbfigur osric ist da, eine Büste fehlt (Klassenbild).
units:
  - id: osric
    nameKey: unit.osric.name
    team: enemy
    class: skirmisher
    sprite: mercenary
    level: 3
    at: [8, 2]
    boss: true
    items: [ { def: steel_sword }, { def: vulnerary } ]
    drops: [1]
    ai: { profile: guard }
    quote: scn.m1_4.dunn_battle
  - id: ulvric
    nameKey: unit.ulvric.name
    team: enemy
    class: wolf_rider
    level: 5
    at: [10, 8]
    lieutenant: ulvric
    sprite: ulvric
    portrait: ulvric
    items: [ { def: iron_lance }, { def: door_key } ]
    drops: [1]
    ai: { profile: trigger, radius: 5, then: aggressive }
  # Wolfsreiter: Klasse wolf_rider, Figur wolf_rider. wr3 und wr4 entfallen bei E2 „ausliefern“ (der Ring zeigt den Hintereingang und die Wachwechsel).
  - { id: wr1, nameKey: unit.wolf_rider.name, team: enemy, class: wolf_rider, sprite: wolf_rider, level: 2, at: [6, 10], items: [{ def: iron_lance }], ai: { profile: trigger, radius: 5, then: aggressive } }
  - { id: wr2, nameKey: unit.wolf_rider.name, team: enemy, class: wolf_rider, sprite: wolf_rider, level: 2, at: [11, 9], items: [{ def: iron_lance }], ai: { profile: trigger, radius: 5, then: aggressive } }
  - { id: wr3, nameKey: unit.wolf_rider.name, team: enemy, class: wolf_rider, sprite: wolf_rider, level: 2, at: [4, 8],  items: [{ def: iron_lance }], ai: { profile: aggressive }, requires: [{ not: { flag: { e02: hand_over } } }] }
  - { id: wr4, nameKey: unit.wolf_rider.name, team: enemy, class: wolf_rider, sprite: wolf_rider, level: 2, at: [9, 6],  items: [{ def: iron_lance }], ai: { profile: aggressive }, requires: [{ not: { flag: { e02: hand_over } } }] }
  # Lagerwachen; g3 und g4 entfallen bei E2 „ausliefern“ (Wachwechsel)
  - { id: g1, nameKey: unit.bounty_hunter.name, team: enemy, class: brigand,  sprite: brigand,       level: 2, at: [7, 5],  items: [{ def: iron_axe }],  ai: { profile: trigger, radius: 4, then: aggressive } }
  - { id: g2, nameKey: unit.bounty_hunter.name, team: enemy, class: marksman, sprite: bandit_archer, level: 2, at: [9, 3],  items: [{ def: iron_bow }],  ai: { profile: hold } }
  - { id: g3, nameKey: unit.bounty_hunter.name, team: enemy, class: marksman, sprite: bandit_archer, level: 2, at: [12, 10], items: [{ def: iron_bow }], ai: { profile: hold }, difficulty: [normal, hard], requires: [{ not: { flag: { e02: hand_over } } }] }
  - { id: g4, nameKey: unit.bounty_hunter.name, team: enemy, class: brigand,  sprite: brigand,       level: 2, at: [5, 5],  items: [{ def: hand_axe }],  ai: { profile: hold }, difficulty: [normal, hard], requires: [{ not: { flag: { e02: hand_over } } }] }
  - { id: g5, nameKey: unit.bounty_hunter.name, team: enemy, class: vanguard, sprite: soldier,       level: 2, at: [12, 3],  items: [{ def: iron_lance }], ai: { profile: hold } }   # Käfigwache
  - { id: g6, nameKey: unit.bounty_hunter.name, team: enemy, class: brigand,  sprite: brigand,       level: 3, at: [3, 10],  items: [{ def: iron_axe }],  ai: { profile: aggressive }, difficulty: [hard] }
  - { id: g7, nameKey: unit.bounty_hunter.name, team: enemy, class: marksman, sprite: bandit_archer, level: 3, at: [11, 13],  items: [{ def: iron_bow }], ai: { profile: hold }, difficulty: [hard] }
  # Ysolde, Gefangene im Käfig (Tür cage bei [13,3]): enemy + hold + keine Waffe wie Varek in 1-5, zählt nicht für Rout; {avatar} spricht sie an
  - { id: ysolde, char: ysolde, team: enemy, class: elementalist, level: 5, at: [14, 3], items: [], ai: { profile: hold }, ignoreForRout: true, recruit: { by: [avatar], dialogue: scn.m1_4.ysolde_talk } }
pairs: []
reinforcements:
  - turn: 4
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.wolf_rider.name, team: enemy, class: wolf_rider, sprite: wolf_rider, level: 2, at: [2, 12], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [hard] }
      - { nameKey: unit.wolf_rider.name, team: enemy, class: wolf_rider, sprite: wolf_rider, level: 2, at: [13, 12], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [hard] }
objectives:
  victory: { type: boss, unit: osric }
  defeat:
    - { type: unit_dies, unit: kael }
    - { type: unit_dies, unit: avatar }
  side:
    - { id: s_ysolde, type: recruit, unit: ysolde, reward: { gold: 300 } }
    - { id: s_clean, type: no_downs, reward: { item: { def: vulnerary } } }
    - { id: s_fast, type: turn_limit, turns: 10, reward: { gold: 200 } }   # [C] Startwert
triggers: []
# Szenen: scn.m1_4.intro vor der Karte (Knoten pre, Entscheidung E2), scn.m1_4.dunn_battle (Dunns Auftritt), scn.m1_4.ysolde_talk (Anwerben),
# scn.m1_4.outro nach dem Sieg (Dunns Tod, Rhens Geständnis mit Tafel)
goldReward: 1300   # [C]
music: battle_a
devNote: >
  Nachtlager im Nebel des Krieges. 16 × 18: Lichtung mit Zelten und Feuern, Dunns Zelt im Norden, Käfig im Nordosten (Tür bei [13,3]).
  Gegner: Leicht 9, Normal 11, Schwer 13 plus 2 Wolfsreiter in Runde 4 (Wellenzählung: Schwer 15 gesamt). Bei E2 „ausliefern“ entfallen
  wr3, wr4, g3, g4: Leicht 7, Normal 7, Schwer 9 (plus 2 Wolfsreiter).
