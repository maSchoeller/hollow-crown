# Mission 1-6 – Die Paktwacht (Knoten m1_6). Entwurf s1_1_6_paktwacht (abgenommen 2026-11-01), Missionsliste: G 30×40, seize, 12 / 36, Leutnants Hask und Ulvric. Startwerte [C].
# Schnitt von Süden: Erle, Felder mit Mühle, drei Terrassen mit Stützmauern, Vorburg, Burghof, Bergfried mit Thron am Fels des Grauen Kamms. Sturm bergauf.
# Stufen (Vorgabe Produktinhaber 2026-11-05, Decision Log): Felder und Terrasse 1 (y ≥ 25) = 0. Die Stützmauer y 25 führt über drei Verbindungen auf Stufe 1:
#   Mittelrampe [14–15,25], Rampe im Ostwald [25,25], Treppe des Ziegenpfads [28,25]. Terrasse 2, Terrasse 3, Vorburg, Burghof, Bergfried und Wachpass liegen auf Stufe 1.
#   Die Stützmauer y 21 bleibt Mauer mit Lücken (Zickzack) auf gleicher Stufe. Wehrgänge und Ecktürme liegen auf Stufe 2.
# Wehrgänge nur auf vier Abschnitten: Vorburg-Südmauer West und Ost samt Seitenmauer (Treppen [9,16], [20,16] aus dem Vorburghof), Burgmauer West samt Seitenmauer (Treppe [7,10] aus dem Burghof),
#   Burgmauer Ost (Treppe [17,13] aus dem Vorburghof). Das ist die Hauptaussage der Karte: Engstelle mit Schützen darüber. Die Treppen laufen an der Seitenmauer hoch, weil die Kamera eine Treppe an der Nordseite einer Mauer nur von hinten sieht.
# Burgtor [14–15,12] geschlossen: Der Hebel l_gate steht am Ostende des Wehrgangs Burgmauer Ost; der Hof darunter [20,13] ist Mauer, er lässt sich also nur von oben ziehen.
#   Späher und Schlüssel öffnen das Tor auch (Decision Log 2026-11-05). Das Vorburgtor [14–15,18] steht offen.
# Hask hält die Vorburg; bei 0 TP flieht er (Regel), erzählt durch die Ostpforte [21,15] über den Ziegenpfad (x 28) nach Süden; den Pfad nutzen auch Späher.
# Abweichungen vom Entwurf: t7 steht über der Mittelrampe statt im Weinstock, t13/t14 auf dem Vorburg-Wehrgang statt auf Terrasse 3, k3/k4 auf dem Burg-Wehrgang statt auf den Forts.
# Felder (`f`) als Gelände `field` statt Gras: gleiche Werte, zeigt die Felder. Gold kleiner als im Entwurf (Korridor Akt 1): goldReward 900, Truhe 300, Häuser 200 + 100, Nebenziel 400.
# Balancing 2026-11-05 [C], Normal über die verkettete Kampagne: Stufen 2–5 wie im Entwurf, Schützen und Wölfe je 1 Stufe tiefer, Auslöse-Radien 3 statt 4–5, drei Figuren nur auf Schwer (siehe Notizen). Die Truppe ist kleiner als die 12 Plätze.
# Nach dem Sieg (campaign.yaml, Knoten m1_6): Knotenwirkung setHome: castle; Szene scn.m1_6.outro mit Tafel, Gespräch „Eine Burg für Niemande“ und E4.
