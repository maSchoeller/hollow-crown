design:
  title: Die Paktwacht
  intent: >
    Erste große Schlacht, Sturm bergauf: Brücke, Felder, drei Terrassen mit Rampen im Zickzack, Vorburg, Burghof, Thron.
    Jede Stufe ist eine Engstelle mit Schützen darüber; Wölfe auf der untersten Terrasse und aus dem Westwald strafen lange Kolonnen.
  mood: Spätsommermittag, goldene Kornfelder an der Erle, Weinterrassen, darüber die graue Burg vor dem Fels, Marodeursfahnen auf den Türmen.
  phases:
    - { id: p1, turns: [1, 4], label: Brücke und Felder, note: "Lanzen an der Brücke, Plünderer in den Feldern, Mühle und Höfe." }
    - { id: p2, turns: [5, 9], label: Terrassen, note: "Ulvric und Wölfe auf Terrasse 1, Wolfswelle West (R5), Rückenwelle über die Furten (R8)." }
    - { id: p3, turns: [10, 14], label: Vorburg, note: "Hask am Tor; flieht bei 0 TP durch die Ostpforte über den Ziegenpfad. Hebel auf dem Burg-Wehrgang." }
    - { id: p4, turns: [15, 18], label: Burghof, note: Kastellan im Bergfried; Thron einnehmen. }
  paths:
    - { team: player, points: [[15, 38], [15, 28], [15, 25], [21, 22], [22, 21], [17, 19], [15, 18], [15, 14], [17, 13], [19, 12]], label: Sturm }
    - { team: player, points: [[15, 13], [15, 8], [15, 6]], phase: p4, label: Burgtor }
    - { team: enemy, points: [[21, 15], [23, 15], [27, 13], [28, 20], [28, 30], [26, 36]], phase: p3, label: Hasks Flucht }
    - { team: enemy, points: [[2, 28], [7, 27], [12, 27]], phase: p2, label: R5 Wölfe }
    - { team: enemy, points: [[25, 39], [25, 36], [23, 33]], phase: p2, label: R8 }
  zones:
    - { area: { rect: [6, 26, 23, 27] }, label: Terrasse 1 }
    - { area: { rect: [6, 22, 23, 24] }, label: Terrasse 2 }
    - { area: { rect: [6, 19, 23, 20] }, label: Terrasse 3 }
    - { area: { rect: [9, 13, 20, 17] }, label: Vorburg, phase: p3 }
  marks:
    - { at: [15, 36], label: E1, note: "Brücke über die Erle, zwei Lanzen; Furten rechts und links nur zu Fuß." }
    - { at: [15, 25], label: E2, note: "Mittelrampe Stützmauer 1, Lanzen oben, Schütze [17,24] darüber; Nebenrampe im Ostwald [25,25]; Treppe am Ziegenpfad [28,25]." }
    - { at: [22, 21], label: E3, note: "Lücken in Stützmauer 2 (Ost und West), gleiche Stufe." }
    - { at: [15, 18], label: E4, note: "Vorburgtor mit Hask dahinter, Schützen auf dem Wehrgang darüber (Stufe 2)." }
    - { at: [20, 12], label: H, note: "Hebel öffnet das Burgtor; nur vom Wehrgang [19,12] aus. Späher oder Schlüssel öffnen es auch." }
    - { at: [15, 3], label: G, note: "Gewölbe-Tor im Fels (Einstieg 1-7), verschlossen." }
