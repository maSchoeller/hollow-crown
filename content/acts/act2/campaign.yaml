# Akt 2 „Glut“ (Paket act2, unveröffentlicht bis zum ersten Live-Schritt nach 9.14). Kopf des Akts aus Story 11.1; die Folge
# m2_1 → (m2_2 ∥ m2_3) → m2_4 → (m2_5 ∥ m2_6) → m2_7 → m2_8 (Finale) und die Nebenquests N4–N6 prüft Story 11.11
# (tests/unit/act2-campaign-order.test.ts); die Karten und Szenen kommen mit den Missions-Stories.
# Der Übergang (Architektur §5.4): nach dem Finale von Akt 1 setzt finishMission c.act = 2, wenn dieses Paket im Build ist.
act: 2
# Stufendeckel von Akt 2 (Produktinhaber 2026-10-31): EP darüber verfallen
levelCap: 20
# Positionsstufe (Story 11.2, Architektur §5.4): die Stufe eines Knotens ist P = base + erledigte Story-Knoten von Akt 2 + levelBonus
# des Knotens; Gegner stehen per levelOffset (−3…+2) darauf, Gefährten von Akt 2 treten mit max(Stufe, P − 1) bei.
# base 12 (Story 11.4, Produktinhaber 2026-11-09): gemessene effektive Armee-Stufe beim Eintritt, Normal ohne Heimsuchungen 12,0 (Beförderte zählen +15).
positionLevel: { base: 12 }
# alle Regeln sind aus Akt 1 bekannt: keine gestaffelte Einführung mehr
mechanics: {}
# die Truppe lebt seit 1-6 in der Burg; home gilt nur als Startwert einer neuen Kampagne, die Heimat bleibt beim Übergang, wie sie ist
home: castle
# wird nie gelesen (Gold trägt aus Akt 1 weiter; nur der erste Akt gibt Startgold), vom Schema verlangt
startGold: 0
defaultPlace: grauwacht
startConvoy: []
# Knoten von Akt 2 (Story 11.3): Platzhalter, deren Karte noch nicht gebaut ist; die Weltkarte bietet sie nicht an (mapInBuild),
# bis ihre Missions-Story (11.12–11.22) die Karte anlegt. Die Karten-Ids sind vorläufig [ASSUMPTION], außer m2_1 (Karte seit Story 11.12); die Folge der Missionsliste
# in requires ist mit Story 11.11 geprüft. Nebenquests (Produktinhaber 2026-11-09): N4 und N6 wie N3/Tobin offen, wenn Ilka bzw.
# Jory in der Truppe oder gefallen ist, zu, wenn die Figur gegangen ist (Gedenk-Variante memorialIf/memorial mit 11.20 bzw. 11.22,
# die Szenen fehlen noch); N6 öffnet gleichzeitig mit 2-7 (nach 2-5 und 2-6); offene Nebenquests bleiben nach 2-8 nachholbar.
nodes:
  - { id: m2_1, fixed: first, map: m2_1_windscharte, titleKey: node.m2_1.title, place: windscharte, merchantTier: 0, pre: scn.m2_1.intro, post: scn.m2_1.outro }
  - { id: m2_2, map: m2_2_salzpass, titleKey: node.m2_2.title, requires: [{ completed: m2_1 }], place: salzpass, merchantTier: 1 }
  - { id: m2_3, map: m2_3_rabenweide, titleKey: node.m2_3.title, requires: [{ completed: m2_1 }], merchantTier: 1 }
  - { id: m2_4, map: m2_4_brandschneise, titleKey: node.m2_4.title, requires: [{ completed: m2_2 }, { completed: m2_3 }], place: brandschneise, merchantTier: 1 }
  - { id: m2_5, map: m2_5_silberquell, titleKey: node.m2_5.title, requires: [{ completed: m2_4 }], merchantTier: 1 }
  - { id: m2_6, map: m2_6_kraehenholm, titleKey: node.m2_6.title, requires: [{ completed: m2_4 }], place: kraehenholm, merchantTier: 1 }
  - { id: m2_7, map: m2_7_kontor, titleKey: node.m2_7.title, requires: [{ completed: m2_5 }, { completed: m2_6 }], place: kontor, merchantTier: 1 }
  - { id: m2_8, fixed: finale, map: m2_8_kronfeld, titleKey: node.m2_8.title, requires: [{ completed: m2_7 }], place: kronfeld, merchantTier: 1 }
  # N4 (Story 11.20): Gedenk-Variante wie N3/Tobin, wenn Ilka gefallen ist (gegangen bleibt zu); Glutfunke und Weißwolf in beiden Varianten
  - { id: n4, kind: side, map: n4_clanlager, titleKey: node.n4.title, pre: scn.n4.intro, post: scn.n4.outro, requires: [{ completed: m2_3 }, { any: [{ alive: ilka }, { dead: ilka }] }], memorialIf: { dead: ilka }, memorial: { pre: scn.n4.memorial_intro, post: scn.n4.memorial_outro }, place: clanlager, merchantTier: 1, effects: [{ item: { def: ember_spark } }, { item: { def: white_wolf } }] }
  # N5 (Story 11.21): Belohnung Glutfunke als Knotenwirkung (nur bei Sieg), Brann tritt nur im Kampf durch Ansprechen bei (Ilka, sonst Lucan)
  - { id: n5, kind: side, map: n5_kupfermine, titleKey: node.n5.title, pre: scn.n5.intro, post: scn.n5.outro, requires: [{ completed: m2_4 }], place: kupfermine, merchantTier: 1, effects: [{ item: { def: ember_spark } }] }
  # N6 (Story 11.22): Gedenk-Variante wie N3/Tobin, wenn Jory gefallen ist (gegangen bleibt zu); Signaturlaute Letzter Vorhang in beiden Varianten
  - { id: n6, kind: side, map: n6_auemarkt, titleKey: node.n6.title, pre: scn.n6.intro, post: scn.n6.outro, requires: [{ completed: m2_5 }, { completed: m2_6 }, { any: [{ alive: jory }, { dead: jory }] }], memorialIf: { dead: jory }, memorial: { pre: scn.n6.memorial_intro, post: scn.n6.memorial_outro }, place: auemarkt, merchantTier: 1, effects: [{ item: { def: final_curtain } }] }
# Händler von Akt 2 [ASSUMPTION]: Stufe 0 aus vorhandenen Teilen (Stahl, Heilung, Rüstung); Stufe 1 mit dem Stahl-Tier (Story 11.5, Fassung 2026-10-31),
# offen über merchantTier 1 der Knoten ab 2-2; Stufe 2 mit der 4. Story-Mission. shade (Dunkel) nie beim Händler (items.md §4). Stufe 3 und roomLevel 2: Story 10.9.
merchant:
  - tier: 0
    items: [vulnerary, remedy_salve, iron_sword, iron_lance, iron_axe, iron_bow, iron_dagger, steel_sword, steel_lance, steel_axe, steel_bow, heal_staff, mend_staff, chainmail, iron_helm, iron_shield, door_key]
  - tier: 1
    items: [blaze, gale_blade, stone_fist, whirlpool, light_lance, armorpiercer, steel_dagger, hammer, longbow, round_shield, steel_helm, scale_mail, physic_staff, crystal_focus]
  - tier: 2
    storyCount: 4
    items: [stiletto, tower_shield]
# Narben wie in Akt 1 (dieselben Ids; eine Narbe trägt über die Akte)
scars:
  - { id: lame_leg, mods: { mov: -1 } }
  - { id: shaky_hand, mods: { hit: -10 } }
  - { id: broken_ribs, mods: { hp: -3 } }
  - { id: weak_eye, mods: { crit: -5, hit: -5 } }
  - { id: shattered_shoulder, mods: { str: -2 } }
  - { id: nightmares, mods: { lck: -3, avoid: -5 } }
