# Mission 2-3 – Die Rabenweide (Knoten m2_3). Entwurf concept/27-ueberarbeitung/levels/s2_2_3_rabenweide.yaml, Missionsliste: M 22×26, boss Rowena, 9 / 24, Beitritt Ilka.
# Gestüt der Silbernen Lanze an der Aure. Die Truppe kommt im Süden über offene Weiden; der Fluss hat drei Furten (shallows: Gepanzerte kommen nicht durch)
# und seit Story 11.14 einen Steg an der Straße (PO 2026-11-09 F5 = C), damit Gepanzerte ans Nordufer kommen. Nördlich davon Koppeln und der Gestütshof.
# Rowena (Leutnantin, Boss) wacht im Hof erst auf, wenn jemand nah kommt, und bleibt dann dort (trigger → guard). Bei 0 KP flieht sie wie jeder
# Leutnant (gone: fled) und die Mission ist gewonnen; die Aufgabe erzählt die Nachszene (F1 = A). Ilka steht als Fährtenleserin der Lanze im Wald
# am Nordostufer und tritt nur durch Ansprechen bei (jede Figur, F3 = A; Werte aus units.yaml, P − 1).
# Abweichungen vom Entwurf (Story 11.14, alle in levels/abnahme/s2_2_3_rabenweide.md): Karten-Id m2_3_rabenweide, Szenen scn.m2_3.*, Gegner nur mit levelOffset
# und als Lanzenritter/Lanzenknecht mit den Figuren des Pools silver_lance, Plänkler mit Schwert statt Lanze (Klasse führt keine Lanze),
# Rowenas Stufe nach der Leutnant-Regel, Ilka ohne eigene Stufe/Waffen, Trigger t_rowena gestrichen (feuert für Leutnants nie),
# Steg [10,12]–[10,13] statt des mittleren Furtfelds [ASSUMPTION], Koppelzaun und -tor (paddock, F6 = D) statt Zaun, Stall/Scheune/Heu im Hof (propVariants).
# Gold 2 000 und zwei Heimsuchungs-Anker rout und defend (F8 = A).
# Balancing [C] (pnpm sim m2_3_rabenweide --campaign act2 --start expected --runs 50, Story 11.14), Sieg / Niedergestreckte / Tote / Runden:
#   früheste Position (nach 2-1, P 13): Leicht 100 % / 0,02 / 0,00 / p50 7; Normal 100 % / 0,61 / 0,06 / p50 9; Schwer 82 % / 2,49 / 0,83 / p50 22
#   späteste Position (nach 2-2, P 14):  Leicht 100 % / 0,00 / 0,00 / p50 7; Normal 100 % / 0,49 / 0,10 / p50 10; Schwer 92 % / 1,36 / 0,29 / p50 17 (25 Läufe)
#   Schwer liegt über dem Korridor (Sieg, Niedergestreckte); Abstimmung in Story 11.27
# Szenen: scn.m2_3.intro vor der Karte (Knoten pre), scn.m2_3.water_hint (Runde 2), scn.m2_3.ilka_talk (Ansprechen), scn.m2_3.outro nach dem Sieg.
