  - { id: t_fire_w3, once: true, when: { type: turn_start, turn: 3, phase: player }, then: [{ action: ignite, area: { rect: [2, 8, 13, 11] }, warn: true }] }
  - { id: t_fire_e3, once: true, when: { type: turn_start, turn: 3, phase: player }, then: [{ action: ignite, area: { rect: [16, 6, 27, 7] }, warn: true }] }
  - { id: t_fire_w4, once: true, when: { type: turn_start, turn: 4, phase: player }, then: [{ action: ignite, area: { rect: [2, 12, 13, 16] }, warn: true }] }
  - { id: t_fire_e4, once: true, when: { type: turn_start, turn: 4, phase: player }, then: [{ action: ignite, area: { rect: [16, 8, 27, 9] }, warn: true }] }
  - { id: t_fire_e5, once: true, when: { type: turn_start, turn: 5, phase: player }, then: [{ action: ignite, area: { rect: [16, 10, 27, 11] }, warn: true }] }
  - { id: t_fire_e6, once: true, when: { type: turn_start, turn: 6, phase: player }, then: [{ action: ignite, area: { rect: [16, 12, 27, 13] }, warn: true }] }
  - { id: t_fire_e7, once: true, when: { type: turn_start, turn: 7, phase: player }, then: [{ action: ignite, area: { rect: [16, 14, 27, 16] }, warn: true }] }
  # Brann reißt die Schneise; die Szene spielt nur, solange er auf dem Brett steht (fällt er, ist die Mission ohnehin verloren)
  - id: t_break_west
    once: true
    when: { type: turn_start, turn: 3, phase: player }
    then:
      - { action: dialogue, id: scn.m2_4.brann_break_west, onBoard: brann }
      - { action: set_terrain, area: { tiles: [[3, 17], [4, 17], [5, 17], [7, 17], [8, 17], [9, 17], [10, 17], [11, 17], [12, 17], [13, 17]] }, terrain: ash }
  - id: t_break_east
    once: true
    when: { type: turn_start, turn: 6, phase: player }
    then:
      - { action: dialogue, id: scn.m2_4.brann_break_east, onBoard: brann }
      - { action: set_terrain, area: { tiles: [[16, 17], [17, 17], [18, 17], [19, 17], [20, 17], [21, 17], [22, 17], [24, 17], [25, 17], [26, 17]] }, terrain: ash }
