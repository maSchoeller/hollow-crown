# Mission 2-4 – Die Brandschneise (Knoten m2_4). Entwurf concept/27-ueberarbeitung/levels/s2_2_4_brandschneise.yaml, Missionsliste: G 30×40, defend Brann 12, 12 / 38, Leutnant Grell.
# Bergdorf am Brandhang, drei Stufen von Nord nach Süd: oben Wald und Getreide (Stufe 2), das Dorf auf der Mittelterrasse (Stufe 1), unten Felder und Weide (Stufe 0);
# zwischen den Stufen nur Rampen und Treppen. Dravns Feuer kommt von Norden, Grells Plünderer dahinter und in den Flanken. Brann (Gast, nicht steuerbar) steht
# auf dem Schrein und reißt in Runde 3 (West) und 6 (Ost) die Schneise auf y 17 (ash); fällt er, ist die Mission verloren. Sable sieht von der Lichtung zu.
# Feuer [ASSUMPTION] PO F1 vorläufig A: eine feste, angekündigte Feuerfront (Trigger-Aktion ignite mit warn) frisst sich nach Süden, im Westen schneller
# (R2 y 4–7, R3 y 8–11, R4 y 12–16) als im Osten (je zwei Reihen, R7 y 14–16); jede Kante brennt erst eine Runde nach ihrer Schneise. Die Straße x 14–15 trennt
# beide Hälften, Berg und Rampen brennen nicht: südlich der Schneise kommt kein Feuer an. Schneller oder langsamer: nur die Runden der t_fire_*-Trigger ändern.
# Abweichungen vom Entwurf (Story 11.15, alle in levels/abnahme/s2_2_4_brandschneise.md): Karten-Id m2_4_brandschneise, Szenen scn.m2_4.*, Gegner nur mit levelOffset
# und mit den Figuren des Pools silver_sea, Grell als skirmisher mit steel_sword (Leutnant-Regel), Brann mit Stufe und Werten aus units.yaml,
# Sable ohne Waffe auf einer Lichtung aus plain (F4), a0 mit Truhenschlüssel, Feuerfront (F1), Chronik a2_brandhang (F6), Gold 2 500 (F5), zwei Heimsuchungs-Anker.
# Balancing [C] siehe Abschnitt „Übernahme Story 11.15“ der Abnahme-Datei (pnpm sim m2_4_brandschneise --campaign act2 --start expected, P = 15).
# Szenen: scn.m2_4.intro (Knoten pre), scn.m2_4.brann_break_west (R3), scn.m2_4.grell_battle (R6, Gegnerphase), scn.m2_4.brann_break_east (R6),
# scn.m2_4.sable_watches (R7), scn.m2_4.page (Köhlertruhe), scn.m2_4.outro mit E7 (Knoten post).
