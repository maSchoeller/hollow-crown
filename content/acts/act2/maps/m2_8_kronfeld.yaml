# Mission 2-8 – Kronfeld (Knoten m2_8, Finale von Akt 2). Entwurf concept/27-ueberarbeitung/levels/s2_2_8_kronfeld.yaml, Missionsliste: G 30×40, survive → escape, 15 / 40,
# Leutnants Rowena, Grell, Brakka, Sable. Der neutrale Treffpunkt wird zur Falle: Die Truppe steht auf dem Hügel mit dem Festzelt (Terrasse, Stufe 1), die vier Mächte
# kommen von allen Seiten. Erst überleben (Runde 1–5), dann ausbrechen: Fluchtziel ist das Nordufer der Aure (Zeilen 0–1), mindestens 6 Figuren, Rhen und Lucan dabei.
# Höhen: Treffpunkt und Osthügel sind Terrasse (Stufe 1), die Felsnase des Osthügels crag (Stufe 2); die Balliste [24,13] steht auf Stufe 2 und reicht bis zum Treffpunkt.
# Veränderliche Karte: Das Brückentor [14,6]/[15,6] ist zu. In Runde 6 zögert Rowena (Saat Rowena), das Tor geht auf, sie und ihre beiden Lanzen halten still (hold).
# Wer früher weg will, geht durch die Furt im Osten (rect [23,2,25,5]): Betritt eine eigene Figur sie, beginnt die Flucht sofort (advance_objective); ab Runde 9 sperren Lanzen sie.
# Abweichungen vom Entwurf (Story 11.19, alle in levels/abnahme/s2_2_8_kronfeld.md): Karten-Id m2_8_kronfeld, Szenen scn.m2_8.*, Gegner nur mit levelOffset und vorhandenen
# Namen (Lanzenritter/Lanzenknecht, Kaperfahrer, Freie Klinge, Grenzsoldat), Grell als skirmisher mit steel_sword (Leutnant-Regel), Ziel survive 5 → escape (Story 11.8)
# statt escape mit Tor, Trigger an der Furt, Gold 3 000 statt 2 000, zwei Heimsuchungs-Anker.
# Balancing [C] siehe Abschnitt „Übernahme Story 11.19“ der Abnahme-Datei (pnpm sim --campaign act2 --runs 50).
# Szenen: scn.m2_8.intro (Knoten pre), scn.m2_8.hollow_crown (R1, die Falle), scn.m2_8.rowena_hesitates (R6, Tor), scn.m2_8.ford (Furt betreten),
# scn.m2_8.outro (Knoten post: Nordufer, Rowena, „Die Krone war hohl“, Ende von Akt 2).
id: m2_8_kronfeld
nameKey: map.m2_8_kronfeld.name
size: [30, 40]
