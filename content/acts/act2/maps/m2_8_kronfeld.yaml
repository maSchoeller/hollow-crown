  - { level: 2, area: { tiles: [[24, 13]] } }
  - { level: 1, area: { tiles: [[24, 15]] } }
timeOfDay: evening
weather: clear
objects:
  - { id: b_hill, type: ballista, at: [24, 13] }
deploy:
  max: 15
  forced: [avatar, lucan]
  slots: [[11, 18], [12, 18], [13, 18], [14, 18], [15, 18], [16, 18], [17, 18], [18, 18], [11, 19], [12, 19], [17, 19], [18, 19], [11, 20], [12, 20], [17, 20], [18, 20], [11, 22], [12, 22], [13, 22], [14, 22], [15, 22], [16, 22], [17, 22], [18, 22]]
# Heimsuchungs-Anker (Story 5.5; Story 11.19 [ASSUMPTION], nach dem Muster von 2-1, 2-5 bis 2-7 gleich mitgeliefert), die Gründe stehen als Kommentar darüber
haunts:
  # Grund: der Treffpunkt – nach dem Verrat sammeln sich Versprengte aller vier Banner auf den Feldern im Süden und halten den Hügel mit dem Zelt.
  - variant: rout
    target: { at: [14, 18] }
    enemySpawn: { rect: [9, 30, 20, 33] }
    deploy: { rect: [3, 8, 10, 9] }
  # Grund: der Osthügel – die Freien Klingen haben ihren Sold in Kisten bei der Balliste zurückgelassen; die Truppe kommt über die Furt und muss sie bergen.
  - variant: treasure
    target: { at: [22, 13] }
    enemySpawn: { rect: [2, 24, 10, 26] }
    deploy: { rect: [20, 7, 27, 8] }
    turns: 10
    chests: [[22, 12], [26, 14]]
