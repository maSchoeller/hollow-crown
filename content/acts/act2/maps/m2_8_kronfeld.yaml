      - { nameKey: unit.lance_squire.name, team: enemy, class: vanguard, sprite: soldier, levelOffset: -2, at: [29, 22], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [easy, normal] }
      - { nameKey: unit.lance_squire.name, team: enemy, class: skirmisher, sprite: mercenary, levelOffset: -2, at: [29, 26], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [easy, normal] }
