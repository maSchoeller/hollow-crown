objectives:
  # Ziel-Phasen (Story 11.8): 5 Runden halten, dann über die Aure; 6 Figuren am Nordufer ist der Vorschlag des Entwurfs (per Sim geprüft, Abnahme-Datei)
  victory:
    type: survive
    turns: 5
    then: { type: escape, area: { rect: [0, 0, 29, 1] }, min: 6, must: [avatar, lucan] }
  defeat:
    - { type: unit_dies, unit: avatar }
    - { type: unit_dies, unit: lucan }
  side:
    - { id: s_all, type: no_downs, reward: { gold: 800 } }
    - { id: s_fast, type: turn_limit, turns: 14, reward: { gold: 500 } }
triggers:
  # Runde 1: die Falle schnappt zu (Seraphines Befehl, die vier Banner)
  - id: t_trap
    once: true
    when: { type: turn_start, turn: 1, phase: player }
    then:
      - { action: dialogue, id: scn.m2_8.hollow_crown }
  # Runde 6: Rowena zögert (Saat Rowena), das Brückentor geht auf, sie und ihre beiden Lanzen halten still
  - id: t_hesitate
    once: true
    when: { type: turn_start, turn: 6, phase: player }
    then:
      - { action: dialogue, id: scn.m2_8.rowena_hesitates }
      - { action: set_terrain, area: { tiles: [[14, 6], [15, 6]] }, terrain: gate }
      - { action: set_ai, units: [rowena, n1, n2], profile: hold }
  # Wer vorher durch die Furt kommt, beginnt die Flucht sofort
  - id: t_ford
    once: true
    when: { type: unit_enters, team: player, area: { rect: [23, 2, 25, 5] } }
    then:
      - { action: dialogue, id: scn.m2_8.ford }
      - { action: advance_objective }
# Gold nach der Goldkurve von Akt 2 (2 000–3 000, GDD Ökonomie), als Finale am oberen Rand [ASSUMPTION, Story 11.27 stimmt ab]; dazu 800 + 500 aus den Nebenzielen (Anteil 43 %)
goldReward: 3000
design:
  title: Kronfeld
  intent: >
    Das Finale von Akt 2: Alle vier Anwärter-Linien schließen sich um die Truppe, „Die Krone war hohl“. Erst überleben, dann ausbrechen: In Runde 6 öffnet Rowenas Zögern das Brückentor, wer schneller sein will, kämpft sich zur Furt durch.
    Alles, was die Spieler in Akt 2 gelernt haben, kommt zusammen: offene Ebene, Balliste auf dem Hügel, Höhe, Furt.
  mood: Weite goldene Ebene im letzten Abendlicht, ein Festzelt auf einem Hügel unter vier Bannern, die Aure mit steinerner Brücke im Norden, Speerlinien am Horizont, Rauch.
  phases:
    - { id: p1, turns: [1, 5], label: Überleben, note: "Falle schnappt zu, R3 Welle West, R5 Welle Ost. Hügel halten, Rampen sind die Engstellen." }
    - { id: p2, turns: [6, 9], label: Das Tor, note: "R6 Rowena zögert, Tor offen, ihre Leute halten still. R7 Süden, R9 sperren Lanzen die Furt." }
    - { id: p3, turns: [10, 15], label: Ausbruch, note: "Sechs Figuren über die Brücke oder durch die Furt aufs Nordufer." }
  paths:
    - { team: player, points: [[14, 17], [14, 7], [14, 2], [14, 1]], phase: p2, label: Brücke }
    - { team: player, points: [[18, 18], [24, 18], [28, 16], [28, 8], [24, 6], [24, 1]], phase: p1, label: Furt }
    - { team: enemy, points: [[2, 21], [9, 21]], phase: p1, label: Grell }
    - { team: enemy, points: [[27, 19], [20, 21]], phase: p1, label: Söldner }
    - { team: enemy, points: [[15, 34], [15, 26]], phase: p1, label: Grenzheer }
    - { team: enemy, points: [[14, 12], [14, 17]], phase: p1, label: Krone }
  zones:
    - { area: { rect: [0, 0, 29, 1] }, label: Nordufer Flucht }
    - { area: { rect: [11, 18, 18, 24] }, label: Treffpunkt St.1 }
    - { area: { rect: [22, 12, 26, 15] }, label: Hügel St.1–2 }
    - { area: { rect: [23, 2, 25, 5] }, label: Furt }
  marks:
    - { at: [14, 6], label: T, note: "Brückentor, geschlossen bis Runde 6. Niemand trägt hier einen Schlüssel, nur Fenn kann es laut Regel früher öffnen, wenn er bis dorthin durchkommt." }
    - { at: [24, 13], label: BA, note: "Brakkas Balliste, deckt Hügel und Ostseite. Reicht bis zum Treffpunkt." }
    - { at: [14, 9], label: R, note: "Rowena. Ab Runde 6 hält sie still, wenn niemand sie angreift." }
  notes:
    - "Stufen über levelOffset (Produktinhaber 2026-11-05: Start P−3, Wellen P−2, Elite P−1, Leutnants P+1, Boss P+2)."
    - "Normal 40 Gegner (12 davon in Wellen) gegen 15 eigene; Leicht 36, Schwer 30 (Story 11.27). Sable und Hauptmann schließen sich aus (e07)."
    - "Ziel: survive 5 → escape (Story 11.8), min 6, Rhen und Lucan müssen hinaus; die Furt beginnt die Flucht früher."
    - "Leistung: 1 200 Felder und bis zu 40 Gegner, Architektur T8 (Story 11.26 misst)."
    - "Odiles Zeile wechselt nach E5, Seraphines nach E8, Sable spricht nach E7 warn als Gefährtin; Saat Rowena als Szene in R6 und am Ende von Kronfeld."
