# Mission 2-7 – Das Kontor am Silbermeer (Knoten m2_7). Entwurf concept/27-ueberarbeitung/levels/s2_2_7_kontor.yaml, Missionsliste: M 20×25, reach Schreibstube, 10 / 26, Leutnant Brakka, Regen.
# Kontor des Hauses Silbermeer an der Auremündung: Ein Hafenbecken teilt die Karte, nur die Steinbrücke führt hinüber, und Brakkas Balliste hält sie unter Feuer.
# Höhen: Der Nordkai mit Kontor und Balliste liegt eine Stufe höher (Stufe 1, rect [1,0,18,10]); vom Kaifuß (y 11) führen Treppen an der Brücke ([9,11], [10,11]) und im Osten ([18,11]) hinauf.
# Veränderliche Karte: Der Hebel am Kran im Osten [16,15] legt einen Steg über das Becken (rect [15,12,15,14]), zweiter Weg zur Ostseite und zum Zahlmeister mit dem Türschlüssel (Fenn braucht keinen).
# Abweichungen vom Entwurf (Story 11.18, alle in levels/abnahme/s2_2_7_kontor.md): Karten-Id m2_7_kontor, Szenen scn.m2_7.*, Gegner nur mit levelOffset, Nordkai auf Stufe 1 mit drei Treppen,
# Schützen n3/n4 eine Reihe höher auf dem Kai, Chronik-Seite a2_kontor, Gold 2 000 statt 1 300, zwei Heimsuchungs-Anker.
# Balancing [C] siehe Abschnitt „Übernahme Story 11.18“ der Abnahme-Datei (pnpm sim --campaign act2 --runs 50).
# Szenen: scn.m2_7.intro vor der Karte (Knoten pre), scn.m2_7.crane (Hebel), scn.m2_7.page (Chronik-Truhe, Saat Pakt), scn.m2_7.outro nach der Karte (Geschäftsbücher, E8).
