# Nordkai mit Kontor und Balliste auf Stufe 1 (Schützen von oben +1 Reichweite); der Kaifuß y 11 bleibt Stufe 0, die Treppen führen hinauf
levels:
  - { level: 1, area: { rect: [1, 0, 18, 10] } }
timeOfDay: morning
weather: rain
objects:
  # zwei verschlossene Eingänge vorn, einer an der Ostseite; den Schlüssel trägt der Zahlmeister, Fenn öffnet ohne
  - { id: d_front_w, type: door, at: [9, 5] }
  - { id: d_front_e, type: door, at: [10, 5] }
  - { id: d_side, type: door, at: [14, 3] }
  - { id: b_quay, type: ballista, at: [10, 8] }
  - { id: l_crane, type: lever, at: [16, 15] }
  # Chronik-Seite in der Nordostecke der Schreibstube (Saat Pakt: erste und letzte Seite aus derselben Hand)
  - { id: c_page, type: chest, at: [13, 2], contents: { gold: 300, chronicle: a2_kontor, dialogue: scn.m2_7.page } }
deploy:
  max: 10
  forced: [avatar, lucan]
  slots: [[6, 22], [7, 23], [8, 22], [11, 22], [12, 23], [13, 22], [6, 23], [8, 23], [11, 23], [13, 23], [7, 24], [8, 24], [11, 24], [12, 24]]
# Heimsuchungs-Anker (Story 5.5; Story 11.18 [ASSUMPTION], nach dem Muster von 2-1, 2-5 und 2-6 gleich mitgeliefert), die Gründe stehen als Kommentar darüber
haunts:
  # Grund: der Südkai – nach dem Kontor-Überfall heuert das Haus Silbermeer neue Klingen an, sie halten die Lagerhäuser an der Brücke.
  - variant: rout
    target: { at: [9, 18] }
    enemySpawn: { rect: [3, 15, 14, 16] }
    deploy: { rect: [6, 22, 13, 23] }
  # Grund: der Nordkai – Kisten mit Silbermeer-Siegel warten auf das nächste Schiff; die Truppe landet im Westen und muss sie vor den Wachen bergen.
  - variant: treasure
    target: { at: [2, 3] }
    enemySpawn: { rect: [11, 6, 18, 7] }
    deploy: { rect: [1, 6, 6, 7] }
    turns: 10
    chests: [[3, 2], [16, 2]]
