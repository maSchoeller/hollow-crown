# Nebenquest N4 – Der Clan im Schnee (Knoten n4, öffnet nach 2-3, wenn Ilka in der Truppe oder gefallen ist; gegangen bleibt zu). Entwurf
# concept/27-ueberarbeitung/levels/s2_n4_clan.yaml, Missionsliste: M 20×24, survive 9, 8 / 20, kein Leutnant.
# Ilkas Clanlager auf einer Lichtung im Bergwald der Kupferberge, früher Schnee (season winter, weather snow; Akt 2 ist sonst Herbst) und Nebel.
# Dravns Vorposten (Grenzheer, Fraktion iron_march) kommen im Nebel aus dem Wald von allen vier Seiten, Wellen R3 Nord, R5 Süd, R7 West.
# Felsnase (crag, Stufe 2) im Nordwesten über Rampe [3,8], Terrasse und Treppe [4,7]: Unter Nebel sieht man je Höhenstufe weiter
# (balance.yaml fog.levelBonus, Story 11.20 [ASSUMPTION]); sie ist der einzige hohe Punkt der Karte und damit der einzige Blick über den Nebel.
# Die Clanälteste (dritte Partei, civilian) steht mitten im Lager; fällt sie, scheitert nur das Nebenziel s_elder, keine Niederlage.
# Ilka ist Pflicht, solange sie in der Truppe ist; gefallen filtert die Aufstellung sie heraus (presentForced, Story 11.10), die Gedenk-Variante
# (memorialIf dead ilka) ändert die Karte nicht. Belohnung als Knotenwirkung: Glutfunke und Signaturbogen Weißwolf (white_wolf), in beiden Varianten.
# Abweichungen vom Entwurf (Story 11.20, alle in levels/abnahme/s2_n4_clan.md): Karten-Id n4_clanlager, Gegner nur mit levelOffset und als
# „Grenzsoldat“ mit den Figuren des Pools iron_march, Hauptmann mit eigenem Namen, Älteste mit Figur des Dorfältesten, ein Heimsuchungs-Anker.
# Balancing [C] siehe Abschnitt „Übernahme Story 11.20“ der Abnahme-Datei (pnpm sim n4_clanlager --campaign act2 --start expected).
# Szenen: scn.n4.intro vor der Karte, scn.n4.outro nach Runde 9; Gedenk-Variante scn.n4.memorial_intro/outro.
id: n4_clanlager
nameKey: map.n4_clanlager.name
size: [20, 24]
fog: true
legend:
  ",": grass
  "_": road
  "T": forest
  "^": mountain
  "n": stall
  "v": village
  "%": terrace
  "c": crag
  "s": stairs
  "/": ramp
#          x: 01234567890123456789
terrain: |
  ^TTTTTTTT__TTTTTTTT^
  ^TTTTTTTT__TTTTTTTT^
  ^TTTTTTTT__TTTTTTTT^
  ^TccccTTT__TTTTTTTT^
  ^TccccTTT__TTTTTTTT^
  ^TccccTTT__TTTTTTTT^
  ^TccccTTT__TTTTTTTT^
  ^T%%s%TTT__TTTTTTTT^
  ^TT/,,,,,,,,,,,,TTT^
  ^TTT,,,n,,,,n,,,TTT^
  ^TTT,,v,,,,,,v,,TTT^
  ,,,,,,,,,,,,,,,,,,,,
  ,,,,,^,,,,,,,,^,,,,,
  ,,,,,,,,^,,,,,,,,,,,
  ^TTT,,n,,,,,,n,,TTT^
  ^TTT,,,,,,,^,,,,TTT^
  ^TTT,,,,,,,,,,,,TTT^
  ^TTTTTTTT__TTTTTTTT^
  ^TTTTTTTT__TTTTTTTT^
  ^TTTTTTTT__TTTTTTTT^
  ^TTTTTTTT__TTTTTTTT^
  ^TTTTTTTT__TTTTTTTT^
  ^TTTTTTTT__TTTTTTTT^
  ^TTTTTTTT__TTTTTTTT^
levels:
  # Treppe zwischen Terrasse (Stufe 1) und Felsnase (crag, Stufe 2); die Rampe [3,8] führt vom Lager auf die Terrasse
  - { level: 1, area: { tiles: [[4, 7]] } }
timeOfDay: morning
# Story 15.15: früher Schnee in Akt 2 (Boden Schnee, Schneehauben); snow ist in Akt 2 nur mit season winter erlaubt (validateLook)
weather: snow
season: winter
objects:
  - { id: v_west, type: village, at: [6, 10], reward: { gold: 200 } }
  - { id: v_east, type: village, at: [13, 10], reward: { material: { moonsteel: 1 } } }
deploy:
  max: 8
  forced: [avatar, lucan, ilka]
  slots: [[8, 10], [9, 10], [10, 10], [11, 10], [8, 11], [9, 11], [11, 11], [8, 12], [9, 12], [11, 12]]
# Heimsuchungs-Anker (Story 5.5) [ASSUMPTION]: einer im Lager, der Grund steht als Kommentar darüber
haunts:
  # Grund: das Clanlager selbst – Dravns Vorposten kommen wieder aus dem Wald, die Truppe steht wie in der Mission zwischen den Zelten.
  - variant: rout
    target: { at: [10, 12] }
    enemySpawn: { rect: [7, 1, 12, 4] }
    deploy: { rect: [7, 13, 12, 15] }
units:
  # Dravns Vorposten aus dem Wald, Hauptmann im Norden
  - { id: capt, nameKey: unit.outpost_captain.name, team: enemy, class: skirmisher, sprite: mercenary, levelOffset: -1, at: [9, 3], items: [{ def: steel_sword }], ai: { profile: aggressive } }
  - { id: a1, nameKey: unit.border_soldier.name, team: enemy, class: vanguard, sprite: soldier, levelOffset: -3, at: [10, 5], items: [{ def: iron_lance }], ai: { profile: aggressive } }
  - { id: a2, nameKey: unit.border_soldier.name, team: enemy, class: knight, sprite: soldier, levelOffset: -3, at: [9, 6], items: [{ def: iron_lance }], ai: { profile: aggressive } }
  - { id: a3, nameKey: unit.border_soldier.name, team: enemy, class: marksman, sprite: bandit_archer, levelOffset: -3, at: [7, 5], items: [{ def: iron_bow }], ai: { profile: trigger, radius: 5, then: aggressive } }
  - { id: a4, nameKey: unit.border_soldier.name, team: enemy, class: marksman, sprite: bandit_archer, levelOffset: -3, at: [12, 5], items: [{ def: iron_bow }], ai: { profile: trigger, radius: 5, then: aggressive }, difficulty: [normal, hard] }
  - { id: b1, nameKey: unit.border_soldier.name, team: enemy, class: skirmisher, sprite: mercenary, levelOffset: -3, at: [2, 12], items: [{ def: iron_sword }], ai: { profile: aggressive } }
  - { id: b2, nameKey: unit.border_soldier.name, team: enemy, class: vanguard, sprite: soldier, levelOffset: -3, at: [3, 16], items: [{ def: iron_lance }], ai: { profile: trigger, radius: 5, then: aggressive } }
  - { id: b3, nameKey: unit.border_soldier.name, team: enemy, class: marksman, sprite: bandit_archer, levelOffset: -3, at: [2, 10], items: [{ def: iron_bow }], ai: { profile: trigger, radius: 5, then: aggressive }, difficulty: [normal, hard] }
  - { id: c1, nameKey: unit.border_soldier.name, team: enemy, class: skirmisher, sprite: mercenary, levelOffset: -3, at: [17, 12], items: [{ def: iron_sword }], ai: { profile: aggressive } }
  - { id: c2, nameKey: unit.border_soldier.name, team: enemy, class: vanguard, sprite: soldier, levelOffset: -3, at: [16, 16], items: [{ def: iron_lance }], ai: { profile: trigger, radius: 5, then: aggressive } }
  - { id: c3, nameKey: unit.border_soldier.name, team: enemy, class: marksman, sprite: bandit_archer, levelOffset: -3, at: [17, 10], items: [{ def: iron_bow }], ai: { profile: trigger, radius: 5, then: aggressive } }
  - { id: d1, nameKey: unit.border_soldier.name, team: enemy, class: knight, sprite: soldier, levelOffset: -3, at: [9, 18], items: [{ def: iron_lance }], ai: { profile: aggressive } }
  - { id: d2, nameKey: unit.border_soldier.name, team: enemy, class: skirmisher, sprite: mercenary, levelOffset: -3, at: [10, 19], items: [{ def: iron_sword }], ai: { profile: aggressive }, difficulty: [normal, hard] }
  - { id: d3, nameKey: unit.border_soldier.name, team: enemy, class: marksman, sprite: bandit_archer, levelOffset: -3, at: [12, 18], items: [{ def: iron_bow }], ai: { profile: trigger, radius: 5, then: aggressive } }
  # Nur Schwer
  - { id: h1, nameKey: unit.border_soldier.name, team: enemy, class: knight, sprite: soldier, levelOffset: -2, at: [8, 3], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [hard] }
  - { id: h2, nameKey: unit.border_soldier.name, team: enemy, class: marksman, sprite: bandit_archer, levelOffset: -2, at: [11, 3], items: [{ def: iron_bow }], ai: { profile: trigger, radius: 5, then: aggressive }, difficulty: [hard] }
  - { id: h3, nameKey: unit.border_soldier.name, team: enemy, class: vanguard, sprite: soldier, levelOffset: -2, at: [10, 20], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [hard] }
  # Die Clanälteste, Zivilistin; das Nebenziel hängt an ihr
  - { id: elder, nameKey: unit.clan_elder.name, team: other, class: civilian, sprite: villager_elder, portrait: villager_elder, level: 5, at: [10, 12], items: [], ai: { profile: hold }, ignoreForRout: true }
reinforcements:
  # Nord
  - turn: 3
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.border_soldier.name, team: enemy, class: vanguard, sprite: soldier, levelOffset: -2, at: [9, 0], items: [{ def: iron_lance }], ai: { profile: aggressive } }
      - { nameKey: unit.border_soldier.name, team: enemy, class: skirmisher, sprite: mercenary, levelOffset: -2, at: [10, 0], items: [{ def: iron_sword }], ai: { profile: aggressive } }
      - { nameKey: unit.border_soldier.name, team: enemy, class: marksman, sprite: bandit_archer, levelOffset: -2, at: [9, 1], items: [{ def: iron_bow }], ai: { profile: aggressive } }
  # Süd
  - turn: 5
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.border_soldier.name, team: enemy, class: knight, sprite: soldier, levelOffset: -2, at: [9, 23], items: [{ def: iron_lance }], ai: { profile: aggressive } }
      - { nameKey: unit.border_soldier.name, team: enemy, class: skirmisher, sprite: mercenary, levelOffset: -2, at: [10, 23], items: [{ def: iron_sword }], ai: { profile: aggressive } }
  # West
  - turn: 7
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.border_soldier.name, team: enemy, class: vanguard, sprite: soldier, levelOffset: -2, at: [1, 12], items: [{ def: iron_lance }], ai: { profile: aggressive } }
objectives:
  victory: { type: survive, turns: 9 }
  defeat:
    - { type: unit_dies, unit: avatar }
    - { type: unit_dies, unit: lucan }
  side:
    - { id: s_downs, type: no_downs, reward: { item: { def: vulnerary } } }
    - { id: s_tents, type: visit_villages, reward: { gold: 300 } }
    - { id: s_elder, type: protect_npc, unit: elder, reward: { gold: 300 } }
# [ASSUMPTION] Gold wie Entwurf; die Akt-2-Kurve stimmt 11.27 ab
goldReward: 1400
design:
  title: Der Clan im Schnee
  intent: >
    Ilkas Heimat: Das Lager hält im Nebel gegen Dravns Vorposten. Die Felsnase ist der einzige Blick über den Nebel, wer dort steht, fehlt am Lager. Ilka bekommt ihre Geschichte und den Signaturbogen.
  mood: Früher Schnee im Bergwald, dunkle Tannen, gedrungene Fellzelte mit Rauch, Morgennebel zwischen den Stämmen, Spuren im Weiß.
  phases:
    - { id: p1, turns: [1, 3], label: Aus dem Nebel, note: "Vier Richtungen, im Nebel unsichtbar, R3 Nord." }
    - { id: p2, turns: [4, 9], label: Lager halten, note: "R5 Süd, R7 West. Älteste und Zelte schützen." }
  zones:
    - { area: { rect: [4, 8, 15, 16] }, label: Clanlager }
    - { area: { rect: [2, 3, 5, 6] }, label: Hochsitz St.2 }
  marks:
    - { at: [3, 8], label: R, note: "Rampe, Terrasse, Treppe zur Felsnase (Stufe 2)." }
    - { at: [10, 12], label: A, note: "Clanälteste, kann fallen; Nebenziel, keine Niederlage." }
  notes:
    - "Stufen über levelOffset (Formatwunsch, Produktinhaber 2026-11-05: Start P−3, Wellen P−2, Elite P−1, Leutnants P+1, Boss P+2). level zeigt den Wert bei P = 14 und bleibt fürs Schema."
    - "Normal 20 Gegner (6 davon R3/R5/R7), gegen 8 eigene; Leicht 17, Schwer 23."
    - "Belohnung als Knotenwirkung: Glutfunke und Signaturbogen white_wolf, auch in der Gedenk-Variante. Ilka ist Pflicht, wenn sie lebt; ist sie gefallen, entfällt sie aus forced (Formatwunsch: bedingte Pflichtfigur)."
    - "Epic 11.18 sah 14×16 und defend vor; es gilt die Missionsliste mit 20×24 und survive."
