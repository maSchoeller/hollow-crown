# Mission 2-1 – Wind über der Eisenmark (Knoten m2_1). Entwurf concept/27-ueberarbeitung/levels/s2_2_1_windscharte.yaml, Missionsliste: M 20×25, survive 10, 9 / 24, Leutnant Brakka, Beitritt Jory.
# Die Truppe kommt von Süden die Passstraße herauf. Die Windscharte ist ein trockenes altes Flusstal: vier Felder breit, zwei Felsnasen (crag, Stufe 2) mit Ballisten darüber, dahinter die offene Ebene.
# Lektion Balliste (Story 11.6, PO 2026-11-09 F3 = A): scn.m2_1.tutorial_ballista spielt, sobald eine eigene Figur eine der beiden Felsnasen oder ihre Treppe betritt (unit_enters), genau einmal.
# Gegnerische Bedienung: Brakka an der Ostballiste, ein Schütze an der Westballiste, beide mit Profil hold. Jory steht als Gast am Gauklerwagen und tritt nur durch Ansprechen bei (Werte aus units.yaml, P − 1).
# Abweichungen vom Entwurf (Story 11.12, alle in levels/abnahme/s2_2_1_windscharte.md): Karten-Id m2_1_windscharte, Szenen scn.m2_1.*, Reiter-Lektion gestrichen (keine Reiter),
# Gegner nur mit levelOffset und als „Freie Klinge“ (Fraktion free_blades) mit den Figuren des Pools, Söldner-Plänkler der Wellen mit Schwert statt Lanze (Klasse führt keine Lanze),
# Brakkas Stufe nach der Leutnant-Regel, Jory ohne eigene Stufe/Waffen (Gefährten-Definition).
# Balancing [C] siehe Abschnitt „Übernahme Story 11.12“ der Abnahme-Datei (pnpm sim m2_1_windscharte --campaign act2 --start expected).
# Szenen: scn.m2_1.intro vor der Karte (Knoten pre), scn.m2_1.tutorial_ballista (Felsnase), scn.m2_1.jory_talk (Ansprechen), scn.m2_1.dragon_shadow (Runde 8), scn.m2_1.outro nach Runde 10 (Angebote, Haltung).
id: m2_1_windscharte
nameKey: map.m2_1_windscharte.name
size: [20, 25]
legend:
  "Q": ballista
  ".": plain
  ",": grass
  "_": road
  "T": forest
  "^": mountain
  "F": fort
  "W": wagon
  "%": terrace
  "c": crag
  "/": ramp
  "s": stairs
#          x: 01234567890123456789
terrain: |
  ,,,,,,,,,__,,,,,,,,,
  ,,TT,,,,,__,,,,,TT,,
  ,,TT,,,,,__,,,,,,,,,
  ,,,,,,,,,__,,,,,,,,,
  ,,,,,,,,,__,,,TT,,,,
  ,,,,TT,,,__,,,TT,,,,
  ,,,,,,,,,__,,,,,,,,,
  ^^^,,,,,,__,,,,,,,^^
  ^^^^^,,,,__,,,,^^^^^
  ^^^^^^^,,__,,^^ccc^^
  ^^^^^^^^,__,^^^cQc^^
  ^^^^^^^^,__,^^^ccc^^
  ^^ccc^^^,__,^^^^s^^^
  ^^cQc^^^,__,^^^%%%^^
  ^^ccc^^^,__,^^^%%%^^
  ^^^s^^^,,__,,^^%%%^^
  ^%%%%^,,,__,,,^^/^^^
  ^%%%%,,,,__,FF,,,,^^
  ^^/^^^,,,__,,,,,,,,^
  ,,,,,,,,T__T,,,,,W,,
  ,,TT,,,,,__,,,,TT,,,
  ,,TT,,,,,__,,,,TT,,,
  ,,,,,,,,,__,,,,,,,,,
  ^^,,,,,,,__,,,,,,,^^
  ^^^^,,,,,__,,,,,^^^^
levels:
  # Balliste auf der Felsnase: das Gelände ballista hat keine eigene Stufe; crag ist Stufe 2, terrace Stufe 1
  - { level: 2, area: { tiles: [[3, 13], [16, 10]] } }
  - { level: 1, area: { tiles: [[16, 12], [3, 15]] } }
# Leiter an der Kante der Westterrasse: Fuß [5,17] ist Gras für alle, hinauf nur zu Fuß
ladders:
  - { at: [5, 17], up: w }
timeOfDay: morning
weather: clear
objects:
  - { id: b_west, type: ballista, at: [3, 13] }
  - { id: b_east, type: ballista, at: [16, 10] }
  # Brakkas Sold auf der Ostnase: Fenn öffnet ohne Schlüssel, sonst der Schlüssel der Wache
  - { id: c_pay, type: chest, at: [17, 9], contents: { gold: 400 } }
deploy:
  max: 9
  forced: [avatar, lucan]
  slots: [[7, 21], [8, 21], [11, 21], [12, 21], [7, 22], [8, 22], [9, 22], [10, 22], [11, 22], [12, 22], [9, 23], [10, 23]]
units:
  # Ostnase: Brakka an der Balliste (Stufe nach der Leutnant-Regel, levelOffset nur fürs Format), Wache oben, Söldner auf der Terrasse darunter
  - { id: brakka, nameKey: unit.brakka.name, team: enemy, class: marksman, levelOffset: 1, at: [15, 10], lieutenant: brakka, items: [{ def: steel_bow }], ai: { profile: hold } }
  - { id: g_east, nameKey: unit.free_blade.name, team: enemy, class: vanguard, sprite: soldier, levelOffset: -2, at: [16, 11], items: [{ def: iron_lance }, { def: door_key }], drops: [1], ai: { profile: guard } }
  - { id: t_east, nameKey: unit.free_blade.name, team: enemy, class: skirmisher, sprite: mercenary, levelOffset: -3, at: [16, 14], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 4, then: aggressive } }
  # Westnase: Bedienung an der Balliste, Wache, Söldner auf der Terrasse
  - { id: crew_west, nameKey: unit.free_blade.name, team: enemy, class: marksman, sprite: bandit_archer, levelOffset: -3, at: [3, 12], items: [{ def: iron_bow }], ai: { profile: hold } }
  - { id: g_west, nameKey: unit.free_blade.name, team: enemy, class: vanguard, sprite: soldier, levelOffset: -3, at: [3, 14], items: [{ def: iron_lance }], ai: { profile: guard } }
  - { id: t_west, nameKey: unit.free_blade.name, team: enemy, class: brigand, sprite: brigand, levelOffset: -3, at: [3, 16], items: [{ def: iron_axe }], ai: { profile: trigger, radius: 4, then: aggressive } }
  # In der Scharte: die erste Linie kommt sofort
  - { id: m1, nameKey: unit.free_blade.name, team: enemy, class: brigand, sprite: brigand, levelOffset: -3, at: [9, 12], items: [{ def: iron_axe }], ai: { profile: aggressive } }
  - { id: m2, nameKey: unit.free_blade.name, team: enemy, class: skirmisher, sprite: mercenary, levelOffset: -3, at: [10, 12], items: [{ def: iron_sword }], ai: { profile: aggressive } }
  - { id: m3, nameKey: unit.free_blade.name, team: enemy, class: vanguard, sprite: soldier, levelOffset: -3, at: [8, 11], items: [{ def: iron_lance }], ai: { profile: aggressive } }
  - { id: m4, nameKey: unit.free_blade.name, team: enemy, class: brigand, sprite: brigand, levelOffset: -3, at: [11, 11], items: [{ def: iron_axe }], ai: { profile: aggressive }, difficulty: [normal, hard] }
  - { id: m5, nameKey: unit.free_blade.name, team: enemy, class: marksman, sprite: bandit_archer, levelOffset: -3, at: [9, 9], items: [{ def: iron_bow }], ai: { profile: aggressive } }
  - { id: m6, nameKey: unit.free_blade.name, team: enemy, class: marksman, sprite: bandit_archer, levelOffset: -3, at: [10, 9], items: [{ def: iron_bow }], ai: { profile: aggressive }, difficulty: [normal, hard] }
  - { id: m7, nameKey: unit.free_blade.name, team: enemy, class: skirmisher, sprite: mercenary, levelOffset: -3, at: [8, 8], items: [{ def: iron_sword }], ai: { profile: aggressive } }
  - { id: m8, nameKey: unit.free_blade.name, team: enemy, class: healer, sprite: cleric, levelOffset: -3, at: [11, 8], items: [{ def: heal_staff }], ai: { profile: support } }
  # Nur Schwer
  - { id: h1, nameKey: unit.free_blade.name, team: enemy, class: vanguard, sprite: soldier, levelOffset: -2, at: [9, 8], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [hard] }
  - { id: h2, nameKey: unit.free_blade.name, team: enemy, class: marksman, sprite: bandit_archer, levelOffset: -2, at: [10, 8], items: [{ def: iron_bow }], ai: { profile: aggressive }, difficulty: [hard] }
  # Jory am liegengebliebenen Gauklerwagen, in Reichweite der Ostballiste: Gast, tritt nur durch Ansprechen bei (Stufe max(10, P − 1), Waffen aus units.yaml)
  - { id: jory, char: jory, team: other, class: minstrel, at: [16, 19], items: [], ai: { profile: hold }, ignoreForRout: true, guest: true, recruit: { by: any, dialogue: scn.m2_1.jory_talk } }
reinforcements:
  # Erste Welle über die Ebene
  - turn: 3
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.free_blade.name, team: enemy, class: vanguard, sprite: soldier, levelOffset: -2, at: [9, 0], items: [{ def: iron_lance }], ai: { profile: aggressive } }
      - { nameKey: unit.free_blade.name, team: enemy, class: skirmisher, sprite: mercenary, levelOffset: -2, at: [10, 0], items: [{ def: iron_sword }], ai: { profile: aggressive } }
      - { nameKey: unit.free_blade.name, team: enemy, class: vanguard, sprite: soldier, levelOffset: -2, at: [7, 0], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [normal, hard] }
  # Zweite Welle
  - turn: 6
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.free_blade.name, team: enemy, class: skirmisher, sprite: mercenary, levelOffset: -2, at: [9, 0], items: [{ def: iron_sword }], ai: { profile: aggressive } }
      - { nameKey: unit.free_blade.name, team: enemy, class: vanguard, sprite: soldier, levelOffset: -2, at: [10, 0], items: [{ def: iron_lance }], ai: { profile: aggressive } }
      - { nameKey: unit.free_blade.name, team: enemy, class: skirmisher, sprite: mercenary, levelOffset: -2, at: [12, 0], items: [{ def: iron_sword }], ai: { profile: aggressive } }
      - { nameKey: unit.free_blade.name, team: enemy, class: vanguard, sprite: soldier, levelOffset: -2, at: [7, 0], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [hard] }
  # Die Falle: Söldner kommen von hinten die Passstraße herauf
  - turn: 7
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.free_blade.name, team: enemy, class: brigand, sprite: brigand, levelOffset: -2, at: [9, 24], items: [{ def: iron_axe }], ai: { profile: aggressive } }
      - { nameKey: unit.free_blade.name, team: enemy, class: skirmisher, sprite: mercenary, levelOffset: -2, at: [10, 24], items: [{ def: iron_sword }], ai: { profile: aggressive } }
      - { nameKey: unit.free_blade.name, team: enemy, class: vanguard, sprite: soldier, levelOffset: -2, at: [8, 24], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [normal, hard] }
  # Letzte Welle
  - turn: 9
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.free_blade.name, team: enemy, class: skirmisher, sprite: mercenary, levelOffset: -2, at: [9, 0], items: [{ def: iron_sword }], ai: { profile: aggressive } }
      - { nameKey: unit.free_blade.name, team: enemy, class: vanguard, sprite: soldier, levelOffset: -2, at: [10, 0], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [hard] }
objectives:
  victory: { type: survive, turns: 10 }
  defeat:
    - { type: unit_dies, unit: avatar }
    - { type: unit_dies, unit: lucan }
  side:
    - { id: s_jory, type: recruit, unit: jory, reward: { gold: 200 } }
    - { id: s_pay, type: open_chests, reward: { item: { def: vulnerary } } }
triggers:
  # Lektion Balliste: die erste eigene Figur auf einer Felsnase (crag) oder ihrer Treppe
  - id: t_ballista
    once: true
    when:
      type: unit_enters
      team: player
      area: { tiles: [[2, 12], [3, 12], [4, 12], [2, 13], [4, 13], [2, 14], [3, 14], [4, 14], [3, 15], [15, 9], [16, 9], [17, 9], [15, 10], [17, 10], [15, 11], [16, 11], [17, 11], [16, 12]] }
    then:
      - { action: dialogue, id: scn.m2_1.tutorial_ballista }
  # Saat Drachen: ein Schatten über der Scharte (nur Szene, keine Figur)
  - id: t_shadow
    once: true
    when: { type: turn_start, turn: 8, phase: player }
    then:
      - { action: dialogue, id: scn.m2_1.dragon_shadow }
goldReward: 1100
design:
  title: Wind über der Eisenmark
  intent: >
    Neues Land, neue Gefahr: Die Truppe gerät im Scheitel des Passes in Brakkas Sperre und muss zehn Runden aushalten, bis die Boten von Seraphine und Dravn kommen.
    Lektion Balliste: Wer eine Felsnase erobert, dreht die Balliste um und beschießt die Wellen schon in der Scharte.
  mood: Klarer, kalter Herbstmorgen im Hochgebirge, Sturm reißt an Fahnen und Gras, kahle Felsnasen mit großen Ballisten, dahinter die weite goldbraune Ebene der Eisenmark, ein liegengebliebener bunter Gauklerwagen an der Passstraße.
  phases:
    - { id: p1, turns: [1, 3], label: Der Kessel, note: "Erste Linie aus der Scharte, die Ballisten decken die Straße bis y 17. Jory wird beschossen." }
    - { id: p2, turns: [4, 6], label: Die Wellen, note: "Söldner kommen durch die Scharte (R3, R6). Sturm auf die Nasen über Rampe, Leiter und Treppe." }
    - { id: p3, turns: [7, 10], label: Die Falle, note: "R7 Söldner von Süden, R8 Drachenschatten, R9 letzte Welle, nach R10 die Boten." }
  paths:
    - { team: player, points: [[8, 21], [6, 19], [2, 19], [2, 17], [3, 16], [3, 15], [3, 14]], phase: p2, label: Westnase }
    - { team: player, points: [[6, 17], [5, 17], [4, 17]], phase: p2, label: Leiter }
    - { team: player, points: [[12, 21], [16, 18], [16, 16], [16, 13], [16, 12], [16, 11]], phase: p2, label: Ostnase }
    - { team: enemy, points: [[9, 0], [9, 8], [9, 15], [10, 20]], phase: p2, label: Wellen }
    - { team: enemy, points: [[9, 24], [9, 21]], phase: p3, label: Von hinten }
  zones:
    - { area: { rect: [8, 10, 11, 14] }, label: Die Scharte }
    - { area: { rect: [2, 12, 4, 14] }, label: Felsnase St.2 }
    - { area: { rect: [15, 9, 17, 11] }, label: Felsnase St.2 }
    - { area: { rect: [1, 16, 4, 17] }, label: Terrasse St.1 }
    - { area: { rect: [15, 13, 17, 15] }, label: Terrasse St.1 }
    - { area: { rect: [12, 17, 13, 17] }, label: Passhospiz, phase: p1 }
  marks:
    - { at: [3, 13], label: BW, note: "Balliste West. Reichweite 3–10, von Stufe 2 aus 11: deckt die Straße bis etwa y 18." }
    - { at: [16, 10], label: BO, note: "Balliste Ost mit Brakka. Reicht bis zum Hospiz und bis zu Jorys Wagen." }
    - { at: [5, 17], label: L, note: "Leiter an der Terrassenkante: hinauf nur zu Fuß, 1 Bewegung extra; der kurze Weg auf die Westterrasse." }
    - { at: [12, 17], label: H, note: "Passhospiz: heilt, liegt aber in Reichweite der Ostballiste." }
  notes:
    - "Stufen über levelOffset (Produktinhaber 2026-11-05: Start P−3, Wellen P−2, Elite P−1, Leutnants P+1, Boss P+2); P = 12 (positionLevel.base, 2-1 ist fixed: first)."
    - "Normal 24 Gegner (10 davon R3/R6/R7/R9) gegen 9 eigene (+ Jory); Leicht 20, Schwer 28."
    - "Die KI bedient die Balliste nur mit Profil hold (Brakka Ost, Schütze West)."
    - "Saat Drachen: In Runde 8 zieht ein Schatten über die Scharte, Söldner und Truppe halten kurz inne (Szene, keine Figur)."
    - "Nach dem Sieg: Rowenas Lanzenreiter (ohne Rowena) und ein Bote Dravns erreichen den Pass gleichzeitig, beide bieten den Freispruch an; Rhen antwortet mit einer Haltung (PO 2026-11-09). Brakka zieht ab, sie wurde bezahlt."
