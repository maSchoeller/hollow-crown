# Nebenquest N5 – Glut unter dem Berg (Knoten n5). Entwurf concept/27-ueberarbeitung/levels/s2_n5_mine.yaml, Missionsliste: K 16×20, treasure 4 Truhen in 12 Runden, 7 / 15, kein Leutnant, Beitritt Brann.
# Bergwerk bei Kupferhall, eben (keine Höhenstufen), enge Stollen im Kriegsnebel. Die Truppe kommt von Süden durch den Hauptschacht; vier Truhen in vier Winkeln:
# Westgang (Mondstahl, Brann), Ostgang (Chronik-Seite, Hebel), Knochenhalle im Norden (Drachenglut, Erd-Rune III).
# Zur Knochenhalle führen die verschlossene Mitteltür (zwei Flügel, verknüpft: ein Schlüssel öffnet beide; der Vorarbeiter trägt ihn, Fenn öffnet als Späher ohne)
# oder das Gatter [12,9], das nur der Hebel [14,12] öffnet (Trigger set_terrain zu gate, wie im Entwurf; das Gatter ist kein Objekt, kein Schlüssel öffnet es).
# Brann (Gast, team other) sitzt im Westgang und tritt nur bei, wenn Ilka oder Lucan ihn ansprechen; wer es versäumt, hat ihn für die Staffel nicht, die Quest bleibt gewonnen.
# Saat Drachen: Wer die Knochenhalle betritt, sieht die Rippen im Fels (scn.n5.bones, einmal); die Drachenglut-Truhe spielt scn.n5.relic.
# Abweichungen vom Entwurf (Story 11.21, alle in levels/abnahme/s2_n5_mine.md): Karten-Id n5_kupfermine, Gegner nur mit levelOffset,
# Brann mit den Werten aus units.yaml (char: brann, Stufe P − 1), weitere Schlüssel bei Plünderern [ASSUMPTION] (Truhen brauchen Schlüssel oder Späher, Regel 9.8),
# Knochen-Szene beim Betreten der Halle statt an der Truhe, Gold 2 000 statt 1 500 [ASSUMPTION] (Goldkurve Akt 2).
# Balancing [C] siehe Abschnitt „Übernahme Story 11.21“ der Abnahme-Datei (pnpm sim n5_kupfermine --campaign act2 --start expected).
# Szenen: scn.n5.intro (Knoten pre), scn.n5.brann_talk (Ansprechen), scn.n5.bones (Halle), scn.n5.relic (Truhe Drachenglut), scn.n5.outro (Knoten post, mit/ohne Brann).
id: n5_kupfermine
