# Mission 2-5 – Die verstoßene Leibwache (Knoten m2_5). Entwurf concept/27-ueberarbeitung/levels/s2_2_5_silberquell.yaml, Missionsliste: M 20×25, escort Odile, 9 / 22, Leutnant Sable, Beitritt Odile, Amos.
# Kloster Silberquell in der Eisenschlucht: Die Truppe kommt von Süden in den Klosterhof, Odile folgt der nächsten eigenen Figur (follow) und muss den Ausgang im Norden erreichen.
# Zwei Hängebrücken (footbridge) queren die Schlucht, der Nordrand liegt eine Stufe höher. In Runde 5 kommt die Warnung (Szene und markierte Felder), in Runde 6 kappen Sables Leute die Westbrücke.
# Am Ausgang steht genau eine Figur: Sable (Leutnantin) oder, wenn sie bei E7 gewarnt hat und übergelaufen ist (e07: warn), ein Hauptmann des Grenzheers auf P + 1 (kein Leutnant).
# Abweichungen vom Entwurf (Story 11.16, alle in levels/abnahme/s2_2_5_silberquell.md): Karten-Id m2_5_silberquell, Szenen scn.m2_5.*, Gegner nur mit levelOffset und den Figuren des Grenzheer-Pools,
# Odile und Amos ohne eigene Stufe/Waffen (Gefährten-Definition, P − 1), Gold 2 000 statt 1 200, zwei Heimsuchungs-Anker, Begegnung mit Odile (t_odile), Hauptmann P + 1 statt Leutnant-Stufe.
# Balancing [C] siehe Abschnitt „Übernahme Story 11.16“ der Abnahme-Datei (pnpm sim m2_5_silberquell --campaign act2 --start expected).
# Szenen: scn.m2_5.intro vor der Karte (Knoten pre), scn.m2_5.odile_meet (erste eigene Figur bei Odile), scn.m2_5.amos_talk (Ansprechen), scn.m2_5.bridge_warn (Runde 5), scn.m2_5.outro nach dem Ausgang (Halvards Briefe, E5).
