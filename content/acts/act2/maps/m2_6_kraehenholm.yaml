# Mission 2-6 – Gold für Banditen (Knoten m2_6). Entwurf concept/27-ueberarbeitung/levels/s2_2_6_kraehenholm.yaml, Missionsliste: M 22×26, rout, 10 / 28, Leutnants Grell und Sable, Beitritt Nell.
# Schmugglerinsel Krähenholm: Landung am Südstrand, in der Mitte der Klippenrücken mit Plateau (terrace, Stufe 1) und Felsnase (crag, Stufe 2), im Norden die Bucht mit Grells Schiff.
# Gezeiten: In Runde 4 wird der Kanal im Osten zur Sandbank (zweiter Weg in die Bucht), in Runde 8 kommt die Warnung (Szene und markierte Felder), in Runde 9 ist er wieder Wasser.
# Auf der Felsnase steht genau eine Figur: Sable (Leutnantin) oder, wenn sie bei E7 gewarnt hat und übergelaufen ist (e07: warn), ein Hauptmann des Grenzheers auf P + 1 (kein Leutnant).
# Abweichungen vom Entwurf (Story 11.17, alle in levels/abnahme/s2_2_6_kraehenholm.md): Karten-Id m2_6_kraehenholm, Szenen scn.m2_6.*, Gegner nur mit levelOffset, Nell ohne eigene Stufe/Waffe
# (Gefährten-Definition, P − 1), Grell als Plänkler mit Stahlschwert (Klasse seiner Leutnant-Definition), Gold 2 000 statt 1 400, zwei Heimsuchungs-Anker, Beweisszene auf der Felsnase (t_proof).
# Balancing [C] (pnpm sim m2_6_kraehenholm --campaign act2 --start expected --runs 50, Normal): Sieg 100 %, Runden p10/p50/p90 12/13/19, Niedergestreckte 1,61, Tote 0,08,
# Gold 2 000 + 6; mit e07=warn 100 %, 12/14/18, 1,73, 0,10. Details im Abschnitt „Übernahme Story 11.17“ der Abnahme-Datei.
# Szenen: scn.m2_6.intro vor der Karte (Knoten pre), scn.m2_6.nell_talk (Ansprechen), scn.m2_6.ebb (Runde 4), scn.m2_6.flood_warn (Runde 8), scn.m2_6.gold_proof (Felsnase),
# scn.m2_6.outro nach der Karte (Maelis lässt die Truppe fallen, E6), scn.m2_6.burnt_village auf dem Rückweg nur nach e07: warn (Knoten epilogues).
id: m2_6_kraehenholm
nameKey: map.m2_6_kraehenholm.name
size: [22, 26]
legend:
  ",": grass
  "_": road
  "T": forest
  "^": mountain
  "~": river
  "d": sand
  "b": building
  "%": terrace
  "c": crag
  "/": ramp
  "s": stairs
#          x: 0123456789012345678901
terrain: |
  ~~~~~~~~~~~~~~~~~~~~~~
  ~~~~~~~~~~~~bbbb~~~~~~
  ~~~~,,,,,,~~bbbb~~~~~~
  ~~~~,,,,,,~~bbbb~~~~~~
  ~~ddddddddd______ddd~~
  ~~dddddddddddddddddd~~
  ~~dddddddddddddddddd~~
  ~~dddddddddddddddddd~~
  ~~^^^^^^s^^^^^^~~~~~~~
  ~~^^^%%%%%%%%^^~~~~~~~
  ~~^^^%%%s%%%%^^~~~~~~~
  ~~^^^%%cccc%%^^~~~~~~~
  ~~^^^%%cccc%%^^~~~~~~~
  ~~^^^%%%%s%%%^^~~~~~~~
  ~~^^^%%%%%%%%^^~~~~~~~
  ~~^^^^^^/^^^^^^~~~~~~~
  ~dd,,,,,,,,,,,,,,,,dd~
  ~dd,,,,,,,,,,,,,,,,dd~
  ~dd,TTT,,,,,,TTT,,,dd~
  ~dd,TTT,,,,,,TTT,,,dd~
  ~dd,TTT,,,,,,TTT,,,dd~
  ~dd,,,,,,,,,,,,,,,,dd~
  ~dddddddddddddddddddd~
  ~dddddddddddddddddddd~
  ~dddddddddddddddddddd~
  ~~~~~~~~~~~~~~~~~~~~~~
# die Treppen zwischen Plateau (Stufe 1) und Felsnase (Stufe 2) stehen auf Stufe 1
levels:
  - { level: 1, area: { tiles: [[9, 13], [8, 10]] } }
timeOfDay: evening
weather: clear
objects:
  # Dravns Gold, das Beweisstück: Nell öffnet mit ihrem Schlüssel, sonst der Schlüssel von Sable oder dem Hauptmann
  - { id: c_gold, type: chest, at: [9, 11], contents: { gold: 800 } }
deploy:
  max: 10
  forced: [avatar, lucan]
  slots: [[6, 22], [7, 22], [8, 22], [9, 22], [10, 22], [11, 22], [12, 22], [13, 22], [14, 22], [7, 23], [8, 23], [9, 23], [10, 23], [11, 23], [12, 23]]
# Heimsuchungs-Anker (Story 5.5; Story 11.17 [ASSUMPTION], nach dem Muster von 2-1 und 2-5 gleich mitgeliefert), die Gründe stehen als Kommentar darüber
haunts:
  # Grund: der Südstrand – Grell ist fort, aber Krähenholm bleibt Umschlagplatz; neue Boote landen, die Schmuggler halten die Dünen.
  - variant: rout
    target: { at: [10, 18] }
    enemySpawn: { rect: [3, 16, 18, 17] }
    deploy: { rect: [6, 22, 14, 23] }
  # Grund: die Nordbucht – am Kai liegt wieder Schmuggelgold in Kisten; die Truppe kommt über den Klippenpfad herunter und muss es vor den Booten bergen.
  - variant: treasure
    target: { at: [6, 5] }
    enemySpawn: { rect: [11, 5, 19, 7] }
    deploy: { rect: [5, 9, 12, 10] }
    turns: 10
    chests: [[4, 3], [9, 2]]
units:
  # Strand und Dünen im Süden
  - { id: a1, nameKey: unit.smuggler.name, team: enemy, class: brigand, sprite: brigand, levelOffset: -3, at: [5, 17], items: [{ def: iron_axe }], ai: { profile: aggressive } }
  - { id: a2, nameKey: unit.smuggler.name, team: enemy, class: skirmisher, sprite: mercenary, levelOffset: -3, at: [10, 17], items: [{ def: iron_sword }], ai: { profile: aggressive } }
  - { id: a3, nameKey: unit.smuggler.name, team: enemy, class: brigand, sprite: brigand, levelOffset: -3, at: [16, 17], items: [{ def: iron_axe }], ai: { profile: aggressive } }
  - { id: a4, nameKey: unit.smuggler.name, team: enemy, class: brigand, sprite: brigand, levelOffset: -3, at: [8, 19], items: [{ def: iron_axe }], ai: { profile: trigger, radius: 5, then: aggressive }, difficulty: [normal, hard] }
  - { id: a5, nameKey: unit.smuggler.name, team: enemy, class: skirmisher, sprite: mercenary, levelOffset: -3, at: [12, 19], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 5, then: aggressive }, difficulty: [normal, hard] }
  # Klippenpfad: Rampe bewacht, Schützen auf dem Plateau (Stufe 1)
  - { id: b1, nameKey: unit.smuggler.name, team: enemy, class: vanguard, sprite: soldier, levelOffset: -2, at: [7, 14], items: [{ def: iron_lance }], ai: { profile: guard } }
  - { id: b2, nameKey: unit.smuggler.name, team: enemy, class: vanguard, sprite: soldier, levelOffset: -2, at: [9, 14], items: [{ def: iron_lance }], ai: { profile: guard } }
  - { id: b3, nameKey: unit.smuggler.name, team: enemy, class: marksman, sprite: bandit_archer, levelOffset: -3, at: [5, 10], items: [{ def: iron_bow }], ai: { profile: hold } }
  - { id: b4, nameKey: unit.smuggler.name, team: enemy, class: marksman, sprite: bandit_archer, levelOffset: -3, at: [12, 10], items: [{ def: iron_bow }], ai: { profile: hold } }
  - { id: b5, nameKey: unit.smuggler.name, team: enemy, class: marksman, sprite: bandit_archer, levelOffset: -3, at: [6, 13], items: [{ def: iron_bow }], ai: { profile: hold } }
  - { id: b6, nameKey: unit.smuggler.name, team: enemy, class: marksman, sprite: bandit_archer, levelOffset: -3, at: [11, 13], items: [{ def: iron_bow }], ai: { profile: hold }, difficulty: [normal, hard] }
  # Felsnase (Stufe 2): Goldübergabe. Genau eine Figur: Sable (Stufe nach der Leutnant-Regel, levelOffset nur fürs Format; auch ohne E7) oder, nach E7 warn, der Hauptmann auf P + 1.
  # Beide tragen den Schlüssel der Truhe (drops).
  - { id: sable, nameKey: unit.sable.name, team: enemy, class: duelist, levelOffset: 1, at: [8, 12], lieutenant: sable, items: [{ def: steel_sword }, { def: door_key }], drops: [1], ai: { profile: guard }, requires: [{ not: { flag: { e07: warn } } }] }
  - { id: captain, nameKey: unit.border_captain.name, team: enemy, class: duelist, sprite: mercenary, portrait: border_captain, levelOffset: 1, at: [8, 12], items: [{ def: steel_sword }, { def: door_key }], drops: [1], ai: { profile: guard }, requires: [{ flag: { e07: warn } }] }
  - { id: c1, nameKey: unit.smuggler.name, team: enemy, class: marksman, sprite: bandit_archer, levelOffset: -2, at: [10, 11], items: [{ def: iron_bow }], ai: { profile: hold } }
  - { id: c2, nameKey: unit.smuggler.name, team: enemy, class: healer, sprite: cleric, levelOffset: -2, at: [7, 12], items: [{ def: heal_staff }], ai: { profile: support } }
  # Nordbucht: Grell am Schiff (Plänkler wie in seiner Leutnant-Definition, Stahlschwert; die Signatur gold_hook ist Beute)
  - { id: grell, nameKey: unit.grell.name, team: enemy, class: skirmisher, levelOffset: 1, at: [13, 5], lieutenant: grell, items: [{ def: steel_sword }], ai: { profile: guard } }
  - { id: d1, nameKey: unit.smuggler.name, team: enemy, class: vanguard, sprite: soldier, levelOffset: -2, at: [10, 5], items: [{ def: iron_lance }], ai: { profile: guard } }
  - { id: d2, nameKey: unit.smuggler.name, team: enemy, class: brigand, sprite: brigand, levelOffset: -2, at: [16, 5], items: [{ def: iron_axe }], ai: { profile: trigger, radius: 5, then: aggressive } }
  - { id: d3, nameKey: unit.smuggler.name, team: enemy, class: skirmisher, sprite: mercenary, levelOffset: -3, at: [7, 6], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 5, then: aggressive } }
  - { id: d4, nameKey: unit.smuggler.name, team: enemy, class: marksman, sprite: bandit_archer, levelOffset: -3, at: [15, 6], items: [{ def: iron_bow }], ai: { profile: hold } }
  - { id: d5, nameKey: unit.smuggler.name, team: enemy, class: brigand, sprite: brigand, levelOffset: -3, at: [18, 5], items: [{ def: iron_axe }], ai: { profile: trigger, radius: 5, then: aggressive } }
  - { id: d6, nameKey: unit.smuggler.name, team: enemy, class: skirmisher, sprite: mercenary, levelOffset: -3, at: [5, 3], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 5, then: aggressive } }
  - { id: d7, nameKey: unit.smuggler.name, team: enemy, class: marksman, sprite: bandit_archer, levelOffset: -2, at: [12, 5], items: [{ def: iron_bow }], ai: { profile: hold }, difficulty: [normal, hard] }
  # Nur Schwer
  - { id: h1, nameKey: unit.smuggler.name, team: enemy, class: brigand, sprite: brigand, levelOffset: -2, at: [3, 19], items: [{ def: iron_axe }], ai: { profile: aggressive }, difficulty: [hard] }
  - { id: h2, nameKey: unit.smuggler.name, team: enemy, class: skirmisher, sprite: mercenary, levelOffset: -2, at: [17, 19], items: [{ def: iron_sword }], ai: { profile: aggressive }, difficulty: [hard] }
  - { id: h3, nameKey: unit.smuggler.name, team: enemy, class: marksman, sprite: bandit_archer, levelOffset: -2, at: [8, 9], items: [{ def: iron_bow }], ai: { profile: hold }, difficulty: [hard] }
  - { id: h4, nameKey: unit.smuggler.name, team: enemy, class: vanguard, sprite: soldier, levelOffset: -2, at: [9, 6], items: [{ def: iron_lance }], ai: { profile: guard }, difficulty: [hard] }
  # Nell, von Maelis fallen gelassen, versteckt in der Nordwestecke: Gast, wer sie anspricht, gewinnt sie (Werte aus units.yaml, P − 1)
  - { id: nell, char: nell, team: other, class: scout, at: [3, 5], items: [], ai: { profile: hold }, ignoreForRout: true, guest: true, recruit: { by: any, dialogue: scn.m2_6.nell_talk } }
reinforcements:
  # Boote von Westen
  - turn: 3
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.smuggler.name, team: enemy, class: brigand, sprite: brigand, levelOffset: -2, at: [1, 20], items: [{ def: iron_axe }], ai: { profile: aggressive } }
      - { nameKey: unit.smuggler.name, team: enemy, class: skirmisher, sprite: mercenary, levelOffset: -2, at: [1, 21], items: [{ def: iron_sword }], ai: { profile: aggressive } }
  # Vom Schiff
  - turn: 6
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.smuggler.name, team: enemy, class: vanguard, sprite: soldier, levelOffset: -2, at: [11, 4], items: [{ def: iron_lance }], ai: { profile: aggressive } }
      - { nameKey: unit.smuggler.name, team: enemy, class: marksman, sprite: bandit_archer, levelOffset: -2, at: [16, 4], items: [{ def: iron_bow }], ai: { profile: aggressive } }
  # Boote von Osten
  - turn: 8
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.smuggler.name, team: enemy, class: brigand, sprite: brigand, levelOffset: -2, at: [20, 18], items: [{ def: iron_axe }], ai: { profile: aggressive } }
      - { nameKey: unit.smuggler.name, team: enemy, class: skirmisher, sprite: mercenary, levelOffset: -2, at: [20, 19], items: [{ def: iron_sword }], ai: { profile: aggressive } }
objectives:
  victory: { type: rout }
  defeat:
    - { type: unit_dies, unit: avatar }
    - { type: unit_dies, unit: lucan }
  side:
    - { id: s_nell, type: recruit, unit: nell, reward: { gold: 300 } }
    - { id: s_gold, type: open_chests, reward: { item: { def: vulnerary } } }
triggers:
  # Ebbe: der Kanal im Osten fällt trocken, ein zweiter Weg in die Bucht
  - id: t_ebb
    once: true
    when: { type: turn_start, turn: 4, phase: player }
    then:
      - { action: dialogue, id: scn.m2_6.ebb }
      - { action: set_terrain, area: { rect: [16, 8, 18, 15] }, terrain: sand }
  # Warnung vor der Flut: Szene; die Felder sind schon über warn des Flut-Triggers markiert (eine Runde vorher)
  - id: t_flood_warn
    once: true
    when: { type: turn_start, turn: 8, phase: player }
    then:
      - { action: dialogue, id: scn.m2_6.flood_warn }
  # Flut: die Sandbank ist wieder Wasser; besetzte Felder bleiben (Regel set_terrain), niemand ertrinkt
  - id: t_flood
    once: true
    when: { type: turn_start, turn: 9, phase: player }
    then:
      - { action: set_terrain, area: { rect: [16, 8, 18, 15] }, terrain: river, warn: true }
  # Beweis: die erste eigene Figur auf der Felsnase sieht die Kisten mit Dravns Prägung (nach E7 warn belastet Sable ihn)
  - id: t_proof
    once: true
    when:
      type: unit_enters
      team: player
      area: { rect: [7, 11, 10, 12] }
    then:
      - { action: dialogue, id: scn.m2_6.gold_proof }
# Gold nach der Goldkurve von Akt 2 (2 000–3 000, GDD Ökonomie) wie 2-1 und 2-5 [ASSUMPTION, Story 11.27 stimmt ab]; dazu 800 aus der Truhe
goldReward: 2000
design:
  title: Gold für Banditen
  intent: >
    Über Krähenholm floss das Gold an die Banden aus Akt 1. Zwei Wege in die Nordbucht: der bewachte Klippenpfad über Sable und, nur zwischen Ebbe und Flut, die Sandbank im Osten. Wer zu spät ist, muss zurück über die Klippe.
    Sable übergibt Gold aus Dravns Kasse, die Spur aus 2-4 bestätigt sich. Lagewechsel: Maelis lässt die Truppe fallen.
  mood: Abendlicht über grauem Meer, lange Sandbänke bei Ebbe, schroffe Klippen mit Möwen und Krähen, ein Kaperschiff in der Bucht, Fackeln an Kisten voller Münzen.
  phases:
    - { id: p1, turns: [1, 3], label: Landung, note: "Südstrand, R3 Boote von Westen." }
    - { id: p2, turns: [4, 8], label: Ebbe, note: "Sandbank offen ab R4. Klippenpfad oder Kanal. R6 vom Schiff, R8 Boote von Osten, Warnung vor der Flut." }
    - { id: p3, turns: [9, 14], label: Flut, note: "Sandbank fällt R9. Nordbucht, Grell am Schiff, Nell im Nordwesten." }
  paths:
    - { team: player, points: [[8, 22], [8, 15], [8, 14], [8, 9], [8, 7]], label: Klippenpfad }
    - { team: player, points: [[12, 22], [17, 17], [17, 8], [14, 6]], phase: p2, label: Sandbank }
    - { team: enemy, points: [[1, 20], [6, 22]], phase: p1, label: R3 }
  zones:
    - { area: { rect: [16, 8, 18, 15] }, label: Sandbank R4–R8, phase: p2 }
    - { area: { rect: [5, 9, 12, 14] }, label: Plateau St.1 }
    - { area: { rect: [7, 11, 10, 12] }, label: Felsnase St.2 }
  marks:
    - { at: [9, 11], label: G, note: "Dravns Gold. Nell öffnet mit ihrem Schlüssel, sonst der Schlüssel von Sable oder dem Hauptmann." }
    - { at: [13, 2], label: Sch, note: "Grells Schiff (Modell fehlt, bis dahin Gebäude). Kai auf y 4." }
    - { at: [3, 5], label: N, note: "Nell; wer sie anspricht, gewinnt sie." }
    - { at: [8, 12], label: S, note: "Sable; hat sie bei E7 gewechselt, steht hier ein Hauptmann, Sable belastet Dravn in der Beweisszene." }
  notes:
    - "Stufen über levelOffset (Produktinhaber 2026-11-05: Start P−3, Wellen P−2, Elite P−1, Leutnants P+1, Boss P+2)."
    - "Normal 28 Gegner (6 davon R3/R6/R8) gegen 10 eigene; Leicht 24, Schwer 32. Auf der Felsnase steht nur Sable oder der Hauptmann."
    - "Formatwunsch: Modelle Schiff, Boot, Kai, Lagerhaus, Kran fehlen laut Matrix; Zustand Sandbank (Sand reicht fürs Erste)."
    - "Die Flut lässt besetzte Felder unverändert (Regel set_terrain), niemand ertrinkt."
    - "E6 (Varek, falls dabei) nach 2-6; das verbrannte Dorf (Beat 9) nur nach E7 warn auf dem Rückweg."
