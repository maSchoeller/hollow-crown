# Chronik-Seiten der Paktwächter in Akt 2 (Narrative „Found Documents“: 4 je Akt; Quellen N5 und je eine Truhe in 2-2, 2-4 und 2-7).
# Je Seite: id, title, text (Deutsch); Englisch in content/locales/en/act2.chronicle.yaml unter chronicle.<id>.title|text.
# Akt-2-Schwerpunkt: dass die Könige beim Paktfest etwas „gaben“. Die übrigen drei Seiten kommen mit 2-2, 2-4 und 2-7.
# N5 „Glut unter dem Berg“ (Story 11.21): Truhe c_page im Ostgang der Kupfermine. Text Vorschlag (Schreib-Pipeline der Narrative) [ASSUMPTION].
- id: a2_mine
  title: "Was der Berg nimmt"
  text: "Paktnacht unter dem Kupferberg. Der König stieg allein in die Halle der Rippen, mit der Glutkrone und leeren Händen. Er kam zurück, und die Krone glühte heller als zuvor. Er selbst war blasser. Er sagte, er habe gegeben, was der Pakt verlangt. Was es war, sagte er nicht. Ich habe es aufgeschrieben, damit einer fragt."
# 2-2 „Das Siegel im Salzpass“ (Story 11.13), Truhe c_page: eine Seite aus dem Tempelarchiv, die Grell für Maelis schmuggelt (PO 2026-11-10, T6-13F3).
# Thema „wer zusah“ (PO 2026-11-10, T6-F7): ein Wächter zählt die Zeugen einer Paktnacht. Anders als a2_mine (der König allein im Berg) zeigt sie,
# wer dabei war und wegsah; die Gabe selbst bleibt ungenannt (T8-S5).
- id: a2_salzpass
  title: "Wer zusah"
  text: "Paktnacht im Tempel. Ich stand hinter der dritten Säule und zählte, wer zusah. Die Herzöge sahen ins Feuer, als die Krone heller wurde, und jubelten erst, als es vorbei war. Der Priester am Altar sah zu Boden, die Schreiber auf ihre Hände. Nur der Sohn des Königs, sieben Jahre alt, sah seinen Vater an, die ganze Zeit. Er hat nicht geweint. Ich schreibe auf, wer wegsah, damit einer weiß, dass es Zeugen gab."
# 2-4 „Die Brandschneise“ (Story 11.15), Köhlertruhe c_page: [ASSUMPTION] PO F6 vorläufig A – die Köhler hüteten eine Seite über ein Paktfest, bei dem
# ein König Glut in den Berg zurückgab (Brücke zu N5, Glut unter dem Berg). Anders als a2_mine: kein König, der etwas hergibt und
# dabei verliert, sondern einer, der dem Berg etwas zurückbringt, und ein Hang, der danach nicht mehr brannte. Text der Schreib-Pipeline als Vorschlag zur Abnahme.
- id: a2_brandhang
  title: "Was der König zurückgab"
  text: "Paktfest am Brandhang, im Jahr nach dem großen Feuer. Der König kam zu Fuß herauf, ohne Krone, einen Tonkrug voll Glut im Arm. Er goss sie in den Spalt über dem Köhlerwald und sprach: Was wir dem Berg genommen haben, bringe ich zurück. Vierzig Jahre brannte am Hang kein Baum. Wir Köhler tragen keine Fackel in den Nordwald. Wer es tut, hat den Pakt vergessen."
# 2-7 „Das Kontor am Silbermeer“ (Story 11.18), Truhe c_page in der Schreibstube: [ASSUMPTION] die letzte Seite der Chronik, die das Haus Silbermeer
# mit den Büchern der Wächter aufgekauft hat. Saat Pakt: sie stammt aus derselben Hand wie die erste Seite (scn.m2_7.page sagt es, die Seite selbst
# nur andeutungsweise). Text der Schreib-Pipeline als Vorschlag zur Abnahme.
- id: a2_kontor
  title: "Die letzte Seite"
  text: "Letzter Eintrag der Wache. Die Herzöge wollen keine Zeugen mehr, und das Haus am Silbermeer kauft unsere Bücher und nennt es Schutz. Ich schreibe, was ich am Anfang schrieb: Der König gab, was der Pakt verlangt. Ich war dabei, als es begann. Ich bin dabei, wenn es endet. Wer dies findet, vergleiche die Schrift."
