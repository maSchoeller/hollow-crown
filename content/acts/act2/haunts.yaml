# Gegner-Pools der Heimsuchungen von Akt 2 (Paket act2). VORLÄUFIG (Story 11.5) [ASSUMPTION]: content:check verlangt für jede Fraktion
# eines Leutnants einen Pool; Story 11.7 (Gegner, Herbst, Heimsuchungen von Akt 2) legt Klassen, Anteile, Figuren und Truhen endgültig fest.
# Abgeleitet aus der Fassung vom 2026-10-31 (Story 11.7), ohne Flieger und Reittiere: Ausrüstungs-Tier des Akts ist Stahl.
factions:
