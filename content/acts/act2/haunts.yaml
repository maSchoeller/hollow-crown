    - { class: brigand,    sprite: brigand,       nameKey: unit.free_blade.name, items: [{ def: steel_axe }],   share: 35 }
    - { class: marksman,   sprite: bandit_archer, nameKey: unit.free_blade.name, items: [{ def: steel_bow }],   share: 30 }
