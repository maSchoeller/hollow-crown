id: scn.bark.odile
lines:
  - id: battle_start
    speaker: [odile]
    fallback: skip
    mood: neutral
    text: "Posten bezogen. Niemand kommt an mir vorbei."
  - id: crit
    speaker: [odile]
    fallback: skip
    mood: happy
    text: "Sauber geführt, wie es sich gehört."
  - id: downed
    speaker: [odile]
    fallback: skip
