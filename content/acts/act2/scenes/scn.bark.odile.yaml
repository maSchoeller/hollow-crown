  - id: rescued
    speaker: [odile]
    fallback: skip
    mood: neutral
    text: "Danke. Ich stehe in deiner Schuld."
  - id: level_up
    speaker: [odile]
    fallback: skip
    mood: happy
    text: "Die Haltung wird fester."
  - id: ember
    speaker: [odile]
    fallback: skip
    mood: neutral
    text: "Die Glut ist meine Pflicht. Ich trage sie."
