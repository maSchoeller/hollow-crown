# Mission 2-2, Siegeltruhe geöffnet (Trigger t_seal, setzt m2_2_seal, damit ist die Mission gewonnen).
# [PO offen F1] Vorschlag A: das Siegel ist kein Gegenstand, nur diese Szene und das Flag.
# [PO offen F2] Vorschlag C: beim Siegel liegt ein Brief mit grauem Wachs (Halvards Zeichen aus 1-3), niemand benennt es; wer 1-3 kennt, merkt es.
# Zeile zum Brief mit Ersatzsprecher-Kette. Vorschlag der Schreib-Pipeline.
id: scn.m2_2.seal_found
lines:
  - id: l01
    mood: neutral
    text: "In der Truhe liegt, in Wachstuch gewickelt, ein schweres Siegel mit dem Wappen der Prinzessin."
  - id: l02
    mood: neutral
    text: "Darunter ein gefalteter Brief ohne Namen. Er ist mit grauem Wachs verschlossen."
  - id: l03
    speaker: [liora, ysolde, avatar]
    mood: sad
    text: "Ein Brief, der mit ihrem Siegel reist. Wer schreibt der Prinzessin so heimlich?"
  - id: l04
    speaker: [lucan]
    mood: neutral
    text: "Steckt beides ein. Gelesen wird später, nicht hier im Nebel."
