# Nebenquest N6, Bühne (Trigger t_stage, Story 11.22): Die erste eigene Figur auf der Bühne. Jory spricht Maren an (requires alive);
# in der Gedenk-Variante (Jory gefallen) spricht Lucan, Kette bis Avatar. Die Meisterin tritt nicht bei (escort join: false).
# Maren spricht als Erzählzeile, bis sie eine eigene Halbfigur hat (art/mockups/characters-s1, Frage an den Produktinhaber). Text Vorschlag [ASSUMPTION].
id: scn.n6.master_talk
background: auemarkt
lines:
  - id: l01
    mood: neutral
    text: "Auf der Bühne steht Maren im Flickenmantel, ein Messer in der Hand."
  - id: l02
    speaker: [jory]
    fallback: skip
    requires: [{ alive: jory }]
    mood: happy
    text: "Maren! Leg das weg, du triffst damit eh nur den Vorhang."
  - id: l03
    requires: [{ alive: jory }]
    mood: sad
    text: "„Jory. Wir sind fort, damit die Schuld nicht auch an dir hängt.“"
  - id: l04
    speaker: [jory]
    fallback: skip
    requires: [{ alive: jory }]
    mood: angry
    text: "Darüber reden wir später. Bleib dicht bei mir."
  - id: l05
    speaker: [lucan, avatar]
    fallback: skip
    requires: [{ not: { alive: jory } }]
    mood: sad
    text: "Ihr seid Maren? Jory kann nicht mehr kommen. Wir sind für ihn hier."
  - id: l06
    requires: [{ not: { alive: jory } }]
    mood: sad
    text: "Maren senkt das Messer. „Dann geh ich mit euch. Für ihn.“"
  - id: l07
    mood: neutral
    text: "Die Meisterin folgt der nächsten Figur der Truppe. Bringt sie zum Boot."
