# Weltkarte von Valmora (Story 5.2, concept/23-art-direction §6, architecture §5.12). Paket core. Startwerte [C].
# 56 × 40 Felder: Platz für rund 12–14 Orte je Akt mit mindestens 4 Feldern Abstand (Produktinhaber 2026-10-24).
# Aufteilung nach dem Vorbild weltkarte_valmora.png: Silbermeer im Westen, Drachengebirge und Aurenhall im Norden,
# Eisenmark in der Mitte, Grenzland (Akt 1) im Süden und Osten. Feld (0, 0) liegt oben links, y wächst nach Süden.
id: valmora
