# Weltkarte von Valmora v5 (Story 15.7, concept/23-art-direction §6, architecture §5.12): das gemalte Bild art/world/map_v5.png
# (3276 × 3276, Prompt und Abnahme art/prompts/world_map_v5.md, Geografie concept/22-narrative/geografie-valmora.md). Straßen,
# Brücken und Weiler sind gemalt; Stadtbilder, Steine, Wege, Nebel und Namen legt das Spiel darüber. Paket core.
id: valmora
# Bild unter public/assets/world/ (tools/art/build.py): das ganze Bild in Auflösungsstufen (Story 15.12), levels = Breiten in px.
# Die erste Stufe ist <image>.webp (Übersicht, zuerst gezeigt und Rückfall), jede weitere <image>_<Breite>.webp; geladen wird die
# kleinste Stufe, die bei der nächsten Zoomstufe und der Pixeldichte des Geräts nicht hochskaliert wird. size = Pixelmaße der Quelle
image: valmora
size: [3276, 3276]
levels: [1024, 2048, 3276]
# Regionen: Ort des Namens und Flächen (Polygone in Prozent von Breite und Höhe). Über den Flächen der Regionen späterer Akte
# liegt Nebel. Grenzen nach dem Bild: Akt 3 nördlich des Moränenriegels (Aurenhall und Spiegelsee darin), Akt 1 südlich des
# Grauen Kamms; Krähenholm vor der Küste gehört zu Akt 2. Startwerte [C].
