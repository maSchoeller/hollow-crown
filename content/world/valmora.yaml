# Regionen: eigenes Raster gleicher Größe, ein Zeichen je Feld ("." = keine Region, das Meer). Regionen späterer Akte
# als des aktuellen liegen unter Nebel mit ihrem Namen (world.region.<id>); season wählt das Licht (render.yaml world.seasons).
regions:
  - { id: borderland, char: "1", act: 1, season: late_summer }
  - { id: eisenmark, char: "2", act: 2, season: autumn }
  - { id: aurenhall, char: "3", act: 3, season: winter }
