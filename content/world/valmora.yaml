home:
  camp: [63, 76.56]
  castle: [66.27, 63.16]
# Orte aus art/world/map_places_v5.json (Koordinaten dort in Pixeln einer 1254er Karte, hier in Prozent). at = Spitze des Steins;
# an Orten mit Stadtbild steht er rechts vor dem Plateau (Kupferhall links, am Kartenrand), damit das Bild frei bleibt.
# slots = Plätze der Missionsliste (concept/22-narrative/missionsliste-s1.md) an diesem Ort; `node` bindet einen Platz an einen
# Knoten der Kampagne, Plätze ohne Knoten sind für spätere Akte vorgesehen. Teilen sich Knoten einen Ort, steht dort ein Stein.
# site = Stadtbild auf dem gemalten Plateau (public/assets/world/sites/<id>.webp): foot = Mitte der Unterkante, width = Breite,
# beides in Prozent der Karte. variants: Bilder für Zustände des Orts (sites/<image>.webp) mit Bedingungen, das erste zutreffende
# gewinnt, sonst das Grundbild. Paktwacht (Produktinhaber 2026-11-06, Story 15.12): Grundbild Ruine, ausgebaut ab Burgstufe 1.
