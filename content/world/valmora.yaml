# Weltkarte von Valmora (Story 5.2, concept/23-art-direction §6, architecture §5.12): ein flaches, gemaltes Bild (Hochformat 2:3)
# mit den Orten darauf. Das Bild zeigt keine Gebäude, Wege oder Schrift; Orte, Wege, Nebel und Namen legt das Spiel darüber.
# Produktinhaber 2026-10-24: zurück zum Bild statt 3D-Szene. Bild: art/world/map_flat_v1.png (Prompt art/prompts/world_map.md),
# Reise von unten nach oben: Akt 1 Grenzland (Spätsommer), Akt 2 Eisenmark (Herbst), Akt 3 Aurenhall und Drachengebirge (Winter).
# Paket core. Startwerte [C].
id: valmora
# Bild unter public/assets/world/<image>.webp (tools/art/build.py), size = Pixelmaße des Quellbilds (Seitenverhältnis)
image: valmora
size: [1024, 1536]
# Regionen mit dem Ort ihres Namens (Prozent von Breite und Höhe); die Region eines späteren Akts liegt unter Nebel
regions:
  - { id: borderland, act: 1, at: [66, 86] }
  - { id: eisenmark, act: 2, at: [60, 47] }
  - { id: aurenhall, act: 3, at: [56, 15] }
# Die Region von `act` endet bei y Prozent der Höhe: Nebel eines früheren Akts reicht von oben bis dorthin
fog:
  - { act: 3, y: 31 }
  - { act: 2, y: 62.5 }
# Orte: id = Platz im Plan der 35 Orte (25 Story-Missionen, 10 Nebenquests) und die Heimat, label = Text im Stein,
# kind = story (Kreis), side (Raute), home; at = Prozent von Breite und Höhe, auf einer gemalten Lichtung (Mindestabstand
# etwa 100 px im Quellbild). `node` bindet den Ort an einen Knoten der Kampagne; Orte ohne Knoten sind für spätere Akte
# vorgesehen und erscheinen erst, wenn ihr Knoten angelegt ist. Lage: art/world/map_placed_v1.json.
