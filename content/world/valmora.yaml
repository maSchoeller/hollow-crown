# Orts-Miniaturen: Requisiten (art/models/props, <id>_<zustand>) relativ zur Feldmitte des Orts, at in Feldern
# (x nach Osten, y nach Süden), rot in Grad, scale zusätzlich zu render.yaml world.miniatureScale.
# Platzhalter: Für das Lager gibt es noch kein Zelt-Modell; Wagen und Kiste stehen dafür.
miniatures:
  caravan:
    - { prop: wagon_idle, at: [0, 0], rot: 80 }
    - { prop: wagon_idle, at: [0.7, 0.45], rot: 110, scale: 0.85 }
    - { prop: tree_b, at: [-0.85, -0.55], scale: 0.8 }
    - { prop: rock_idle, at: [0.75, -0.6], scale: 0.55 }
  caravan_raided:
    - { prop: wagon_idle, at: [0, 0], rot: 35 }
    - { prop: ruins_idle, at: [0.7, 0.45], scale: 0.6 }
    - { prop: tree_b, at: [-0.85, -0.55], scale: 0.8 }
    - { prop: chest_open, at: [-0.45, 0.55], scale: 0.8 }
  varnhold:
    - { prop: fort_idle, at: [0, -0.55], scale: 0.9 }
    - { prop: house_intact, at: [-0.7, 0.3], rot: 15 }
    - { prop: house_intact, at: [0.65, 0.35], rot: -20 }
    - { prop: house_intact, at: [0, 0.75], scale: 0.85 }
  varnhold_burned:
    - { prop: fort_idle, at: [0, -0.55], scale: 0.9 }
    - { prop: house_razed, at: [-0.7, 0.3], rot: 15 }
    - { prop: house_razed, at: [0.65, 0.35], rot: -20 }
    - { prop: ruins_idle, at: [0, 0.75], scale: 0.7 }
  silverbrook:
    - { prop: shrine_idle, at: [0, -0.2] }
    - { prop: house_intact, at: [-0.8, 0.5], rot: 30, scale: 0.85 }
    - { prop: tree_a, at: [0.8, 0.45], scale: 0.8 }
    - { prop: tree_c, at: [0.7, -0.7], scale: 0.7 }
  camp:
    - { prop: wagon_idle, at: [-0.3, -0.1], rot: 20 }
    - { prop: chest_closed, at: [0.55, 0.35], scale: 0.9 }
    - { prop: tree_a, at: [0.85, -0.6], scale: 0.75 }
# Orte: node = Knoten-ID aus campaign.yaml, home = Heimat (camp, später castle). variants: höchstens 2; es gilt die erste,
# deren requires erfüllt sind, sonst model.
locations:
  - { node: prologue, at: [48, 22], model: caravan, variants: [{ model: caravan_raided, requires: [{ completed: prologue }] }] }
  - { node: ch01, at: [40, 16], model: varnhold, variants: [{ model: varnhold_burned, requires: [{ completed: ch01 }] }] }
  - { node: ch02, at: [22, 31], model: silverbrook }
  - { home: camp, at: [35, 33], model: camp }
# Drachenzeichen (art-direction §6): zusätzliche Ebenen ab dem Akt. Akt 1 Asche: die Flächen [x, y, Breite, Höhe] werden
# zu Gelände ash, darüber fallen Ascheflocken (render.yaml world.ash).
signs:
  - { act: 1, kind: ash, areas: [[37, 12, 5, 2], [43, 18, 4, 2], [27, 25, 4, 2], [46, 30, 4, 2], [50, 15, 3, 3]] }
