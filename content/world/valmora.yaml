  - { id: prologue, label: "P", act: 1, kind: story, at: [77.15, 94.08], node: prologue }
  - { id: m1_1, label: "1-1", act: 1, kind: story, at: [59.57, 89.32], node: m1_1 }
  - { id: m1_2, label: "1-2", act: 1, kind: story, at: [39.26, 91.15], node: m1_2 }   # Karte: m1_2_erlbach (Story 9.3)
  - { id: m1_3, label: "1-3", act: 1, kind: story, at: [61.04, 80.08], node: ch02 }   # Brücke: der PoC-Knoten ch02 liegt vorläufig auf 1-3, bis Story 9.4 ihn ersetzt   # Karte: m1_3_silberbach (Layout, Story 9.4)
  - { id: m1_4, label: "1-4", act: 1, kind: story, at: [76.17, 73.44] }   # Karte: m1_4_wolfslager (Layout, Story 9.5)
