# Startwerte [C]. Bei der Umsetzung in content/affixes.yaml, runes.yaml, sets.yaml aufteilen.

affixes:
  # appliesTo: weapon | armor | shield | accessory ; position: prefix | suffix (für den Namen)
  - { id: swift,       position: prefix, appliesTo: [weapon, armor],     mods: { stats: { spd: 2 } } }
  - { id: heavy,       position: prefix, appliesTo: [weapon],            mods: { might: 2, weight: 2 } }
  - { id: featherlight, position: prefix, appliesTo: [weapon, armor, shield], mods: { weight: -2 } }
  - { id: keen,        position: prefix, appliesTo: [weapon],            mods: { crit: 5 } }
  - { id: accurate,    position: prefix, appliesTo: [weapon],            mods: { hit: 10 } }
  - { id: sturdy,      position: prefix, appliesTo: [armor, shield],     mods: { stats: { def: 1 } } }
  - { id: warded,      position: prefix, appliesTo: [armor, shield],     mods: { stats: { res: 2 } } }
  - { id: lucky,       position: prefix, appliesTo: [weapon, accessory], mods: { stats: { lck: 3 } } }
  - { id: of_might,    position: suffix, appliesTo: [weapon, accessory], mods: { stats: { str: 1 } } }
  - { id: of_sorcery,  position: suffix, appliesTo: [weapon, accessory], mods: { stats: { mag: 1 } } }
  - { id: of_the_watch,position: suffix, appliesTo: [armor, shield],     mods: { avoid: 5 } }
  - { id: of_vigor,    position: suffix, appliesTo: [armor, accessory],  mods: { stats: { hp: 3 } } }
  - { id: dragonslayer,position: suffix, appliesTo: [weapon],            mods: { effectiveVs: [dragon] }, rarityMin: epic }
  - { id: of_embers,   position: suffix, appliesTo: [weapon],            mods: { statusOnHit: { status: burning, chance: 15 } } }
  - { id: of_the_hunt, position: suffix, appliesTo: [weapon],            mods: { damageVsTag: { tag: flier, bonus: 2 } } }

runes:
  # Element-Runen: tier 1..3, Effekte siehe concept/05 §7
  - { id: fire_rune_1,  element: fire,  tier: 1, price: 400 }
  - { id: fire_rune_2,  element: fire,  tier: 2 }
  - { id: fire_rune_3,  element: fire,  tier: 3, terrainOnHit: ignite }
  - { id: wind_rune_1,  element: wind,  tier: 1, price: 400 }
  - { id: wind_rune_2,  element: wind,  tier: 2 }
  - { id: wind_rune_3,  element: wind,  tier: 3, statusOnHit: knockback }
  - { id: earth_rune_1, element: earth, tier: 1, price: 400 }
  - { id: earth_rune_2, element: earth, tier: 2 }
  - { id: earth_rune_3, element: earth, tier: 3 }
  - { id: water_rune_1, element: water, tier: 1, price: 400 }
  - { id: water_rune_2, element: water, tier: 2 }
  - { id: water_rune_3, element: water, tier: 3, terrainOnHit: extinguish }
  - { id: light_rune_1, element: light, tier: 1, price: 600 }
  - { id: light_rune_2, element: light, tier: 2 }
  - { id: light_rune_3, element: light, tier: 3, effectiveVs: [monster, undead] }
  - { id: dark_rune_1,  element: dark,  tier: 1 }            # V1: nur als Drop, kein Händler
  # Hilfs-Runen (zweiter Slot)
  - { id: precision_rune, utility: true, mods: { hit: 10 },             price: 500 }
  - { id: force_rune,     utility: true, mods: { might: 2, weight: 2 }, price: 600 }
  - { id: edge_rune,      utility: true, mods: { crit: 5 },             price: 600 }
  - { id: feather_rune,   utility: true, mods: { weight: -2 },          price: 500 }

sets:
  - id: ashen_watch
    pieces: [iron_helm, chainmail, iron_shield, ashen_badge]
    bonuses:
      - { count: 2, mods: { stats: { def: 2 } } }
      - { count: 4, mods: { grantSkill: shield_wall } }
  - id: ember_garb
    pieces: [mage_hood, ember_robe, ember_focus]
    bonuses:
      - { count: 2, mods: { stats: { mag: 2 } } }
      - { count: 3, mods: { statusChanceBonus: { element: fire, value: 20 } } }

traits:   # Taverne, siehe concept/04 §7
  - { id: tough,       mods: { growth: { hp: 10 } } }
  - { id: nimble,      mods: { stats: { mov: 1 } } }
  - { id: greedy,      mods: { recruitCostPercent: 20, chestGoldPercent: 10 } }
  - { id: coward,      mods: { hitBonusWhenAlone: -10 } }
  - { id: veteran,     mods: { loadoutSlots: 1 } }
  - { id: elementborn, mods: { randomAffinity: true, ownElementStatusBonus: 10 } }
  - { id: clumsy,      mods: { growth: { skl: -10 } } }
