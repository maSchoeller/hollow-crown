# Etappe 6, Akt 2, Mission 2-8 – Kronfeld. Entwurf nach missionsliste.html (G 30×40, survive → escape, 15 / 40, Leutnants Rowena, Grell, Brakka, Sable).
# Der neutrale Treffpunkt wird zur Falle: Die Truppe steht auf dem Hügel in der Mitte, die vier Mächte kommen von allen Seiten. Fluchtziel ist das Nordufer der Aure.
# Veränderliche Karte: Das Brückentor ist zu. In Runde 6 zögert Rowena, als Seraphine den Angriff befiehlt, ihre Leute lassen das Tor offen. Bis dahin bleibt nur die bewachte Furt im Osten.
