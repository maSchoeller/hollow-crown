# Etappe 6, Akt 1, Mission 1-2 – Asche über Erlbach. Entwurf nach missionsliste-s1.md (M 20×24, defend, 7 / 18, Leutnant Hask).
# Dorf Erlbach nördlich des Bachs, Truppe startet am Nordufer. Hask zieht aus seinem Lager im Süden über Brücke und zwei Furten
# (nur zu Fuß) heran; seine Leute haben die Kornfelder südlich des Bachs angezündet, das Feuer frisst sich durch die Felder.
# Mira: Besuch ihres Hauses am Ostrand bringt sie in die Truppe; ein Plünderer zielt genau darauf.
