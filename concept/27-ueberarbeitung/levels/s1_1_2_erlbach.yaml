goldReward: 800
design:
  title: Asche über Erlbach
  intent: >
    Erste Verteidigung, der Bach ist die Front: Brücke in der Mitte, zwei Furten nur zu Fuß. Plünderer zielen auf die Häuser, eines davon ist Miras.
    Das Feuer in den Kornfeldern drängt die Angreifer auf Straße und Furten, die Flankenwellen ziehen die Truppe auseinander.
  mood: Abend, Rauch über brennenden Kornfeldern, Asche fällt auf Strohdächer, der Bach glänzt orange, Dorfbewohner unter der Linde.
  phases:
    - { id: p1, turns: [1, 2], label: Am Bach, note: "Erste Welle an Brücke und Furten, Feuer im Süden." }
    - { id: p2, turns: [3, 5], label: Flanken, note: "Hask rückt nach; Wellen Ost (R3) und West (R5) am Nordufer." }
    - { id: p3, turns: [6, 8], label: Letzter Ansturm, note: Nachschub aus Hasks Lager über die Straße (R6). }
  paths:
    - { team: enemy, points: [[10, 22], [10, 14], [10, 9]], label: Hask }
    - { team: enemy, points: [[4, 21], [3, 15], [2, 8]], label: Westfurt }
    - { team: enemy, points: [[16, 21], [16, 15], [17, 9]], label: Ostfurt }
    - { team: enemy, points: [[19, 12], [18, 9]], phase: p2, label: R3 }
    - { team: enemy, points: [[0, 10], [3, 4]], phase: p2, label: R5 }
  zones:
    - { area: { rect: [2, 17, 18, 20] }, label: Kornfelder brennbar }
  marks:
    - { at: [10, 15], label: E, note: "Brücke: Hauptweg, auch für Gepanzerte." }
    - { at: [3, 15], label: F1, note: Westfurt nur zu Fuß. }
    - { at: [16, 15], label: F2, note: "Ostfurt nur zu Fuß, direkt auf Miras Haus." }
    - { at: [17, 8], label: Mi, note: "Miras Haus: besuchen bringt Mira; Plünderer r8 und R3 zielen darauf." }
  notes:
    - "Normal 18 Gegner (6 davon R3/R5/R6) gegen 7 eigene (6 aufstellbar + Mira), Stufe 2–3 plus Hask; Leicht 15, Schwer 21."
    - "Aufstellbar 6: Rhen, Lucan, Brenna, Tobin, Fenn + Liora, falls 1-3 zuerst gespielt; sonst ein Söldner aus der Taverne."
    - Keine Geländeveränderung über das vorhandene Feuer hinaus (nächste veränderliche Karte 1-4).
