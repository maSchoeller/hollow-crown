# Etappe 6, Akt 2, Mission 2-1 – Wind über der Eisenmark. Entwurf nach missionsliste.html (M 20×25, survive, 9 / 24, Leutnant Brakka, Beitritt Jory).
# Die Truppe kommt von Süden die Passstraße herauf. Die Windscharte ist ein trockenes altes Flusstal: vier Felder breit, zwei Felsnasen mit Ballisten darüber, dahinter die offene Ebene.
# Lektion Balliste: Die Nasen sind Stufe 2 und von Süden über Rampe, Leiter und Treppe erreichbar. Wer oben steht, dreht die Balliste gegen die Wellen aus der Ebene.
# Wellen von Söldnern kommen über die Ebene und drängen durch die enge Scharte.
id: s2_2_1_windscharte
nameKey: map.s2_2_1_windscharte.name
size: [20, 25]
legend:
  "Q": ballista
  ".": plain
  ",": grass
  "_": road
  "T": forest
  "^": mountain
  "F": fort
  "W": wagon
  "%": terrace
  "c": crag
  "/": ramp
  "s": stairs
#          x: 01234567890123456789
terrain: |
  ,,,,,,,,,__,,,,,,,,,
  ,,TT,,,,,__,,,,,TT,,
  ,,TT,,,,,__,,,,,,,,,
  ,,,,,,,,,__,,,,,,,,,
  ,,,,,,,,,__,,,TT,,,,
  ,,,,TT,,,__,,,TT,,,,
  ,,,,,,,,,__,,,,,,,,,
  ^^^,,,,,,__,,,,,,,^^
  ^^^^^,,,,__,,,,^^^^^
  ^^^^^^^,,__,,^^ccc^^
  ^^^^^^^^,__,^^^cQc^^
  ^^^^^^^^,__,^^^ccc^^
  ^^ccc^^^,__,^^^^s^^^
  ^^cQc^^^,__,^^^%%%^^
  ^^ccc^^^,__,^^^%%%^^
  ^^^s^^^,,__,,^^%%%^^
  ^%%%%^,,,__,,,^^/^^^
  ^%%%%,,,,__,FF,,,,^^
  ^^/^^^,,,__,,,,,,,,^
  ,,,,,,,,T__T,,,,,W,,
  ,,TT,,,,,__,,,,TT,,,
  ,,TT,,,,,__,,,,TT,,,
  ,,,,,,,,,__,,,,,,,,,
  ^^,,,,,,,__,,,,,,,^^
  ^^^^,,,,,__,,,,,^^^^
levels:
  # Balliste auf der Felsnase (Story 11.10): das Gelände ballista hat keine eigene Stufe
  - { level: 2, area: { tiles: [[3, 13], [16, 10]] } }
  - { level: 1, area: { tiles: [[16, 12], [3, 15]] } }
# Leiter an der Kante der Westterrasse (Fix 2026-11-08): Fuß [5,17] ist Gras für alle, hinauf nur zu Fuß
ladders:
  - { at: [5, 17], up: w }
timeOfDay: morning
weather: clear
objects:
  - { id: b_west, type: ballista, at: [3, 13] }
  - { id: b_east, type: ballista, at: [16, 10] }
  - { id: c_pay, type: chest, at: [17, 9], contents: { gold: 400 } }
deploy:
  max: 9
  forced: [avatar, lucan]
  slots: [[7, 21], [8, 21], [11, 21], [12, 21], [7, 22], [8, 22], [9, 22], [10, 22], [11, 22], [12, 22], [9, 23], [10, 23]]
units:
  # Ostnase: Brakka an der Balliste, Wache oben, Söldner auf der Terrasse darunter
  - { id: brakka, nameKey: unit.brakka.name, team: enemy, class: marksman, level: 12, levelOffset: 1, at: [15, 10], lieutenant: brakka, items: [{ def: steel_bow }], ai: { profile: hold } }
  - { id: g_east, nameKey: unit.mercenary.name, team: enemy, class: vanguard, level: 9, levelOffset: -2, at: [16, 11], items: [{ def: iron_lance }, { def: door_key }], drops: [1], ai: { profile: guard } }
  - { id: t_east, nameKey: unit.mercenary.name, team: enemy, class: skirmisher, level: 8, levelOffset: -3, at: [16, 14], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 4, then: aggressive } }
  # Westnase: Bedienung an der Balliste, Wache, Söldner auf der Terrasse
  - { id: crew_west, nameKey: unit.mercenary.name, team: enemy, class: marksman, level: 8, levelOffset: -3, at: [3, 12], items: [{ def: iron_bow }], ai: { profile: hold } }
  - { id: g_west, nameKey: unit.mercenary.name, team: enemy, class: vanguard, level: 8, levelOffset: -3, at: [3, 14], items: [{ def: iron_lance }], ai: { profile: guard } }
  - { id: t_west, nameKey: unit.mercenary.name, team: enemy, class: brigand, level: 8, levelOffset: -3, at: [3, 16], items: [{ def: iron_axe }], ai: { profile: trigger, radius: 4, then: aggressive } }
  # In der Scharte: die erste Linie kommt sofort
  - { id: m1, nameKey: unit.mercenary.name, team: enemy, class: brigand, level: 8, levelOffset: -3, at: [9, 12], items: [{ def: iron_axe }], ai: { profile: aggressive } }
  - { id: m2, nameKey: unit.mercenary.name, team: enemy, class: skirmisher, level: 8, levelOffset: -3, at: [10, 12], items: [{ def: iron_sword }], ai: { profile: aggressive } }
  - { id: m3, nameKey: unit.mercenary.name, team: enemy, class: vanguard, level: 8, levelOffset: -3, at: [8, 11], items: [{ def: iron_lance }], ai: { profile: aggressive } }
  - { id: m4, nameKey: unit.mercenary.name, team: enemy, class: brigand, level: 8, levelOffset: -3, at: [11, 11], items: [{ def: iron_axe }], ai: { profile: aggressive }, difficulty: [normal, hard] }
  - { id: m5, nameKey: unit.mercenary.name, team: enemy, class: marksman, level: 8, levelOffset: -3, at: [9, 9], items: [{ def: iron_bow }], ai: { profile: aggressive } }
  - { id: m6, nameKey: unit.mercenary.name, team: enemy, class: marksman, level: 8, levelOffset: -3, at: [10, 9], items: [{ def: iron_bow }], ai: { profile: aggressive }, difficulty: [normal, hard] }
  - { id: m7, nameKey: unit.mercenary.name, team: enemy, class: skirmisher, level: 8, levelOffset: -3, at: [8, 8], items: [{ def: iron_sword }], ai: { profile: aggressive } }
  - { id: m8, nameKey: unit.mercenary.name, team: enemy, class: healer, level: 8, levelOffset: -3, at: [11, 8], items: [{ def: heal_staff }], ai: { profile: support } }
  # Nur Schwer
  - { id: h1, nameKey: unit.mercenary.name, team: enemy, class: vanguard, level: 9, levelOffset: -2, at: [9, 8], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [hard] }
  - { id: h2, nameKey: unit.mercenary.name, team: enemy, class: marksman, level: 9, levelOffset: -2, at: [10, 8], items: [{ def: iron_bow }], ai: { profile: aggressive }, difficulty: [hard] }
  # Jory am liegengebliebenen Gauklerwagen, in Reichweite der Ostballiste
  - { id: jory, char: jory, team: other, class: minstrel, level: 5, at: [16, 19], items: [{ def: iron_dagger }, { def: travel_lute }], ai: { profile: hold }, ignoreForRout: true, guest: true, recruit: { by: any, dialogue: scn.s2_1.jory_talk } }
reinforcements:
  # Erste Welle über die Ebene
  - turn: 3
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.mercenary.name, team: enemy, class: vanguard, level: 9, levelOffset: -2, at: [9, 0], items: [{ def: iron_lance }], ai: { profile: aggressive } }
      - { nameKey: unit.mercenary.name, team: enemy, class: skirmisher, level: 9, levelOffset: -2, at: [10, 0], items: [{ def: iron_lance }], ai: { profile: aggressive } }
      - { nameKey: unit.mercenary.name, team: enemy, class: vanguard, level: 9, levelOffset: -2, at: [7, 0], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [normal, hard] }
  # Zweite Welle
  - turn: 6
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.mercenary.name, team: enemy, class: skirmisher, level: 9, levelOffset: -2, at: [9, 0], items: [{ def: iron_lance }], ai: { profile: aggressive } }
      - { nameKey: unit.mercenary.name, team: enemy, class: vanguard, level: 9, levelOffset: -2, at: [10, 0], items: [{ def: iron_lance }], ai: { profile: aggressive } }
      - { nameKey: unit.mercenary.name, team: enemy, class: skirmisher, level: 9, levelOffset: -2, at: [12, 0], items: [{ def: iron_lance }], ai: { profile: aggressive } }
      - { nameKey: unit.mercenary.name, team: enemy, class: vanguard, level: 9, levelOffset: -2, at: [7, 0], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [hard] }
  # Die Falle: Söldner kommen von hinten die Passstraße herauf
  - turn: 7
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.mercenary.name, team: enemy, class: brigand, level: 9, levelOffset: -2, at: [9, 24], items: [{ def: iron_axe }], ai: { profile: aggressive } }
      - { nameKey: unit.mercenary.name, team: enemy, class: skirmisher, level: 9, levelOffset: -2, at: [10, 24], items: [{ def: iron_sword }], ai: { profile: aggressive } }
      - { nameKey: unit.mercenary.name, team: enemy, class: vanguard, level: 9, levelOffset: -2, at: [8, 24], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [normal, hard] }
  # Letzte Welle
  - turn: 9
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.mercenary.name, team: enemy, class: skirmisher, level: 9, levelOffset: -2, at: [9, 0], items: [{ def: iron_lance }], ai: { profile: aggressive } }
      - { nameKey: unit.mercenary.name, team: enemy, class: vanguard, level: 9, levelOffset: -2, at: [10, 0], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [hard] }
objectives:
  victory: { type: survive, turns: 10 }
  defeat:
    - { type: unit_dies, unit: avatar }
    - { type: unit_dies, unit: lucan }
  side:
    - { id: s_jory, type: recruit, unit: jory, reward: { gold: 200 } }
    - { id: s_pay, type: open_chests, reward: { item: { def: vulnerary } } }
triggers:
  - id: t_ballista
    once: true
    when: { type: turn_start, turn: 1, phase: player }
    then:
      - { action: dialogue, id: scn.s2_1.ballista_lesson }
  - id: t_riders
    once: true
    when: { type: turn_start, turn: 3, phase: player }
    then:
      - { action: dialogue, id: scn.s2_1.riders_lesson }
  - id: t_shadow
    once: true
    when: { type: turn_start, turn: 8, phase: player }
    then:
      - { action: dialogue, id: scn.s2_1.dragon_shadow }
goldReward: 1100
design:
  title: Wind über der Eisenmark
  intent: >
    Neues Land, neue Gefahr: Die Truppe gerät im Scheitel des Passes in Brakkas Sperre und muss zehn Runden aushalten, bis die Boten von Seraphine und Dravn kommen.
    Lektion Balliste: Wer eine Felsnase erobert, dreht die Balliste um und beschießt die Wellen schon in der Scharte.
  mood: Klarer, kalter Herbstmorgen im Hochgebirge, Sturm reißt an Fahnen und Gras, kahle Felsnasen mit großen Ballisten, dahinter die weite goldbraune Ebene der Eisenmark, ein liegengebliebener bunter Gauklerwagen an der Passstraße.
  phases:
    - { id: p1, turns: [1, 3], label: Der Kessel, note: "Erste Linie aus der Scharte, die Ballisten decken die Straße bis y 17. Jory wird beschossen." }
    - { id: p2, turns: [4, 6], label: Die Wellen, note: "Söldner kommen durch die Scharte (R3, R6). Sturm auf die Nasen über Rampe, Leiter und Treppe." }
    - { id: p3, turns: [7, 10], label: Die Falle, note: "R7 Söldner von Süden, R8 Drachenschatten, R9 letzte Welle, nach R10 die Boten." }
  paths:
    - { team: player, points: [[8, 21], [6, 19], [2, 19], [2, 17], [3, 16], [3, 15], [3, 14]], phase: p2, label: Westnase }
    - { team: player, points: [[6, 17], [5, 17], [4, 17]], phase: p2, label: Leiter }
    - { team: player, points: [[12, 21], [16, 18], [16, 16], [16, 13], [16, 12], [16, 11]], phase: p2, label: Ostnase }
    - { team: enemy, points: [[9, 0], [9, 8], [9, 15], [10, 20]], phase: p2, label: Wellen }
    - { team: enemy, points: [[9, 24], [9, 21]], phase: p3, label: Von hinten }
  zones:
    - { area: { rect: [8, 10, 11, 14] }, label: Die Scharte }
    - { area: { rect: [2, 12, 4, 14] }, label: Felsnase St.2 }
    - { area: { rect: [15, 9, 17, 11] }, label: Felsnase St.2 }
    - { area: { rect: [1, 16, 4, 17] }, label: Terrasse St.1 }
    - { area: { rect: [15, 13, 17, 15] }, label: Terrasse St.1 }
    - { area: { rect: [12, 17, 13, 17] }, label: Passhospiz, phase: p1 }
  marks:
    - { at: [3, 13], label: BW, note: "Balliste West. Reichweite 3–10, von Stufe 2 aus 11: deckt die Straße bis etwa y 18." }
    - { at: [16, 10], label: BO, note: "Balliste Ost mit Brakka. Reicht bis zum Hospiz und bis zu Jorys Wagen." }
    - { at: [5, 17], label: L, note: "Leiter an der Terrassenkante: hinauf nur zu Fuß, 1 Bewegung extra; der kurze Weg auf die Westterrasse." }
    - { at: [12, 17], label: H, note: "Passhospiz: heilt, liegt aber in Reichweite der Ostballiste." }
  notes:
    - "Stufen über levelOffset (Formatwunsch, Produktinhaber 2026-11-05: Start P−3, Wellen P−2, Elite P−1, Leutnants P+1, Boss P+2). level zeigt den Wert bei P = 11 und bleibt fürs Schema."
    - "Normal 24 Gegner (10 davon R3/R6/R7/R9) gegen 9 eigene (+ Jory), P−3 bis P−1 (hier P = 11, Stufe 8–10), Leutnants P+1 bis P+2; Leicht 20, Schwer 28."
    - "Formatwunsch Balliste: Objekt und Modell gibt es, die Regel (GDD: Mt 12 + STR, Treffer 70, Reichweite 3–10, Bedienen vom Nachbarfeld) fehlt in src/core noch. Die KI bedient sie nur mit Profil hold."
    - "Formatwunsch Leutnant: brakka fehlt in lieutenants (Akt-2-Paket); als Ballistenmeisterin zu Fuß, Bogenklasse hier nur als Platzhalter."
    - "Die Truhe mit Brakkas Sold auf der Ostnase: Fenn öffnet ohne Schlüssel, sonst der Schlüssel der Wache auf der Nase."
    - "Saat Drachen: In Runde 8 zieht ein Schatten über die Scharte, Söldner und Truppe halten kurz inne (Szene, keine Figur)."
    - "Nach dem Sieg: Rowenas Lanzen und ein Bote Dravns erreichen den Pass gleichzeitig, beide bieten den Freispruch an (Szene). Brakka zieht ab, sie wurde bezahlt."
