reinforcements:
  # Grells Nachhut schließt von Süden auf, sobald die Truppe in der Mittelkammer steht
  - turn: 6
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.smuggler.name, team: enemy, class: brigand, level: 10, levelOffset: -2, at: [5, 19], items: [{ def: iron_axe }], ai: { profile: aggressive } }
      - { nameKey: unit.smuggler.name, team: enemy, class: skirmisher, level: 10, levelOffset: -2, at: [6, 19], items: [{ def: iron_sword }], ai: { profile: aggressive } }
      - { nameKey: unit.smuggler.name, team: enemy, class: vanguard, level: 10, levelOffset: -2, at: [7, 19], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [hard] }
objectives:
