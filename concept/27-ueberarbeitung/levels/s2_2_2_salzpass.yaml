  - { id: m2, nameKey: unit.smuggler.name, team: enemy, class: skirmisher, level: 10, levelOffset: -2, at: [9, 9], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 4, then: aggressive } }
  - { id: m3, nameKey: unit.smuggler.name, team: enemy, class: brigand, level: 10, levelOffset: -2, at: [10, 12], items: [{ def: iron_axe }], ai: { profile: trigger, radius: 3, then: aggressive }, difficulty: [normal, hard] }
