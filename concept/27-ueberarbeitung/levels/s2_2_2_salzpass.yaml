  defeat:
    - { type: unit_dies, unit: avatar }
    - { type: unit_dies, unit: lucan }
  side:
    - { id: s_chests, type: open_chests, reward: { item: { def: vulnerary } } }
triggers:
  - id: t_rock1
    once: true
    when: { type: turn_start, turn: 3, phase: enemy }
    then:
      - { action: dialogue, id: scn.s2_2.rockfall_south }
      - { action: set_terrain, area: { tiles: [[4, 14], [7, 14]] }, terrain: rockwall }
  - id: t_rock2_warn
    once: true
    when: { type: turn_start, turn: 4, phase: player }
    then:
      - { action: dialogue, id: scn.s2_2.rockfall_warn }
  - id: t_rock2
    once: true
    when: { type: turn_start, turn: 5, phase: enemy }
    then:
      - { action: set_terrain, area: { tiles: [[12, 6], [12, 7]] }, terrain: rockwall, warn: true }
  - id: t_rock3
    once: true
    when: { type: turn_start, turn: 8, phase: enemy }
    then:
      - { action: dialogue, id: scn.s2_2.rockfall_ledge }
      - { action: set_terrain, area: { tiles: [[14, 7], [14, 8]] }, terrain: rockwall }
  - id: t_seal
    once: true
    when: { type: object_activated, object: c_seal }
    then:
      - { action: dialogue, id: scn.s2_2.seal_found }
      - { action: set_flag, flag: m2_2_seal }
goldReward: 900
design:
  title: Das Siegel im Salzpass
  intent: >
    Kurze, enge Jagd gegen die Zeit: Grells Karawane zieht bald weiter, im Nebel sieht man nur, was der Späher sieht. Die Straße ist sicher, aber langsam und fällt enger zu; die Felsleiste ist kurz, aber schmal, von Schützen besetzt und in Runde 8 weg.
    Fenn glänzt: Er sieht weiter im Nebel und öffnet die Truhe ohne Schlüssel. Saat Kharesh: Kundschafter, die hier nichts zu suchen haben.
  mood: Dichter weißer Nebel in einem engen grauen Felspass, salzverkrustete Schmugglerwagen, herabstürzendes Geröll, Morgenlicht nur als fahler Schein.
  phases:
    - { id: p1, turns: [1, 3], label: Südenge, note: "Wachen in der Enge, R3 Steinschlag engt sie hinter der Truppe ein." }
    - { id: p2, turns: [4, 7], label: Mittelkammer, note: "Warnung R4, R5 Nordenge auf ein Feld, R6 Nachhut von Süden. Kundschafter im Westwinkel." }
    - { id: p3, turns: [8, 11], label: Karawane, note: "R8 fällt die Leiste, Grell bei den Wagen. Zahlmeister trägt den Schlüssel." }
  paths:
    - { team: player, points: [[5, 18], [5, 13], [8, 11], [11, 10], [11, 5], [7, 4], [5, 3]], label: Straße }
    - { team: player, points: [[10, 16], [14, 16], [14, 14], [14, 5], [13, 5], [12, 4]], label: Felsleiste }
    - { team: enemy, points: [[6, 19], [6, 15]], phase: p2, label: Nachhut }
  zones:
    - { area: { rect: [3, 1, 13, 4] }, label: Grells Karawane, phase: p3 }
    - { area: { rect: [14, 9, 14, 14] }, label: Felsleiste St.1 }
    - { area: { tiles: [[4, 14], [7, 14]] }, label: Steinschlag R3, phase: p1 }
    - { area: { tiles: [[12, 6], [12, 7]] }, label: Steinschlag R5, phase: p2 }
    - { area: { tiles: [[14, 7], [14, 8]] }, label: Steinschlag R8, phase: p3 }
  marks:
    - { at: [4, 2], label: S, note: "Truhe mit dem Siegel. Fenn öffnet ohne Schlüssel, sonst der Schlüssel des Zahlmeisters." }
    - { at: [14, 15], label: R, note: "Rampe auf die Felsleiste (Stufe 1), oben nur ein Feld breit." }
    - { at: [13, 5], label: T, note: "Treppe von der Leiste in die Nordkammer." }
    - { at: [3, 9], label: K, note: "Kundschafter aus Kharesh, in ihrer Truhe die Seekarte aus Silbermeer (Saat)." }
  notes:
    - "Stufen über levelOffset (Formatwunsch, Produktinhaber 2026-11-05: Start P−3, Wellen P−2, Elite P−1, Leutnants P+1, Boss P+2). level zeigt den Wert bei P = 12 und bleibt fürs Schema."
    - "Normal 16 Gegner (2 davon R6) gegen 7 eigene, P−3 bis P−1 (hier P = 12, Stufe 9–11), Leutnants P+1 bis P+2; Leicht 13, Schwer 19."
    - "Die Straße bleibt immer offen: Steinschlag engt nur ein, sperrt nie ganz. Laut Regel bleibt ein besetztes Feld unverändert."
    - "Formatwunsch Inhalt: Truhe c_seal braucht den Gegenstand Siegel (key item), c_page trägt laut Narrative eine Chronik-Seite (Quellen Akt 2: je eine Truhe in 2-2, 2-4, 2-7), die ID ist Platzhalter."
    - "Formatwunsch Leutnant: grell fehlt in lieutenants (Akt-2-Paket); Klasse brigand ist Platzhalter."
    - "Saat Kharesh und Zweifel „Wer schreibt der Prinzessin?“ stehen in den Szenen; die Kundschafter kamen per Schiff, Silbermeer verkaufte die Überfahrt."
