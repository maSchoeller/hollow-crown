  - { id: c_scouts, type: chest, at: [3, 9], contents: { gold: 200 } }
deploy:
  max: 7
  forced: [avatar, lucan]
  slots: [[4, 17], [7, 17], [8, 17], [5, 18], [6, 18], [7, 18], [8, 18], [5, 19], [6, 19]]
units:
  # Nordkammer: Grell bei den Wagen, Zahlmeister mit dem Schlüssel
  - { id: grell, nameKey: unit.grell.name, team: enemy, class: brigand, level: 13, levelOffset: 1, at: [6, 3], lieutenant: grell, items: [{ def: steel_axe }], ai: { profile: guard } }
  - { id: purser, nameKey: unit.smuggler.name, team: enemy, class: skirmisher, level: 10, levelOffset: -2, at: [8, 3], items: [{ def: iron_sword }, { def: door_key }], drops: [1], ai: { profile: guard } }
  - { id: n1, nameKey: unit.smuggler.name, team: enemy, class: vanguard, level: 10, levelOffset: -2, at: [11, 5], items: [{ def: iron_lance }], ai: { profile: guard } }
  - { id: n2, nameKey: unit.smuggler.name, team: enemy, class: vanguard, level: 10, levelOffset: -2, at: [12, 5], items: [{ def: iron_lance }], ai: { profile: guard } }
  - { id: n3, nameKey: unit.smuggler.name, team: enemy, class: marksman, level: 10, levelOffset: -2, at: [10, 3], items: [{ def: iron_bow }], ai: { profile: hold } }
  # Felsleiste: Schützen schießen von Stufe 1 in die Mittelkammer
  - { id: l1, nameKey: unit.smuggler.name, team: enemy, class: marksman, level: 10, levelOffset: -2, at: [14, 9], items: [{ def: iron_bow }], ai: { profile: hold } }
  - { id: l2, nameKey: unit.smuggler.name, team: enemy, class: marksman, level: 10, levelOffset: -2, at: [14, 12], items: [{ def: iron_bow }], ai: { profile: hold }, difficulty: [normal, hard] }
  # Mittelkammer: warten im Nebel
