# Etappe 6, Akt 2, Mission 2-2 – Das Siegel im Salzpass. Entwurf nach missionsliste.html (K 16×20, treasure, 7 / 16, Leutnant Grell).
# Enger Schmugglerpass im Nebel: drei Kammern, zwei Engstellen auf der Straße, dazu eine schmale Felsleiste (Stufe 1) im Osten als kurzer zweiter Weg.
# Veränderliche Karte: Steinschlag macht in Runde 3, 5 und 8 Felder zu Fels. Runde 5 engt die Nordenge auf ein Feld ein, Runde 8 sperrt die Leiste.
# Grells Karawane zieht nach Runde 11 weiter; bis dahin muss die Truhe mit dem Siegel offen sein.
