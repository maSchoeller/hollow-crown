# Etappe 6, Akt 1, Mission 1-3 – Der Fremde mit dem Siegel. Entwurf nach missionsliste-s1.md (M 20×25, reach, 7 / 18, Leutnant Morra).
# Grenzwald, dichter Wald mit Nebel des Krieges. Ziel: Rhen erreicht den Schrein am Weißdorn auf der Lichtung im Norden.
# Drei Wege: die Waldstraße in Schleifen (lang, Holzsteg über den Bach), zwei Wildwechsel West und Ost (kurz, schmal, Hinterhalte).
# Morra hält mit Schützen den Lichtungsrand. Halvard und Liora warten am Schrein; Liora heilt, wer die Lichtung erreicht.
