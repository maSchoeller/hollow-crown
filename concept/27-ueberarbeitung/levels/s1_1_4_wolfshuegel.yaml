# Etappe 6, Akt 1, Mission 1-4 – Die Spur des Maklers. Entwurf nach missionsliste-s1.md (M 22×26, boss Osric Dunn, 8 / 22, Leutnant Ulvric).
# Wolfshügel: zwei Felskämme teilen die Karte in Fuß, Mittelterrasse und Oberterrasse; Rampen und Lücken sind die Engstellen.
# Ulvric hält mit Wolfsreitern die Anhöhe in der Mitte, aus zwei Wolfshöhlen (West, Ost) kommen Wellen. Dunn sitzt in der Höhle im Norden.
# Veränderliche Karte: Ein Hebel auf der Felsnase über der Osthöhle löst einen Felsrutsch aus, der die Osthöhle verschüttet.
# Ysolde sitzt gefangen in der Westhöhle (Rhen spricht sie an); der Kerkermeister trägt den Schlüssel für Dunns Truhe.
