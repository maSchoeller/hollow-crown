    phase: enemy
    announce: true
    units:
      - { nameKey: unit.wolf_rider.name, team: enemy, class: wolf_rider, level: 2, at: [0, 14], items: [{ def: iron_lance }], ai: { profile: aggressive } }
  # Osthöhle, zweite Welle
  - turn: 6
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.wolf_rider.name, team: enemy, class: wolf_rider, level: 3, at: [21, 14], items: [{ def: iron_lance }], ai: { profile: aggressive } }
      - { nameKey: unit.wolf_rider.name, team: enemy, class: wolf_rider, level: 3, at: [21, 15], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [hard] }
