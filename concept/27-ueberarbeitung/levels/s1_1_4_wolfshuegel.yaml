reinforcements:
  # Osthöhle (fällt weg, wenn der Felsrutsch ausgelöst ist – Formatwunsch)
  - turn: 3
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.wolf_rider.name, team: enemy, class: wolf_rider, level: 2, at: [21, 14], items: [{ def: iron_lance }], ai: { profile: aggressive } }
      - { nameKey: unit.wolf_rider.name, team: enemy, class: wolf_rider, level: 2, at: [21, 15], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [normal, hard] }
  # Westhöhle
