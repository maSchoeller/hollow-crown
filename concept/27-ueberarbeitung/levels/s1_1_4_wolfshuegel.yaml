    - { id: s_chests, type: open_chests, reward: { item: { def: vulnerary } } }
triggers:
  - id: t_rockfall
    once: true
    when: { type: object_activated, object: l_rock }
    then:
      - { action: dialogue, id: scn.s1_1_4.rockfall }
      - { action: set_flag, flag: m1_4_rockfall }
goldReward: 1000
design:
  title: Die Spur des Maklers
  intent: >
    Erste veränderliche Karte: Wer den Hebel auf der Felsnase erreicht, verschüttet die Osthöhle und schneidet die Wolfswellen ab.
    Zwei Kämme machen Rampen und Lücken zu Engstellen; Wolfsreiter sind im Wald und am Fels langsam, auf dem Gras schnell.
  mood: Abendrot über kahlen Felskuppen, Wolfsgeheul aus den Höhlen, Lagerfeuer vor Dunns Höhle, Knochen und Fahnen der Wolfsbande.
  phases:
    - { id: p1, turns: [1, 3], label: Erste Rampe, note: "Rampe West, Mitte, Ost; erste Welle aus der Osthöhle (R3)." }
    - { id: p2, turns: [4, 7], label: Mittelterrasse, note: "Ulvric auf der Anhöhe; Felsrutsch möglich; Wellen R5 West, R6 Ost." }
    - { id: p3, turns: [8, 12], label: Dunns Höhle, note: "Lücke im zweiten Kamm, Schützen auf den Ruinen, Ysolde im Westen." }
  paths:
    - { team: player, points: [[10, 22], [10, 19], [10, 11], [10, 4]], label: Hauptweg }
    - { team: player, points: [[13, 22], [18, 21], [18, 18], [19, 17], [19, 13], [18, 12], [18, 11], [19, 11]], phase: p2, label: zum Hebel }
    - { team: player, points: [[3, 20], [2, 12], [2, 9], [2, 6], [2, 3]], phase: p3, label: zu Ysolde }
    - { team: enemy, points: [[21, 14], [16, 18], [13, 21]], phase: p1, label: Osthöhle }
    - { team: enemy, points: [[0, 14], [3, 18], [8, 21]], phase: p2, label: Westhöhle }
  zones:
    - { area: { rect: [9, 13, 12, 16] }, label: Anhöhe Ulvric, phase: p2 }
    - { area: { rect: [8, 1, 13, 3] }, label: Dunns Höhle, phase: p3 }
  marks:
    - { at: [19, 11], label: H, note: "Hebel: Felsrutsch, Felder [19,14], [19,15], [20,14], [21,14] werden zu rockwall; R6 entfällt." }
    - { at: [10, 9], label: E, note: "Lücke im zweiten Kamm, zwei Lanzen halten sie." }
    - { at: [1, 2], label: Y, note: "Ysolde gefangen; Rhen spricht sie an. Der Kerkermeister trägt den Schlüssel für Dunns Truhe." }
  notes:
    - "Normal 22 Gegner (5 davon R3/R5/R6) gegen 8 eigene (+ Ysolde), Stufe 2–3 plus Ulvric und Dunn; Leicht 18, Schwer 26."
    - "Formatwunsch set_terrain: Der Hebel soll Felder zu rockwall machen und spätere Spawns in der Osthöhle streichen; bis dahin setzt der Auslöser nur das Flag."
    - "Truhe in Dunns Höhle: Fenn öffnet ohne Schlüssel, alle anderen brauchen den Schlüssel des Kerkermeisters (Regel aus Story 2.6)."
    - Dunns letzte Worte (Saat Stimme) und E2 davor stehen in den Szenen.
