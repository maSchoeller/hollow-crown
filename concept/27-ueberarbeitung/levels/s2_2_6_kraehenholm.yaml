# Etappe 6, Akt 2, Mission 2-6 – Gold für Banditen. Entwurf nach missionsliste.html (M 22×26, rout, 10 / 28, Leutnant Grell, Sable, Beitritt Nell).
# Schmugglerinsel Krähenholm. Landung am Südstrand, in der Mitte ein Klippenrücken mit Plateau (Stufe 1) und Felsnase (Stufe 2), wo Sable das Gold übergibt, im Norden die Bucht mit Grells Schiff.
# Veränderliche Karte: Bei Ebbe (Runde 4) wird der Kanal im Osten zur Sandbank, ein zweiter Weg in die Bucht; bei Flut (Runde 9) ist er wieder Wasser.
