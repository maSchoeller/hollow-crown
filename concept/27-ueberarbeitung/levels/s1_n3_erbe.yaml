# Etappe 6, Akt 1, Nebenquest N3 – Das Erbe. Entwurf nach missionsliste-s1.md (K 16×20, defend, öffnet nach 1-6, wenn Tobin lebt).
# Tobins Pachthof: Fluss im Norden mit Mühle und Mühlbrücke, Furt im Osten; in der Mitte Hofplatz mit Wohnhaus und Scheunen,
# im Süden offene Kornfelder mit Hecken. Hasks versprengte Marodeure kommen von Süden über die Felder und von Norden über die Brücke.
# Zu schützen: Tobins Vater. Der Hauptmann trägt den Schlüssel zur Truhe in der Scheune.
