  - { id: v_miller, type: village, at: [7, 5], reward: { item: { def: vulnerary } } }
  - { id: c_barn, type: chest, at: [12, 8], contents: { gold: 400 } }
deploy:
  max: 6
  forced: [avatar, tobin]
  slots: [[5, 9], [6, 9], [7, 9], [8, 9], [5, 10], [6, 10], [7, 10], [8, 10]]
units:
  - { id: tobin_father, nameKey: unit.tobin_father.name, team: other, class: civilian, level: 1, at: [6, 7], items: [], ai: { profile: hold } }
  # Süden: Felder und Straße
  - { id: m1, nameKey: unit.marauder.name, team: enemy, class: brigand, level: 3, at: [3, 17], items: [{ def: iron_axe }], ai: { profile: raider, target: v_home } }
  - { id: m2, nameKey: unit.marauder.name, team: enemy, class: skirmisher, level: 3, at: [5, 19], items: [{ def: iron_sword }], ai: { profile: aggressive } }
  - { id: m3, nameKey: unit.marauder.name, team: enemy, class: brigand, level: 3, at: [12, 17], items: [{ def: iron_axe }], ai: { profile: aggressive } }
  - { id: m4, nameKey: unit.marauder.name, team: enemy, class: marksman, level: 3, at: [14, 19], items: [{ def: iron_bow }], ai: { profile: aggressive } }
  - { id: captain, nameKey: unit.marauder_captain.name, team: enemy, class: vanguard, level: 4, at: [9, 18], items: [{ def: iron_lance }, { def: door_key }], drops: [1], ai: { profile: trigger, wakeTurn: 2, then: aggressive } }
  # Norden: über die Mühlbrücke
