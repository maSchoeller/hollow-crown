  # Nur Schwer
  - { id: m8, nameKey: unit.marauder.name, team: enemy, class: brigand, level: 4, at: [1, 19], items: [{ def: iron_axe }], ai: { profile: aggressive }, difficulty: [hard] }
reinforcements:
