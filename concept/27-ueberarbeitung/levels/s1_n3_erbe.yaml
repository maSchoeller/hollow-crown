      - { nameKey: unit.marauder.name, team: enemy, class: marksman, level: 3, at: [10, 19], items: [{ def: iron_bow }], ai: { profile: aggressive }, difficulty: [normal, hard] }
objectives:
  victory: { type: defend, unit: tobin_father, turns: 8 }
  defeat:
    - { type: unit_dies, unit: avatar }
    - { type: unit_dies, unit: tobin }
    - { type: unit_dies, unit: tobin_father }
  side:
    - { id: s_chest, type: open_chests, reward: { gold: 200 } }
    - { id: s_clean, type: no_downs, reward: { item: { def: vulnerary } } }
goldReward: 500
design:
  title: Das Erbe
  intent: >
    Kleine Verteidigung auf zwei Fronten: Süden über offene, brennende Felder, Norden über die Mühlbrücke und die Furt im Osten.
    Plünderer zielen auf Wohnhaus und Müllerhaus. Nach dem Sieg übergibt Tobins Vater die Signaturlanze (Szene).
  mood: Spätsommerabend auf einem Pachthof, das Mühlrad dreht sich, Rauch über den Kornfeldern, Hühner flüchten über den Hof.
  phases:
    - { id: p1, turns: [1, 3], label: Felder, note: "Marodeure aus dem Süden, Feuer in den Feldern; zwei Mann über die Brücke." }
    - { id: p2, turns: [4, 5], label: Furt, note: Welle über die Furt im Nordosten (R4). }
    - { id: p3, turns: [6, 8], label: Letzter Ansturm, note: Nachschub über die Straße (R6). }
  paths:
    - { team: enemy, points: [[3, 17], [4, 13], [6, 9]], label: Plünderer }
    - { team: enemy, points: [[9, 1], [9, 6], [7, 8]], label: Mühlbrücke }
    - { team: enemy, points: [[15, 0], [13, 3], [12, 7]], phase: p2, label: R4 Furt }
  zones:
    - { area: { rect: [4, 7, 12, 12] }, label: Hofplatz }
  marks:
    - { at: [9, 3], label: E1, note: "Mühlbrücke, ein Kämpfer hält sie." }
    - { at: [13, 3], label: E2, note: "Furt, nur zu Fuß." }
    - { at: [12, 8], label: K, note: "Truhe in der Scheune: Schlüssel beim Hauptmann oder Fenn." }
  notes:
    - "Normal 14 Gegner (6 davon in Wellen R2/R4/R6) gegen 6 eigene, Stufe 3–4; Leicht 11, Schwer 16."
    - Keine Geländeveränderung außer dem vorhandenen Feuer (nächste veränderliche Karte 1-7).
