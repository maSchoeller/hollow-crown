    phase: enemy
    announce: true
    units:
      - { nameKey: unit.marauder.name, team: enemy, class: brigand, level: 3, at: [12, 19], items: [{ def: iron_axe }], ai: { profile: raider, target: v_home } }
      - { nameKey: unit.marauder.name, team: enemy, class: skirmisher, level: 3, at: [2, 19], items: [{ def: iron_sword }], ai: { profile: aggressive }, difficulty: [normal, hard] }
  - turn: 4
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.marauder.name, team: enemy, class: brigand, level: 3, at: [15, 0], items: [{ def: iron_axe }], ai: { profile: aggressive } }
      - { nameKey: unit.marauder.name, team: enemy, class: skirmisher, level: 3, at: [15, 2], items: [{ def: iron_sword }], ai: { profile: aggressive } }
