# Etappe 6, Akt 2, Mission 2-7 – Das Kontor am Silbermeer. Entwurf nach missionsliste.html (M 20×25, reach Geschäftsbücher, 10 / 26, Leutnant Brakka).
# Kontor an der Auremündung. Ein Hafenbecken teilt die Karte, nur eine Steinbrücke führt hinüber, und Brakkas Balliste hält sie unter Feuer.
# Veränderliche Karte: Der Hebel am Kran im Osten legt einen Steg über das Becken (zweiter Weg). Das Kontor hat zwei verschlossene Türen; den Schlüssel trägt der Zahlmeister, Fenn braucht keinen.
