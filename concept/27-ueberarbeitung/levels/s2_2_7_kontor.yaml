design:
  title: Das Kontor am Silbermeer
  intent: >
    Beweis gegen Maelis: Eine Figur muss in die Schreibstube und die Bücher holen. Wer stur über die Brücke geht, läuft in die Balliste; wer den Kran bedient, kommt über den Steg an die Ostseite und an den Zahlmeister mit dem Schlüssel.
    Brakka kehrt zurück, diesmal von Maelis bezahlt.
  mood: Regnerischer Morgen am Hafen, nasses Kopfsteinpflaster, hohe Lagerhäuser, hölzerne Kräne, Masten im Becken, ein prächtiges Kontorhaus mit Silbermeer-Wappen.
  phases:
    - { id: p1, turns: [1, 4], label: Südkai, note: "Wachen zwischen den Lagerhäusern, R3 Boote im Westen. Hebel am Kran erreichbar." }
    - { id: p2, turns: [5, 8], label: Über das Becken, note: "Brücke unter Feuer oder Steg; R5 Ostkai, R7 von hinten. Zahlmeister mit Schlüssel." }
    - { id: p3, turns: [9, 13], label: Das Kontor, note: "Tür öffnen, Schreibstube erreichen, Chronik-Seite in der Nordostecke." }
  paths:
    - { team: player, points: [[9, 22], [9, 15], [9, 11], [9, 6]], label: Brücke }
    - { team: player, points: [[12, 22], [17, 21], [17, 16], [15, 15], [15, 11], [16, 7], [15, 4]], phase: p2, label: Steg }
    - { team: enemy, points: [[1, 16], [7, 21]], phase: p1, label: R3 }
    - { team: enemy, points: [[18, 16], [13, 21]], phase: p2, label: R5 }
  zones:
    - { area: { rect: [6, 2, 7, 3] }, label: Schreibstube }
    - { area: { rect: [15, 12, 15, 14] }, label: Steg nach Hebel, phase: p2 }
  marks:
    - { at: [10, 8], label: BA, note: "Balliste. Reichweite 3–10: deckt Brücke und Südkai bis y 18. Wer Brakka vertreibt, kann sie umdrehen." }
    - { at: [16, 15], label: H, note: "Hebel am Kran, vom Nachbarfeld zu ziehen, nur Spielerfiguren: Steg über das Becken." }
    - { at: [16, 6], label: Z, note: "Zahlmeister mit Türschlüssel. Fenn öffnet ohne." }
  notes:
    - "Normal 26 Gegner (6 davon R3/R5/R7), Stufe 5–6 plus Brakka (St. 10), gegen 10 eigene; Leicht 22, Schwer 30."
    - "Formatwunsch: Modelle Kai, Lagerhaus, Kran, Schiff, Boot fehlen laut Matrix; Regel Balliste wie in 2-1."
    - "E8 und Saat Pakt (Erste und letzte Seite der Chronik aus derselben Hand) stehen in der Szene nach der Mission. Nach 2-7 öffnet N6."
