design:
  title: Die Paktwacht
  intent: >
    Erste große Schlacht, Sturm bergauf: Brücke, Felder, drei Terrassen mit Rampen im Zickzack, Vorburg, Burghof, Thron.
    Jede Stufe ist eine Engstelle mit Schützen darüber; Wölfe auf der untersten Terrasse und aus dem Ostwald strafen lange Kolonnen.
  mood: Spätsommermittag, goldene Kornfelder an der Erle, Weinterrassen, darüber die graue Burg vor dem Fels, Marodeursfahnen auf den Türmen.
  phases:
    - { id: p1, turns: [1, 4], label: Brücke und Felder, note: "Lanzen an der Brücke, Plünderer in den Feldern, Mühle und Höfe." }
    - { id: p2, turns: [5, 9], label: Terrassen, note: "Ulvric und Wölfe auf Terrasse 1, Wolfswelle Ost (R5), Rückenwelle über die Furten (R8)." }
    - { id: p3, turns: [10, 14], label: Vorburg, note: "Hask am Tor; flieht bei 0 TP durch die Westpforte über den Ziegenpfad." }
    - { id: p4, turns: [15, 18], label: Burghof, note: Kastellan im Bergfried; Thron einnehmen. }
  paths:
    - { team: player, points: [[14, 38], [14, 28], [14, 25], [8, 22], [7, 21], [12, 19], [14, 18], [14, 12], [14, 6]], label: Sturm }
    - { team: enemy, points: [[8, 15], [6, 15], [2, 13], [1, 20], [1, 30], [3, 36]], phase: p3, label: Hasks Flucht }
    - { team: enemy, points: [[27, 28], [22, 27], [17, 27]], phase: p2, label: R5 Wölfe }
    - { team: enemy, points: [[4, 39], [4, 36], [6, 33]], phase: p2, label: R8 }
  zones:
    - { area: { rect: [6, 26, 23, 27] }, label: Terrasse 1 }
    - { area: { rect: [6, 22, 23, 24] }, label: Terrasse 2 }
    - { area: { rect: [6, 19, 23, 20] }, label: Terrasse 3 }
    - { area: { rect: [9, 13, 20, 17] }, label: Vorburg, phase: p3 }
  marks:
    - { at: [14, 36], label: E1, note: "Brücke über die Erle, zwei Lanzen; Furten links und rechts nur zu Fuß." }
    - { at: [14, 25], label: E2, note: "Mittelrampe Stützmauer 1, Lanzen oben; Nebenrampe im Westwald [4,25]." }
    - { at: [7, 21], label: E3, note: "Randrampen Stützmauer 2 (West und Ost)." }
    - { at: [14, 18], label: E4, note: Vorburgtor mit Hask dahinter. }
    - { at: [14, 3], label: G, note: "Gewölbe-Tor im Fels (Einstieg 1-7), verschlossen." }
    - { at: [24, 2], label: P, note: "Wachpass nach Norden (Angriffsweg in 1-8)." }
  notes:
    - "Normal 36 Gegner (4 davon R5/R8) gegen 12 eigene, Stufe 2–5 plus Hask und Ulvric; Leicht 30, Schwer 40."
    - "Große Karte: Plätze über 12 füllen Söldner aus der Taverne auf (Missionsliste, Regeln)."
    - Keine Geländeveränderung; die Karte ist Vorlage für 1-8.
