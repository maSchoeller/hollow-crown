# Etappe 6, Akt 1, Mission 1-6 – Die Paktwacht. Entwurf nach missionsliste-s1.md (G 30×40, seize, 12 / 36, Leutnants Hask und Ulvric).
# Schnitt der Paktwacht (weltentwurf.html): von Süden Erle, Felder mit Mühle, drei Terrassen mit Stützmauern, Vorburg, Burghof,
# Bergfried mit Thron am Fels des Grauen Kamms. Im Fels das Gewölbe-Tor (1-7), im Nordosten der Wachpass (1-8).
# Rampen im Zickzack: Stützmauer 1 mit Rampe in der Mitte (und einer im Westwald), Stützmauer 2 mit Rampen an beiden Rändern.
# Hask hält die Vorburg und flieht durch die Westpforte über den Ziegenpfad nach Süden; Ulvric jagt mit Wölfen auf der untersten Terrasse.
