# Etappe 6, Akt 1, Nebenquest N2 – Der letzte Wachturm. Entwurf nach missionsliste-s1.md (K 16×20, treasure, öffnet nach 1-5).
# Grenzhügel an der Grenzmauer, dahinter liegt Kharesh. Im Norden die Ruine des Wachturms, in der sich Varek verschanzt hat.
# Ein Suchtrupp des Grenzheers belagert den Turm; Nachschub kommt durch zwei Breschen in der Mauer und von den Seiten.
# Lucan spricht Varek an, nur dann tritt er bei. Zwei Truhen im Turm: Chronik-Seite und Schild der Paktwächter (verschlossen,
# Schlüssel beim Feldwebel oder Fenn).
id: s1_n2_wachturm
nameKey: map.s1_n2_wachturm.name
size: [16, 20]
legend:
  ".": plain
  ",": grass
  "_": road
  "T": forest
  "^": mountain
  "W": wall
  "R": ruins
  "F": fort
#          x: 0123456789012345
terrain: |
  WWWRWWWWWWWWRWWW
  ,,,,,WWWWWW,,,,,
  ,R,,,W....W,,R,,
  ,,,,,R.F..W,,,,,
  ,,R,,W....W,,,R,
  ,,,,,WWRRWW,,,,,
  ,,,,,,,__,,,,,,,
  ,,,,R,,__,,R,,,,
  ^^^,,,,__,,,,,,,
  ^^^,,,,__,,,,^^^
  ^^^,,,^^^,,,,^^^
  ,,,,,,^^^R,,,^^^
  TT,,,,,__,,,,,,,
  TT,,,,,__,,TTT,,
  TT,,,,,__,,TTT,,
  ,,,TT,,__,,TTT,,
  ,,,TT,,__,,,,,,,
  ,,,,,,,__,,,,,TT
  TT,,,,,__,,,,,TT
  TT,,,,,__,,,,,TT
timeOfDay: evening
weather: clear
objects:
  - { id: c_chronicle, type: chest, at: [6, 2], contents: { dialogue: scn.s1_n2.chronicle_page, gold: 100 } }
  - { id: c_shield, type: chest, at: [9, 4], contents: { item: { def: pactwarden_shield } } }
  - { id: c_cache, type: chest, at: [1, 2], contents: { gold: 300 } }
deploy:
  max: 6
  forced: [avatar, lucan]
  slots: [[6, 17], [7, 17], [8, 17], [9, 17], [7, 18], [8, 18], [6, 18], [9, 18]]
units:
  # Varek im Turm: kämpft nicht, bis er angesprochen wird
  - { id: varek, char: varek, team: enemy, class: skirmisher, level: 5, at: [8, 3], items: [{ def: iron_sword }], ai: { profile: hold }, ignoreForRout: true, recruit: { by: [lucan], dialogue: scn.s1_n2.varek_talk } }
  # Suchtrupp vor dem Turm
  - { id: sergeant, nameKey: unit.border_sergeant.name, team: enemy, class: knight, level: 4, at: [11, 3], items: [{ def: iron_lance }, { def: door_key }], drops: [1], ai: { profile: guard } }
  - { id: b1, nameKey: unit.border_soldier.name, team: enemy, class: vanguard, level: 3, at: [7, 6], items: [{ def: iron_lance }], ai: { profile: guard } }
  - { id: b2, nameKey: unit.border_soldier.name, team: enemy, class: vanguard, level: 3, at: [8, 6], items: [{ def: iron_lance }], ai: { profile: guard } }
  - { id: b3, nameKey: unit.border_soldier.name, team: enemy, class: marksman, level: 2, at: [4, 7], items: [{ def: iron_bow }], ai: { profile: hold } }
  - { id: b4, nameKey: unit.border_soldier.name, team: enemy, class: marksman, level: 2, at: [11, 7], items: [{ def: iron_bow }], ai: { profile: hold } }
  - { id: b5, nameKey: unit.border_soldier.name, team: enemy, class: skirmisher, level: 2, at: [2, 4], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 4, then: aggressive } }
  - { id: b6, nameKey: unit.border_soldier.name, team: enemy, class: skirmisher, level: 2, at: [14, 4], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 4, then: aggressive } }
  - { id: b7, nameKey: unit.border_soldier.name, team: enemy, class: skirmisher, level: 2, at: [12, 9], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 4, then: aggressive } }
  - { id: b8, nameKey: unit.border_soldier.name, team: enemy, class: marksman, level: 2, at: [9, 11], items: [{ def: iron_bow }], ai: { profile: hold }, difficulty: [normal, hard] }
  - { id: b9, nameKey: unit.border_soldier.name, team: enemy, class: skirmisher, level: 2, at: [3, 11], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 4, then: aggressive } }
reinforcements:
  # durch die Breschen
  - turn: 3
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.border_soldier.name, team: enemy, class: skirmisher, level: 2, at: [3, 0], items: [{ def: iron_sword }], ai: { profile: aggressive } }
      - { nameKey: unit.border_soldier.name, team: enemy, class: skirmisher, level: 2, at: [12, 0], items: [{ def: iron_sword }], ai: { profile: aggressive } }
  - turn: 5
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.border_soldier.name, team: enemy, class: vanguard, level: 3, at: [15, 6], items: [{ def: iron_lance }], ai: { profile: aggressive } }
      - { nameKey: unit.border_soldier.name, team: enemy, class: skirmisher, level: 2, at: [15, 7], items: [{ def: iron_sword }], ai: { profile: aggressive }, difficulty: [normal, hard] }
  - turn: 7
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.border_soldier.name, team: enemy, class: vanguard, level: 3, at: [0, 6], items: [{ def: iron_lance }], ai: { profile: aggressive } }
      - { nameKey: unit.border_soldier.name, team: enemy, class: marksman, level: 3, at: [0, 5], items: [{ def: iron_bow }], ai: { profile: aggressive }, difficulty: [hard] }
objectives:
  victory: { type: treasure, chests: [c_chronicle, c_shield], turns: 10 }
  defeat:
    - { type: unit_dies, unit: avatar }
    - { type: unit_dies, unit: lucan }
  side:
    - { id: s_varek, type: recruit, unit: varek, reward: { gold: 200 } }
    - { id: s_cache, type: open_chests, reward: { item: { def: vulnerary } } }
goldReward: 500
design:
  title: Der letzte Wachturm
  intent: >
    Schatzkarte mit Zeitdruck: Zwei Truhen im Turm in 10 Runden, der Suchtrupp steht davor. Der Hügel in der Mitte teilt den Anmarsch
    in West und Ost. Lucan muss zu Varek in den Turm, sonst bleibt der Deserteur allein zurück.
  mood: Abendlicht über kahlen Grenzhügeln, die bröckelnde Grenzmauer, hinter ihr im Dunst die Türme von Kharesh, Feuer des Suchtrupps.
  phases:
    - { id: p1, turns: [1, 3], label: Anmarsch, note: "Hügel teilt den Weg; Plänkler an den Flanken; Breschen-Welle R3." }
    - { id: p2, turns: [4, 7], label: Turm, note: "Lanzen vor dem Eingang, Feldwebel mit Schlüssel am Ostrand; Wellen R5 Ost, R7 West." }
    - { id: p3, turns: [8, 10], label: Truhen, note: "Chronik-Seite und Schild öffnen, Lucan bei Varek." }
  paths:
    - { team: player, points: [[7, 17], [7, 12], [5, 10], [5, 7], [7, 5]], label: West }
    - { team: player, points: [[8, 17], [8, 12], [10, 10], [11, 6], [8, 5]], label: Ost }
    - { team: enemy, points: [[3, 0], [3, 3], [5, 6]], phase: p1, label: Bresche W }
    - { team: enemy, points: [[12, 0], [12, 3], [10, 6]], phase: p1, label: Bresche O }
  zones:
    - { area: { rect: [6, 2, 9, 4] }, label: Wachturm, phase: p3 }
  marks:
    - { at: [8, 3], label: V, note: "Varek: nur Lucan kann ihn ansprechen (Beitritt)." }
    - { at: [11, 3], label: S, note: "Feldwebel mit Schlüssel für die Schildtruhe." }
    - { at: [7, 10], label: Hü, note: "Grenzhügel: teilt den Anmarsch in West und Ost." }
  notes:
    - "Normal 15 Gegner (5 davon R3/R5/R7) gegen 6 eigene, Stufe 2–4; Leicht 12, Schwer 17."
    - "Item pactwarden_shield (Schild der Paktwächter, Relikt) fehlt noch in items.yaml; Chronik-Seite als Szene."
    - Keine Geländeveränderung (nächste veränderliche Karte 1-7).
