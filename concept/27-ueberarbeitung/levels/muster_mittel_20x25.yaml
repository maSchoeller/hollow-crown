# Musterkarte im neuen Maßstab (Etappe 5, Level-Werkzeug): mittel, 20 × 25, zeigt alle Planungsangaben unter `design:`.
# Kein Spielinhalt: liegt außerhalb von content/, wird vom Spiel nicht geladen. `pnpm levels` prüft sie gegen das Karten-Schema.
# Szenario zur Anschauung: Die Truppe (10) überquert den Krähenbach, sichert das Dorf und stürmt das Hügelfort im Norden.
# Viele schwache Gegner (Normal 26 samt Wellen, Stufe 2–4) statt weniger starker, Verhältnis gut 2,5 : 1 (Leitplanke der Roadmap).
id: muster_mittel
nameKey: map.muster_mittel.name
size: [20, 25]
legend:
  ".": plain
  ",": grass
  "_": road
  "T": forest
  "^": mountain
  "~": river
  "w": shallows
  "=": bridge
  "H": village
  "f": field
  "x": fence
  "W": wall
  "G": gate
  "F": fort
  "t": throne
  "R": ruins
#          x: 01234567890123456789
terrain: |
  ^^^^^^^^^^^^^^^^^^^^
  ^^^^^^WWWWWWWW^^^^^^
  TTTT^^W..tt..W^^TTTT
  TTTT^^W......W^^TTTT
  TTTT,,WF....FW,,TTTT
  TTTT,,W......W,,TTTT
  TTTT,,WWWGGWWW,,TTTT
  ,xxx,xxx,__,,,,,TTTT
  ,.H..H..,__,ffffff,,
  ,.......,__,ffffff,,
  ,.....H.,__,ffffff,,
  ,.H.....,__,ffffff,,
  ,,,,,,,,,__,xx,xxx,,
  ~~~w~~~~~==~~~~~w~~~
  ~~~w~~~~~==~~~~~w~~~
  ,,,,,,,,,__,,,,,,,,,
  TTTTT,,,,__,RTTTTTTT
  TTTTT,,R,__,,TTTTTTT
  TTTTTTT,,__,,TTTTTTT
  TTTTTTT,,__,,TTTTTTT
  ,,,,,,,,,__,,TTTTTTT
  ,,,,,,,,,__,,,,,,,,,
  ,,,,,,...__...,,,,,,
  ,,,,,,...__...,,H,,,
  ,,,,,,...__...,,,,,,
timeOfDay: morning
objects:
  - { id: v_w1, type: village, at: [2, 8],  reward: { gold: 300 } }
  - { id: v_w2, type: village, at: [5, 8],  reward: { item: { def: vulnerary } } }
  - { id: v_w3, type: village, at: [6, 10], reward: { item: { def: remedy_salve } } }
  - { id: v_w4, type: village, at: [2, 11], reward: { gold: 200 } }
  - { id: v_s,  type: village, at: [16, 23], reward: { item: { def: hand_axe } } }
  - { id: c_fort, type: chest, at: [8, 2], contents: { gold: 500 } }
  - { id: c_ruin, type: chest, at: [12, 16], contents: { item: { def: steel_sword } } }
deploy:
  max: 10
  forced: [avatar, kael]
  slots: [[9, 22], [10, 22], [8, 22], [11, 22], [9, 23], [10, 23], [7, 23], [12, 23], [8, 24], [11, 24], [6, 22], [13, 22]]
units:
  # Hügelfort: Kommandant (Boss) auf dem Thron, Wachen bleiben stehen
  - { id: warden, nameKey: unit.muster.warden, team: enemy, class: knight, level: 6, at: [10, 2], boss: true, items: [{ def: iron_lance }], ai: { profile: hold } }
  - { team: enemy, class: vanguard, level: 4, at: [9, 5], items: [{ def: iron_lance }], ai: { profile: guard } }
  - { team: enemy, class: vanguard, level: 4, at: [10, 5], items: [{ def: iron_lance }], ai: { profile: guard } }
  - { team: enemy, class: marksman, level: 3, at: [7, 4], items: [{ def: iron_bow }], ai: { profile: hold } }
  - { team: enemy, class: marksman, level: 3, at: [12, 4], items: [{ def: iron_bow }], ai: { profile: hold } }
  - { team: enemy, class: healer, level: 3, at: [11, 3], items: [{ def: heal_staff }], ai: { profile: support } }
  # Brückenkopf: schwache Plänkler, greifen sofort an
  - { team: enemy, class: brigand, level: 2, at: [9, 11], items: [{ def: iron_axe }], ai: { profile: aggressive } }
  - { team: enemy, class: brigand, level: 2, at: [10, 11], items: [{ def: iron_axe }], ai: { profile: aggressive } }
  - { team: enemy, class: skirmisher, level: 2, at: [8, 12], items: [{ def: iron_sword }], ai: { profile: aggressive } }
  - { team: enemy, class: skirmisher, level: 2, at: [11, 12], items: [{ def: iron_sword }], ai: { profile: aggressive } }
  - { team: enemy, class: marksman, level: 2, at: [12, 10], items: [{ def: iron_bow }], ai: { profile: aggressive } }
  # Dorf: Plünderer auf die Häuser
  - { team: enemy, class: brigand, level: 3, at: [3, 7], items: [{ def: iron_axe }], ai: { profile: raider, target: v_w1 } }
  - { team: enemy, class: brigand, level: 3, at: [6, 7], items: [{ def: iron_axe }], ai: { profile: raider, target: v_w3 } }
  - { team: enemy, class: skirmisher, level: 3, at: [4, 9], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 3, then: aggressive } }
  - { team: enemy, class: skirmisher, level: 3, at: [3, 10], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 3, then: aggressive }, difficulty: [normal, hard] }
  # Felder Ost
  - { team: enemy, class: wolf_rider, level: 3, at: [15, 9], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 4, then: aggressive } }
  - { team: enemy, class: wolf_rider, level: 3, at: [16, 10], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 4, then: aggressive }, difficulty: [normal, hard] }
  - { team: enemy, class: marksman, level: 3, at: [14, 8], items: [{ def: iron_bow }], ai: { profile: trigger, radius: 4, then: aggressive } }
  # Hinterhalt im Westwald (Marke A)
  - { team: enemy, class: skirmisher, level: 2, at: [3, 17], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 3, then: aggressive } }
  - { team: enemy, class: brigand, level: 2, at: [5, 18], items: [{ def: iron_axe }], ai: { profile: trigger, radius: 3, then: aggressive }, difficulty: [hard] }
reinforcements:
  # Flanke Ost über die Furt (Weg rot gestrichelt, Phase P2)
  - turn: 4
    phase: enemy
    announce: true
    units:
      - { team: enemy, class: wolf_rider, level: 3, at: [19, 8], items: [{ def: iron_sword }], ai: { profile: aggressive } }
      - { team: enemy, class: brigand, level: 2, at: [19, 9], items: [{ def: iron_axe }], ai: { profile: aggressive } }
      - { team: enemy, class: brigand, level: 2, at: [19, 10], items: [{ def: iron_axe }], ai: { profile: aggressive }, difficulty: [normal, hard] }
  - turn: 6
    phase: enemy
    announce: true
    units:
      - { team: enemy, class: skirmisher, level: 3, at: [0, 15], items: [{ def: iron_sword }], ai: { profile: aggressive } }
      - { team: enemy, class: skirmisher, level: 3, at: [0, 20], items: [{ def: iron_sword }], ai: { profile: aggressive }, difficulty: [normal, hard] }
objectives:
  victory: { type: seize, area: { rect: [9, 2, 10, 2] } }
  defeat:
    - { type: unit_dies, unit: avatar }
    - { type: unit_dies, unit: kael }
  side:
    - { id: s_villages, type: visit_villages, reward: { gold: 300 } }
    - { id: s_fast, type: turn_limit, turns: 12, reward: { item: { def: vulnerary } } }
triggers:
  # Wer das Tor erreicht, weckt die Mauerschützen (Phase P3)
  - id: t_gate
    once: true
    when: { type: unit_enters, team: player, area: { rect: [8, 7, 11, 8] } }
    then:
      - action: spawn
        units:
          - { team: enemy, class: marksman, level: 3, at: [14, 4], items: [{ def: iron_bow }], ai: { profile: aggressive } }
          - { team: enemy, class: marksman, level: 3, at: [5, 4], items: [{ def: iron_bow }], ai: { profile: aggressive } }
goldReward: 1200
design:
  title: "Muster: Sturm auf das Krähenfort"
  intent: >
    Mittlere Karte für 10 eigene Einheiten: drei Abschnitte nacheinander (Brücke, Dorf/Felder, Fort), viele schwache Gegner,
    zwei Flankenwellen. Der Spieler entscheidet, ob er das Dorf rettet (Umweg West) oder direkt zum Fort zieht.
  mood: Früher Morgen, Nebel steigt vom Krähenbach, das Fort liegt dunkel auf dem Hügel, im Dorf rauchen die Kamine.
  phases:
    - { id: p1, turns: [1, 3], label: Brückenkopf, note: Plänkler an der Brücke binden die Spitze. }
    - { id: p2, turns: [4, 7], label: Dorf und Flanken, note: "Welle Ost über die Furt (R4), Welle West aus dem Wald (R6)." }
    - { id: p3, turns: [8, 12], label: Sturm aufs Fort, note: Am Tor wachen die Mauerschützen auf (Auslöser A1). }
  paths:
    - { team: player, points: [[9, 22], [9, 15], [9, 9]], phase: p1, label: Hauptweg }
    - { team: player, points: [[7, 22], [5, 16], [3, 15], [3, 13], [3, 11]], phase: p2, label: Dorf retten }
    - { team: enemy, points: [[19, 8], [17, 9], [16, 12], [16, 14], [15, 17], [12, 21]], phase: p2, label: Welle Ost }
    - { team: enemy, points: [[0, 15], [4, 16], [7, 20]], phase: p2, label: Welle West }
    - { team: player, points: [[10, 9], [10, 7], [10, 3]], phase: p3, label: Sturm }
  zones:
    - { area: { rect: [1, 8, 7, 11] }, label: Dorf, phase: p2 }
    - { area: { rect: [7, 2, 12, 5] }, label: Fort, phase: p3 }
  marks:
    - { at: [4, 17], label: A, note: "Hinterhalt im Westwald, wer den Umweg nimmt, läuft hinein." }
    - { at: [12, 16], label: B, note: Ruine mit Truhe als Belohnung für den Umweg Ost. }
    - { at: [16, 13], label: C, note: "Furt Ost als Engstelle für die Welle, ein Panzer hält sie hier auf." }
  notes:
    - Normal 26 Gegner (7 davon später) gegen 10 eigene; Stufen 2–4 bewusst unter der Truppe, Werte per pnpm sim abstimmen.
    - Kamera beim Start auf Brücke und Fort, damit Ziel und Gefahr sofort sichtbar sind.
