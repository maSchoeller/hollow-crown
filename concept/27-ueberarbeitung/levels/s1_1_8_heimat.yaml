# Etappe 6, Akt 1, Mission 1-8 – Die Heimat halten. Entwurf nach missionsliste-s1.md (G 30×40, defend, 14 / 42, Leutnants Morra, Hask, Ulvric, Grosk).
# Variante der 1-6-Karte: Die Truppe hält die Paktwacht. Die Ostpforte der Vorburg ist vermauert, sonst gleiches Gelände.
# Hask, Ulvric und Grosk (nur ohne Wechsel bei E3) kommen von Süden über Felder und Terrassen, Morras Häscher ab Runde 4
# über den Wachpass in den Rücken (Westtor des Burghofs). Zu schützen: der Burgverwalter im Bergfried, 12 Runden.
