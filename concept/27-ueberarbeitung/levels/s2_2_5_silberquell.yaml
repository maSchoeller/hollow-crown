# Etappe 6, Akt 2, Mission 2-5 – Die verstoßene Leibwache. Entwurf nach missionsliste.html (M 20×25, escort Odile, 9 / 22, Leutnant Sable, Beitritt Odile, Amos).
# Kloster Silberquell in der Eisenschlucht. Die Truppe kommt von Süden in den Klosterhof, Odile folgt der nächsten eigenen Figur, der Ausgang liegt hinter der Schlucht im Norden.
# Zwei Hängebrücken queren die Schlucht, der Nordrand liegt eine Stufe höher. Veränderliche Karte: In Runde 6 kappen Sables Leute die Westbrücke.
id: s2_2_5_silberquell
nameKey: map.s2_2_5_silberquell.name
size: [20, 25]
