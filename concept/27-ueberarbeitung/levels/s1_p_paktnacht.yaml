# Etappe 6, Akt 1, Prolog – Die Paktnacht. Entwurf nach missionsliste-s1.md (K 14×18, escape, 4 / 10, keine Leutnants).
# Tempelbezirk des Glutdoms, Aurenhall, Nacht: Glutdom-Tür im Norden, Säulengang, innere Mauer, unterer Hof, Tempeltor im Süden.
# Brennas Abkürzung: Pforte in der Westmauer zur Unterstadt-Gasse, umgeht das bewachte Tempeltor (nicht kürzer, aber sicherer).
# Nur Nahkampf-Gegner (Produktinhaber 2026-10-24). Gerrit steht nur in den Szenen, nicht auf der Karte.
id: s1_p_paktnacht
nameKey: map.s1_p_paktnacht.name
size: [14, 18]
fog: false
noDeath: true
legend:
  ".": plain
  ",": grass
  "_": road
  "T": forest
  "W": wall
  "P": wall
  "G": gate
  "d": door
  "F": fort
  "R": ruins
#          x: 01234567890123
terrain: |
  WWWWWWddWWWWWW
  TT,W______W,TT
  T,,W______W,,T
  ,,,G______G,,,
  T,,WP____PW,,T
  TT,W.____.W,TT
  T,,WP____PW,,T
  ,,,W.____.W,,,
  T,,WP____PW,T,
  WWGWWWGGWWWGWW
  _W.F..__..F..W
  _d....__.....W
  _W..R.__..R..W
  _W....__.....G
  _WTT.P__P..TTW
  _W,,.P__P.,,,W
  _WWWWWGGWWWWWW
  __,,,,__,,,,,,
timeOfDay: night
weather: ash
lights:
  - { at: [5, 2], color: "#ffb35c", radius: 3 }
  - { at: [8, 2], color: "#ffb35c", radius: 3 }
  - { at: [6, 10], color: "#ffb35c", radius: 3 }
  - { at: [7, 15], color: "#ffb35c", radius: 3 }
objects:
  - { id: d_unterstadt, type: door, at: [1, 11] }
  - { id: c_garden, type: chest, at: [11, 1], contents: { item: { def: vulnerary } } }
deploy:
  max: 4
  forced: [avatar, lucan]
  slots: [[5, 1], [6, 1], [7, 1], [8, 1], [5, 2], [6, 2]]
units:
  # Säulengang: wachen auf, sobald die Truppe herankommt
  - { id: tg1, nameKey: unit.temple_guard.name, team: enemy, class: skirmisher, level: 2, at: [5, 5], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 4, then: aggressive } }
  - { id: tg2, nameKey: unit.temple_guard.name, team: enemy, class: vanguard, level: 2, at: [8, 7], items: [{ def: iron_lance }], ai: { profile: trigger, radius: 4, then: aggressive } }
  # Gärten: greifen über die Seitentore in die Flanke
  - { id: tg3, nameKey: unit.temple_guard.name, team: enemy, class: skirmisher, level: 1, at: [1, 5], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 3, then: aggressive } }
  - { id: tg4, nameKey: unit.temple_guard.name, team: enemy, class: vanguard, level: 1, at: [12, 6], items: [{ def: iron_lance }], ai: { profile: trigger, radius: 3, then: aggressive }, difficulty: [normal, hard] }
  # Innere Mauer: zwei Wachen hinter dem Tor (Engstelle 1)
  - { id: tg5, nameKey: unit.temple_guard.name, team: enemy, class: vanguard, level: 3, at: [6, 10], items: [{ def: iron_lance }, { def: vulnerary }], drops: [1], ai: { profile: guard } }
  - { id: tg6, nameKey: unit.temple_guard.name, team: enemy, class: skirmisher, level: 2, at: [7, 10], items: [{ def: iron_sword }], ai: { profile: guard } }
  # Tempeltor: halten den Ausgang (Engstelle 2)
  - { id: tg7, nameKey: unit.temple_guard.name, team: enemy, class: vanguard, level: 3, at: [6, 15], items: [{ def: iron_lance }], ai: { profile: hold } }
  - { id: tg8, nameKey: unit.temple_guard.name, team: enemy, class: vanguard, level: 3, at: [7, 15], items: [{ def: iron_lance }], ai: { profile: hold } }
  # Nur Schwer: unterer Hof
  - { id: tg9, nameKey: unit.temple_guard.name, team: enemy, class: skirmisher, level: 2, at: [3, 12], items: [{ def: iron_sword }], ai: { profile: aggressive }, difficulty: [hard] }
  - { id: tg10, nameKey: unit.temple_guard.name, team: enemy, class: skirmisher, level: 2, at: [10, 12], items: [{ def: iron_sword }], ai: { profile: aggressive }, difficulty: [hard] }
reinforcements:
  # Seitentor Ost, nach dem Beben
  - turn: 4
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.temple_guard.name, team: enemy, class: skirmisher, level: 2, at: [13, 13], items: [{ def: iron_sword }], ai: { profile: aggressive } }
      - { nameKey: unit.temple_guard.name, team: enemy, class: vanguard, level: 2, at: [12, 13], items: [{ def: iron_lance }], ai: { profile: aggressive }, difficulty: [normal, hard] }
objectives:
  # Sieg, sobald alle Stehenden die Unterstadt erreicht haben (Gasse oder Tempeltor), Lucan zuletzt
  victory: { type: escape, area: { rect: [0, 17, 13, 17] } }
  defeat:
    - { type: unit_dies, unit: avatar }
    - { type: unit_dies, unit: lucan }
  side:
    - { id: s_clean, type: no_downs, reward: { item: { def: vulnerary } } }
    - { id: s_fast, type: turn_limit, turns: 10, reward: { gold: 100 } }
triggers:
  - id: t_quake
    once: true
    when: { type: turn_start, turn: 3, phase: player }
    then:
      - { action: dialogue, id: scn.s1_p.quake }
goldReward: 300
design:
  title: Die Paktnacht
  intent: >
    Lernkarte und Auslöser der Staffel: Die Truppe flieht vom Glutdom nach Süden. Zwei Engstellen (inneres Tor, Tempeltor)
    lehren Gefahrenzone und Deckung; Brennas Pforte zeigt früh, dass es mehr als einen Weg gibt.
  mood: Nacht des Paktfestes, Glutleuchten über dem Dom, Ascheflocken, Kohlebecken im Hof, lange Säulenschatten, Wachen mit Fackeln.
  phases:
    - { id: p1, turns: [1, 2], label: Säulengang, note: "Lektionen Bewegen und Angriff; Wachen wachen in den Gängen auf." }
    - { id: p2, turns: [3, 5], label: Beben, note: "Erstes Beben (Szene), Verstärkung durch das Seitentor Ost (R4)." }
    - { id: p3, turns: [6, 10], label: Ausbruch, note: Tempeltor erzwingen oder durch Brennas Pforte in die Gasse. }
  paths:
    - { team: player, points: [[6, 2], [6, 9], [6, 16]], label: Tempeltor }
    - { team: player, points: [[5, 10], [2, 11], [0, 11], [0, 17]], phase: p3, label: Brennas Pforte }
    - { team: enemy, points: [[13, 13], [9, 12], [7, 11]], phase: p2, label: Seitentor }
  zones:
    - { area: { rect: [4, 1, 9, 3] }, label: Innenhof }
    - { area: { rect: [0, 10, 0, 17] }, label: Unterstadt-Gasse, phase: p3 }
  marks:
    - { at: [6, 9], label: E1, note: "Inneres Tor, zwei Wachen dahinter: erste Engstelle." }
    - { at: [6, 16], label: E2, note: "Tempeltor, zwei Lanzen halten: zweite Engstelle." }
    - { at: [1, 11], label: B, note: "Brennas Pforte zur Unterstadt (Tür), sie kennt den Weg." }
  notes:
    - "Normal 10 Gegner (2 davon R4) gegen 4 eigene, Stufe 1–3; Leicht 8, Schwer 12."
    - "Wunsch ans Format: Das Beben in R3 soll die Pforte öffnen und Säulen umwerfen (Wirkung set_terrain / open_door fehlt noch); bis dahin öffnet Brenna die Tür."
    - Gerrit fällt in der Szene vor Runde 1 (Bannerträger, nicht auf der Karte).
