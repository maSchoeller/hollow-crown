# Etappe 6, Akt 2, Mission 2-4 – Die Brandschneise. Entwurf nach missionsliste.html (G 30×40, defend, 12 / 38, Leutnant Grell, Sable nicht feindlich, Beitritt Sable bei E7).
# Bergdorf am Brandhang, drei Stufen von Nord nach Süd: oben Wald und Getreide (Stufe 2), das Dorf auf der Mittelterrasse (Stufe 1), unten Felder und Weide (Stufe 0). Durch die Stufen kommt man nur über Rampen und Treppen.
# Dravns Feuer kommt von Norden, Grells Plünderer dahinter und in den Flanken. Brann steht auf dem Schrein und reißt mit Erdmagie die Schneise auf.
# Veränderliche Karte: Feuer breitet sich aus, Runde 3 und 6 wird der Rand der Terrasse zu Asche und stoppt es.
