goldReward: 1600
design:
  title: Die Brandschneise
  intent: >
    Dravns Lüge platzt: Er opfert seine eigenen Dörfer, Grells Leute plündern hinter dem Feuer. Die Truppe verteidigt Brann, der mit Erdmagie die Schneise reißt und das Dorf rettet, das ihn verstieß.
    Drei Stufen machen die Höhe zur Regel: Schützen oben schießen weiter, durch die Terrassenkante kommt man nur an Rampen und Treppen, und die Plünderer gehen auf die Häuser, nicht auf die Truppe.
  mood: Abend unter Aschehimmel, eine rote Feuerwand im Bergwald, goldene Getreideterrassen vor dem Brand, ein steinernes Bergdorf mit Schieferdächern, Funkenflug.
  phases:
    - { id: p1, turns: [1, 4], label: Der Brand kommt, note: "Feuer im Wald, Schützen auf der Oberkante, R3 Plünderer über das Verbrannte. Schneise West (R3)." }
    - { id: p2, turns: [5, 8], label: Häuser halten, note: "R5 West, R6 Grell und Schneise Ost, R7 Sable sieht zu (E7), R8 Süden." }
    - { id: p3, turns: [9, 12], label: Durchhalten, note: "R9 Nord, R10 Ost. Danach nennen sie Brann wieder Hexenkind, er flieht in die Minen." }
  paths:
    - { team: enemy, points: [[14, 0], [14, 12], [14, 17], [14, 20]], phase: p1, label: Nord }
    - { team: enemy, points: [[3, 19], [7, 21]], phase: p1, label: Plünderer }
    - { team: enemy, points: [[26, 24], [20, 24]], phase: p1, label: Plünderer }
    - { team: enemy, points: [[14, 39], [14, 28], [14, 25]], phase: p2, label: Süd }
    - { team: player, points: [[12, 21], [8, 18], [6, 17], [6, 12], [10, 5]], phase: p2, label: zur Chronik }
  zones:
    - { area: { rect: [12, 20, 18, 24] }, label: Dorfplatz }
    - { area: { rect: [3, 17, 13, 17] }, label: Schneise R3, phase: p1 }
    - { area: { rect: [16, 17, 26, 17] }, label: Schneise R6, phase: p2 }
    - { area: { rect: [4, 13, 25, 16] }, label: Obere Terrasse St.2 }
    - { area: { rect: [4, 28, 25, 31] }, label: Untere Felder St.0 }
  marks:
    - { at: [15, 22], label: B, note: "Brann auf dem Schrein (Gast). Heilt 20 %, steht aber in Reichweite der Schützen auf der Kante." }
    - { at: [21, 7], label: S, note: "Sable schaut zu, greift nicht an, kann nicht angegriffen werden. E7 „warnen“ nach der Mission entscheidet ihren Beitritt." }
    - { at: [10, 4], label: C, note: "Chronik-Seite in der Köhlerruine. Der Wald brennt dorthin: früh losgehen." }
    - { at: [14, 17], label: R, note: "Rampen der Oberkante bei x 6, 14, 15, 23; Unterkante ebenso, dazu Treppen bei x 10, 19." }
  notes:
    - "Stufen über levelOffset (Formatwunsch, Produktinhaber 2026-11-05: Start P−3, Wellen P−2, Elite P−1, Leutnants P+1, Boss P+2). level zeigt den Wert bei P = 14 und bleibt fürs Schema."
    - "Normal 38 Gegner (18 davon in Wellen), P−3 bis P−1 (hier P = 14, Stufe 11–13), Leutnants P+1 bis P+2, gegen 12 eigene; Leicht 33, Schwer 44. Die Gegnerstufen sind per pnpm sim abzustimmen."
    - "Plünderer (AI raider) zerstören Besuchshäuser; ohne Einsatz geht das Nebenziel Häuser verloren."
    - "Feuer: Wald, Gras und Feld brennen und breiten sich nach der vorhandenen Regel aus; Asche und Terrasse nicht. Die Schneise liegt auf y 17."
    - "Modell Getreideterrasse, Rampe, Stützmauer laut Matrix fehlend; Boden Herbst ausstehend. Leutnant grell fehlt in lieutenants."
