goldReward: 1200
design:
  title: Die Rabenweide
  intent: >
    Die Reiterei zeigt, wozu sie auf offenem Land fähig ist. Wer stehen bleibt, wird umritten; wer die Furten, den Wald und die Koppelzäune nutzt, bricht den Ansturm.
    Rowena verteidigt ihr eigenes Gestüt, das macht sie greifbar. Dravn holt sich hier die Pferde, die die Krone ihm verweigert.
  mood: Heller, kühler Herbstmittag auf weiten goldenen Weiden, weiße Koppelzäune, die silbrige Aure mit flachen Furten, Stallungen mit Schieferdächern, Banner der Silbernen Lanze, Staub unter Hufen.
  phases:
    - { id: p1, turns: [1, 4], label: Weide, note: "Streife auf dem Südufer, R3 Reiter von Osten. Wald und kleine Koppel als Deckung." }
    - { id: p2, turns: [5, 7], label: Furten, note: "R5 von Westen. Drei Furten: Mitte bewacht, West und Ost führen in die Koppeln." }
    - { id: p3, turns: [8, 12], label: Gestütshof, note: "Koppelreiter erwachen, R7 Ausfall aus dem Hof, Rowena stellt sich." }
  paths:
    - { team: player, points: [[10, 21], [10, 14], [10, 12], [10, 6], [10, 4]], label: Mitte }
    - { team: player, points: [[8, 22], [3, 18], [3, 14], [4, 12], [4, 9], [4, 7], [8, 7]], phase: p2, label: West }
    - { team: player, points: [[13, 22], [17, 16], [17, 14], [17, 12], [16, 9], [16, 7], [13, 7]], phase: p2, label: Ost }
    - { team: enemy, points: [[21, 19], [13, 21]], phase: p1, label: R3 }
    - { team: enemy, points: [[0, 18], [7, 21]], phase: p2, label: R5 }
  zones:
    - { area: { rect: [8, 3, 12, 5] }, label: Gestütshof, phase: p3 }
  marks:
    - { at: [10, 12], label: F, note: "Mittlere Furt: drei Felder breit, Reiter zahlen 4, Fußvolk 3. Hier bricht der Ansturm." }
    - { at: [7, 7], label: L, note: "Lücken in den Koppelzäunen (West [7,7], Süd [4,9], Ost [13,7], Süd [16,9]): Engstellen, die Vorkämpfer schließen können." }
    - { at: [18, 11], label: I, note: "Ilka im Wald; wer sie anspricht, gewinnt sie. Sie schießt sonst vom Waldrand." }
  notes:
    - "Normal 24 Gegner einschließlich Ilka (6 davon R3/R5/R7) gegen 9 eigene, Stufe 4–6 plus Rowena (St. 9); Leicht 20, Schwer 28."
    - "Formatwunsch Klasse cavalier wie in 2-1, Leutnant rowena fehlt noch; Modell Koppel, Stall, Gestüt laut Matrix fehlend, bis dahin Zaun und Kulissenhäuser."
    - "Rowena erliegt nicht: Boss besiegt heißt sie gibt nach und zieht ab, Leutnant kehrt in 2-8 zurück. Saat Rowena: Sie lässt einen verwundeten Gefährten versorgen statt ihn gefangen zu nehmen (Szene)."
    - "Rolle belohnt: Vorkämpfer an Furt und Zaunlücke; Heiler braucht Abstand zur Weide."
