# Etappe 6, Akt 2, Mission 2-3 – Die Rabenweide. Entwurf nach missionsliste.html (M 22×26, boss Rowena, 9 / 24, Beitritt Ilka).
# Gestüt der Silbernen Lanze an der Aure. Die Truppe kommt im Süden über offene Weiden; der Fluss hat nur drei Furten, keine Brücke. Nördlich davon Koppeln und der Gestütshof.
# Zäune sperren alle Figuren, die Koppeln haben nur Lücken. Auf offener Weide sind die Reiter schnell und tödlich, in der Furt kosten sie 4 Bewegung: Der Fluss ist die Waffe der Truppe.
