timeOfDay: noon
weather: clear
objects:
  - { id: v_bounty, type: village, at: [1, 2], reward: { gold: 200 } }
  - { id: v_rumor, type: village, at: [1, 6], reward: { dialogue: scn.s1_1_1.kharesh_rumor, gold: 100 } }
  - { id: v_east, type: village, at: [14, 6], reward: { item: { def: vulnerary } } }
  - { id: v_north, type: village, at: [14, 2], reward: { item: { def: iron_bow } } }
  - { id: v_shore, type: village, at: [2, 11], reward: { gold: 150 } }
deploy:
  max: 4
  forced: [avatar, lucan]
  slots: [[6, 17], [7, 17], [8, 17], [9, 17], [7, 18], [8, 18], [6, 18]]
units:
  # Brückenkopf: zwei Lanzen halten die Brücke (Engstelle)
  - { id: h1, nameKey: unit.bounty_hunter.name, team: enemy, class: vanguard, level: 2, at: [7, 11], items: [{ def: iron_lance }], ai: { profile: guard } }
  - { id: h2, nameKey: unit.bounty_hunter.name, team: enemy, class: vanguard, level: 2, at: [8, 11], items: [{ def: iron_lance }], ai: { profile: guard } }
  # Uferstraße: kommen von den Seiten an die Brücke
  - { id: h3, nameKey: unit.bounty_hunter.name, team: enemy, class: skirmisher, level: 1, at: [3, 11], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 4, then: aggressive } }
  - { id: h4, nameKey: unit.bounty_hunter.name, team: enemy, class: brigand, level: 2, at: [12, 11], items: [{ def: iron_axe }], ai: { profile: trigger, radius: 4, then: aggressive } }
  # Markt: hinter den Ständen
  - { id: h5, nameKey: unit.bounty_hunter.name, team: enemy, class: brigand, level: 2, at: [5, 6], items: [{ def: iron_axe }], ai: { profile: trigger, radius: 4, then: aggressive } }
  - { id: h6, nameKey: unit.bounty_hunter.name, team: enemy, class: skirmisher, level: 2, at: [10, 6], items: [{ def: iron_sword }], ai: { profile: trigger, radius: 4, then: aggressive } }
  - { id: h7, nameKey: unit.bounty_hunter.name, team: enemy, class: vanguard, level: 2, at: [6, 9], items: [{ def: iron_lance }], ai: { profile: trigger, radius: 4, then: aggressive } }
  # Mauertürme: Schützen bleiben oben
  - { id: h8, nameKey: unit.bounty_hunter.name, team: enemy, class: marksman, level: 2, at: [4, 0], items: [{ def: iron_bow }], ai: { profile: hold } }
  - { id: h9, nameKey: unit.bounty_hunter.name, team: enemy, class: marksman, level: 2, at: [12, 0], items: [{ def: iron_bow }], ai: { profile: hold }, difficulty: [normal, hard] }
  # Anführer vor der Kopfgeldstube
  - { id: h_lead, nameKey: unit.bounty_leader.name, team: enemy, class: brigand, level: 4, at: [7, 2], items: [{ def: steel_axe }, { def: vulnerary }], drops: [1], ai: { profile: hold } }
  # Nur Schwer
  - { id: h10, nameKey: unit.bounty_hunter.name, team: enemy, class: marksman, level: 2, at: [9, 4], items: [{ def: iron_bow }], ai: { profile: trigger, radius: 4, then: aggressive }, difficulty: [hard] }
  - { id: h11, nameKey: unit.bounty_hunter.name, team: enemy, class: brigand, level: 2, at: [2, 8], items: [{ def: iron_axe }], ai: { profile: trigger, radius: 4, then: aggressive }, difficulty: [hard] }
  # Fenn: reißt am Markt Steckbriefe ab, wird angesprochen und tritt bei (zählt nicht für rout)
  - { id: fenn, char: fenn, team: enemy, class: scout, level: 2, at: [13, 5], items: [], ai: { profile: hold }, ignoreForRout: true, recruit: { by: any, dialogue: scn.s1_1_1.fenn_talk } }
reinforcements:
  # Häscher aus der Vorstadt im Rücken
  - turn: 4
    phase: enemy
    announce: true
    units:
      - { nameKey: unit.bounty_hunter.name, team: enemy, class: brigand, level: 1, at: [0, 16], items: [{ def: iron_axe }], ai: { profile: aggressive } }
      - { nameKey: unit.bounty_hunter.name, team: enemy, class: skirmisher, level: 1, at: [15, 16], items: [{ def: iron_sword }], ai: { profile: aggressive }, difficulty: [normal, hard] }
objectives:
  victory: { type: rout }
  defeat:
    - { type: unit_dies, unit: avatar }
    - { type: unit_dies, unit: lucan }
  side:
    - { id: s_villages, type: visit_villages, reward: { gold: 200 } }
    - { id: s_fast, type: turn_limit, turns: 12, reward: { item: { def: vulnerary } } }
goldReward: 600
design:
  title: Steckbriefe
  intent: >
    Erste offene Schlacht nach der Flucht, Lektion Waffendreieck. Brücke als Engstelle oder Furt als langsamer Umweg im Westen;
    am Markt wartet Fenn, im Händlerhaus das Gerücht über Kharesh.
  mood: Mittag in einer Kleinstadt am Fluss, Steckbriefe an jeder Mauer, Marktstände mit bunten Planen, Spätsommerlicht auf Fachwerk.
  phases:
    - { id: p1, turns: [1, 3], label: Brücke, note: "Lanzen an der Brücke, Plänkler von den Ufern." }
    - { id: p2, turns: [4, 8], label: Markt, note: "Kampf zwischen den Ständen; Häscher aus der Vorstadt im Rücken (R4)." }
    - { id: p3, turns: [9, 12], label: Nordviertel, note: Anführer und Turmschützen. }
  paths:
    - { team: player, points: [[7, 17], [7, 12], [7, 4]], label: Brücke }
    - { team: player, points: [[6, 17], [2, 15], [1, 12], [2, 8]], label: Furt }
    - { team: enemy, points: [[0, 16], [4, 17]], phase: p2, label: R4 West }
    - { team: enemy, points: [[15, 16], [10, 17]], phase: p2, label: R4 Ost }
  zones:
    - { area: { rect: [3, 4, 12, 9] }, label: Markt, phase: p2 }
  marks:
    - { at: [7, 13], label: E, note: Brücke als Engstelle; Lanzen halten sie. }
    - { at: [1, 13], label: F, note: "Furt, nur zu Fuß, kostet Bewegung, umgeht die Brücke." }
    - { at: [13, 5], label: Fe, note: "Fenn reißt Steckbriefe ab; Ansprechen holt ihn in die Truppe." }
  notes:
    - "Normal 12 Gegner (2 davon R4) gegen 5 eigene (Rhen, Lucan, Brenna, Tobin + Fenn), Stufe 1–4; Leicht 10, Schwer 14."
    - "Saat Kharesh im Händlerhaus [1,6]; Lucan schweigt dazu in der Szene."
