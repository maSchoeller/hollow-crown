# Etappe 6, Akt 1, Mission 1-1 – Steckbriefe. Entwurf nach missionsliste-s1.md (K 16×20, rout, 5 / 12, kein Leutnant).
# Varnhold an der Erle: Truppe kommt von Süden, die Brücke ist die Engstelle in die Stadt, westlich eine Furt nur zu Fuß.
# Häscher um den Markt (Stände als Deckung), Schützen auf den Mauertürmen im Norden. Fenn steht am Markt und tritt per Ansprechen bei.
# Saat Kharesh: Marktgerücht im Haus des Händlers (Besuch). Lektion: Waffendreieck.
id: s1_1_1_steckbriefe
nameKey: map.s1_1_1_steckbriefe.name
size: [16, 20]
legend:
  ".": plain
  ",": grass
  "_": road
  "T": forest
  "~": river
  "w": shallows
  "=": bridge
  "W": wall
  "B": wall
  "O": wall
