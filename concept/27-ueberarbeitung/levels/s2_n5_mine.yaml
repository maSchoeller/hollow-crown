design:
  title: Glut unter dem Berg
  intent: >
    Eine kurze, enge Schatzsuche im Dunkeln: Vier Truhen, zwölf Runden, und man muss sich aufteilen. Brann sitzt im Westgang und fürchtet die eigene Glut. In der Knochenhalle liegt, was niemand erklären kann (Saat Drachen).
  mood: Enge Stollen im Kupferberg, Loren auf Schienen, rote Glutadern im Fels als einziges Licht, riesige Rippenknochen im Gestein der oberen Halle.
  phases:
    - { id: p1, turns: [1, 4], label: Hauptschacht, note: "Aufteilen: West zu Brann und Truhe, Ost zu Hebel und Seite. R4 vom Eingang." }
    - { id: p2, turns: [5, 12], label: Knochenhalle, note: "Über Tür oder Gatter in die obere Halle, Relikt und Rune." }
  paths:
    - { team: player, points: [[7, 17], [7, 13], [2, 13]], label: Brann }
    - { team: player, points: [[8, 16], [8, 12], [13, 12]], label: Hebel }
    - { team: player, points: [[12, 10], [12, 5], [12, 2]], phase: p2, label: Gatter }
    - { team: player, points: [[7, 9], [7, 5], [4, 3]], phase: p2, label: Tür }
  zones:
    - { area: { rect: [2, 1, 13, 4] }, label: Knochenhalle, phase: p2 }
  marks:
    - { at: [14, 12], label: H, note: "Hebel öffnet das Gatter [12,9]." }
    - { at: [7, 3], label: K, note: "Drachenknochen im Fels, unpassierbar. Sarkophag ist Platzhalter fürs Modell." }
    - { at: [3, 13], label: V, note: "Vorarbeiter trägt den Türschlüssel; Fenn öffnet ohne." }
  notes:
    - "Stufen über levelOffset (Formatwunsch, Produktinhaber 2026-11-05: Start P−3, Wellen P−2, Elite P−1, Leutnants P+1, Boss P+2). level zeigt den Wert bei P = 15 und bleibt fürs Schema."
    - "Normal 15 Gegner (3 davon R4), gegen 7 eigene; Leicht 12, Schwer 18. Beitritt Brann über Ilka oder Lucan."
    - "Ohne Hebel und ohne Schlüssel bleibt die Knochenhalle zu: Hebel und Schlüssel sind beide leicht erreichbar, Fenn öffnet die Tür."
    - "Knotenwirkung: Glutfunke. Item-IDs laut Epic; das Blatt warnt nicht bei fehlenden Items."
