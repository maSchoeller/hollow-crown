# Etappe 6, Akt 2, Nebenquest N5 – Glut unter dem Berg. Entwurf nach missionsliste.html (K 16×20, treasure, Beitritt Brann); Gegner, Truhen, Nebenziele nach Epic 11, Story 11.19.
# Bergwerk bei Kupferhall, enge Stollen im Kriegsnebel. Vier Truhen in vier Winkeln. Zur Knochenhalle führen die verschlossene Mitteltür oder das Gatter im Osten, das ein Hebel öffnet.
