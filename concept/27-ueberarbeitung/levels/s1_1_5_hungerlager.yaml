# Etappe 6, Akt 1, Mission 1-5 – Das Hungerlager. Entwurf nach missionsliste-s1.md (M 20×25, survive, 8 / 24, Leutnant Grosk).
# Erlenmoor an der Erlenbucht: Inseln im Sumpf, Priele (nicht betretbar), Stege als Engstellen. Die Truppe hält die Mittelinsel mit dem
# alten Wachhügel; Hungernde kommen aus dem Lager im Norden und von den Inseln West und Ost. Gepanzerte kommen nicht in den Sumpf,
# sie halten die Stege. Im Süden eine Sandbank mit Bootswrack und Schmugglerkiste, Schlüssel beim Vorratsmeister im Lager.
