goldReward: 800
design:
  title: Unter der Paktwacht
  intent: >
    Zweite veränderliche Karte: Das Gewölbe stürzt ab Runde 4 von Norden her ein. Der Spieler muss wählen zwischen der Chronik
    (Sieg) und den Grabkammern (Beute), bevor sie verschüttet sind. Enge Gänge, Dunkelheit, Plünderer aus Felsspalten.
  mood: Dunkles Felsgewölbe, Fackeln an den Wänden, Steinsarkophage junger Könige mit Kronen-Reliefs, Staub rieselt, ein fahles Glühen im Norden.
  phases:
    - { id: p1, turns: [1, 3], label: Gang, note: "Plünderer in Gang und unteren Kammern; Spaltenwelle Nordost (R3)." }
    - { id: p2, turns: [4, 6], label: Beben, note: "R4 Beben; R5 stürzt die Königskammer bis auf die Chronik ein, R6 die oberen Kammern." }
    - { id: p3, turns: [7, 8], label: Flucht nach vorn, note: "R7 stürzen die unteren Kammern ein; der Hauptgang bleibt bis zuletzt offen." }
  paths:
    - { team: player, points: [[7, 18], [7, 13], [7, 4], [7, 2]], label: Hauptgang }
    - { team: player, points: [[6, 13], [3, 13]], label: Kammer W1 }
    - { team: player, points: [[9, 13], [12, 13]], label: Kammer O1 }
    - { team: enemy, points: [[13, 4], [11, 3], [9, 3]], phase: p1, label: R3 Spalte }
  zones:
    - { area: { rect: [4, 1, 11, 3] }, label: Königskammer, phase: p2 }
    - { area: { tiles: [[1, 6], [2, 6], [3, 6], [4, 6], [11, 6], [12, 6], [13, 6], [14, 6], [1, 7], [2, 7], [3, 7], [4, 7], [11, 7], [12, 7], [13, 7], [14, 7], [1, 8], [2, 8], [3, 8], [4, 8], [11, 8], [12, 8], [13, 8], [14, 8]] }, label: Einsturz R6, phase: p2 }
  marks:
    - { at: [5, 7], label: T, note: "Verschlossene Tür zur Kammer W2; Schlüssel beim Anführer in Kammer O1 oder Fenn." }
    - { at: [12, 13], label: A, note: "Anführer der Plünderer mit Schlüssel." }
    - { at: [7, 1], label: C, note: "Versiegelte Chronik: Siegtruhe; Grabreliefs zeigen den Pakt (Saat Pakt)." }
  notes:
    - "Normal 14 Gegner (3 davon R3/R5) gegen 6 eigene, Stufe 3–4; Leicht 11, Schwer 15."
    - "Formatwunsch set_terrain: Einsturz Runde 5 Königskammer außer [7,1]/[8,1]/[7,2]/[8,2], Runde 6 obere Kammern, Runde 7 untere Kammern werden zu rockwall; der Hauptgang bleibt offen; Figuren darauf werden auf das nächste freie Feld geschoben."
    - "Verschüttete Truhen sind verloren; die Chronik selbst bleibt bis Runde 8 erreichbar."
