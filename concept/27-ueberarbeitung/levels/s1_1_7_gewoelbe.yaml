# Etappe 6, Akt 1, Mission 1-7 – Unter der Paktwacht. Entwurf nach missionsliste-s1.md (K 16×20, treasure, 6 / 14, Plünderer).
# Gewölbe im Fels des Grauen Kamms hinter der Burg: Eingangshalle im Süden (vom Gewölbe-Tor), ein Hauptgang nach Norden,
# vier Grabkammern seitlich, die Königskammer mit der versiegelten Chronik im Norden. Dunkel (Nebel des Krieges), Fackeln.
# Veränderliche Karte: Ab Runde 4 bebt es aus dem Norden, das Gewölbe stürzt von Norden her und von den Seiten ein (Formatwunsch set_terrain).
# Die Westkammer oben ist verschlossen; den Schlüssel trägt der Anführer der Plünderer in der Ostkammer unten (oder Fenn).
