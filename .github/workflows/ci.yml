name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/art/requirements.txt
      - run: pip install -r tools/art/requirements.txt
      - name: Art tool imports (art:build needs these packages)
        run: python tools/art/check_imports.py
      - name: Lint + typecheck
        run: pnpm lint
      - name: Content
        run: pnpm content:check
      - name: Unit tests (incl. replay determinism, core coverage ratchet)
        run: pnpm test:coverage
      - name: Balancing smoke (KI vs. KI)
        run: pnpm sim prologue_paktnacht --runs 5
      - name: Enemy phase budget (NFR3, 300 ms per enemy unit, blocks)
        run: pnpm bench:ai

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Playwright (iPhone 13, Pixel 7, iPad landscape, Desktop – Chromium)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results

  # Leistungsmessung (Story 7.5): Gegnerphase der großen Schlacht und Kaltstart mit Referenzprofil. Meldet
  # Überschreitungen als Warnung und im Job-Summary; die Freigabe (Story 9.14) läuft mit PERF_STRICT=1 auf echter GPU.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Performance run (Pixel 6a, iPhone 12 profiles)
        run: pnpm perf
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-report
          path: test-results/perf
