name: Deploy to GitHub Pages

# Builds the PWA and publishes it to https://<owner>.github.io/hollow-crown/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Git LFS objects (art sources) are cached so deploys do not burn LFS bandwidth
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
      - name: Restore LFS cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - name: Pull LFS objects
        run: git lfs pull

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/art/requirements.txt
      - run: pip install -r tools/art/requirements.txt
      - run: pnpm install --frozen-lockfile

      - name: Build assets (art/ → public/assets)
        run: pnpm art:build
      - name: Content check
        run: pnpm content:check
      - name: Unit tests
        run: pnpm test
      - name: Build PWA
        run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_APP_VERSION: ${{ github.sha }}

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
