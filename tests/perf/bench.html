<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hollow Crown – Leistungsmessung</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #15141a;
        overflow: hidden;
      }
      #board {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #board canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #float {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- slot for the render host's canvas (story 5.1) -->
    <div id="board"></div>
    <div id="float"></div>
    <script type="module" src="./bench.ts"></script>
  </body>
</html>
