  "_": road
  "T": forest
  "^": mountain
  "s": sand
  "~": river
  "w": shallows
  "B": bridge
  "#": wall
  "G": gate
  "D": door
  "d": door_open
  "t": throne
  "F": fort
  "V": village
  "R": ruins
  "S": shrine
  "r": rockwall
  "X": wagon
  "W": well
  "M": stall
  "O": brazier
  "Z": fence
  "H": farm
  "Y": building
  "b": field
  "a": ash
  "A": burning
