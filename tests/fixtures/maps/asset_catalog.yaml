# Entwicklerkarte: jedes Gelände der terrain.yaml nebeneinander im echten Brett (Asset-Prüfung). `await __hc.devMap('asset_catalog')`.
# Kommt nicht in den Build. Von oben: Natur, Wasser, Mauerwerk mit Tor und Türen, Einzelbauten, Flächen; Einheiten als Maßstab.
#          x: 0123456789ABCDEFGHIJ
terrain: |
  ,,,TTT,,^^^,,..,,sss
  ,,,TTT,,^^^,,..,,sss
  __,TTT,,^^^,,..,,sss
  __,,,,,,,,,,,,,,,,,,
  ~~~~~~BB~~~~~~wwww,,
  ~~~~~~BB~~~~~~wwww,,
  ,,,,,,,,,,,,,,,,,,,,
  ,###GG###,,,,###,,,,
  ,#......#,,,,#D#,,,,
  ,#..t...#,,,,#.#,,,,
  ,#......#,,,,#d#,,,,
  ,########,,,,,,,,,,,
  ,,,,,,,,,,,,,,,,,,,,
  ,F,,V,,R,,S,,r,,X,,,
  ,,,,,,,,,,,,,,,,,,,,
  ,W,,M,,O,,Z,,H,,Y,,,
  ,,,,,,,,,,,,,,,,,,,,
  ,bbb,,aaa,,AA,,,,,,,
  ,bbb,,aaa,,AA,,,,,,,
  ,,,,,,,,,,,,,,,,,,,,
