# Probekarte der Format-Reste (Story 11.10). Gehört zu keinem Paket, kommt nicht in den Build. Im Spiel: `await __hc.devMap('dev_terrain_warn')`.
#
# Ein Fluss quer über die Karte, zwei Brücken. Die Westbrücke fällt zu Beginn der Gegnerphase von Runde 2 (`set_terrain` mit `warn`):
# Ab Runde 1 zeigt der HUD die Warnzeile, das Brett schraffiert die beiden Felder. Liora steht als Gast (`team: other`, `guest`) am
# Südufer; fällt sie, ist die Mission verloren, nach dem Sieg schließt sie sich nicht an.
#          x: 0123456789
terrain: |
  ,,,,,,,,,,
  ,,T,,,,,,,
  ,,,,,,,T,,
  ~~=~~~~=~~
  ~~=~~~~=~~
  ,,,,,,,,,,
  ,,,,,,,,,,
  ,,,T,,,,,,
  ,,,,,,,,,,
  ,,,,,,,,,,
  ,,,,,,,,,,
  ,,,,,,,,,,
id: dev_terrain_warn
nameKey: map.dev_terrain_warn.name
size: [10, 12]
fog: false
legend:
  ",": grass
  "T": forest
  "~": river
  "=": bridge
objects: []
initialEffects: []
deploy: { max: 0, forced: [], slots: [] }
units:
  - { id: dev_vanguard, team: player, class: vanguard, level: 5, at: [3, 9], sprite: soldier, items: [{ def: iron_lance }, { def: vulnerary }] }
  - { id: dev_marksman, team: player, class: marksman, level: 5, at: [5, 9], sprite: bandit_archer, items: [{ def: iron_bow }, { def: vulnerary }] }
  - { id: liora, char: liora, team: other, class: healer, level: 3, at: [4, 7], items: [{ def: heal_staff }], ai: { profile: hold }, ignoreForRout: true, guest: true }
  - { id: dev_raider, team: enemy, class: brigand, level: 3, at: [2, 1], sprite: brigand, items: [{ def: iron_axe }] }
  - { id: dev_archer, team: enemy, class: marksman, level: 3, at: [7, 1], sprite: bandit_archer, ai: { profile: hold }, items: [{ def: iron_bow }] }
pairs: []
reinforcements: []
objectives:
  victory: { type: rout }
  defeat:
    - { type: unit_dies, unit: dev_vanguard }
    - { type: unit_dies, unit: liora }
  side: []
triggers:
  - id: t_bridge
    once: true
    when: { type: turn_start, turn: 2, phase: enemy }
    then:
      - { action: set_terrain, area: { tiles: [[2, 3], [2, 4]] }, terrain: river, warn: true }
