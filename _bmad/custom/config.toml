# Team / enterprise overrides for _bmad/config.toml.
# Committed to the repo — applies to every developer on the project.
# Tables deep-merge over base config; keyed entries merge by key.
# Example: override an agent descriptor, or add a new agent.
#
# [agents.bmad-agent-pm]
# description = "Prefers short, bulleted PRDs over narrative drafts."

# Hollow Crown: planning artifacts (brief, GDD, narrative, art direction,
# architecture) and project knowledge live in concept/ (not docs/ or
# _bmad-output/). Implementation artifacts (stories, sprint status) stay in
# _bmad-output/implementation-artifacts.
[modules.bmm]
project_knowledge = "{project-root}/concept"
planning_artifacts = "{project-root}/concept"

[modules.gds]
project_knowledge = "{project-root}/concept"
planning_artifacts = "{project-root}/concept"
